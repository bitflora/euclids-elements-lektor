# Book III, Definitions 1–11. Euclid's words come from Heath via the extracted
# JSON; everything here is this edition's commentary.

items:
  - id: III.Def.1
    title: Equal circles
    paraphrase: |
      Circles are equal when their diameters (or radii) are equal.
    meaning: |
      A definition by criterion: two circles count as "equal" exactly when their radii are equal. Euclid
      could have proved this from his general notion of equality (by superposition); instead he stipulates it.
    modern: |
      $\odot(O, r) \cong \odot(O', r') \iff r = r'$.
    notes: |
      Used throughout [[III.26]]–[[III.29]], where arcs, chords and angles are compared "in equal circles".
    figure: |
      <svg viewBox="0 0 300 110"><circle class="l" cx="80" cy="55" r="38"/><circle class="l" cx="210" cy="55" r="38"/><line class="l2" x1="80" y1="55" x2="118" y2="55"/><line class="l2" x1="210" y1="55" x2="248" y2="55"/><circle class="pt" cx="80" cy="55" r="2.5"/><circle class="pt" cx="210" cy="55" r="2.5"/></svg>

  - id: III.Def.2
    title: Touching a circle (tangent)
    paraphrase: |
      A line *touches* a circle if it meets the circle but, extended, does not cut it.
    meaning: |
      A tangent has exactly one point in common with the circle and stays on one side of it. Euclid does
      not define it as "perpendicular to the radius" — that is a theorem ([[III.16]], [[III.18]]).
    examples:
      - the line perpendicular to a diameter at its end ([[III.16]])
    nonExamples:
      - a line through two points of the circle (it cuts it)
    figure: |
      <svg viewBox="0 0 300 110"><circle class="l" cx="150" cy="58" r="40"/><line class="l2" x1="70" y1="98" x2="230" y2="98"/><circle class="pt" cx="150" cy="98" r="2.5"/></svg>

  - id: III.Def.3
    title: Circles touching one another
    paraphrase: |
      Two circles *touch* if they meet but do not cut each other.
    meaning: |
      Internally (one inside the other) or externally (side by side). They then have exactly one common
      point ([[III.13]]).
    figure: |
      <svg viewBox="0 0 300 110"><circle class="l" cx="70" cy="55" r="40"/><circle class="l" cx="85" cy="55" r="25"/><circle class="l" cx="200" cy="55" r="30"/><circle class="l" cx="255" cy="55" r="25"/><text class="fig-note" x="78" y="106" text-anchor="middle">internally</text><text class="fig-note" x="228" y="106" text-anchor="middle">externally</text></svg>

  - id: III.Def.4
    title: Chords equally distant from the centre
    paraphrase: |
      Chords are *equally distant* from the centre when the perpendiculars from the centre to them are equal.
    meaning: |
      Distance from a point to a line is the length of the perpendicular. Euclid needs the definition for
      [[III.14]] and [[III.15]].
    figure: |
      <svg viewBox="0 0 300 120"><circle class="l" cx="150" cy="60" r="50"/><line class="l2" x1="110" y1="30" x2="190" y2="30"/><line class="l2" x1="110" y1="90" x2="190" y2="90"/><line class="thin" x1="150" y1="60" x2="150" y2="30"/><line class="thin" x1="150" y1="60" x2="150" y2="90"/><circle class="pt" cx="150" cy="60" r="2.5"/></svg>

  - id: III.Def.5
    title: Greater distance from the centre
    paraphrase: |
      A chord is *farther* from the centre when the perpendicular to it is longer.
    notes: |
      Used in [[III.15]]: the nearer chord is longer.

  - id: III.Def.6
    title: Segment of a circle
    paraphrase: |
      A *segment* is the region bounded by a chord and one of the arcs it cuts off.
    meaning: |
      Each chord cuts off two segments: a greater and a less (unless the chord is a diameter, when both are
      semicircles — [[I.Def.18]]).
    figure: |
      <svg viewBox="0 0 300 110"><path class="fill" d="M95,70 A55,55 0 0 1 205,70 Z"/><circle class="l" cx="150" cy="70" r="55"/><line class="l2" x1="95" y1="70" x2="205" y2="70"/></svg>

  - id: III.Def.7
    title: Angle of a segment
    paraphrase: |
      The *angle of a segment* is the curvilinear angle between its chord and its arc.
    meaning: |
      A "mixed" angle, between a straight line and a curve. Euclid uses it only in [[III.16]] and [[III.31]];
      it is the source of the horn-angle controversy.
    nonExamples:
      - the angle *in* a segment (Def. 8), which is rectilinear

  - id: III.Def.8
    title: Angle in a segment
    paraphrase: |
      The *angle in a segment* is the angle at a point of the arc, between the lines joining it to the ends
      of the chord.
    meaning: |
      The inscribed angle. All such angles in the same segment are equal ([[III.21]]).
    figure: |
      <svg viewBox="0 0 300 120"><circle class="l" cx="150" cy="65" r="50"/><line class="l2" x1="105" y1="87" x2="195" y2="87"/><line class="l" x1="105" y1="87" x2="140" y2="16"/><line class="l" x1="195" y1="87" x2="140" y2="16"/><circle class="pt" cx="140" cy="16" r="2.5"/></svg>

  - id: III.Def.9
    title: Standing on an arc
    paraphrase: |
      An angle *stands on* the arc cut off between its arms.
    meaning: |
      The inscribed angle in one segment stands on the arc of the *other* segment. [[III.20]] and
      [[III.26]] are stated with this wording.

  - id: III.Def.10
    title: Sector
    paraphrase: |
      A *sector* is the region bounded by two radii and the arc between them.
    notes: |
      Unlike the other definitions, the term defined is not marked in bold in the Perseus text.
    figure: |
      <svg viewBox="0 0 300 110"><path class="fill" d="M150,95 L105,48 A60,60 0 0 1 195,48 Z"/><circle class="pt" cx="150" cy="95" r="2.5"/></svg>

  - id: III.Def.11
    title: Similar segments
    paraphrase: |
      Segments are *similar* when the angles in them are equal.
    meaning: |
      Similar segments are the same "shape": the same fraction of their circles. Used in [[III.23]], [[III.24]],
      [[III.26]] and [[III.33]].
    modern: |
      Segments with equal inscribed angle $\alpha$ are similar figures (scaled copies).
