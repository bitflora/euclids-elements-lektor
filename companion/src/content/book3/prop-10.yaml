id: III.10
kind: theorem
title: Two circles meet in at most two points

paraphrase: |
  Two distinct circles cannot cut each other at more than two points.

diagram:
  width: 300
  height: 300
  elements:
    - "B;point;free;150,40"
    - "F;point;free;150,260"
    - "H;point;free;40,180"
