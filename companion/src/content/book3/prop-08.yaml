id: III.8
kind: theorem
title: Lines from a point outside the circle

paraphrase: |
  From a point {D} outside a circle draw lines through the circle. Of those reaching the far
  (concave) side, the one through the centre ({DA}) is longest and the lengths decrease as they swing
  away from it; of those stopping at the near (convex) side, the one along the diameter ({DG}) is
  shortest and the lengths increase away from it. Equal lines come only in mirror pairs.

