  given: [A, D, AD, M, ABC, G, E, F, C, DE, DF, DC, H, L, K]
  caption: |
    Drag {A} and {D}, slide {M} and the points {E}, {F}, {C} on the circle. {B} is the mirror image of
    {K} in the diameter, so {DB} = {DK}.

  equal:
    - [MK, ML, MB, MG]
