id: III.29
kind: theorem
title: Equal arcs are subtended by equal chords

paraphrase: |
  The converse of [[III.28]]: in equal circles, equal arcs have equal chords.

diagram:
  width: 400
  height: 220
  elements:
    - "K;point;free;110,110"
    - "A;point;free;110,30;black"
    - "ABC;circle;radius;K,A;0;0;black;0"
    - "B;point;circleSlider;ABC,60,170"
    - "C;point;circleSlider;ABC,160,170"
    - "L;point;free;290,110"
    - "DEF;circle;radius;L,K,A;0;0;black;0"
    - "E;point;circleSlider;DEF,240,170"
    - "D;point;circleSlider;DEF,290,30"
    - "F;point;similar;L,E,K,B,C"
    - "G;point;circleSlider;ABC,110,190"
    - "H;point;circleSlider;DEF,290,190"
    - "BCK;polygon;triangle;B,C,K;0;0;black;0"
    - "EFL;polygon;triangle;E,F,L;0;0;black;0"
    - "BC;line;connect;B,C;0;0;0"
    - "EF;line;connect;E,F;0;0;0"
    - "BGC;sector;arc;B,G,C;0;0;0;0"
    - "EHF;sector;arc;E,H,F;0;0;0;0"
    - "angBKC;sector;angleMarker;K,B,C"
    - "angELF;sector;angleMarker;L,E,F"
  aliases:
    BKC: angBKC
    ELF: angELF
  given: [ABC, DEF, K, L, A, B, C, D, E, F, G, H, BCK, EFL]
  caption: |
    Equal arcs {BGC}, {EHF} in equal circles; their chords stay equal.

  equal:
    - [BC, EF]

steps:
  - part: enunciation
    text: "In equal circles equal circumferences are subtended by equal straight lines."
    highlight: [BGC, EHF, BC, EF]
    hint: |
      Equal arcs ⇒ equal chords.

  - part: setting-out
    text: "Let ABC, DEF be equal circles, and in them let equal circumferences BGC, EHF be cut off; and let the straight lines BC, EF be joined;"
    highlight: [BGC, EHF, BC, EF]
    hint: |
      The data.

  - part: specification
    text: "I say that BC is equal to EF."
    highlight: [BC, EF]
    hint: |
      The goal.

  - part: construction
    text: "For let the centres of the circles be taken, and let them be K, L; let BK, KC, EL, LF be joined."
    highlight: [BCK, EFL]
    hint: |
      Radii.

  - part: proof
    text: "Now, since the circumference BGC is equal to the circumference EHF, the angle BKC is also equal to the angle ELF."
    highlight: [angBKC, angELF]
    hint: |
      [[III.27]].

  - part: proof
    text: "And, since the circles ABC, DEF are equal, the radii are also equal; therefore the two sides BK, KC are equal to the two sides EL, LF; and they contain equal angles; therefore the base BC is equal to the base EF."
    highlight: [BC, EF]
    hint: |
      SAS ([[I.4]]).

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved. (Heath's text has no Q.E.D. here.)

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3, 4, 5]
      text: Chord $= 2r\sin(\theta/2)$ with $\theta = s/r$. $\blacksquare$

commentary: |
  III.26–III.29 together: in equal circles, central angles, arcs and chords determine one another.
