id: III.5
kind: theorem
title: Intersecting circles have different centres

paraphrase: |
  Two circles that cut one another cannot have the same centre.

diagram:
  width: 270
  height: 250
  elements:
    - "A;point;free;50,50"
    - "B;point;free;50,180"
    - "C;point;free;190,60"
    - "ABC;circle;circumcircle;A,B,C;0;0;black;0"
    - "D;point;free;70,70"
    - "CDG;circle;circumcircle;D,B,C;0;0;black;0"
    - "E;point;free;130,130"
    - "G;point;circleSlider;CDG,220,170"
    - "EG;line;connect;E,G"
    - "FFx;line;chord;EG,ABC;0;0;0"
    - "F;point;first;FFx"
    - "EC;line;connect;E,C"
    - "EF;line;connect;E,F;0;0;0"
  aliases:
    EFG: EG
    CE: EC
  given: [A, B, C, D, ABC, CDG]
  caption: |
    {E} is the supposed common centre; drag it anywhere. {EF} and {EG} are never both equal to {EC}.

steps:
  - part: enunciation
    text: "If two circles cut one another, they will not have the same centre."
    highlight: [ABC, CDG]
    hint: |
      Cutting circles are not concentric.
    explain:
      implicit: |
        Joyce's guide observes that the converse is false: circles with different centres need not
        cut one another.

  - part: setting-out
    text: "For let the circles ABC, CDG cut one another at the points B, C;"
    highlight: [ABC, CDG, B, C]
    hint: |
      Two circles meeting at {B} and {C}.

  - part: specification
    text: "I say that they will not have the same centre."
    highlight: [ABC, CDG]
    hint: |
      The goal.

  - part: proof
    text: "For, if possible, let it be E;"
    highlight: [E]
    adds: [E]
    hint: |
      Suppose {E} is the centre of both.

  - part: construction
    text: "let EC be joined, and let EFG be drawn through at random."
    highlight: [EC, EG, F, G]
    adds: [EC, EG, F, G]
    hint: |
      Join {EC} to the common point {C}; draw any line from {E}, meeting the circles at {F} and {G}.

  - part: proof
    text: "Then, since the point E is the centre of the circle ABC, EC is equal to EF."
    highlight: [EC, EF, ABC]
    hint: |
      Radii of {ABC} ([[I.Def.15]]).

  - part: proof
    text: "Again, since the point E is the centre of the circle CDG, EC is equal to EG."
    highlight: [EC, EG, CDG]
    hint: |
      Radii of {CDG}.
    cites: [I.Def.15]

  - part: proof
    text: "But EC was proved equal to EF also; therefore EF is also equal to EG, the less to the greater: which is impossible."
    highlight: [EF, EG]
    hint: |
      {EF} is part of {EG} ([[I.CN.5]]). Contradiction.
    cites: [I.CN.1, I.CN.5]

  - part: proof
    text: "Therefore the point E is not the centre of the circles ABC, CDG."
    highlight: [E]
    hint: |
      Done.

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3, 4, 5, 6, 7, 8]
      text: |
        Concentric circles $\{P : |P - E| = r\}$ and $\{P : |P - E| = s\}$ are equal ($r = s$) or
        disjoint ($r \ne s$). Cutting circles are neither. $\blacksquare$

commentary: |
  III.5 and [[III.6]] (touching circles) rule out the concentric case before Book III studies how
  circles meet.

gaps: |
  - **{F} between {E} and {G}**: the line through {E} meets the inner circle before the outer — read off
    the figure, and needs that one circle lies (partly) inside the other along that line.

historical: |
  Joyce's guide uses III.5 as its standard example of a proposition whose converse is false.
