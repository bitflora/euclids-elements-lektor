id: III.33
kind: problem
title: A segment on a given line admitting a given angle

paraphrase: |
  On a given segment {AB}, construct an arc such that every angle inscribed in it (standing on {AB})
  equals a given angle {C|angC}.

diagram:
  width: 330
  height: 240
  elements:
    - "A;point;free;210,30"
    - "B;point;free;145,160"
    - "AB;line;connect;A,B"
    - "C1;point;free;80,60;0"
    - "C2;point;free;100,100;0"
    - "C3;point;free;30,100;0"
    - "C12;line;connect;C1,C2"
    - "C23;line;connect;C2,C3"
    - "C;polygon;triangle;C1,C2,C3;black;0;0;0"
    - "angC;sector;angleMarker;C2,C1,C3"
    - "Dp;point;similar;B,A,C3,C2,C1;0;0"
    - "D;point;lineSlider;Dp,A,140,30"
    - "Hx;point;lineSlider;Dp,A,290,30;0"
    - "DH;line;connect;D,Hx"
    - "AEp;line;perpendicular;A,D;0;0;0"
    - "F;point;midpoint;A,B"
    - "FGp;line;perpendicular;F,B;0;0;0"
    - "G;point;intersection;AEp,FGp"
    - "E;point;extend;A,G,A,G"
