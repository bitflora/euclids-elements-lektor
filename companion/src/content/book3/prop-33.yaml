  aliases:
    DA: DH
    AD: DH
    GB: BG
    EB: BE
    AEB: ABE
    BAD: angBAD
    DAB: angBAD
  given: [A, B, AB, C, C12, C23, angC]
  caption: |
    The acute case. Move {A}, {B}, or the corners of the given angle {C|angC}: the circle {ABE} always
    carries an arc on {AB} in which the inscribed angle equals {C|angC}.

  equal:
    - [BG, AG]
    - [AF, FB]

steps:
  - part: enunciation
    text: "On a given straight line to describe a segment of a circle admitting an angle equal to a given rectilineal angle."
    highlight: [AB, ABE, angC]
    hint: |
      A problem: build the arc on which a segment "sees" {AB} under a given angle.

  - part: setting-out
    text: "Let AB be the given straight line, and the angle at C the given rectilineal angle;"
    highlight: [AB, angC]
    hint: |
      The data.

  - part: specification
    text: "thus it is required to describe on the given straight line AB a segment of a circle admitting an angle equal to the angle at C."
    highlight: [AB, angC]
    hint: |
      The goal.

  - part: proof
    text: "The angle at C is then acute, or right, or obtuse."
    highlight: [angC]
    hint: |
      Three cases; the figure shows the first.

  - part: construction
    text: "First let it be acute, and, as in the first figure, on the straight line AB, and at the point A, let the angle BAD be constructed equal to the angle at C; therefore the angle BAD is also acute."
    highlight: [angBAD, angC, DH]
    adds: [D, DH, angBAD]
    hint: |
      Copy the angle at {A} ([[I.23]]).
    cites: [I.23]

  - part: construction
    text: "Let AE be drawn at right angles to DA, let AB be bisected at F, let FG be drawn from the point F at right angles to AB, and let GB be joined."
    highlight: [AE, F, FG, BG]
    adds: [F, G, FG, BG]
    hint: |
      The perpendicular to {AD} at {A} meets the perpendicular bisector of {AB} at {G}.

  - part: proof
    text: "Then, since AF is equal to FB, and FG is common, the two sides AF, FG are equal to the two sides BF, FG; and the angle AFG is equal to the angle BFG; therefore the base AG is equal to the base BG."
    highlight: [AG, BG]
    hint: |
      SAS ([[I.4]]).

  - part: proof
    text: "Therefore the circle described with centre G and distance GA will pass through B also."
    highlight: [G]
    hint: |
      {G} is equidistant from {A} and {B}.

  - part: construction
    text: "Let it be drawn, and let it be ABE; let EB be joined."
    highlight: [ABE, BE]
    adds: [ABE, E, AE, BE]
    hint: |
      The circle and the diameter {AE}.

  - part: proof
    text: "Now, since AD is drawn from A, the extremity of the diameter AE, at right angles to AE, therefore AD touches the circle ABE."
    highlight: [DH, ABE]
    hint: |
      Porism to [[III.16]].

  - part: proof
    text: "Since then a straight line AD touches the circle ABE, and from the point of contact at A a straight line AB is drawn across in the circle ABE, the angle DAB is equal to the angle AEB in the alternate segment of the circle."
    highlight: [angBAD, angAEB]
    hint: |
      [[III.32]].

  - part: proof
    text: "But the angle DAB is equal to the angle at C; therefore the angle at C is also equal to the angle AEB."
    highlight: [angC, angAEB]
    hint: |
      So the segment admits the angle.

  - part: proof
    text: "Therefore on the given straight line AB the segment AEB of a circle has been described admitting the angle AEB equal to the given angle, the angle at C."
    highlight: [ABE]
    hint: |
      Acute case done.

  - part: proof
    text: "Next let the angle at C be right; and let it be again required to describe on AB a segment of a circle admitting an angle equal to the right angle at C."
    hint: |
      Second case.

  - part: proof
    text: "Let the angle BAD be constructed equal to the right angle at C, as is the case in the second figure; let AB be bisected at F, and with centre F and distance either FA or FB let the circle AEB be described."
    hint: |
      The semicircle on {AB}.

  - part: proof
    text: "Therefore the straight line AD touches the circle ABE, because the angle at A is right."
    hint: |
      Porism to [[III.16]].

  - part: proof
    text: "And the angle BAD is equal to the angle in the segment AEB, for the latter too is itself a right angle, being an angle in a semicircle."
    hint: |
      [[III.31]].

  - part: proof
    text: "But the angle BAD is also equal to the angle at C."
    hint: |
      By construction.

  - part: proof
    text: "Therefore the angle AEB is also equal to the angle at C."
    hint: |
      So the semicircle does.

  - part: proof
    text: "Therefore again the segment AEB of a circle has been described on AB admitting an angle equal to the angle at C."
    hint: |
      Right case done.

  - part: proof
    text: "Next, let the angle at C be obtuse; and on the straight line AB, and at the point A, let the angle BAD be constructed equal to it, as is the case in the third figure; let AE be drawn at right angles to AD, let AB be again bisected at F, let FG be drawn at right angles to AB, and let GB be joined."
    hint: |
      Third case: the same construction; now {G} is on the other side of {AB}.

  - part: proof
    text: "Then, since AF is again equal to FB, and FG is common, the two sides AF, FG are equal to the two sides BF, FG; and the angle AFG is equal to the angle BFG; therefore the base AG is equal to the base BG."
    hint: |
      [[I.4]].

  - part: proof
    text: "Therefore the circle described with centre G and distance GA will pass through B also; let it so pass, as AEB."
    hint: |
      The circle.

  - part: proof
    text: "Now, since AD is drawn at right angles to the diameter AE from its extremity, AD touches the circle AEB."
    hint: |
      Porism to [[III.16]].

  - part: proof
    text: "And AB has been drawn across from the point of contact at A; therefore the angle BAD is equal to the angle constructed in the alternate segment AHB of the circle."
    hint: |
      [[III.32]]: the angle is in the smaller segment *AHB*.

  - part: proof
    text: "But the angle BAD is equal to the angle at C."
    hint: |
      By construction.

  - part: proof
    text: "Therefore the angle in the segment AHB is also equal to the angle at C."
    hint: |
      So it admits the angle.

  - part: conclusion
    text: "Therefore on the given straight line AB the segment AHB of a circle has been described admitting an angle equal to the angle at C."
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. F."
    hint: |
      What it was required to do.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3, 4, 5, 6, 7, 8]
      text: |
        The centre $G$ lies on the perpendicular bisector of $AB$ with $\angle AGB = 2\gamma$ (III.20);
        equivalently, $GA \perp AD$ where $AD$ makes angle $\gamma$ with $AB$.
    - steps: [9, 10, 11, 12]
      text: The tangent–chord angle at $A$ is $\gamma$, so the inscribed angle on the far arc is $\gamma$ (III.32). $\blacksquare$
  closing: |
    The arc is the *locus* of points from which {AB} is seen under the angle {C|angC} — a basic tool of
    Greek "analysis".

commentary: |
  Euclid splits the problem into acute, right and obtuse cases, with a figure for each; the figure here
  shows the acute case. Modern treatments handle all three at once.

gaps: |
  - **{AE} meets {FG}** at {G}: true because ∠{BAD|angBAD} is not zero, taken from the figure.
