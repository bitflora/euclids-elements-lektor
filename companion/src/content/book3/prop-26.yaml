  given: [ABC, DEF, A, B, C, D, E, F, G, H, triABC, triDEF, GB, GC, HE, HF, K, L]
  caption: |
    Two equal circles with equal central angles at {G} and {H}. Slide the points: the arcs {BKC} and {ELF}
    stay equal.

  equal:
    - [GB, GC, HF, HE]
    - [BC, EF]
