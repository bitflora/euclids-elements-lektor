id: III.26
kind: theorem
title: Equal angles stand on equal arcs

paraphrase: |
  In equal circles, equal angles (at the centre or at the circumference) stand on equal arcs.

diagram:
  width: 465
  height: 240
  elements:
    - "G;point;free;120,115"
    - "A;point;free;75,30"
