    - "GD;line;connect;G,D;0;0;0"
    - "BH;line;connect;B,H;0;0;0"
    - "HD;line;connect;H,D;0;0;0"
  aliases:
    ABCD: ABDC
    BGHD: BD
  given: [A, B, D, C, ABDC, E, F, arcTR, arcRS, arcSU, arcUT]
  caption: |
    The four arcs draw the impossible inner "circle" {EBFD} touching {ABDC} at two points, {B} and {D}.
    {G} and {H} are the two centres the proof locates on {BD}.

steps:
  - part: enunciation
    text: "A circle does not touch a circle at more points than one, whether it touch it internally or externally."
    highlight: [ABDC]
    hint: |
      Touching circles have exactly one common point.

  - part: setting-out
    text: "For, if possible, let the circle ABDC touch the circle EBFD, first internally, at more points than one, namely D, B."
    highlight: [ABDC, B, D]
    hint: |
      Internal case. Suppose two contact points {B} and {D}.
    explain:
      implicit: |
        Heath writes *ABDC*; Euclid writes *ABCD* here and later, regardless of the order of the points
        in the figure (Heath's note on line 3 and others).

  - part: construction
    text: "Let the centre G of the circle ABDC, and the centre H of EBFD, be taken."
    highlight: [G, H]
    adds: [G, H]
    hint: |
      The two centres ([[III.1]]).
    cites: [III.1]

  - part: proof
    text: "Therefore the straight line joined from G to H will fall on B, D."
    highlight: [B, D, BD]
    hint: |
      By [[III.11]] the line of centres passes through each point of contact.

  - part: proof
    text: "Let it so fall, as BGHD."
    highlight: [BD]
    hint: |
      So {B}, {G}, {H}, {D} are on one line.

  - part: proof
    text: "Then, since the point G is the centre of the circle ABCD, BG is equal to GD; therefore BG is greater than HD; therefore BH is much greater than HD."
    highlight: [BG, GD, HD, BH]
    hint: |
      {BG} = {GD} > {HD}, and {BH} > {BG}.

  - part: proof
    text: "Again, since the point H is the centre of the circle EBFD, BH is equal to HD; but it was also proved much greater than it: which is impossible."
    highlight: [BH, HD]
    hint: |
      But {H} is the centre of the inner circle, so {BH} = {HD}. Contradiction.

  - part: proof
    text: "Therefore a circle does not touch a circle internally at more points than one."
    highlight: [ABDC]
    hint: |
      Internal case done.

  - part: specification
    text: "I say further that neither does it so touch it externally."
    hint: |
      External case.
    explain:
      implicit: |
        "Does it so touch it" supplies words the Greek leaves understood (Heath's note on line 25).

  - part: setting-out
    text: "For, if possible, let the circle ACK touch the circle ABDC at more points than one, namely A, C, and let AC be joined."
    highlight: [A, C]
    hint: |
      Suppose an outside circle *ACK* touches at {A} and {C}.

  - part: proof
    text: "Then, since on the circumference of each of the circles ABDC, ACK two points A, C have been taken at random, the straight line joining the points will fall within each circle;"
    highlight: [ABDC]
    hint: |
      By [[III.2]] the chord *AC* lies inside both circles.

  - part: proof
    text: "but it fell within the circle ABCD and outside ACK: which is absurd."
    highlight: [ABDC]
    hint: |
      But touching externally, the circles do not overlap ([[III.Def.3]]): the chord inside one is outside
      the other. Contradiction.

  - part: proof
    text: "Therefore a circle does not touch a circle externally at more points than one."
    hint: |
      External case done.

  - part: proof
    text: "And it was proved that neither does it so touch it internally."
    hint: |
      Both cases.

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3, 4, 5, 6, 7]
      text: |
        Tangent circles satisfy $|F - G| = R \pm r$; equality in the triangle inequality forces any common
        point onto line $FG$ at a determined distance from $F$, so there is only one. $\blacksquare$

commentary: |
  III.11–III.13 complete the basic facts about touching circles. As with [[III.10]], the internal case
  needs a figure that cannot exist: a "circle" touching another at two points.

gaps: |
  - **The external case** relies on the definition of touching ([[III.Def.3]]) in a strong sense: that
    externally touching circles have no interior points in common.
