id: III.13
kind: theorem
title: Circles touch at only one point

paraphrase: |
  Two circles that touch (internally or externally) touch at exactly one point.

diagram:
  width: 260
  height: 250
  elements:
    - "A;point;free;150,40"
    - "B;point;free;40,170"
    - "D;point;free;220,170"
    - "BD;line;connect;B,D"
    - "M;point;midpoint;BD;0;0"
    - "ABDC;circle;circumcircle;A,B,D;0;0;black;0"
