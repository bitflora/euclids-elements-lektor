id: III.31
kind: theorem
title: The angle in a semicircle is right

paraphrase: |
  An angle inscribed in a semicircle is a right angle (Thales' theorem); in a larger segment it is acute,
  in a smaller one obtuse. Also: the curvilinear angle of the larger segment exceeds a right angle, that
  of the smaller falls short.

