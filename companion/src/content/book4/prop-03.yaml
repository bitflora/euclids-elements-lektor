id: IV.3
kind: problem
title: Circumscribing a triangle of given shape

paraphrase: |
  About a given circle, draw a triangle (with all three sides touching the circle) having the same
  angles as a given triangle {DEF}.

diagram:
  width: 360
  height: 290
  elements:
    - "B;point;free;160,120"
    - "K;point;free;120,150"
    - "BK;line;connect;B,K"
    - "ABC;circle;radius;K,B;0;0;black;0"
    - "D;point;free;320,55"
    - "E;point;free;230,150"
    - "F;point;free;220,55"
    - "DEF;polygon;triangle;D,E,F;0;0;black;#dfe7ea"
    - "H;point;lineSlider;E,F,220,30"
    - "G;point;lineSlider;E,F,260,220"
    - "HF;line;connect;H,F"
    - "EG;line;connect;E,G"
    - "Ap;point;similar;B,K,G,E,D;0;0"
    - "A;point;cutoff;K,Ap,K,B"
    - "AK;line;connect;A,K"
    - "Cp;point;similar;B,K,H,F,D;0;0"
    - "C;point;cutoff;K,Cp,K,B"
    - "CK;line;connect;C,K"
    - "Atan;line;perpendicular;A,K;0;0;0"
    - "Btan;line;perpendicular;B,K;0;0;0"
    - "Ctan;line;perpendicular;C,K;0;0;0"
    - "M;point;intersection;Atan,Btan"
    - "N;point;intersection;Btan,Ctan"
    - "L;point;intersection;Ctan,Atan"
    - "LMN;polygon;triangle;L,M,N;0;0;black;#efe4d2"
    - "LM;line;connect;L,M;0;0;0"
    - "MN;line;connect;M,N;0;0;0"
    - "NL;line;connect;N,L;0;0;0"
    - "AMBK;polygon;quadrilateral;A,M,B,K;0;0;0;0"
    - "angBKA;sector;angleMarker;K,B,A"
    - "angBKC;sector;angleMarker;K,B,C"
    - "angDEG;sector;angleMarker;E,D,G"
    - "angDFH;sector;angleMarker;F,D,H"
    - "angAMB;sector;angleMarker;M,A,B"
    - "angDEF;sector;angleMarker;E,D,F"
    - "angLNB;sector;angleMarker;N,L,B"
