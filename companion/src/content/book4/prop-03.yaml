  aliases:
    KB: BK
    KA: AK
    KC: CK
    LAM: LM
    MBN: MN
    NCL: NL
    BKA: angBKA
    AKB: angBKA
    BKC: angBKC
    DEG: angDEG
    DFH: angDFH
    AMB: angAMB
    LNB: angLNB
    DFE: angDFE
    KAM: angKAM
    KBM: angKBM
  given: [ABC, K, B, BK, DEF, D, E, F]
  caption: |
    Drag {B}, {K}, or the corners of {DEF}. The tangent triangle {LMN} always has the angles of {DEF}.

steps:
  - part: enunciation
    text: "About a given circle to circumscribe a triangle equiangular with a given triangle."
    highlight: [ABC, LMN, DEF]
    hint: |
      A problem: a triangle of given shape around a circle.
    explain:
      fact: |
        "Circumscribed about a circle": every side touches it ([[IV.Def.4]]).
    cites: [IV.Def.4]

  - part: setting-out
    text: "Let ABC be the given circle, and DEF the given triangle;"
    highlight: [ABC, DEF]
    hint: |
      The data.

  - part: specification
    text: "thus it is required to circumscribe about the circle ABC a triangle equiangular with the triangle DEF."
    highlight: [ABC, DEF]
    hint: |
      The goal.

  - part: construction
    text: "Let EF be produced in both directions to the points G, H,"
    highlight: [EG, HF]
    adds: [G, H, EG, HF]
    hint: |
      Extend the base of {DEF} both ways, to get its exterior angles.

  - part: construction
    text: "let the centre K of the circle ABC be taken,"
    highlight: [K]
    hint: |
      [[III.1]].

  - part: construction
    text: "and let the straight line KB be drawn across at random;"
    highlight: [BK]
    hint: |
      Any radius {KB}.
    explain:
      implicit: |
        "At random" is literally "as it may chance" (ὡς ἔτυχεν), as in [[III.1]] (Heath's note on line 10).

  - part: construction
    text: "on the straight line KB, and at the point K on it, let the angle BKA be constructed equal to the angle DEG, and the angle BKC equal to the angle DFH;"
    highlight: [angBKA, angDEG, angBKC, angDFH]
    adds: [A, C, AK, CK, angBKA, angBKC]
    hint: |
      At the centre, copy the two *exterior* angles of {DEF} ([[I.23]]).

  - part: construction
    text: "and through the points A, B, C let LAM, MBN, NCL be drawn touching the circle ABC."
    highlight: [LMN]
    adds: [L, M, N, LMN]
    hint: |
      Tangents at {A}, {B}, {C} (porism to [[III.16]]); they meet at {L}, {M}, {N}.

  - part: proof
    text: "Now, since LM, MN, NL touch the circle ABC at the points A, B, C, and KA, KB, KC have been joined from the centre K to the points A, B, C, therefore the angles at the points A, B, C are right."
    highlight: [angKAM, angKBM]
    hint: |
      [[III.18]].

  - part: proof
    text: "And, since the four angles of the quadrilateral AMBK are equal to four right angles, inasmuch as AMBK is in fact divisible into two triangles, and the angles KAM, KBM are right, therefore the remaining angles AKB, AMB are equal to two right angles."
    highlight: [AMBK, angBKA, angAMB]
    hint: |
      A quadrilateral's angles sum to four right angles (two triangles, [[I.32]]).
    explain:
      implicit: |
        "Is in fact divisible" is literally "is actually divided" (Heath's note on line 22).
    cites: [I.32]

  - part: proof
    text: "But the angles DEG, DEF are also equal to two right angles;"
    highlight: [angDEG, angDEF]
    hint: |
      [[I.13]].

  - part: proof
    text: "therefore the angles AKB, AMB are equal to the angles DEG, DEF, of which the angle AKB is equal to the angle DEG; therefore the angle AMB which remains is equal to the angle DEF which remains."
    highlight: [angAMB, angDEF]
    hint: |
      ∠{AMB|angAMB} = ∠{DEF|angDEF}.

  - part: proof
    text: "Similarly it can be proved that the angle LNB is also equal to the angle DFE;"
    highlight: [angLNB, angDFE]
    hint: |
      Same at {N}.

  - part: proof
    text: "therefore the remaining angle MLN is equal to the angle EDF."
    highlight: [LMN]
    hint: |
      Angle sum ([[I.32]]).

  - part: proof
    text: "Therefore the triangle LMN is equiangular with the triangle DEF; and it has been circumscribed about the circle ABC."
    highlight: [LMN, DEF]
    hint: |
      Done.

  - part: conclusion
    text: "Therefore about a given circle there has been circumscribed a triangle equiangular with the given triangle."
    highlight: [LMN]
    hint: |
      Q.E.F.

  - part: conclusion
    text: "Q. E. F."
    hint: |
      What it was required to do.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3, 4, 5, 6, 7]
      text: Choose points of contact $A, B, C$ with $\angle AKB = 180^\circ - \angle E$, $\angle BKC = 180^\circ - \angle F$.
    - steps: [8, 9, 10, 11, 12, 13]
      text: In the kite $AMBK$ (right angles at $A$, $B$), $\angle M = 180^\circ - \angle AKB = \angle E$; likewise $\angle N = \angle F$. $\blacksquare$

commentary: |
  The dual of [[IV.2]]: there the angles were copied at a point of the circle against a tangent; here they
  are copied (as exterior angles) at the centre, and tangents are drawn.

gaps: |
  - **The tangents meet**: that the three tangents meet in pairs to form a triangle around the circle
    needs the copied central angles to be less than two right angles together — true, since they are
    exterior angles of a triangle.
