id: IV.12
kind: problem
title: Circumscribing a regular pentagon about a circle

paraphrase: |
  About a given circle, draw a regular pentagon whose sides touch it: tangents at the vertices of an
  inscribed regular pentagon.

diagram:
  width: 300
  height: 300
  elements:
    - "A;point;free;89,68"
    - "B;point;free;56,169"
    - "ABCDEp;polygon;regularPolygon;A,B,5;0;0;0;0"
    - "C;point;vertex;ABCDEp,3"
    - "D;point;vertex;ABCDEp,4"
    - "E;point;vertex;ABCDEp,5"
    - "ABCDE;circle;circumcircle;A,B,C;0;0;black;0"
    - "F;point;center;ABCDE"
    - "BF;line;connect;B,F"
    - "CF;line;connect;C,F"
    - "DF;line;connect;D,F"
    - "Atan;line;perpendicular;A,F;0;0;0"
    - "Btan;line;perpendicular;B,F;0;0;0"
    - "Ctan;line;perpendicular;C,F;0;0;0"
    - "Dtan;line;perpendicular;D,F;0;0;0"
    - "Etan;line;perpendicular;E,F;0;0;0"
