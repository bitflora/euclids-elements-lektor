id: IV.11
kind: problem
title: Inscribing a regular pentagon in a circle

paraphrase: |
  In a given circle, inscribe a regular pentagon (all sides and all angles equal).

diagram:
  width: 350
  height: 250
  elements:
    - "A;point;free;98,30"
    - "B;point;free;30,80"
    - "ABCDE;polygon;regularPolygon;A,B,5;0;0;black;#efe4d2"
    - "C;point;vertex;ABCDE,3"
    - "D;point;vertex;ABCDE,4"
    - "E;point;vertex;ABCDE,5"
    - "circ;circle;circumcircle;A,B,C;0;0;black;0"
    - "AC;line;connect;A,C"
    - "AD;line;connect;A,D"
    - "BD;line;connect;B,D"
    - "CE;line;connect;C,E"
    - "G;point;free;210,220"
    - "H;point;free;310,220"
    - "F;point;similar;G,H,C,D,A"
    - "FGH;polygon;triangle;F,G,H;0;0;black;#dfe7ea"
    - "ACD;polygon;triangle;A,C,D;0;0;0;0"
    - "AB;line;connect;A,B;0;0;0"
    - "BC;line;connect;B,C;0;0;0"
    - "CD;line;connect;C,D;0;0;0"
    - "DE;line;connect;D,E;0;0;0"
    - "EA;line;connect;E,A;0;0;0"
    - "angCAD;sector;angleMarker;A,C,D"
    - "angACE;sector;angleMarker;C,A,E"
    - "angECD;sector;angleMarker;C,E,D"
    - "angCDB;sector;angleMarker;D,C,B"
