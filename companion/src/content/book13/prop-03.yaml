steps:
  - part: enunciation
    text: "If a straight line be cut in extreme and mean ratio, the square on the lesser segment added to the half of the greater segment is five times the square on the half of the greater segment."
    highlight: [DB, DC]
    hint: |
      Another $\sqrt5$ identity of the golden section.
    modern: |
      $AB = 1$, $AC = x$: $(1 - \tfrac{x}{2})^2 = 5(\tfrac{x}{2})^2$, since $x^2 = 1 - x$.

  - part: setting-out
    text: "For let any straight line AB be cut in extreme and mean ratio at the point C, let AC be the greater segment, and let AC be bisected at D; I say that the square on BD is five times the square on DC."
    highlight: [AB, C, D]
    hint: |
      Setup.

  - part: construction
    text: "For let the square AE be described on AB, and let the figure be drawn double."
    highlight: [AB]
    hint: |
      Square on {AB}; draw the figure.

  - part: proof
    text: "Since AC is double of DC, therefore the square on AC is quadruple of the square on DC, that is, RS is quadruple of FG."
    highlight: [AC, DC]
    hint: |
      sq({AC}) = 4 sq({DC}): *RS* = 4 *FG*.

  - part: proof
    text: "And, since the rectangle AB, BC is equal to the square on AC, and CE is the rectangle AB, BC, therefore CE is equal to RS."
    highlight: [AB, BC, AC]
    hint: |
      rect({AB},{BC}) = sq({AC}): *CE* = *RS*.

  - part: proof
    text: "But RS is quadruple of FG; therefore CE is also quadruple of FG."
    highlight: [DC]
    hint: |
      So *CE* = 4 *FG*.

  - part: proof
    text: "Again, since AD is equal to DC, HK is also equal to KF."
    highlight: [DC]
    hint: |
      {AD} = {DC}, so *HK* = *KF* …

  - part: proof
    text: "Hence the square GF is also equal to the square HL."
    highlight: [DC]
    hint: |
      … *GF* = *HL* …

  - part: proof
    text: "Therefore GK is equal to KL, that is, MN to NE; hence MF is also equal to FE."
    highlight: [DC]
    hint: |
      … *MF* = *FE* …

  - part: proof
    text: "But MF is equal to CG; therefore CG is also equal to FE."
    highlight: [DC]
    hint: |
      … *CG* = *FE*.

  - part: proof
    text: "Let CN be added to each; therefore the gnomon OPQ is equal to CE."
    highlight: [DC]
    hint: |
      Adding *CN*: gnomon *OPQ* = *CE* …

  - part: proof
    text: "But CE was proved quadruple of GF; therefore the gnomon OPQ is also quadruple of the square FG."
    highlight: [DC]
    hint: |
      … = 4 *FG*.

  - part: proof
    text: "Therefore the gnomon OPQ and the square FG are five times FG."
    highlight: [DC]
    hint: |
      So gnomon + *FG* = 5 *FG* …

  - part: proof
    text: "But the gnomon OPQ and the square FG are the square DN."
    highlight: [DB]
    hint: |
      … and that is the square *DN* on {DB}.

  - part: proof
    text: "And DN is the square on DB, and GF the square on DC."
    highlight: [DB, DC]
    hint: |
      *DN* = sq({DB}), *GF* = sq({DC}).

  - part: proof
    text: "Therefore the square on DB is five times the square on DC."
    highlight: [DB, DC]
    hint: |
      So sq({DB}) = 5 sq({DC}).

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        $(1 - x/2)^2 = 1 - x + x^2/4 = x^2 + x^2/4 = 5x^2/4$. $\blacksquare$
