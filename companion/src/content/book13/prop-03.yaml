id: XIII.3
kind: theorem
title: "Golden section: (lesser part + half the greater)² = 5 × (half the greater)²"

paraphrase: |
  If {AB} is cut in extreme and mean ratio at {C} and {D} bisects the greater part {AC}, then the square on {DB} is five
  times the square on {DC}.

