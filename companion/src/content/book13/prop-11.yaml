id: XIII.11
kind: theorem
title: The side of a pentagon in a rational circle is a minor line

paraphrase: |
  If the diameter of a circle is rational, the side of the inscribed regular pentagon is the irrational called
  *minor* ([[X.76]]).

diagram:
  width: 310
  height: 270
  elements:
    - "C;point;free;110,220"
