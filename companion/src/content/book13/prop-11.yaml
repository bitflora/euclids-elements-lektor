  caption: |
    The pentagon in its circle with centre {F}; diameters {AG}, {BH}.

steps:
  - part: enunciation
    text: "If in a circle which has its diameter rational an equilateral pentagon be inscribed, the side of the pentagon is the irrational straight line called minor."
    highlight: [AB]
    hint: |
      The side of a pentagon inscribed in a rational circle is a minor line ([[X.76]]).
    modern: |
      With diameter 1: $s_5 = \tfrac12\sqrt{\tfrac{5 - \sqrt5}{2}}$, a minor.

  - part: setting-out
    text: "For in the circle ABCDE which has its diameter rational let the equilateral pentagon ABCDE be inscribed; I say that the side of the pentagon is the irrational straight line called minor."
    highlight: [AB]
    hint: |
      Setup.

  - part: construction
    text: "For let the centre of the circle, the point F, be taken, let AF, FB be joined and carried through to the points, G, H, let AC be joined, and let FK be made a fourth part of AF."
    highlight: [AG, BH, AC]
    hint: |
      Centre {F}; diameters {AG}, {BH}; join {AC}; {FK} a quarter of {AF}.

  - part: proof
    text: "Now AF is rational; therefore FK is also rational."
    highlight: [FK]
    hint: |
      {AF} rational, so {FK} is.

  - part: proof
    text: "But BF is also rational; therefore the whole BK is rational."
    highlight: [BK]
    hint: |
      So {BK} is rational.

  - part: proof
    text: "And, since the circumference ACG is equal to the circumference ADG, and in them ABC is equal to AED, therefore the remainder CG is equal to the remainder GD."
    highlight: [AC]
    hint: |
      Arc *CG* = arc *GD* …

  - part: proof
    text: "And, if we join AD, we conclude that the angles at L are right, and CD is double of CL."
    highlight: [AC]
    hint: |
      … angles at {L} right, *CD* = 2*CL* …

  - part: proof
    text: "For the same reason the angles at M are also right, and AC is double of CM."
    highlight: [AC, M]
    hint: |
      … angles at {M} right, {AC} = 2*CM*.

  - part: proof
    text: "Since then the angle ALC is equal to the angle AMF, and the angle LAC is common to the two triangles ACL and AMF, therefore the remaining angle ACL is equal to the remaining angle MFA; therefore the triangle ACL is equiangular with the triangle AMF; therefore, proportionally, as LC is to CA, so is MF to FA."
    highlight: [AC, M]
    hint: |
      Triangles *ACL*, *AMF* equiangular: *LC* : *CA* = *MF* : *FA*.

  - part: proof
    text: "And the doubles of the antecedents may be taken; therefore, as the double of LC is to CA, so is the double of MF to FA."
    highlight: [AC]
    hint: |
      Doubling the antecedents …

  - part: proof
    text: "But, as the double of MF is to FA, so is MF to the half of FA; therefore also, as the double of LC is to CA, so is MF to the half of FA."
    highlight: [AC]
    hint: |
      … and halving …

  - part: proof
    text: "And the halves of the consequents may be taken; therefore, as the double of LC is to the half of CA, so is MF to the fourth of FA."
    highlight: [AC]
    hint: |
      … and halving again …

  - part: proof
    text: "And DC is double of LC, CM is half of CA, and FK a fourth part of FA; therefore, as DC is to CM, so is MF to FK."
    highlight: [FK, M]
    hint: |
      *DC* : *CM* = *MF* : {FK}.

  - part: proof
    text: "Componendo also, as the sum of DC, CM is to CM, so is MK to KF; therefore also, as the square on the sum of DC, CM is to the square on CM, so is the square on MK to the square on KF."
    highlight: [FK, M]
    hint: |
      Componendo and squaring ([[V.18]]).

  - part: proof
    text: "And since, when the straight line subtending two sides of the pentagon, as AC, is cut in extreme and mean ratio, the greater segment is equal to the side of the pentagon, that is, to DC, while the square on the greater segment added to the half of the whole is five times the square on the half of the whole, and CM is half of the whole AC, therefore the square on DC, CM taken as one straight line is five times the square on CM."
    highlight: [AC, M]
    hint: |
      *AC* cut in golden section has *DC* as greater segment ([[XIII.8]]); so (*DC* + *CM*)² = 5 sq(*CM*) ([[XIII.1]]).

  - part: proof
    text: "But it was proved that, as the square on DC, CM taken as one straight line is to the square on CM, so is the square on MK to the square on KF; therefore the square on MK is five times the square on KF."
    highlight: [FK, M]
    hint: |
      So sq(*MK*) = 5 sq({FK}).

  - part: proof
    text: "But the square on KF is rational, for the diameter is rational; therefore the square on MK is also rational; therefore MK is rational"
    highlight: [FK, M]
    hint: |
      sq({KF}) rational, so *MK* rational.

  - part: proof
    text: "And, since BF is quadruple of FK, therefore BK is five times KF; therefore the square on BK is twenty-five times the square on KF."
    highlight: [BK, FK]
    hint: |
      *BF* = 4 {FK}, so {BK} = 5 {KF} and sq({BK}) = 25 sq({KF}).

  - part: proof
    text: "But the square on MK is five times the square on KF; therefore the square on BK is five times the square on KM; therefore the square on BK has not to the square on KM the ratio which a square number has to a square number; therefore BK is incommensurable in length with KM."
    highlight: [BK, M]
    hint: |
      So sq({BK}) = 5 sq(*KM*): incommensurable in length ([[X.9]]).

  - part: proof
    text: "And each of them is rational."
    highlight: [BK, M]
    hint: |
      Both rational …

  - part: proof
    text: "Therefore BK, KM are rational straight lines commensurable in square only."
    highlight: [BK, M]
    hint: |
      … commensurable in square only …

  - part: proof
    text: "But, if from a rational straight line there be subtracted a rational straight line which is commensurable with the whole in square only, the remainder is irrational, namely an apotome; therefore MB is an apotome and MK the annex to it."
    highlight: [BK, M]
    hint: |
      … so *BM* is an apotome ([[X.73]]).

  - part: specification
    text: "I say next that MB is also a fourth apotome."
    highlight: [BK, M]
    hint: |
      A fourth apotome:

  - part: construction
    text: "Let the square on N be equal to that by which the square on BK is greater than the square on KM; therefore the square on BK is greater than the square on KM by the square on N."
    highlight: [BK]
    hint: |
      sq(*N*) = sq({BK}) − sq(*KM*).

  - part: proof
    text: "And, since KF is commensurable with FB, componendo also, KB is commensurable with FB."
    highlight: [BK, BH]
    hint: |
      {KB} commensurable with *FB* ([[X.15]]) …

  - part: proof
    text: "But BF is commensurable with BH; therefore BK is also commensurable with BH."
    highlight: [BK, BH]
    hint: |
      … and with {BH} ([[X.12]]).

  - part: proof
    text: "And, since the square on BK is five times the square on KM, therefore the square on BK has to the square on KM the ratio which 5 has to 1."
    highlight: [BK]
    hint: |
      sq({BK}) : sq(*KM*) = 5 : 1 …

  - part: proof
    text: "Therefore, convertendo, the square on BK has to the square on N the ratio which 5 has to 4, and this is not the ratio which a square number has to a square number; therefore BK is incommensurable with N; therefore the square on BK is greater than the square on KM by the square on a straight line incommensurable with BK."
    highlight: [BK]
    hint: |
      … convertendo 5 : 4, not square to square ([[X.9]]).

  - part: proof
    text: "Since then the square on the whole BK is greater than the square on the annex KM by the square on a straight line incommensurable with BK, and the whole BK is commensurable with the rational straight line, BH, set out, therefore MB is a fourth apotome."
    highlight: [BK]
    hint: |
      So *BM* is a fourth apotome ([[X.Def.III.4]]).

  - part: proof
    text: "But the rectangle contained by a rational straight line and a fourth apotome is irrational, and its square root is irrational, and is called minor."
    highlight: [BH]
    hint: |
      Rational × fourth apotome: its side is minor ([[X.94]]).

  - part: proof
    text: "But the square on AB is equal to the rectangle HB, BM, because, when AH is joined, the triangle ABH is equiangular with the triangle ABM, and, as HB is to BA, so is AB to BM."
    highlight: [AB, BH]
    hint: |
      sq({AB}) = rect({HB}, *BM*) (similar triangles *ABH*, *ABM*).

  - part: proof
    text: "Therefore the side AB of the pentagon is the irrational straight line called minor."
    highlight: [AB]
    hint: |
      So {AB} is minor.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        $s_5^2 = r^2\tfrac{5 - \sqrt5}{2}$ is (rational line) × (fourth apotome), whose side is minor by [[X.94]]. $\blacksquare$

commentary: |
  The link between Book X's classification and the regular solids: Euclid determines to which kind of
  irrational each edge belongs ([[XIII.16]], [[XIII.17]]).
