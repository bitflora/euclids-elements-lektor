id: XIII.6
kind: theorem
title: The segments of a rational line cut in golden section are apotomes

paraphrase: |
  If a rational line {AB} is cut in extreme and mean ratio, each segment is an apotome: $\tfrac{\sqrt5 - 1}{2}$ and
  $\tfrac{3 - \sqrt5}{2}$ (with $AB = 1$).

diagram:
  width: 250
  height: 70
  elements:
    - "A;point;free;100,35"
    - "B;point;free;220,35"
