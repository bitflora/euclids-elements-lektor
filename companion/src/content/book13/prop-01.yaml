id: XIII.1
kind: theorem
title: "Golden section: (greater part + half the whole)² = 5 × (half)²"

paraphrase: |
  If {AB} is cut in extreme and mean ratio at {C} ({AC} the greater part), and {AD} is half of {AB} laid off in line,
  then the square on {DC} is five times the square on {AD}.

diagram:
  width: 260
  height: 350
  elements:
    - "A;point;free;100,170"
