id: XIII.15
kind: problem
title: To construct a cube in a sphere

paraphrase: |
  Construct a cube inscribed in a given sphere, and show that the square on the diameter is three times the square
  on the edge.

diagram:
  width: 550
  height: 320
  elements:
    - "A0;point;free;40,-1000;0;0"
    - "A3;point;free;40,1000;0;0"
    - "A;point;lineSlider;A0,A3,0,40"
    - "B;point;lineSlider;A0,A3,0,280"
