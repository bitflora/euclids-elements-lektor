id: XIII.14
kind: problem
title: To construct a regular octahedron in a sphere

paraphrase: |
  Construct an octahedron inscribed in a given sphere, and show that the square on the diameter is twice the square
  on the edge.

diagram:
  width: 540
  height: 320
  elements:
    - "A0;point;free;40,-1000;0;0"
    - "A3;point;free;40,1000;0;0"
    - "A;point;lineSlider;A0,A3,0,40"
    - "B;point;lineSlider;A0,A3,0,280"
    - "AB;line;connect;A,B"
    - "C;point;midpoint;AB"
    - "BDA;sector;sector;C,B,A;0;0;black;random"
    - "D;point;perpendicular;C,B"
    - "CD;line;connect;C,D"
    - "BD;line;connect;B,D"
    - "K;point;free;360,160"
    - "Ksphere;sphere;radius;K,C,A;0;0;lightGray"
    - "E;point;sphereSlider;Ksphere,340,170,40"
    - "G;point;extend;E,K,K,E"
    - "equpl;plane;perpendicular;K,E;0;0;0;0"
    - "equator;circle;radius;K,E,equpl;0;0;0;0"
    - "F;point;circleSlider;equator,230,300"
    - "H;point;extend;F,K,K,E"
    - "EFGH;polygon;quadrilateral;E,F,G,H;0;0;0;0"
    - "HF;line;connect;H,F"
    - "EG;line;connect;E,G"
    - "L;point;perpendicular;K,F,equpl"
    - "M;point;extend;L,K,K,E"
    - "LM;line;connect;L,M"
    - "Lpyr;polyhedron;pyramid;EFGH,L;0;0;black;random"
    - "Mpyr;polyhedron;pyramid;EFGH,M;0;0;black;random"
    - "BC;line;connect;B,C;0;0;0"
    - "DB;line;connect;D,B;0;0;0"
  aliases: { BA: AB, DC: CD, FH: HF, GE: EG, ML: LM, CB: BC }
  caption: |
    The diameter {AB} bisected at {C}; the square {EFGH} with side {BD}; the apexes {L}, {M} on the line through its
    centre {K}.

steps:
  - part: enunciation
    text: "To construct an octahedron and comprehend it in a sphere, as in the preceding case; and to prove that the square on the diameter of the sphere is double of the square on the side of the octahedron."
    highlight: [LM, EG]
    hint: |
      The octahedron: diameter² = 2 · edge².
    modern: |
      $d^2 = 2a^2$, $a = d/\sqrt2$.

  - part: construction
    text: "Let the diameter AB of the given sphere be set out, and let it be bisected at C; let the semicircle ADB be described on AB, let CD be drawn from C at right angles to AB, let DB be joined; let the square EFGH, having each of its sides equal to DB, be set out, let HF, EG be joined, from the point K let the straight line KL be set up at right angles to the plane of the square EFGH, and let it be carried through to the other side of the plane, as KM; from the straight lines KL, KM let KL, KM be respectively cut off equal to one of the straight lines EK, FK, GK, HK, and let LE, LF, LG, LH, ME, MF, MG, MH be joined."
    highlight: [AB, BD, EFGH]
    hint: |
      Bisect {AB} at {C}; {BD} the chord of the quadrant; the square {EFGH} on side {BD}, centre *K*; {L}, {M} at distance *KE* above and below.

  - part: proof
    text: "Then, since KE is equal to KH, and the angle EKH is right, therefore the square on HE is double of the square on EK."
    highlight: [EFGH]
    hint: |
      *KE* = *KH*, right angle: sq(*HE*) = 2 sq(*EK*) ([[I.47]]).

  - part: proof
    text: "Again, since LK is equal to KE, and the angle LKE is right, therefore the square on EL is double of the square on EK. [id.]"
    highlight: [EFGH]
    hint: |
      Likewise sq(*EL*) = 2 sq(*EK*).

  - part: proof
    text: "But the square on HE was also proved double of the square on EK; therefore the square on LE is equal to the square on EH; therefore LE is equal to EH."
    highlight: [EFGH]
    hint: |
      So *LE* = *EH* …

  - part: proof
    text: "For the same reason LH is also equal to HE; therefore the triangle LEH is equilateral."
    highlight: [EFGH]
    hint: |
      … and *LH* = *HE*: triangle *LEH* equilateral.

  - part: proof
    text: "Similarly we can prove that each of the remaining triangles of which the sides of the square EFGH are the bases, and the points L, M the vertices, is equilateral; therefore an octahedron has been constructed which is contained by eight equilateral triangles."
    highlight: [EFGH, LM]
    hint: |
      Likewise all eight faces: an octahedron.

  - part: specification
    text: "It is next required to comprehend it in the given sphere, and to prove that the square on the diameter of the sphere is double of the square on the side of the octahedron."
    highlight: [LM]
    hint: |
      Now inscribe it and compute.

  - part: proof
    text: "For, since the three straight lines LK, KM, KE are equal to one another, therefore the semicircle described on LM will also pass through E."
    highlight: [LM]
    hint: |
      *LK*, *KM*, *KE* equal: the semicircle on {LM} passes through {E} …

  - part: proof
    text: "And for the same reason, if, LM remaining fixed, the semicircle be carried round and restored to the same position from which it began to be moved, it will also pass through the points F, G, H, and the octahedron will have been comprehended in a sphere."
    highlight: [LM]
    hint: |
      … and through all the vertices; rotating it gives the sphere.

  - part: specification
    text: "I say next that it is also comprehended in the given sphere."
    highlight: [LM]
    hint: |
      It is the given sphere:

  - part: proof
    text: "For, since LK is equal to KM, while KE is common, and they contain right angles, therefore the base LE is equal to the base EM."
    highlight: [LM]
    hint: |
      *LE* = *EM* ([[I.4]]) …

  - part: proof
    text: "And, since the angle LEM is right, for it is in a semicircle, therefore the square on LM is double of the square on LE."
    highlight: [LM]
    hint: |
      … ∠*LEM* right ([[III.31]]): sq({LM}) = 2 sq(*LE*).

  - part: proof
    text: "Again, since AC is equal to CB, AB is double of BC."
    highlight: [AB]
    hint: |
      {AB} = 2{BC} …

  - part: proof
    text: "But, as AB is to BC, so is the square on AB to the square on BD; therefore the square on AB is double of the square on BD."
    highlight: [AB, BD]
    hint: |
      … sq({AB}) = 2 sq({BD}).

  - part: proof
    text: "But the square on LM was also proved double of the square on LE."
    highlight: [LM]
    hint: |
      Recalled.

  - part: proof
    text: "And the square on DB is equal to the square on LE, for EH was made equal to DB."
    highlight: [BD]
    hint: |
      And {DB} = *LE*.

  - part: proof
    text: "Therefore the square on AB is also equal to the square on LM; therefore AB is equal to LM."
    highlight: [AB, LM]
    hint: |
      So {AB} = {LM}.

  - part: proof
    text: "And AB is the diameter of the given sphere; therefore LM is equal to the diameter of the given sphere."
    highlight: [AB, LM]
    hint: |
      The given diameter.

  - part: proof
    text: "Therefore the octahedron has been comprehended in the given sphere, and it has been demonstrated at the same time that the square on the diameter of the sphere is double of the square on the side of the octahedron."
    highlight: [LM]
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        Vertices at $\pm r$ on three axes: edge $r\sqrt2$, diameter $2r$, so $d^2 = 2a^2$. $\blacksquare$
