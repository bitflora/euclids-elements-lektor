id: XIII.13
kind: problem
title: To construct a regular tetrahedron in a sphere

paraphrase: |
  Construct a pyramid of four equilateral triangles inscribed in a given sphere, and show that the square on the
  sphere's diameter is one and a half times the square on its edge.

diagram:
  width: 440
  height: 280
  elements:
    - "A0;point;free;40,-1000;0;0"
