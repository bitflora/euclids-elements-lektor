id: XIII.18
kind: problem
title: The five regular solids compared, and no others

paraphrase: |
  Set out the edges of the five regular solids inscribed in the same sphere and compare them; then prove that no
  other solid can be bounded by equal regular polygons equal in number at each vertex. The last proposition of the
  *Elements*.

diagram:
  width: 320
  height: 330
  elements:
    - "A0;point;free;-1000,300;0;0"
