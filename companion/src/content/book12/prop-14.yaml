  caption: |
    Cylinders *EB*, *FD* on equal bases; *CM* is a cylinder on the base of *FD* with axis {LN} equal to {GH}.

steps:
  - part: enunciation
    text: "Cones and cylinders which are on equal bases are to one another as their heights."
    highlight: [GH, KL]
    hint: |
      Equal bases: volume ∝ height.

  - part: setting-out
    text: "For let EB, FD be cylinders on equal bases, the circles AB, CD; I say that, as the cylinder EB is to the cylinder FD, so is the axis GH to the axis KL."
    highlight: [GH, KL]
    hint: |
      Setup.

  - part: construction
    text: "For let the axis KL be produced to the point N, let LN be made equal to the axis GH, and let the cylinder CM be conceived about LN as axis."
    highlight: [LN]
    hint: |
      Extend {KL} by {LN} = {GH}; the cylinder *CM* about it.

  - part: proof
    text: "Since then the cylinders EB, CM are of the same height, they are to one another as their bases."
    highlight: [GH, LN]
    hint: |
      *EB*, *CM* have the same height: as their bases ([[XII.11]]) …

  - part: proof
    text: "But the bases are equal to one another; therefore the cylinders EB, CM are also equal."
    highlight: [GH, LN]
    hint: |
      … so equal.

  - part: proof
    text: "And, since the cylinder FM has been cut by the plane CD which is parallel to its opposite planes, therefore, as the cylinder CM is to the cylinder FD, so is the axis LN to the axis KL."
    highlight: [LN, KL]
    hint: |
      Cut *FM* by the plane *CD*: *CM* : *FD* = {LN} : {KL} ([[XII.13]]).

  - part: proof
    text: "But the cylinder CM is equal to the cylinder EB, and the axis LN to the axis GH; therefore, as the cylinder EB is to the cylinder FD, so is the axis GH to the axis KL."
    highlight: [GH, KL]
    hint: |
      So *EB* : *FD* = {GH} : {KL}.

  - part: proof
    text: "But, as the cylinder EB is to the cylinder FD, so is the cone ABG to the cone CDK."
    highlight: [GH, KL]
    hint: |
      Cones are thirds of cylinders ([[XII.10]]) …

  - part: proof
    text: "Therefore also, as the axis GH is to the axis KL, so is the cone ABG to the cone CDK and the cylinder EB to the cylinder FD."
    highlight: [GH, KL]
    hint: |
      … so the same for cones.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        $V = Bh$ (or $\tfrac13 Bh$) with common $B$. $\blacksquare$
