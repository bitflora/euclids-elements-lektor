id: XII.16
kind: problem
title: A polygon between two concentric circles

paraphrase: |
  Given two concentric circles, inscribe in the greater an equilateral polygon with an even number of sides that
  does not touch the lesser circle.

diagram:
  width: 280
  height: 280
  pivot: "K"
  elements:
    - "B;point;free;40,145"
    - "D;point;free;240,145"
    - "K;point;midpoint;B,D;black;green"
    - "E;point;lineSlider;B,D,100,125"
    - "G;point;cutoff;K,D,E,K"
    - "ABCD;circle;radius;K,B;0;0;black;random"
    - "EFGH;circle;radius;K,E;0;0;black;random"
    - "H;point;perpendicular;K,G;black;0"
    - "F;point;perpendicular;K,E;black;0"
    - "BD;line;connect;B,D"
    - "A';point;perpendicular;G,K;0;0"
    - "AC;line;chord;G,A',ABCD"
    - "A;point;first;AC"
    - "C;point;last;AC"
    - "AL';line;angleDivider;A,K,D,3;0;0;0"
    - "L';point;last;AL';0;0"
    - "L;point;cutoff;K,L',K,B"
    - "M;point;foot;L,B,D"
    - "N;point;extend;L,M,L,M"
    - "LN;line;connect;L,N"
    - "LD;line;connect;L,D"
    - "DN;line;connect;D,N"
  aliases: { DB: BD, CA: AC, NL: LN, DL: LD, ND: DN }
  caption: |
    Concentric circles {ABCD}, {EFGH}; the tangent {AC} to the inner circle at {G}; the side {LD} of the polygon.

  equal:
    - [LD, DN]

steps:
  - part: enunciation
    text: "Given two circles about the same centre, to inscribe in the greater circle an equilateral polygon with an even number of sides which does not touch the lesser circle."
    highlight: [ABCD, EFGH]
    hint: |
      A polygon inscribed in the outer circle missing the inner one.

  - part: setting-out
    text: "Let ABCD, EFGH be the two given circles about the same centre K; thus it is required to inscribe in the greater circle ABCD an equilateral polygon with an even number of sides which does not touch the circle EFGH."
    highlight: [ABCD, EFGH]
    hint: |
      Setup.

  - part: construction
    text: "For let the straight line BKD be drawn through the centre K, and from the point G let GA be drawn at right angles to the straight line BD and carried through to C; therefore AC touches the circle EFGH."
    highlight: [BD, AC]
    hint: |
      Diameter {BD}; {AC} touches the inner circle at {G}, perpendicular to {BD}.

  - part: proof
    text: "Then, bisecting the circumference BAD, bisecting the half of it, and doing this continually, we shall leave a circumference less than AD."
    highlight: [LD]
    hint: |
      Halve the arc *BAD* repeatedly until an arc {LD} less than *AD* remains ([[X.1]]).
    cites: [X.1]

  - part: construction
    text: "Let such be left, and let it be LD; from L let LM be drawn perpendicular to BD and carried through to N, and let LD, DN be joined; therefore LD is equal to DN."
    highlight: [LN, LD, DN]
    hint: |
      Draw {LN} ⊥ {BD}; join {LD}, {DN}.

  - part: proof
    text: "Now, since LN is parallel to AC, and AC touches the circle EFGH, therefore LN does not touch the circle EFGH; therefore LD, DN are far from touching the circle EFGH."
    highlight: [LN, AC]
    hint: |
      {LN} ∥ {AC} and further from the centre, so {LD}, {DN} miss the inner circle.

  - part: proof
    text: "If then we fit into the circle ABCD straight lines equal to the straight line LD and placed continuously, there will be inscribed in the circle ABCD an equilateral polygon with an even number of sides which does not touch the lesser circle EFGH."
    highlight: [LD]
    hint: |
      Chords equal to {LD} round the circle give the required polygon.

  - part: conclusion
    text: "Q. E. F."
    hint: |
      What it was required to do.

reconstruction:
  lines:
    - text: |
        Choose $n$ with $\cos(\pi/n) > r/R$; the $2^k$-gon's sides stay outside the inner circle. $\blacksquare$

commentary: |
  A lemma for [[XII.17]] and, through it, [[XII.18]].
