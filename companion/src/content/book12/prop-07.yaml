steps:
  - part: enunciation
    text: "Any prism which has a triangular base is divided into three pyramids equal to one another which have triangular bases."
    highlight: [BAC]
    hint: |
      Three equal tetrahedra make a triangular prism: the pyramid is a third of the prism.
    modern: |
      $V_{\text{pyramid}} = \tfrac13 B h$.

  - part: setting-out
    text: "Let there be a prism in which the triangle ABC is the base and DEF its opposite; I say that the prism ABCDEF is divided into three pyramids equal to one another, which have triangular bases."
    highlight: [BAC]
    hint: |
      Setup.

  - part: construction
    text: "For let BD, EC, CD be joined."
    highlight: [BD, EC, CD]
    hint: |
      Join {BD}, {EC}, {CD}.

  - part: proof
    text: "Since ABED is a parallelogram, and BD is its diameter, therefore the triangle ABD is equal to the triangle EBD; therefore also the pyramid of which the triangle ABD is the base and the point C the vertex is equal to the pyramid of which the triangle DEB is the base and the point C the vertex."
    highlight: [ABD, EBD]
    hint: |
      {ABD} = {EBD} ([[I.34]]), so the pyramids on them with vertex {C} are equal ([[XII.5]]).

  - part: proof
    text: "But the pyramid of which the triangle DEB is the base and the point C the vertex is the same with the pyramid of which the triangle EBC is the base and the point D the vertex; for they are contained by the same planes."
    highlight: [EBC]
    hint: |
      The pyramid on {DEB} with vertex {C} is the pyramid on {EBC} with vertex {D}.

  - part: proof
    text: "Therefore the pyramid of which the triangle ABD is the base and the point C the vertex is also equal to the pyramid of which the triangle EBC is the base and the point D the vertex."
    highlight: [ABD, EBC]
    hint: |
      So pyramid({ABD}, {C}) = pyramid({EBC}, {D}).

  - part: proof
    text: "Again, since FCBE is a parallelogram, and CE is its diameter, the triangle CEF is equal to the triangle CBE."
    highlight: [CEF, CBE]
    hint: |
      {CEF} = {CBE} ([[I.34]]).

  - part: proof
    text: "Therefore also the pyramid of which the triangle BCE is the base and the point D the vertex is equal to the pyramid of which the triangle ECF is the base and the point D the vertex."
    highlight: [BCE, ECF]
    hint: |
      So pyramid({BCE}, {D}) = pyramid({ECF}, {D}).

  - part: proof
    text: "But the pyramid of which the triangle BCE is the base and the point D the vertex was proved equal to the pyramid of which the triangle ABD is the base and the point C the vertex; therefore also the pyramid of which the triangle CEF is the base and the point D the vertex is equal to the pyramid of which the triangle ABD is the base and the point C the vertex; therefore the prism ABCDEF has been divided into three pyramids equal to one another which have triangular bases."
    highlight: [ABD, ECF]
    hint: |
      So all three are equal.

  - part: proof
    text: "And, since the pyramid of which the triangle ABD is the base and the point C the vertex is the same with the pyramid of which the triangle CAB is the base and the point D the vertex, for they are contained by the same planes, while the pyramid of which the triangle ABD is the base and the point C the vertex was proved to be a third of the prism in which the triangle ABC is the base and DEF its opposite, therefore also the pyramid of which the triangle ABC is the base and the point D the vertex is a third of the prism which has the same base, the triangle ABC, and DEF as its opposite."
    highlight: [BAC]
    hint: |
      And they make up the prism.

reconstruction:
  lines:
    - text: |
        Three tetrahedra $ABCD$, $BCDE$, $CDEF$ with equal bases and heights in pairs. $\blacksquare$

commentary: |
  The porism — a pyramid is one third of the prism on the same base and height — is the result Archimedes
  credits to Eudoxus (Democritus had stated it without proof).
