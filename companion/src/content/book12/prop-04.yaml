id: XII.4
kind: theorem
title: The prisms of the division are as the bases

paraphrase: |
  If two pyramids of the same height on triangular bases {ABC}, {DEF} are each divided as in [[XII.3]], the prisms
  in one are to the prisms in the other as the bases — and the same holds at every further stage of division.

