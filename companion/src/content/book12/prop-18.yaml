id: XII.18
kind: theorem
title: Spheres are in the triplicate ratio of their diameters

paraphrase: |
  Two spheres are to one another in the triplicate ratio of their diameters — volume scales as the cube of the
  diameter. The last proposition of Book XII, again by exhaustion.

diagram:
  width: 540
  height: 300
  elements:
    - "B0;point;free;-1000,100;0;0"
