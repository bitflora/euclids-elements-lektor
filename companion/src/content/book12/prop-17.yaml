id: XII.17
kind: problem
title: A polyhedron between two concentric spheres

paraphrase: |
  Given two concentric spheres, inscribe in the greater a polyhedron that does not touch the lesser. The porism: similar
  polyhedra in two spheres are in the triplicate ratio of their diameters.

