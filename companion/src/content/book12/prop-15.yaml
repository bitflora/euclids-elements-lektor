id: XII.15
kind: theorem
title: Equal cones and cylinders have bases reciprocally proportional to heights

paraphrase: |
  Cones or cylinders are equal exactly when their bases are reciprocally proportional to their heights.

diagram:
  width: 550
  height: 270
  elements:
    - "K0;point;fixed;110,100,0;0;0"
