  caption: |
    Cylinders *AO*, *EP* on bases {ACO}, {EGM} with axes {LK}, {MN}.

steps:
  - part: enunciation
    text: "In equal cones and cylinders the bases are reciprocally proportional to the heights; and those cones and cylinders in which the bases are reciprocally proportional to the heights are equal."
    highlight: [ACO, EGM]
    hint: |
      Equal volume iff bases reciprocally as heights.
    modern: |
      $B_1h_1 = B_2h_2$.

  - part: setting-out
    text: "Let there be equal cones and cylinders of which the circles ABCD, EFGH are the bases; let AC, EG be the diameters of the bases, and KL, MN the axes, which are also the heights of the cones or cylinders; let the cylinders AO, EP be completed."
    highlight: [ACO, EGM]
    hint: |
      Setup.

  - part: specification
    text: "I say that in the cylinders AO, EP the bases are reciprocally proportional to the heights, that is, as the base ABCD is to the base EFGH, so is the height MN to the height KL."
    highlight: [ACO, EGM]
    hint: |
      To prove (first part).

  - part: proof
    text: "For the height LK is either equal to the height MN or not equal."
    highlight: [LK, MN]
    hint: |
      Heights equal or not.

  - part: proof
    text: "First, let it be equal."
    highlight: [LK, MN]
    hint: |
      Equal heights:

  - part: proof
    text: "Now the cylinder AO is also equal to the cylinder EP."
    highlight: [ACO, EGM]
    hint: |
      equal cylinders …

  - part: proof
    text: "But cones and cylinders which are of the same height are to one another as their bases; therefore the base ABCD is also equal to the base EFGH."
    highlight: [ACO, EGM]
    hint: |
      … so equal bases ([[XII.11]]) …

  - part: proof
    text: "Hence also, reciprocally, as the base ABCD is to the base EFGH, so is the height MN to the height KL."
    highlight: [ACO, EGM]
    hint: |
      … and the reciprocal proportion holds trivially.

  - part: construction
    text: "Next, let the height LK not be equal to MN, but let MN be greater; from the height MN let QN be cut off equal to KL, through the point Q let the cylinder EP be cut by the plane TUS parallel to the planes of the circles EFGH, RP, and let the cylinder ES be conceived erected from the circle EFGH as base and with height NQ."
    highlight: [MN]
    hint: |
      Unequal: cut off *QN* = {LK} from {MN}; the cylinder *ES* on it.

  - part: proof
    text: "Now, since the cylinder AO is equal to the cylinder EP, therefore, as the cylinder AO is to the cylinder ES, so is the cylinder EP to the cylinder ES."
    highlight: [ACO, EGM]
    hint: |
      *AO* : *ES* = *EP* : *ES* ([[V.7]]).

  - part: proof
    text: "But, as the cylinder AO is to the cylinder ES, so is the base ABCD to the base EFGH, for the cylinders AO, ES are of the same height; and, as the cylinder EP is to the cylinder ES, so is the height MN to the height QN, for the cylinder EP has been cut by a plane which is parallel to its opposite planes."
    highlight: [ACO, EGM]
    hint: |
      *AO* : *ES* = base : base ([[XII.11]]); *EP* : *ES* = {MN} : *QN* ([[XII.13]]).

  - part: proof
    text: "Therefore also, as the base ABCD is to the base EFGH, so is the height MN to the height QN."
    highlight: [MN]
    hint: |
      So base : base = {MN} : *QN* …

  - part: proof
    text: "But the height QN is equal to the height KL; therefore, as the base ABCD is to the base EFGH, so is the height MN to the height KL."
    highlight: [MN, LK]
    hint: |
      … = {MN} : {KL}.

  - part: proof
    text: "Therefore in the cylinders AO, EP the bases are reciprocally proportional to the heights."
    highlight: [ACO, EGM]
    hint: |
      First part done.

  - part: specification
    text: "Next, in the cylinders AO, EP let the bases be reciprocally proportional to the heights, that is, as the base ABCD is to the base EFGH, so let the height MN be to the height KL; I say that the cylinder AO is equal to the cylinder EP."
    highlight: [ACO, EGM]
    hint: |
      Converse.

  - part: proof
    text: "For, with the same construction, since, as the base ABCD is to the base EFGH, so is the height MN to the height KL, while the height KL is equal to the height QN, therefore, as the base ABCD is to the base EFGH, so is the height MN to the height QN"
    highlight: [MN]
    hint: |
      Same construction …

  - part: proof
    text: "But, as the base ABCD is to the base EFGH, so is the cylinder AO to the cylinder ES, for they are of the same height; and, as the height MN is to QN, so is the cylinder EP to the cylinder ES; therefore, as the cylinder AO is to the cylinder ES, so is the cylinder EP to the cylinder ES."
    highlight: [ACO, EGM]
    hint: |
      … *AO* : *ES* = *EP* : *ES* …

  - part: proof
    text: "Therefore the cylinder AO is equal to the cylinder EP."
    highlight: [ACO, EGM]
    hint: |
      … so *AO* = *EP* ([[V.9]]).

  - part: proof
    text: "And the same is true for the cones also."
    highlight: [ACO, EGM]
    hint: |
      Cones likewise.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        $B_1h_1 = B_2h_2 \iff B_1 : B_2 = h_2 : h_1$. $\blacksquare$
