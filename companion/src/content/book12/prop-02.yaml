id: XII.2
kind: theorem
title: Circles are as the squares on their diameters

paraphrase: |
  Two circles are to one another as the squares on their diameters. The first use of the "method of exhaustion":
  inscribed polygons are made to differ from the circle by less than any given area, and a double reductio ad
  absurdum excludes every other ratio.

