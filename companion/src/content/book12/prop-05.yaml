  caption: |
    Pyramids *ABCG*, *DEFH* of equal height; {W} is the supposed fourth proportional solid.

steps:
  - part: enunciation
    text: "Pyramids which are of the same height and have triangular bases are to one another as the bases."
    highlight: [ABC, DEF]
    hint: |
      Pyramids of equal height are as their bases (triangular case), by exhaustion.
    modern: |
      $V = \tfrac13 B h$; here only $V_1 : V_2 = B_1 : B_2$.

  - part: setting-out
    text: "Let there be pyramids of the same height, of which the triangles ABC, DEF are the bases and the points G, H the vertices; I say that, as the base ABC is to the base DEF, so is the pyramid ABCG to the pyramid DEFH."
    highlight: [ABC, DEF]
    hint: |
      Setup.

  - part: proof
    text: "For, if the pyramid ABCG is not to the pyramid DEFH as the base ABC is to the base DEF, then, as the base ABC is to the base DEF, so will the pyramid ABCG be either to some solid less than the pyramid DEFH or to a greater."
    highlight: [W]
    hint: |
      If not, base : base = pyramid *ABCG* : some solid {W}, smaller or larger than *DEFH*.

  - part: construction
    text: "Let it, first, be in that ratio to a less solid W, and let the pyramid DEFH be divided into two pyramids equal to one another and similar to the whole and into two equal prisms; then the two prisms are greater than the half of the whole pyramid."
    highlight: [W]
    hint: |
      Case 1: {W} smaller. Divide *DEFH* as in [[XII.3]].

  - part: proof
    text: "Again, let the pyramids arising from the division be similarly divided, and let this be done continually until there are left over from the pyramid DEFH some pyramids which are less than the excess by which the pyramid DEFH exceeds the solid W."
    highlight: [W]
    hint: |
      Keep dividing until the leftover pyramids are less than *DEFH* − {W} ([[X.1]]).
    cites: [X.1]

  - part: proof
    text: "Let such be left, and let them be, for the sake of argument, DQRS, STUH; therefore the remainders, the prisms in the pyramid DEFH, are greater than the solid W."
    highlight: [DQRS, STUH, W]
    hint: |
      Say {DQRS}, {STUH}; the prisms in *DEFH* exceed {W}.

  - part: construction
    text: "Let the pyramid ABCG also be divided similarly, and a similar number of times, with the pyramid DEFH; therefore, as the base ABC is to the base DEF, so are the prisms in the pyramid ABCG to the prisms in the pyramid DEFH."
    highlight: [W]
    hint: |
      Divide *ABCG* the same number of times: prisms : prisms = {ABC} : {DEF} ([[XII.4]]).

  - part: proof
    text: "But, as the base ABC is to the base DEF, so also is the pyramid ABCG to the solid W; therefore also, as the pyramid ABCG is to the solid W, so are the prisms in the pyramid ABCG to the prisms in the pyramid DEFH; therefore, alternately, as the pyramid ABCG is to the prisms in it, so is the solid W to the prisms in the pyramid DEFH."
    highlight: [W]
    hint: |
      So *ABCG* : {W} = prisms : prisms; alternately …

  - part: proof
    text: "But the pyramid ABCG is greater than the prisms in it; therefore the solid W is also greater than the prisms in the pyramid DEFH."
    highlight: [W]
    hint: |
      … *ABCG* exceeds its prisms, so {W} exceeds the prisms in *DEFH* …

  - part: proof
    text: "But it is also less: which is impossible."
    highlight: [W]
    hint: |
      … but it is less: impossible.

  - part: proof
    text: "Therefore the prism ABCG is not to any solid less than the pyramid DEFH as the base ABC is to the base DEF."
    highlight: [W]
    hint: |
      So not to a smaller solid.

  - part: proof
    text: "Similarly it can be proved that neither is the pyramid DEFH to any solid less than the pyramid ABCG as the base DEF is to the base ABC."
    highlight: [W]
    hint: |
      Likewise with the pyramids exchanged.

  - part: specification
    text: "I say next that neither is the pyramid ABCG to any solid greater than the pyramid DEFH as the base ABC is to the base DEF."
    highlight: [W]
    hint: |
      Case 2: {W} larger.

  - part: proof
    text: "For, if possible, let it be in that ratio to a greater solid W; therefore, inversely, as the base DEF is to the base ABC, so is the solid W to the pyramid ABCG."
    highlight: [W]
    hint: |
      Inversely …

  - part: proof
    text: "But, as the solid W is to the solid ABCG, so is the pyramid DEFH to some solid less than the pyramid ABCG, as was before proved; therefore also, as the base DEF is to the base ABC, so is the pyramid DEFH to some solid less than the pyramid ABCG: which was proved absurd."
    highlight: [W]
    hint: |
      … reduces to case 1 (lemma of [[XII.2]]).

  - part: proof
    text: "Therefore the pyramid ABCG is not to any solid greater than the pyramid DEFH as the base ABC is to the base DEF."
    highlight: [W]
    hint: |
      Impossible.

  - part: proof
    text: "But it was proved that neither is it in that ratio to a less solid."
    highlight: [W]
    hint: |
      So neither smaller nor larger …

  - part: proof
    text: "Therefore, as the base ABC is to the base DEF, so is the pyramid ABCG to the pyramid DEFH."
    highlight: [ABC, DEF]
    hint: |
      … and the pyramids are as the bases.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - steps: [2, 3, 4, 5, 6, 7, 8, 9]
      text: |
        If $V_1 : w = B_1 : B_2$ with $w < V_2$, divide until the prisms in pyramid 2 exceed $w$; the matching prisms
        in pyramid 1 are in the ratio $B_1 : B_2$, giving $w >$ prisms$_2$: contradiction.
    - steps: [12, 13, 14, 15, 16, 17]
      text: |
        The other case reduces to this one. $\blacksquare$

commentary: |
  The same structure as [[XII.2]], with the prisms of [[XII.3]]–[[XII.4]] in place of inscribed polygons.
