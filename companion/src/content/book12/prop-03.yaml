id: XII.3
kind: theorem
title: A triangular pyramid splits into two similar pyramids and two prisms

paraphrase: |
  A pyramid on a triangular base can be divided into two equal pyramids similar to it (each with half its edges) and
  two equal prisms, the prisms together making up more than half of the whole. The engine of the exhaustion
  argument for pyramids ([[XII.5]]).

