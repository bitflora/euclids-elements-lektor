id: XII.10
kind: theorem
title: A cone is a third of the cylinder with the same base and height

paraphrase: |
  Any cone is one third of the cylinder on the same base and of the same height — proved by exhaustion, comparing
  pyramids and prisms on inscribed polygons.

diagram:
  width: 280
  height: 280
  elements:
    - "B;point;free;40,140"
    - "D;point;free;240,140"
    - "O;point;midpoint;B,D;0;0"
    - "circ;circle;radius;O,B;0;0;black;random"
    - "A;point;perpendicular;O,D"
    - "C;point;extend;A,O,A,O"
    - "E';point;midpoint;A,B;0;0"
    - "E;point;cutoff;O,E',O,A"
    - "F';point;midpoint;B,C;0;0"
    - "F;point;cutoff;O,F',O,A"
    - "G';point;midpoint;C,D;0;0"
    - "G;point;cutoff;O,G',O,A"
    - "H';point;midpoint;D,A;0;0"
    - "H;point;cutoff;O,H',O,A"
    - "AHDGCFBE;polygon;octagon;A,H,D,G,C,F,B,E;0;0;black;random"
    - "ABCE;polygon;quadrilateral;A,B,C,D;0;0;black;random"
    - "AB;line;connect;A,B;0;0;0"
    - "BC;line;connect;B,C;0;0;0"
    - "CD;line;connect;C,D;0;0;0"
    - "DA;line;connect;D,A;0;0;0"
    - "AE;line;connect;A,E;0;0;0"
    - "EB;line;connect;E,B;0;0;0"
    - "BF;line;connect;B,F;0;0;0"
    - "FC;line;connect;F,C;0;0;0"
