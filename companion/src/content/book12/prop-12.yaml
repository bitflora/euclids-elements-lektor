id: XII.12
kind: theorem
title: Similar cones and cylinders are in the triplicate ratio of their base diameters

paraphrase: |
  Similar cones (and similar cylinders) are to one another in the triplicate ratio of the diameters of their
  bases — their volumes scale as the cube of the diameter.

