id: XII.8
kind: theorem
title: Similar pyramids are in the triplicate ratio of their sides

paraphrase: |
  Similar pyramids on triangular bases are to one another in the triplicate ratio of corresponding sides (and, by
  the porism, so are similar pyramids on polygonal bases).

