id: JZ.5.4
title: Square and round forts — the box and the cylinder
paraphrase: |
  A square fort (*fang bao dao* 方堡壔) is a box: side squared times height. A round fort is a cylinder,
  whose volume the classic gives as circumference squared times height over 12, the circle rule of
  [[JZ.1.14]] with π = 3 times the height. Liu Hui notes that all the round solids in this chapter use π = 3,
  and gives his corrections.

parallels:
  - id: XII.11
    relation: related
    note: |
      Volume = base × height for the cylinder assumes that cylinders of the same height are as their bases,
      Euclid's XII.11, together with the area of the circular base.
  - id: XI.32
    relation: related
    note: |
      For the box: parallelepipeds of the same height are to one another as their bases (XI.32). The rule
      gives the volume as a number, side × side × height.

steps:
  - classic: |
      Now there is a square fort
  - liu: |
      A *bao* is a small fort. *Dao* is read *ding-lao* [i.e. *dao*], also read *dao*; it means earth packed
      around timber.
    hint: |
      A gloss on pronunciation by the *fanqie* 反切 method: the initial of *ding* with the final of *lao*. The
      structure is a rammed-earth tower built around a timber frame.
  - classic: |
      1 *zhang* 6 *chi* square and 1 *zhang* 5 *chi* high. Question: what is its volume? Answer: 3840 *chi*.
  - classic: |
      The rule says: multiply the side by itself, and multiply by the height: that is the volume in *chi*.
    modern: |
      $V = a^2 h = 16^2 \cdot 15 = 3840$.
  - classic: |
      Now there is a round fort with a circumference of 4 *zhang* 8 *chi* and a height of 1 *zhang* 1 *chi*.
      Question: what is its volume? Answer: 2112 *chi*.
  - liu: |
      By Hui's method the volume should be 2017 131/157 *chi*.
  - li: |
      We respectfully note: by the precise rate, the volume is 2016 *chi*.
  - classic: |
      The rule says: multiply the circumference by itself, multiply by the height, and divide by 12.
    modern: |
      $V = \dfrac{C^2 h}{12}$, which is $\pi r^2 h$ with π = 3.
    cites: [XII.11]
  - liu: |
      The rules of this chapter also all take "circumference 3, diameter 1" as the rate, and all are wrong. By
      Hui's method, one should multiply the circumference by itself, multiply by the height, multiply again by
      25, and divide by 314. The circular area here is the same as the area of a circular field: find the area
      as for a circular field, and multiply it by the height.
    modern: |
      $V = \dfrac{25\, C^2 h}{314} = \dfrac{C^2 h}{4\pi}$ with π = 3.14.
  - li: |
      We respectfully note: by the precise rate, multiply by 7 and divide by 88.
