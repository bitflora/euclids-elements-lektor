id: JZ.9.14
title: The circle inscribed in a right triangle
paraphrase: |
  The diameter of the circle inscribed in a right triangle with *gou* 8 and *gu* 15 (hypotenuse 17) is
  $\dfrac{2ab}{a + b + c} = \dfrac{240}{40} = 6$.

  Liu Hui's proof is a famous dissection: "draw it on a small piece of paper, cut it, and turn the pieces
  round". Lines from the centre of the circle cut each triangle into three pairs of small right triangles
  and a small square. Four copies of the triangle (area $2ab$) rearrange into a rectangle whose width is the
  diameter and whose length is $a + b + c$. He adds other formulas for the diameter: $a + b - c$, and
  $\sqrt{2(c - a)(c - b)}$, which ties back to [[JZ.9.10]].

parallels:
  - id: IV.4
    relation: same
    note: |
      Euclid inscribes a circle in a given triangle (IV.4): bisect two angles, and the point where the bisectors
      meet is equidistant from the three sides. Liu uses the same configuration ("the *gou*, *gu* and slant
      are equally distant from the centre"), but to compute the diameter, which Euclid never does.
  - id: I.47
    relation: same
    note: |
      The hypotenuse 17 is found from 8 and 15 first.
  - id: III.17
    relation: related
    note: |
      The pairs of small triangles in Liu's figure are congruent because the two tangents from a point to a
      circle are equal: Euclid's III.17 construction, and the equality Heath notes under III.36.

diagram:
  width: 200
