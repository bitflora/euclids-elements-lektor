id: JZ.4.6
title: The sphere — Liu Hui's double umbrella and Zu Geng's proof
paraphrase: |
  The classic gives the diameter of a sphere of volume $V$ as $d = \sqrt[3]{16V/9}$; that is,
  $V = \tfrac{9}{16} d^3$. Liu Hui explains how this was reached. With π = 3, a circle is $\tfrac34$ of its
  square, so a cylinder is $\tfrac34$ of its cube. Someone assumed the sphere is likewise $\tfrac34$ of its
  cylinder, which gives $\tfrac{9}{16}$.

  Liu shows the assumption is false. Cut a cube twice with cylinders at right angles, and what is left is
  a solid he names the *mouhe fanggai* 牟合方蓋, the "double square umbrella" (now the Steinmetz solid).
  Every horizontal section of the sphere is a circle inscribed in the square section of the umbrella. So
  it is the umbrella, not the cylinder, that stands to the sphere as square to circle. But he could not find
  the umbrella's volume, and left it, in one of the most famous passages of Chinese mathematics, "to wait
  for one who can explain it".

  Two centuries later Zu Geng 祖暅 (son of Zu Chongzhi) did. Li Chunfeng's note preserves his proof. One
  eighth of the umbrella sits in a small cube; the rest of the cube has, at every height $h$, a section of
  area $h^2$, the same as an upside-down pyramid (*yangma*). "If the areas at every height are the same,
  the volumes cannot differ": the remainder equals the pyramid, a third of the cube. So the umbrella is
  $\tfrac23$ of the cube on the diameter, and the sphere is $\tfrac{\pi}{4} \cdot \tfrac23 d^3 = \tfrac{\pi}{6}
  d^3$.

parallels:
  - id: XII.18
    relation: same
    note: |
      "Spheres are to one another in the triplicate ratio of their respective diameters." The rule
      $V = k\, d^3$ presupposes this. Euclid proves the ratio by exhaustion but never finds $k$. Zu Geng
      finds it: $k = \pi/6$, the result of Archimedes' *On the Sphere and Cylinder* (sphere = $\tfrac23$ of
      its cylinder).
  - id: XII.7
    relation: same
    note: |
      Zu Geng's proof ends on "the *yangma* is a third of the cube": a pyramid is a third of the prism
      with the same base and height (the porism to XII.7). Liu Hui proves it for the *yangma* in
      [[JZ.5.8]].
  - id: XII.2
    relation: related
    note: |
      Each horizontal section of the sphere is a circle inscribed in the square section of the umbrella,
      so their areas stand in the fixed ratio of circle to square (XII.2, with Liu's $\tfrac{\pi}{4}$). Zu
      Geng's principle then carries the ratio of the sections over to the solids.
  - id: XII.10
    relation: related
    note: |
      Euclid compares cones and cylinders by exhaustion, never by sections. Zu Geng's principle (in
      Europe, Cavalieri's, 1635) replaces his double contradiction by a direct comparison: solids whose
      sections at every height are equal have equal volumes.

