id: JZ.9.1
title: Gou, gu and hypotenuse — the theorem, and Liu Hui's out-in proof
paraphrase: |
  Chapter 9, *Gou gu* 句股, is on right triangles. *Gou* 句 is the shorter leg, *gu* 股 the longer, and *xian*
  弦 (the bowstring) the hypotenuse. It opens with the 3-4-5 triangle three times, solved for each side in
  turn, and the general rule. Hypotenuse $= \sqrt{\text{gou}^2 + \text{gu}^2}$; either leg $= \sqrt{\text{xian}^2 - \text{other}^2}$.

  Liu Hui proves it with a dissection: "The *gou* squared is the red square, the *gu* squared the blue square.
  Let them move out and in to fill each other, each according to its kind; the rest stays unmoved. They
  combine to form the area of the square on the hypotenuse." His figure is lost, and several
  reconstructions have been proposed; the principle is that the two squares are cut into pieces that
  exactly fill the third.

parallels:
  - id: I.47
    relation: same
    proves: true
    note: |
      Euclid's theorem: the square on the hypotenuse equals the squares on the two legs. Euclid proves it by
      dividing the square on the hypotenuse into two rectangles and showing each equal to a square on a leg,
      using congruent triangles (I.4) and parallelograms on the same base (I.41). Liu cuts the two smaller
      squares into pieces and fits them into the larger, as Zhao Shuang does in the Zhou bi ([[ZB.1.3]]).
      The *Nine Chapters* takes the rule as given; Liu supplies the proof.
  - id: I.48
    relation: related
    note: |
      The converse, that a triangle whose sides satisfy the relation is right-angled, is not stated; the
      *gou-gu* chapter always begins from a right angle.

