    hint: |
      Multiplying 27,720 by 12 and cancelling where possible gives 83,160, three times what is needed.
      The answer's denominator, 86,021, is 258,063 divided by 3.
  - li: |
      We respectfully note: in general the intention of a rule is that economy is best. It should say:
      below there are twelfths; take 1 as 27,720, the half as 13,860, the third as 9240, the quarter as
      6930, the fifth as 5544, the sixth as 4620, the seventh as 3960, the eighth as 3465, the ninth as 3080,
      the tenth as 2772, the eleventh as 2520, the twelfth as 2310; adding them gives 86,021, for the
      divisor. Set out the field, 240 *bu*, and also multiply it by 27,720, for the dividend. Divide the
      dividend by the divisor to get the length in *bu*. That rule also gets it, and is not cumbersome.
    cites: [VII.36]
