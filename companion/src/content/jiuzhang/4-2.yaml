id: JZ.4.2
title: Short width, continued — widths up to 1/12
paraphrase: |
  The same problem for widths $1 + \tfrac12 + \cdots + \tfrac1n$, $n = 6, \dots, 12$. The common multiples
  the rule produces are 120, 420, 840, 2520, 2520, 27,720 and 83,160. For $n = 6$ and $n = 12$ they
  are twice and three times the least common multiple. Li Chunfeng's team points out the simpler
  27,720 for the last problem.

  The answers are exact. For $n = 12$, the length is $77\tfrac{29183}{86021}$ *bu*, against a width of
  just over 3.1 *bu*.

parallels:
  - id: VII.36
    relation: related
    note: |
      Li Chunfeng's correction, 27,720 rather than 83,160, is the least number measured by all of
      $1, \dots, 12$, the number Euclid's VII.36, extended, would produce.

steps:
  - classic: |
      Now there is a field 1 1/2 1/3 1/4 1/5 1/6 *bu* wide. To make a field of 1 *mu*, question: what is the
      length? Answer: 97 47/49 *bu*.
  - classic: |
      The rule says: below there are sixths. Take 1 as 120, the half as 60, the third as 40, the quarter as
      30, the fifth as 24, the sixth as 20; adding them gives 294, for the divisor. Set out the field, 240
      *bu*, and also multiply it by 120, for the dividend. Divide the dividend by the divisor to get the
      length in *bu*.
    hint: |
      The rule's procedure, multiplying successively by 6 and then by 5, gives 120 rather than the least
      common multiple 60. The answer reduces to the same fraction.
    modern: |
      $\dfrac{240 \cdot 120}{294} = 97\tfrac{47}{49}$.
  - classic: |
      Now there is a field 1 1/2 1/3 1/4 1/5 1/6 1/7 *bu* wide. To make a field of 1 *mu*, question: what is
