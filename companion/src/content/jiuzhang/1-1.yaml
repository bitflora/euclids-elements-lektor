id: JZ.1.1
title: Rectangular fields — width times length
paraphrase: |
  The book opens with its simplest rule. A rectangular field 15 *bu* wide and 16 *bu* long has an area
  of $15 \times 16 = 240$ square *bu*, which is one *mu* 畝, the unit of land; 100 *mu* make a *qing*
  頃. Every problem in the book has this form: a question (*wen* 問), an answer (*da* 荅), and a rule
  (*shu* 術) that gives the answer from the data.

  Liu Hui calls the product the field's "area" (*mi* 冪). Li Chunfeng's team objects to his wording: a
  *mi* is a spread-out surface, whereas the classic's *ji* 積, "accumulation", is a count of unit
  squares. Then they verify the rule by counting. Cut the field into 15 strips one way and 16 the
  other, and there are 240 unit squares.

parallels:
  - id: II.Def.1
    relation: related
    note: |
      Euclid speaks of a rectangle as "contained by" its two sides and never multiplies lengths: his
      areas are figures, compared by cutting and fitting, not numbers. The *Nine Chapters* measures an
      area by the number of unit squares it holds, as Li Chunfeng's count shows.
  - id: VII.Def.16
    relation: related
    note: |
      In the arithmetical books Euclid calls the product of two numbers a "plane" number, whose
      "sides" are the factors. The name keeps the picture of a rectangle of units: Li Chunfeng's 15 by
      16 field.

