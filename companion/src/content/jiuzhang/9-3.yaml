id: JZ.9.3
title: A vine round a tree — unrolling the cylinder; the gnomons of the gou-gu figure
paraphrase: |
  A tree 2 *zhang* tall, 3 *chi* round, has a vine growing from its foot that winds 7 times round it to the
  top. How long is the vine? Unroll the trunk: the vine becomes the hypotenuse of a right triangle with legs
  20 (the height) and $7 \times 3 = 21$ (seven circumferences). It is 29 *chi*.

  Liu Hui's note goes on to his general account of the *gou-gu* figure. Take the square on the hypotenuse
  with the square on the *gu* placed inside it at a corner. What is left is an L-shaped gnomon equal to the
  *gou* square. That gnomon, straightened out, is a rectangle with width $c - b$ and length $c + b$. So
  $a^2 = (c - b)(c + b)$, and likewise $b^2 = (c - a)(c + a)$. "Difference and sum divide each other." The
  next five problems use this.

parallels:
  - id: I.47
    relation: same
    note: |
      The vine is the hypotenuse of the unrolled triangle.
  - id: II.6
    relation: same
    note: |
      The *gou* square as a gnomon, "with the difference of *gu* and hypotenuse as width and their sum as
      length": $c^2 - b^2 = (c - b)(c + b)$. In Euclid's form, II.6: if a line is bisected and extended, the
      rectangle on the whole extended line and the extension, with the square on the half, equals the square
      on the half plus the extension. (II.5 is the same identity for a line cut unequally.)
  - id: II.Def.2
    relation: related
    note: |
      Liu's *ju mi* 矩冪, "trysquare area", is the gnomon of II.Def.2: the L-shaped region left when a square is
      cut from a corner of a larger square.

