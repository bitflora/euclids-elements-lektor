id: JZ.4.3
title: Extracting the square root — yellow, red and blue areas
paraphrase: |
  The square-root algorithm, done digit by digit on the counting board. For 55,225: the root has three
  digits, and the first is 2 (hundreds); subtract $200^2$. Double 200 for the "fixed divisor", 400. The
  next digit, 3, must satisfy $(400 + 30) \cdot 30 \le 15{,}225$; subtract 12,900. The divisor becomes 460;
  the last digit, 5, gives $(460 + 5) \cdot 5 = 2325$, exactly the remainder. The root is 235.

  Liu Hui explains each move with a coloured figure. The first digit's square is the "yellow area A";
  the two rectangles along its sides are the "red areas", whose length is the fixed divisor; the small
  corner square is the "yellow area B"; the next rectangles are "blue". This is the geometry of
  $(a + b)^2 = a^2 + 2ab + b^2$. Where the root is not a whole number, Liu continues in decimal
  fractions, "the further down, the finer the parts".

parallels:
  - id: II.4
    relation: same
    proves: true
    note: |
      "If a straight line be cut at random, the square on the whole is equal to the squares on the
      segments and twice the rectangle contained by the segments." Liu's figure is Euclid's: yellow A and
      yellow B are the squares on the segments, the two red areas the two rectangles. The algorithm
      subtracts them in turn.
  - id: II.Def.2
    relation: related
    note: |
      After the first digit, what remains to be subtracted is a gnomon, two red rectangles and a yellow
      corner, around the yellow square A. Euclid names the gnomon in II.Def.2.

diagram:
