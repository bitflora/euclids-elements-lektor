id: JZ.9.18
title: Sighting distances, a mountain's height, a well's depth
paraphrase: |
  The book ends with three surveying problems, each solved with one pair of similar right triangles. The
  distance of a tree is found with four posts set out in a square. The height of a mountain is found by sighting
  its peak over the top of a tree of known height. The depth of a well is found by sighting its far waterline
  past the top of a post. In each, Liu Hui names a "*gou* rate" and "*gu* rate" in the small triangle and a
  "given" side in the large one.

  These are the methods Liu's preface says are limited: the base of the large triangle must be reachable
  ([[JZ.Pref]]). His *Sea Island Manual* (*Haidao suanjing*) was appended here to go further.

parallels:
  - id: VI.4
    relation: same
    note: |
      All three are the proportionality of the sides of equiangular triangles. The Zhou bi's gnomon calculations
      ([[ZB.2.5]]) are the same.
  - id: VI.2
    relation: related
    note: |
      The mountain's height: a line (the tree) parallel to one side of a triangle (the mountain) cuts the other
      sides proportionally (VI.2).

