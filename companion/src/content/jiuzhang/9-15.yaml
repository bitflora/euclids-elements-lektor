id: JZ.9.15
title: The tree outside the town — similar triangles
paraphrase: |
  A square walled town, 200 *bu* on a side, has a gate in the middle of each wall. A tree stands 15 *bu* outside
  the east gate. How far out of the south gate must one walk to see the tree past the south-east corner? The
  sight-line makes two similar right triangles: $x = \dfrac{100 \cdot 100}{15} = 666\tfrac23$ *bu*. The second
  problem has an oblong town.

  Liu Hui reads both as the rule of three on similar triangles: a "*gou* rate" and a "*gu* rate" from one
  triangle, applied to a "given *gou*" in the other.

parallels:
  - id: VI.4
    relation: same
    note: |
      The two triangles, tree–east gate–corner and corner–south gate–observer, are equiangular (their sides lie
      along parallel walls and one sight-line), so their sides are proportional: Euclid's VI.4, used as the "rates"
      of the *gou* and *gu*.

