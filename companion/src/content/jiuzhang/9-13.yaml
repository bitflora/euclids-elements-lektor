id: JZ.9.13
title: The square inscribed in a right triangle
paraphrase: |
  What is the largest square that fits in the right angle of a triangle with *gou* 5 and *gu* 12? Its side is
  $\dfrac{ab}{a + b} = \dfrac{60}{17} = 3\tfrac{9}{17}$.

  Liu Hui gives two proofs. The first is a dissection. Two copies of the triangle make the rectangle $ab$,
  made of two squares (yellow) and two each of the small triangles (red, blue) left beside the square. These
  rearrange into a long rectangle whose width is the square's side and whose length is $a + b$. The second
  uses similar triangles. The small triangles beside the square "keep the original rates", so the square's
  side follows by the rule of three.

parallels:
  - id: VI.4
    relation: same
    note: |
      "The two edges of the square each form small *gou-gu* triangles, whose relation keeps the original rates."
      The small triangles are equiangular with the whole, so their sides are proportional (VI.4). Liu's second
      proof is a fourth proportional: $s : (a - s) = b : a$.
  - id: I.43
    relation: related
    note: |
      The dissection proof rests on the complements about the diagonal of a rectangle being equal. In the
      rectangle $a \times b$ cut by its diagonal, the square at the corner and the rectangle opposite are such
      complements, the figure of I.43.

