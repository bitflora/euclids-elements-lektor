  caption: |
    The slanted field {A}{B}{C}{D}: the ends {AD} and {BC} are parallel and {AB} is the true length
    between them. The line {EF} at the mean height cuts the slant at its midpoint {M}. The red triangle
    {MCF|cut} above it is congruent to the blue gap {MDE|fill} below it. Moved across, it turns the field into the
    rectangle {A}{B}{F}{E}, whose width is the mean of the two ends.

steps:
  - classic: |
      Now there is a slanted field, one end 30 *bu* wide and the other 42 *bu*, with a true length of 64
      *bu*. Question: how much field does it make? Answer: 9 *mu* 144 *bu*.
    highlight: [AD, BC, AB]
  - classic: |
      Again there is a slanted field, its true width 65 *bu*, one side 100 *bu* long and the other 72 *bu*.
      Question: how much field does it make? Answer: 23 *mu* 70 *bu*.
    hint: The same field turned the other way; $\tfrac12(100 + 72) \cdot 65 = 5590$ square *bu*.
  - classic: |
      The rule says: add the two slanting [ends] and halve them, and multiply by the true length or width.
      Or halve the true length or width, and multiply by the sum. Divide by the *mu* divisor.
    hint: |
      The "two slanting" are the two ends that the slant joins, the parallel sides.
    modern: $A = \tfrac12 (a + b)\, h = (a + b) \cdot \tfrac{h}{2}$.
  - liu: |
      Adding and halving is using the excess to fill the deficit.
    adds: [E, F, M, EF, cut, fill]
    highlight: [cut, fill]
    explain:
      fact: |
        The triangle {MCF|cut} cut off by the mean line exactly fills the gap {MDE|fill}. The field equals the
        rectangle {A}{B}{F}{E} on the mean width $\tfrac12(a+b)$.
