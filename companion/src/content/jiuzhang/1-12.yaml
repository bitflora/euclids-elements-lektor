id: JZ.1.12
title: Slanted fields — the trapezoid
paraphrase: |
  A "slanted field" (*xie tian* 邪田) is a right trapezoid: one side slants, the two ends are parallel.
  Its area is half the sum of the parallel sides times the distance between them:
  $\tfrac12(30 + 42) \cdot 64 = 2304$ square *bu*, which is 9 *mu* 144 *bu*. Liu Hui: "adding and halving
  is using the excess to fill the deficit".

parallels:
  - id: I.41
    relation: related
    note: |
      Euclid has no rule for the trapezoid, but the out-in argument reduces it to his propositions on
      triangles and parallelograms: cut off the triangle beyond the mean width and turn it into the gap.
      The halves are congruent triangles (I.26), and the trapezoid equals the rectangle on the mean of
      the parallel sides.

