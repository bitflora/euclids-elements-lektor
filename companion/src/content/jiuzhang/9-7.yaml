steps:
  - classic: |
      Now there is a round log buried in a wall, its size unknown. Sawing it, at a depth of 1 *cun* the saw-path is
      1 *chi* long. Question: what is the diameter? Answer: the log is 2 *chi* 6 *cun* across.
    highlight: [AB, MT]
  - classic: |
      The rule says: multiply half the saw-path by itself,
  - liu: |
      This rule takes the saw-path of 1 *chi* as the *gou* and the log's diameter as the hypotenuse; the depth of
      the cut, 1 *cun*, is half the difference of *gu* and hypotenuse. So the saw-path is halved too.
    adds: [X, AX, BX]
    highlight: [AB, BX, AX]
    explain:
      fact: |
        $BX - AX = 2 \cdot MT$, since {AX} and the diameter through {M} are parallel chords and {AX} falls
        short of the diameter by the depth at each end. Then $BX + AX = \dfrac{AB^2}{BX - AX} = \dfrac{100}{2} =
        50$, and $BX = 26$. Halving the chord and the difference together gives $\dfrac{25}{1} + 1 = 26$
        directly.
    cites: [III.31]
  - li: |
      We respectfully note: the cut's depth of 1 *cun* is half the difference of *gu* and hypotenuse; where the
      commentary says "the difference of *gu* and hypotenuse", it means the saw-path.
    dispute: |
      Li's correction is itself obscure; the point is that the depth is half the difference.
  - classic: |
      divide by the depth in *cun*, and add the depth in *cun*: that is the diameter of the log.
    modern: |
      $d = \dfrac{(c/2)^2}{s} + s = \dfrac{25}{1} + 1 = 26$ *cun*.
    cites: [III.35]
  - liu: |
      Here too one adds the half. In the rule above, the distance from the foot should be halved; here all are
      halved differences alike, so there is no need to halve again.
    hint: |
      Compare the rope ([[JZ.9.5]]): $c = \tfrac12\left(\tfrac{a^2}{d} + d\right)$. Here $a$ and $d$ are both halved already.
