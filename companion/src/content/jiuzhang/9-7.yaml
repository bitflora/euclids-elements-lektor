id: JZ.9.7
title: The log in the wall — chord and depth give the diameter
paraphrase: |
  A round log is buried in a wall, size unknown. Sawing into it, a cut 1 *cun* deep makes a saw-path 1 *chi*
  long. What is the diameter? The rule: half the saw-path squared, divided by the depth, plus the depth:
  $\tfrac{5^2}{1} + 1 = 26$ *cun*.

  Liu Hui fits it to the *gou-gu* pattern. The chord (10) is a *gou*, the diameter through one end of the chord
  is the hypotenuse, and twice the depth is the difference of *gu* and hypotenuse. So $c + b = 100/2 = 50$
  and $c = 26$. The rule halves everything, which comes to the same.

parallels:
  - id: III.35
    relation: same
    note: |
      "If in a circle two straight lines cut one another, the rectangle contained by the segments of the one is
      equal to the rectangle contained by the segments of the other." For the chord and the diameter at right
      angles to it: $(\tfrac{c}{2})^2 = s(d - s)$, so $d = \tfrac{(c/2)^2}{s} + s$, which is the rule.
  - id: III.31
    relation: related
    note: |
      Liu's right triangle has the diameter as hypotenuse and the chord as a leg; its right angle is the angle
      in a semicircle (III.31).
  - id: III.3
    relation: related
    note: |
      That the saw-path is bisected by the diameter perpendicular to it (the rule uses half of it) is III.3.

