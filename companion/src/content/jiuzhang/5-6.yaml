id: JZ.5.6
title: Square pyramids and round cones — a third of the box
paraphrase: |
  A square pyramid (*fang zhui* 方錐) is a third of the box on its base with its height: $V = \tfrac13 a^2 h$.
  A round cone (*yuan zhui* 圓錐) is a third of its cylinder, given here, with π = 3, as $C^2 h / 36$.

  Liu Hui's justification is a count of *yangma*. A square pyramid with base 2 and height 1 is four
  *yangma* (one in each quarter of the base). The box on its base is four unit cubes, or twelve *yangma*,
  so it holds three such pyramids. The cone is to the pyramid as the circle to the square.

parallels:
  - id: XII.7
    relation: same
    note: |
      "Any pyramid is a third part of the prism which has the same base with it and equal height" (porism to
      XII.7). Euclid proves it for triangular pyramids by dissecting a prism into three pyramids equal by
      XII.5. Liu counts *yangma*, relying on his proof that a *yangma* is a third of its cube ([[JZ.5.8]]).
  - id: XII.10
    relation: same
    note: |
      "Any cone is a third part of the cylinder which has the same base with it and equal height." Liu gets it
      from the pyramid by the ratio of circle to square; Euclid proves it by exhaustion with inscribed
      pyramids and prisms.

steps:
  - classic: |
      Now there is a square pyramid 2 *zhang* 7 *chi* square at the base and 2 *zhang* 9 *chi* high. Question:
      what is its volume? Answer: 7047 *chi*.
    modern: |
      $\tfrac13 \cdot 27^2 \cdot 29 = 7047$.
  - classic: |
      The rule says: multiply the lower side by itself, multiply by the height, and divide by 3.
    modern: |
      $V = \tfrac13 a^2 h$.
    cites: [XII.7]
  - liu: |
      In this rule, suppose a square pyramid 2 *chi* square at the base and 1 *chi* high: that is four
      *yangma*. Done by the rule, twelve *yangma* make three square pyramids; so dividing by 3 gives it.
    explain:
      fact: |
        The pyramid with base $2 \times 2$ and height 1 has its apex above the centre of the base. The
        vertical planes through the apex parallel to the sides cut it into four *yangma*, each with a $1
        \times 1$ base and its apex over a corner. The box $2 \times 2 \times 1$ is four unit cubes, each
        three *yangma*: twelve in all, three pyramids.
      implicit: |
        That the pyramid of any proportions is a third of its box. Liu's proof in [[JZ.5.8]] covers *yangma*
        of any width, length and height.
  - classic: |
      Now there is a round cone with a base circumference of 3 *zhang* 5 *chi* and a height of 5 *zhang* 1
      *chi*. Question: what is its volume? Answer: 1735 5/12 *chi*.
  - liu: |
      By Hui's method the volume should be 1658 13/314 *chi*. By the precise rate, the volume is 1656 47/88 *chi*.
  - classic: |
      The rule says: multiply the base circumference by itself, multiply by the height, and divide by 36.
    modern: |
      $V = \dfrac{C^2 h}{36}$, that is $\tfrac13 \pi r^2 h$ with π = 3.
    cites: [XII.10]
  - liu: |
      In this rule, take the round cone's base circumference as the side of a square pyramid's base. Multiply
      it by itself, multiply by the height, and divide by 3: that gives the volume of the large square
      pyramid. The volume of the large square pyramid contains 12 rounds. Now we want one round, so we divide
      again by 12; hence 3 times 12 makes 36, dividing all at once.
    zh: 按此術圓錐下周以爲方錐下方方錐下方令自乘以高乘之合三而一得大錐方之積大錐方之積合十二圓矣今求一圓復合十二除之故令三乘十二得三十六而連除
    explain:
      fact: |
        A square of side $C$ has area $C^2$; with π = 3 the circle of circumference $C$ has area $C^2/12$. So
        the pyramid on the large square holds the cone twelve times.
  - liu: |
      By Hui's method, one should multiply the base circumference by itself, multiply by the height, again by
      25, and divide by 942. The round cone compared with the square pyramid is also 157/200. If the diameter
      is multiplied by itself, one should multiply by 157 and divide by 600. The explanation is as for the
      round frustum.
    modern: |
      $V = \dfrac{157}{600}\, d^2 h = \tfrac13 \cdot \tfrac{\pi}{4} d^2 h$ with π = 3.14.
  - li: |
      We respectfully note: by the precise rate, multiply by 7 and divide by 264.
