  given: [A, B, C, AB, AC, BC]
  caption: |
    The triangle {A}{B}{C} with base {AB} = 12 and height 21. Vertical cuts {MP} and {NQ} through the
    midpoints {M}, {N} of the sides cut off the red corners {APM|cutA} and {BQN|cutB}. Each, turned half round
    about {M} or {N}, exactly fills a blue gap ({SCM|fillS}, {RCN|fillR}) beside the apex. The result is the
    rectangle {P}{Q}{R}{S}: half the base wide, the full height high.

steps:
  - classic: |
      Now there is a pointed field, 12 *bu* wide, with a true length of 21 *bu*. Question: how much field
      does it make? Answer: 126 *bu*.
    hint: |
      The "true length" is the height, measured straight (perpendicular to the base), not along a
      slanting side.
    highlight: [AB]
  - classic: |
      Again there is a pointed field 5 1/2 *bu* wide and 8 2/3 *bu* long. Question: how much field does it
      make? Answer: 23 5/6 *bu*.
    modern: $\tfrac12 \cdot \tfrac{11}{2} \cdot \tfrac{26}{3} = \tfrac{143}{6} = 23\tfrac56$.
  - classic: |
      The rule says: half the width, multiplied by the true length.
    modern: $A = \tfrac12\, b\, h$.
    adds: [rect]
    highlight: [rect]
    cites: [I.41]
  - liu: |
      "Half the width": using the excess to fill the deficit, it becomes a rectangular field. One may
      also halve the true length and multiply by the width. On halving the width and multiplying by the
      length: this takes the middle, level value. So the width and length are multiplied for the
      accumulated *bu*, and dividing by the *mu* divisor gives it.
    hint: |
      The first statement of Liu's out-in principle: the pieces that stick out (the "excess") are moved
      into the gaps (the "deficit"). Cut and moved, the area does not change.
    adds: [M, N, P, Q, R, S, MP, NQ, cutA, cutB, fillS, fillR]
    highlight: [cutA, cutB, fillS, fillR]
    explain:
      did: |
        Liu turns the triangle into a rectangle of equal area: half the base wide, the full height high
        (as in the figure). Halving the height instead, he gets a rectangle the full base wide and half
        as high.
      fact: |
        The corner {APM|cutA} and the gap {SCM|fillS} are congruent: half a turn about the midpoint {M} carries
        one onto the other.
      implicit: |
        That the pieces are congruent and fit exactly. Liu's figure would make it visible; Euclid would
        prove it with I.26 (a side and two angles) and I.15 (vertical angles).
