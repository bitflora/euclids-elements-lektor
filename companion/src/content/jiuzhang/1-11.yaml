id: JZ.1.11
title: Triangular fields — half the width times the height
paraphrase: |
  A *gui* 圭 field is a triangle; the name comes from the jade tablet with a pointed top. Its area is
  half the width (the base) times the "true length" (*zheng zong* 正從, the height):
  $\tfrac12 \cdot 12 \cdot 21 = 126$ square *bu*.

  Liu Hui's proof is a dissection, "using the excess to fill the deficit" (*yi ying bu xu* 以盈補虛).
  Cut off the two corners at the base with vertical cuts through the midpoints of the sides, and turn
  each over into the gap beside the apex. The triangle becomes a rectangle half as wide and just as
  high.

parallels:
  - id: I.41
    relation: same
    proves: true
    note: |
      A parallelogram on the same base and between the same parallels as a triangle is double the
      triangle. So the triangle equals the rectangle on half the base with the same height, which is the
      rule here. Euclid proves it by the diagonal cutting the parallelogram in half (I.34) and by
      comparing figures on equal bases (I.35–I.38). Liu cuts the triangle itself into pieces and moves
      them.
  - id: I.42
    relation: related
    note: |
      Euclid's construction of a parallelogram equal to a given triangle uses the same half-base
      rectangle: the triangle is turned into a parallelogram on half the base.

