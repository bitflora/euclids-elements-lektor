    is $2c^2 - (b - a)^2$.

steps:
  - classic: |
      Now there is a door whose height exceeds its width by 6 *chi* 8 *cun*, and whose two corners are exactly 1
      *zhang* apart. Question: what are the door's height and width? Answer: width 2 *chi* 8 *cun*; height 9
      *chi* 6 *cun*.
  - classic: |
      The rule says: multiply 1 *zhang* by itself for the dividend. Halve the excess, multiply it by itself, double
      it, subtract it from the dividend, and halve the remainder. Extract the square root; subtract half the
      excess from the result: that is the door's width. Add half the excess: that is the door's height.
    modern: |
      $\tfrac{a + b}{2} = \sqrt{\tfrac12\left[c^2 - 2\left(\tfrac{b-a}{2}\right)^2\right]} = \sqrt{\tfrac12(10{,}000 - 2 \cdot
      34^2)} = 62$ *cun*; width $62 - 34 = 28$, height $62 + 34 = 96$.
    cites: [II.9]
  - liu: |
      Let the door's width be the *gou*, its height the *gu*, and the 1 *zhang* between the corners the
      hypotenuse; the excess of height over width, 6 *chi* 8 *cun*, is the difference of *gou* and *gu*. Set it
      out by the figure: the hypotenuse area is exactly 10,000 *cun*. Double it, subtract the square of the
      difference of *gou* and *gu*, and extract the square root: the result is the sum of height and width.
      Subtract the difference from the sum and halve it: that is the door's width; add the excess: that is the
      door's height.
    zh: 令戸廣爲句高爲股兩隅相去一丈爲弦高多於廣六尺八寸爲句股差按圖爲位弦幂適滿萬寸倍之減句股差幂開方除之其所得卽高廣并數以差減并而半之卽戸廣加相多之數卽戸高也
    modern: |
      $a + b = \sqrt{2c^2 - (b - a)^2} = \sqrt{20{,}000 - 4624} = 124$.
  - liu: |
      Now this rule first finds the half. 1 *zhang* multiplied by itself is four red areas and one yellow area.
      Half the difference, multiplied by itself and doubled, is two quarters of the yellow area. Subtract it from
      the dividend and halve the remainder: there are two red areas and a quarter of the yellow area. Of the
      large square, this leaves out three quarters and is exactly a quarter. So extracting the square root gives
      half the sum of height and width; subtracting half the difference gives the width, and adding gives the
      door's height.
    zh: 今此術先求其半一丈自乘爲朱幂四黃幂一半差自乘又倍之爲黃幂四分之二減實半其餘有朱幂二黃幂四分之一其於大方棄四分之三適得四分之一故開方除之得高廣并數之半減差半得廣加得戸高
    highlight: [red1, red2, red3, red4, yellow, outer]
    explain:
      fact: |
        $c^2 = 4\,\triangle + Y$ and $(a + b)^2 = 8\,\triangle + Y$, where $\triangle = \tfrac12 ab$ and $Y = (b-a)^2$. So
        $\tfrac12\left(c^2 - \tfrac12 Y\right) = 2\,\triangle + \tfrac14 Y = \tfrac14 (a + b)^2$.
  - liu: |
      Further, by the areas of this figure: the sum of *gou* and *gu* multiplied by itself, with the square of the
      difference added, makes two hypotenuse areas; halve it and extract the root to get the hypotenuse. Now,
      doubling the hypotenuse area and subtracting the square of the difference finds the sum of *gou* and *gu*:
      one first sees the hypotenuse, and then knows the *gou* and the *gu*.
    zh: 又按此圖幂句股并自乘加差幂爲兩弦幂半之開方得弦今倍弦幂減差幂求句股并葢先見其弦然後知其句與股也
    modern: |
      $(a + b)^2 + (b - a)^2 = 2c^2$.
    cites: [II.9, II.10]
  - liu: |
      When the *gou* and *gu* are exactly equal, their sum multiplied by itself makes two hypotenuse areas, each
      a square. "First seeing the hypotenuse, then knowing *gou* and *gu*": doubling the hypotenuse area gives
      the square of the sum when *gou* and *gu* are equal. Half the excess multiplied by itself and doubled, and
      half the sum multiplied by itself and also doubled, together make the hypotenuse area.
    zh: 句股適等者并而自乘卽爲兩弦幂皆各爲方先見其弦然後知其句與股者倍弦幂卽爲句股適等者并而自乘之幂半相多自乘倍之又半股并自乘亦倍之合爲弦幂
    modern: |
      $c^2 = 2\left(\tfrac{b - a}{2}\right)^2 + 2\left(\tfrac{a + b}{2}\right)^2$, exactly II.9.
    dispute: |
      半股并 ("half the *gu* sum") should read 半并, "half the sum".
  - liu: |
      When there is no difference, multiply the *gou* and the *gu* each by itself and add, for the dividend; or
      multiply *gou* by *gu* and double, for the dividend: extracting the root of either gives the hypotenuse.
      Halve the hypotenuse area for the dividend, and extracting the root gives the *gou* and *gu*. [The case
      where] the *gu* is long and the *gou* short comes from the same source and divides into another stream.
    zh: 其無差數者句股各自乘并之爲實與句股相乘倍之爲實皆開方得弦弦幂半之爲實開方卽得句股及股長句短同源而分流焉
  - liu: |
      Suppose the *gou* and the *gu* are each 5: the hypotenuse area is 50, and extracting its root gives 7 *chi*
      and more, with 1 not used up. Suppose the hypotenuse is 10: its area is 100; halved, the *gou* and *gu*
      areas are each 50, which again cannot be extracted. So it is said, "circle 3, diameter 1; square 5,
      diagonal 7": though not exactly right, one can say they come close.
    zh: 假令句股各五弦幂五十開方除之得七尺有餘一不盡假令弦十其幂有百半之爲句股二幂各得五十當亦不可開故曰圓三徑一方五斜七雖不正得盡理亦可言相近耳
    hint: |
      $7^2 = 49$, one short of 50. The saying "square 5, diagonal 7" ($\sqrt2 \approx 1.4$) is the square's
      counterpart of "circumference 3, diameter 1".
    cites: [X.9]
  - liu: |
      From the area of *gou* and *gu* combined and multiplied by itself: take the hypotenuse multiplied by itself
      and doubled, two hypotenuse areas, and subtract [the first] from it; extract the root of the remainder: that
      is the difference of *gou* and *gu*. Add the difference to the sum and halve: the *gu*; subtract the
      difference from the sum and halve: the *gou*. *Gou*, *gu* and hypotenuse are the height, width and
      diagonal; they come from this figure.
    zh: 其句股合而自乘之幂令弦自乘倍之爲兩弦幂以減之其餘開方除之爲句股差加差於合而半之爲股減差於合而半之爲句股弦卽高廣袤其出此圖也
    modern: |
      $(b - a)^2 = 2c^2 - (a + b)^2$.
  - liu: |
      Doubling the hypotenuse to combine the width and the diagonal [?], the trysquare *gou* becomes an area, and
      its width is the difference of *gou* and *gu*. The area of the trysquare *gou*, doubled, as the "following
      divisor", extracted, is again the difference of *gou* and *gu*. Of the rest: subtract [the square of the
      difference] from the hypotenuse area and halve the remainder; with the difference as the following
      divisor, extract the square root: that is the *gou*.
    modern: |
      $a^2 + (b - a)\,a = ab = \tfrac12\left[c^2 - (b - a)^2\right]$, a quadratic in $a$ with "following divisor"
      (linear coefficient) $b - a$: $a^2 + 68a = 2704$, so $a = 28$.
    dispute: |
      The first two sentences are corrupt and the translation is a guess. The last sentence gives a second
      method: solve a quadratic by the root-extraction with a "following divisor" (*cong fa* 從法), the earliest
      use in the book of that technique for an equation with a linear term.
