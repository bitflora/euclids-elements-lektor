id: JZ.9.9
title: A door from its diagonal and the difference of its sides
paraphrase: |
  A door is 6 *chi* 8 *cun* taller than it is wide, and its diagonal is exactly 1 *zhang*. How tall and wide is
  it? From $c$ and $b - a$: $\left(\tfrac{a + b}{2}\right)^2 = \tfrac12\left[c^2 - 2\left(\tfrac{b - a}{2}\right)^2\right]$, so
  half the sum is found by a square root, and the sides by adding and subtracting half the difference.
  Width 2 *chi* 8 *cun*, height 9 *chi* 6 *cun*.

  Liu Hui explains it with Zhao Shuang's figure. The square on the hypotenuse is four red triangles and a
  yellow square on the difference. The square on the sum is eight red triangles and the yellow square. So
  $(a + b)^2 + (b - a)^2 = 2c^2$. He then digresses to the isosceles case, where the root cannot be found
  exactly: "square 5, diagonal 7" is only an approximation, like "circumference 3, diameter 1".

parallels:
  - id: II.9
    relation: same
    note: |
      "If a straight line be cut into equal and unequal segments, the squares on the unequal segments are double
      of the square on the half and of the square on the straight line between the points of section." With
      the unequal segments $a$ and $b$: $a^2 + b^2 = 2\left(\tfrac{a+b}{2}\right)^2 + 2\left(\tfrac{b-a}{2}\right)^2$.
      Liu's "half the excess squared and doubled, and half the sum squared also doubled, together make the
      hypotenuse area" is exactly II.9. Zhao Shuang uses the same identity in the Zhou bi ([[ZB.1.3]]).
  - id: II.10
    relation: related
    note: |
      The same identity for a line bisected and extended; in Liu's form, $(a + b)^2 + (b - a)^2 = 2c^2$.
  - id: X.9
    relation: related
    note: |
      "Square 5, diagonal 7, though not exact": $5^2 + 5^2 = 50$ is not a square, so the diagonal is not a whole
      number of *chi*. Euclid proves more: the side and diagonal of a square are incommensurable, because
      their squares (1 : 2) are not as a square number to a square number (X.9). Liu only notes that the root
      "cannot be extracted".

