  caption: |
    Zhao Shuang's hypotenuse figure, drawn for this door: width 2.8, height 9.6, diagonal 10. The {square on the
    diagonal|hyp} is four red triangles (each half the door, $\tfrac12 ab$) and the {yellow square|yellow} on the
