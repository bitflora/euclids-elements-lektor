  given: [O, A, B, circ, hex, OA]
  caption: |
    The circle of radius {OA} = 1 *chi* with its inscribed {hexagon|hex}, whose side {A}{B} equals the
    radius. With {OA} as hypotenuse and the half-side {AM} as *gou*, the *gu* {OM} follows. The leftover
