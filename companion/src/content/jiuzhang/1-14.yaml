id: JZ.1.14
title: Circular fields — Liu Hui cuts the circle; π = 3.14
paraphrase: |
  The classic gives four rules for the area of a circle: half the circumference times half the diameter;
  circumference times diameter over 4; three quarters of the square on the diameter; the square of the
  circumference over 12. The first is exact. The others take the circumference as three times the
  diameter ("circumference 3, diameter 1"), so with them the problems' answers come out too large.

  Liu Hui's commentary on the first rule is the most famous passage in the book. He proves the rule by
  inscribing regular polygons in the circle, doubling the sides again and again: "the finer one
  cuts, the less is lost; cut and cut again until it cannot be cut, and it coincides with the circle,
  and nothing is lost". Then he computes. Starting from the hexagon in a circle of radius 1 *chi*, he
  finds the sides of the 12-, 24-, 48- and 96-gons by the *gou-gu* rule, and the areas of the 96- and
  192-gons: $313\tfrac{584}{625}$ and $314\tfrac{64}{625}$ square *cun* (313.9344 and 314.1024). Since the circle lies between the 192-gon and the 192-gon
  plus the difference of the last two areas, he takes 314. That is $\pi \approx 3.14$, or $\tfrac{157}{50}$,
  and a later refinement gives $\tfrac{3927}{1250} = 3.1416$.

  Li Chunfeng's team explains why "circumference 3" fits the hexagon, not the circle, and reports Zu
  Chongzhi's more precise $\tfrac{22}{7}$, used in their own notes on each problem.

parallels:
  - id: XII.2
    relation: related
    note: |
      Euclid proves that circles are to one another as the squares on their diameters, by inscribing
      polygons whose sides double until the leftover is less than any given area: the "method of
      exhaustion". Liu's argument has the same core: each doubling cuts away more than half of what
      is left, and the leftover tends to nothing. But Liu goes to the limit ("until it cannot be cut")
      where Euclid argues by double contradiction, and Liu computes a number where Euclid proves only a
      ratio. The ratio Euclid proves constant is the 3/4 (Liu: 157/200) of the third rule here.
  - id: X.1
    relation: related
    note: |
      The principle behind "the finer one cuts, the less is lost": if from a magnitude more than half is
      taken away, and from the remainder more than half, and so on, there will be left a magnitude less
      than any given one. Euclid proves it, and uses it in XII.2; Liu takes it as evident.
  - id: IV.15
    relation: same
    note: |
      "The side of the hexagon inscribed in a circle is equal to the radius." Liu starts from it, and
      Li Chunfeng's six triangles make it visible. Euclid states it in the porism to IV.15.
  - id: I.47
    relation: same
    note: |
      Each doubling of the sides is two applications of the *gou-gu* rule ([[JZ.9.1]]): radius and
      half-side give the distance from the centre to the side; the leftover of the radius and the
      half-side give the side of the polygon with twice as many sides.
  - id: III.3
    relation: related
    note: |
      Liu takes for granted that the radius through the midpoint of an arc is perpendicular to the chord
      and bisects it, so that the half-side is a leg of a right triangle with the radius as hypotenuse.
      Euclid proves it in III.3.

