  caption: |
    A semicircular bow field: chord {AB} $= 2r$, arrow {OT} $= r$. "Chord times arrow, halved" is the
    yellow triangle {ABT|yellow}; "arrow squared, halved" is the two blue pieces, {left|blueL} and {right|blueR}.
