id: JZ.1.16
title: Segment-shaped fields — chord and arrow
paraphrase: |
  A "bow field" (*hu tian* 弧田) is a segment of a circle, given by its chord (*xian* 弦, the
  bowstring) and its sagitta (*shi* 矢, the "arrow", the height of the arc above the chord). The
  classic's rule: area $= \tfrac12(cs + s^2)$.

  Liu Hui shows where it comes from. For a semicircle, chord $2r$ and arrow $r$, the rule gives
  $\tfrac32 r^2$, which is half the area of the inscribed 12-gon. It is the circle rule with π = 3
  again ([[JZ.1.14]]), and too small. For smaller segments it is worse. He proposes an exact method in
  the spirit of the circle: find the diameter from chord and arrow, then cut the segment into ever
  smaller segments and add up the triangles, "chord times arrow", until the sum is as close as one
  likes.

parallels:
  - id: III.35
    relation: related
    note: |
      To find the circle's diameter from chord and arrow, Liu cites the problem of the log in the wall
      ([[JZ.9.7]]): $(\tfrac{c}{2})^2 = s(d - s)$. That is III.35, the rectangles on the segments of
      intersecting chords, applied to the chord and the diameter perpendicular to it.
  - id: III.30
    relation: related
    note: |
      "Cutting the arc" halves it at its midpoint, where the perpendicular from the centre meets it.
      Euclid bisects a given arc in III.30.
  - id: I.47
    relation: same
    note: |
      Each halving finds the new chord as the hypotenuse of half the old chord and the arrow, and the
      new arrow from the radius and the half-chord, as in Liu's circle computation.
  - id: X.1
    relation: related
    note: |
      "Cut and cut again until extremely fine, and it will come close to the precise value": the
      exhaustion of the segment by triangles, as in [[JZ.1.14]].

