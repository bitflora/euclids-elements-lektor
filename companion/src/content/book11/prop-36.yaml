steps:
  - part: enunciation
    text: "If three straight lines be proportional, the parallelepipedal solid formed out of the three is equal to the parallelepipedal solid on the mean which is equilateral, but equiangular with the aforesaid solid."
    highlight: [A, B, C]
    hint: |
      $ac = b^2$, so $a\,b\,c = b^3$ (with the same angles).

  - part: setting-out
    text: "Let A, B, C be three straight lines in proportion, so that, as A is to B, so is B to C; I say that the solid formed out of A, B, C is equal to the solid on B which is equilateral, but equiangular with the aforesaid solid."
    highlight: [A, B, C]
    hint: |
      Setup.

  - part: construction
    text: "Let there be set out the solid angle at E contained by the angles DEG, GEF, FED, let each of the straight lines DE, GE, EF be made equal to B, and let the parallelepipedal solid EK be completed, let LM be made equal to A, and on the straight line LM, and at the point L on it, let there be constructed a solid angle equal to the solid angle at E, namely that contained by NLO, OLM, MLN; let LO be made equal to B, and LN equal to C."
    highlight: [B]
    hint: |
      A solid angle at *E* with edges equal to {B}; an equal solid angle at *L* with edges {A}, {B}, {C}.

  - part: proof
    text: "Now, since, as A is to B, so is B to C, while A is equal to LM, B to each of the straight lines LO, ED, and C to LN, therefore, as LM is to EF, so is DE to LN."
    highlight: [A, B, C]
    hint: |
      *LM* : *EF* = *DE* : *LN* …

  - part: proof
    text: "Thus the sides about the equal angles NLM, DEF are reciprocally proportional; therefore the parallelogram MN is equal to the parallelogram DF."
    highlight: [A, B, C]
    hint: |
      … so the parallelograms *MN*, *DF* are equal ([[VI.14]]).

  - part: proof
    text: "And, since the angles DEF, NLM are two plane rectilineal angles, and on them the elevated straight lines LO, EG are set up which are equal to one another and contain equal angles with the original straight lines respectively, therefore the perpendiculars drawn from the points G, O to the planes through NL, LM and DE, EF are equal to one another; hence the solids LH, EK are of the same height."
    highlight: [B]
    hint: |
      Equal heights by [[XI.35]] (porism).

  - part: proof
    text: "But parallelepipedal solids on equal bases and of the same height are equal to one another; therefore the solid HL is equal to the solid EK."
    highlight: [B]
    hint: |
      So the solids are equal ([[XI.31]]).

  - part: proof
    text: "And LH is the solid formed out of A, B, C, and EK the solid on B; therefore the parallelepipedal solid formed out of A, B, C is equal to the solid on B which is equilateral, but equiangular with the aforesaid solid."
    highlight: [A, B, C]
    hint: |
      That is the claim.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        $V = ab c\cdot k = b^3 k$ where $k$ depends only on the angles. $\blacksquare$
