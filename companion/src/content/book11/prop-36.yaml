id: XI.36
kind: theorem
title: The solid on three proportionals equals the equiangular solid on the mean

paraphrase: |
  If {A} : {B} = {B} : {C}, the parallelepiped with edges {A}, {B}, {C} equals the equilateral parallelepiped on {B}
  with the same angles. The solid version of [[VI.17]].

