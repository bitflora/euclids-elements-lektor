steps:
  - part: enunciation
    text: "In equal parallelepipedal solids the bases are reciprocally proportional to the heights; and those parallelepipedal solids in which the bases are reciprocally proportional to the heights are equal."
    highlight: [A]
    hint: |
      Equal volume iff base₁ : base₂ = height₂ : height₁.
    modern: |
      $B_1h_1 = B_2h_2 \iff B_1 : B_2 = h_2 : h_1$.

  - part: setting-out
    text: "Let AB, CD be equal parallelepipedal solids; I say that in the parallelepipedal solids AB, CD the bases are reciprocally proportional to the heights, that is, as the base EH is to the base NQ, so is the height of the solid CD to the height of the solid AB."
    highlight: [A]
    hint: |
      Setup.

  - part: specification
    text: "First, let the sides which stand up, namely AG, EF, LB, HK, CM, NO, PD, QR, be at right angles to their bases; I say that, as the base EH is to the base NQ, so is CM to AG."
    highlight: [A]
    hint: |
      Case 1: upright edges.

  - part: proof
    text: "If now the base EH is equal to the base NQ, while the solid AB is also equal to the solid CD, CM will also be equal to AG."
    highlight: [A]
    hint: |
      If the bases are equal, the heights are.

  - part: proof
    text: "For parallelepipedal solids of the same height are to one another as the bases; and, as the base EH is to NQ, so will CM be to AG, and it is manifest that in the parallelepipedal solids AB, CD the bases are reciprocally proportional to the heights."
    highlight: [A]
    hint: |
      ([[XI.32]].)

  - part: proof
    text: "Next, let the base EH not be equal to the base NQ, but let EH be greater."
    highlight: [A]
    hint: |
      Otherwise let *EH* > *NQ* …

  - part: proof
    text: "Now the solid AB is equal to the solid CD; therefore CM is also greater than AG."
    highlight: [A]
    hint: |
      … so *CM* > *AG*.

  - part: construction
    text: "Let then CT be made equal to AG, and let the parallelepipedal solid VC be completed on NQ as base and with CT as height."
    highlight: [A]
    hint: |
      *CT* = *AG*; complete the solid *CV*.

  - part: proof
    text: "Now, since the solid AB is equal to the solid CD, and CV is outside them, while equals have to the same the same ratio, therefore, as the solid AB is to the solid CV, so is the solid CD to the solid CV."
    highlight: [A]
    hint: |
      *AB* : *CV* = *CD* : *CV* ([[V.7]]) …

  - part: proof
    text: "But, as the solid AB is to the solid CV, so is the base EH to the base NQ, for the solids AB, CV are of equal height; and, as the solid CD is to the solid CV, so is the base MQ to the base TQ and CM to CT; therefore also, as the base EH is to the base NQ, so is MC to CT."
    highlight: [A]
    hint: |
      … *AB* : *CV* = *EH* : *NQ* ([[XI.32]]), *CD* : *CV* = *CM* : *CT* ([[XI.25]]) …

  - part: proof
    text: "But CT is equal to AG; therefore also, as the base EH is to the base NQ, so is MC to AG."
    highlight: [A]
    hint: |
      … so *EH* : *NQ* = *MC* : *AG*.

  - part: proof
    text: "Therefore in the parallelepipedal solids AB, CD the bases are reciprocally proportional to the heights."
    highlight: [A]
    hint: |
      Reciprocally proportional.

  - part: specification
    text: "Again, in the parallelepipedal solids AB, CD let the bases be reciprocally proportional to the heights, that is, as the base EH is to the base NQ, so let the height of the solid CD be to the height of the solid AB; I say that the solid AB is equal to the solid CD."
    highlight: [A]
    hint: |
      Converse.

  - part: proof
    text: "Let the sides which stand up be again at right angles to the bases."
    highlight: [A]
    hint: |
      Upright edges.

  - part: proof
    text: "Now, if the base EH is equal to the base NQ, and, as the base EH is to the base NQ, so is the height of the solid CD to the height of the solid AB, therefore the height of the solid CD is also equal to the height of the solid AB."
    highlight: [A]
    hint: |
      Equal bases give equal heights …

  - part: proof
    text: "But parallelepipedal solids on equal bases and of the same height are equal to one another; therefore the solid AB is equal to the solid CD."
    highlight: [A]
    hint: |
      … and equal solids ([[XI.31]]).

  - part: proof
    text: "Next, let the base EH not be equal to the base NQ, but let EH be greater; therefore the height of the solid CD is also greater than the height of the solid AB, that is, CM is greater than AG."
    highlight: [A]
    hint: |
      Otherwise *CM* > *AG* …

  - part: construction
    text: "Let CT be again made equal to AG, and let the solid CV be similarly completed."
    highlight: [A]
    hint: |
      *CT* = *AG*, the solid *CV*.

  - part: proof
    text: "Since, as the base EH is to the base NQ, so is MC to AG, while AG is equal to CT, therefore, as the base EH is to the base NQ, so is CM to CT."
    highlight: [A]
    hint: |
      *EH* : *NQ* = *CM* : *CT* …

  - part: proof
    text: "But, as the base EH is to the base NQ, so is the solid AB to the solid CV, for the solids AB, CV are of equal height; and, as CM is to CT, so is the base MQ to the base QT and the solid CD to the solid CV."
    highlight: [A]
    hint: |
      … so *AB* : *CV* = *CD* : *CV* …

  - part: proof
    text: "Therefore also, as the solid AB is to the solid CV, so is the solid CD to the solid CV; therefore each of the solids AB, CD has to CV the same ratio."
    highlight: [A]
    hint: |
      … the same ratio to *CV* …

  - part: proof
    text: "Therefore the solid AB is equal to the solid CD."
    highlight: [A]
    hint: |
      … *AB* = *CD* ([[V.9]]).

  - part: construction
    text: "Now let the sides which stand up, FE, BL, GA, HK, ON, DP, MC, RQ, not be at right angles to their bases; let perpendiculars be drawn from the points F, G, B, K, O, M, D, R to the planes through EH, NQ, and let them meet the planes at S, T, U, V, W, X, Y, a, and let the solids FV, Oa be completed; I say that, in this case too, if the solids AB, CD are equal, the bases are reciprocally proportional to the heights, that is, as the base EH is to the base NQ, so is the height of the solid CD to the height of the solid AB."
    highlight: [A]
    hint: |
      Case 2: slanting edges. Drop perpendiculars to form upright solids *BT*, *DX*.

  - part: proof
    text: "Since the solid AB is equal to the solid CD, while AB is equal to BT, for they are on the same base FK and of the same height; and the solid CD is equal to DX, for they are again on the same base RO and of the same height; [id.] therefore the solid BT is also equal to the solid DX."
    highlight: [A]
    hint: |
      *BT* = *AB* and *DX* = *CD* ([[XI.29]], [[XI.30]]) …

  - part: proof
    text: "Therefore, as the base FK is to the base OR, so is the height of the solid DX to the height of the solid BT. [Part 1.]"
    highlight: [A]
    hint: |
      … so by case 1 …

  - part: proof
    text: "But the base FK is equal to the base EH, and the base OR to the base NQ; therefore, as the base EH is to the base NQ, so is the height of the solid DX to the height of the solid BT."
    highlight: [A]
    hint: |
      … the bases are reciprocally as the heights …

  - part: proof
    text: "But the solids DX, BT and the solids DC, BA have the same heights respectively; therefore, as the base EH is to the base NQ, so is the height of the solid DC to the height of the solid AB."
    highlight: [A]
    hint: |
      … of the given solids.

  - part: proof
    text: "Therefore in the parallelepipedal solids AB, CD the bases are reciprocally proportional to the heights."
    highlight: [A]
    hint: |
      So in general.

  - part: specification
    text: "Again, in the parallelepipedal solids AB, CD let the bases be reciprocally proportional to the heights, that is, as the base EH is to the base NQ, so let the height of the solid CD be to the height of the solid AB; I say that the solid AB is equal to the solid CD."
    highlight: [A]
    hint: |
      Converse, slanting case.

  - part: proof
    text: "For, with the same construction, since, as the base EH is to the base NQ, so is the height of the solid CD to the height of the solid AB, while the base EH is equal to the base FK, and NQ to OR, therefore, as the base FK is to the base OR, so is the height of the solid CD to the height of the solid AB."
    highlight: [A]
    hint: |
      The same construction …

  - part: proof
    text: "But the solids AB, CD and BT, DX have the same heights respectively; therefore, as the base FK is to the base OR, so is the height of the solid DX to the height of the solid BT."
    highlight: [A]
    hint: |
      … the reciprocal proportion transfers to *BT*, *DX* …

  - part: proof
    text: "Therefore in the parallelepipedal solids BT, DX the bases are reciprocally proportional to the heights; therefore the solid BT is equal to the solid DX. [Part 1.]"
    highlight: [A]
    hint: |
      … so *BT* = *DX* by case 1.

  - part: proof
    text: "But BT is equal to BA, for they are on the same base FK and of the same height; and the solid DX is equal to the solid DC. [id.]"
    highlight: [A]
    hint: |
      And *BT* = *BA*, *DX* = *DC*.

  - part: proof
    text: "Therefore the solid AB is also equal to the solid CD."
    highlight: [A]
    hint: |
      So *AB* = *CD*.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        $B_1h_1 = B_2h_2$. $\blacksquare$
