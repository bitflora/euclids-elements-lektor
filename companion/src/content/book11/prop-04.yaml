id: XI.4
kind: theorem
title: Perpendicular to two lines at their intersection, perpendicular to their plane

paraphrase: |
  If {EF} is perpendicular to two lines {AB}, {CD} at their point of intersection {E}, it is perpendicular to the
  plane through them — that is, to every line in that plane through {E}.

