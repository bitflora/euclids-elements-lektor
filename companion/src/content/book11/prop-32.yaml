    *AB*, *CD* of the same height; *GK* is built on *FH* = *AE* next to *CD*.

steps:
  - part: enunciation
    text: "Parallelepipedal solids which are of the same height are to one another as their bases."
    highlight: [A]
    hint: |
      Same height: volume ∝ base.

  - part: setting-out
    text: "Let AB, CD be parallelepipedal solids of the same height; I say that the parallelepipedal solids AB, CD are to one another as their bases, that is, that, as the base AE is to the base CF, so is the solid AB to the solid CD."
    highlight: [A]
    hint: |
      Setup.

  - part: construction
    text: "For let FH equal to AE be applied to FG, and on FH as base, and with the same height as that of CD, let the parallelepipedal solid GK be completed."
    highlight: [A]
    hint: |
      Apply *FH* = *AE* to *FG* ([[I.45]]) and complete *GK* with the same height.

  - part: proof
    text: "Then the solid AB is equal to the solid GK; for they are on equal bases AE, FH and of the same height."
    highlight: [A]
    hint: |
      *AB* = *GK* ([[XI.31]]).

  - part: proof
    text: "And, since the parallelepipedal solid CK is cut by the plane DG which is parallel to opposite planes, therefore, as the base CF is to the base FH, so is the solid CD to the solid DH."
    highlight: [A]
    hint: |
      *CD* : *GK* = *CF* : *FH* ([[XI.25]]).

  - part: proof
    text: "But the base FH is equal to the base AE, and the solid GK to the solid AB; therefore also, as the base AE is to the base CF, so is the solid AB to the solid CD."
    highlight: [A]
    hint: |
      Substitute: *AB* : *CD* = *AE* : *CF*.

  - part: conclusion
    text: "Therefore etc."
    highlight: [A]
    hint: |
      The enunciation.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
