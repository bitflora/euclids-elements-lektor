  aliases: { DA: AD, EB: BE, FC: CF, CA: AC, FD: DF, CB: BC, FE: EF }
  caption: |
    {BA} = {BC} = {ED} = {EF}; {AD}, {BE}, {CF} are equal and parallel.

  equal:
    - [AB, BC, DE, EF]
    - [AD, BE, CF]
    - [AC, DF]

steps:
  - part: enunciation
    text: "If two straight lines meeting one another be parallel to two straight lines meeting one another not in the same plane, they will contain equal angles."
    highlight: [ABC, DEF]
    hint: |
      Angles with parallel arms are equal.

  - part: setting-out
    text: "For let the two straight lines AB, BC meeting one another be parallel to the two straight lines DE, EF meeting one another, not in the same plane; I say that the angle ABC is equal to the angle DEF."
    highlight: [ABC, DEF]
    hint: |
      Setup.

  - part: construction
    text: "For let BA, BC, ED, EF be cut off equal to one another, and let AD, CF, BE, AC, DF be joined."
    highlight: [AD, BE, CF]
    hint: |
      Cut off equal lengths; join {AD}, {CF}, {BE}, {AC}, {DF}.

  - part: proof
    text: "Now, since BA is equal and parallel to ED, therefore AD is also equal and parallel to BE."
    highlight: [AD, BE]
    hint: |
      {AD} equal and parallel to {BE} ([[I.33]]).

  - part: proof
    text: "For the same reason CF is also equal and parallel to BE."
    highlight: [CF, BE]
    hint: |
      Likewise {CF}.

  - part: proof
    text: "Therefore each of the straight lines AD, CF is equal and parallel to BE."
    highlight: [AD, CF]
    hint: |
      Both equal and parallel to {BE} …

  - part: proof
    text: "But straight lines which are parallel to the same straight line and are not in the same plane with it are parallel to one another; therefore AD is parallel and equal to CF."
    highlight: [AD, CF]
    hint: |
      … so to each other ([[XI.9]]).

  - part: proof
    text: "And AC, DF join them; therefore AC is also equal and parallel to DF."
    highlight: [AC, DF]
    hint: |
      So {AC} equal and parallel to {DF} ([[I.33]]).

  - part: proof
    text: "Now, since the two sides AB, BC are equal to the two sides DE, EF, and the base AC is equal to the base DF, therefore the angle ABC is equal to the angle DEF."
    highlight: [ABC, DEF]
    hint: |
      Three sides equal: ∠{ABC} = ∠{DEF} ([[I.8]]).

  - part: conclusion
    text: "Therefore etc."
    highlight: [ABC, DEF]
    hint: |
      The enunciation.

reconstruction:
  lines:
    - text: |
        A translation carries one angle onto the other. $\blacksquare$
