steps:
  - part: enunciation
    text: "If there be two prisms of equal height, and one have a parallelogram as base and the other a triangle, and if the parallelogram be double of the triangle, the prisms will be equal."
    highlight: [A, B]
    hint: |
      Volume = base × height for triangular prisms.

  - part: setting-out
    text: "Let ABCDEF, GHKLMN be two prisms of equal height, let one have the parallelogram AF as base, and the other the triangle GHK, and let the parallelogram AF be double of the triangle GHK; I say that the prism ABCDEF is equal to the prism GHKLMN."
    highlight: [A, B]
    hint: |
      Setup.

  - part: construction
    text: "For let the solids AO, GP be completed."
    highlight: [A, B]
    hint: |
      Complete the parallelepipeds *AO*, *GP*.

  - part: proof
    text: "Since the parallelogram AF is double of the triangle GHK, while the parallelogram HK is also double of the triangle GHK, therefore the parallelogram AF is equal to the parallelogram HK."
    highlight: [A, B]
    hint: |
      The bases of *AO*, *GP* are equal ([[I.34]]) …

  - part: proof
    text: "But parallelepipedal solids which are on equal bases and of the same height are equal to one another; therefore the solid AO is equal to the solid GP."
    highlight: [A, B]
    hint: |
      … so *AO* = *GP* ([[XI.31]]).

  - part: proof
    text: "And the prism ABCDEF is half of the solid AO, and the prism GHKLMN is half of the solid GP; therefore the prism ABCDEF is equal to the prism GHKLMN."
    highlight: [A, B]
    hint: |
      Each prism is half its parallelepiped ([[XI.28]]): equal.

  - part: conclusion
    text: "Therefore etc."
    highlight: [A, B]
    hint: |
      The enunciation.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

