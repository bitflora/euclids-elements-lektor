id: XI.15
kind: theorem
title: Planes through pairs of parallel lines are parallel

paraphrase: |
  If two intersecting lines {AB}, {BC} are parallel to two intersecting lines {DE}, {EF} not in the same plane, the
  planes through them are parallel.

