steps:
  - part: enunciation
    text: "If two straight lines meeting one another be parallel to two straight lines meeting one another, not being in the same plane, the planes through them are parallel."
    highlight: [AB, BC, DE, EF]
    hint: |
      Parallel pairs of lines span parallel planes.

  - part: setting-out
    text: "For let the two straight lines AB, BC meeting one another be parallel to the two straight lines DE, EF meeting one another, not being in the same plane; I say that the planes produced through AB, BC and DE, EF will not meet one another."
    highlight: [AB, BC, DE, EF]
    hint: |
      Setup.

  - part: construction
    text: "For let BG be drawn from the point B perpendicular to the plane through DE, EF, and let it meet the plane at the point G; through G let GH be drawn parallel to ED, and GK parallel to EF."
    highlight: [BG, GH, GK]
    hint: |
      Drop {BG} ⊥ plane {DEF} ([[XI.11]]); {GH} ∥ {ED}, {GK} ∥ {EF}.

  - part: proof
    text: "Now, since BG is at right angles to the plane through DE, EF, therefore it will also make right angles with all the straight lines which meet it and are in the plane through DE, EF."
    highlight: [BG]
    hint: |
      {BG} ⊥ every line in that plane through {G} …

  - part: proof
    text: "But each of the straight lines GH, GK meets it and is in the plane through DE, EF; therefore each of the angles BGH, BGK is right."
    highlight: [BG, GH, GK]
    hint: |
      … so ∠{BGH}, ∠{BGK} are right.

  - part: proof
    text: "And, since BA is parallel to GH, therefore the angles GBA, BGH are equal to two right angles."
    highlight: [AB, GH]
    hint: |
      {BA} ∥ {GH} ([[XI.9]]), so ∠{GBA} + ∠{BGH} = two right angles ([[I.29]]) …

  - part: proof
    text: "But the angle BGH is right; therefore the angle GBA is also right; therefore GB is at right angles to BA."
    highlight: [BG, AB]
    hint: |
      … so {GB} ⊥ {BA}.

  - part: proof
    text: "For the same reason GB is also at right angles to BC."
    highlight: [BG, BC]
    hint: |
      Likewise {GB} ⊥ {BC}.

  - part: proof
    text: "Since then the straight line GB is set up at right angles to the two straight lines BA, BC which cut one another, therefore GB is also at right angles to the plane through BA, BC."
    highlight: [BG]
    hint: |
      So {GB} ⊥ plane {ABC} ([[XI.4]]).

  - part: proof
    text: "But planes to which the same straight line is at right angles are parallel; therefore the plane through AB, BC is parallel to the plane through DE, EF."
    highlight: [BG]
    hint: |
      Common perpendicular: parallel planes ([[XI.14]]).

  - part: proof
    text: "Therefore, if two straight lines meeting one another be parallel to two straight lines meeting one another, not in the same plane, the planes through them are parallel."
    highlight: [BG]
    hint: |
      The enunciation.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        Both planes are spanned by the same two directions. $\blacksquare$
