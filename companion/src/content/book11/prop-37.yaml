steps:
  - part: enunciation
    text: "If four straight lines be proportional, the parallelepipedal solids on them which are similar and similarly described will also be proportional; and, if the parallelepipedal solids on them which are similar and similarly described be proportional, the straight lines will themselves also be proportional."
    highlight: [AB, CD, EF, GH]
    hint: |
      $a : b = c : d \iff a^3 : b^3 = c^3 : d^3$.

  - part: setting-out
    text: "Let AB, CD, EF, GH be four straight lines in proportion, so that, as AB is to CD, so is EF to GH; and let there be described on AB, CD, EF, GH the similar and similarly situated parallelepipedal solids KA, LC, ME, NG; I say that, as KA is to LC, so is ME to NG."
    highlight: [AB, CD, EF, GH]
    hint: |
      Setup.

  - part: proof
    text: "For, since the parallelepipedal solid KA is similar to LC, therefore KA has to LC the ratio triplicate of that which AB has to CD."
    highlight: [AB, CD]
    hint: |
      *KA* : *LC* is the triplicate of {AB} : {CD} ([[XI.33]]).

  - part: proof
    text: "For the same reason ME also has to NG the ratio triplicate of that which EF has to GH. [id.]"
    highlight: [EF, GH]
    hint: |
      Likewise.

  - part: proof
    text: "And, as AB is to CD, so is EF to GH."
    highlight: [AB, CD, EF, GH]
    hint: |
      The line ratios are equal …

  - part: proof
    text: "Therefore also, as AK is to LC, so is ME to NG."
    highlight: [AB, CD, EF, GH]
    hint: |
      … so the solid ratios are.

  - part: specification
    text: "Next, as the solid AK is to the solid LC, so let the solid ME be to the solid NG; I say that, as the straight line AB is to CD, so is EF to GH."
    highlight: [AB, CD, EF, GH]
    hint: |
      Conversely …

  - part: proof
    text: "For since, again, KA has to LC the ratio triplicate of that which AB has to CD, and ME also has to NG the ratio triplicate of that which EF has to GH, [id.] and, as KA is to LC, so is ME to NG, therefore also, as AB is to CD, so is EF to GH."
    highlight: [AB, CD, EF, GH]
    hint: |
      … equal triplicate ratios give equal ratios.

  - part: conclusion
    text: "Therefore etc."
    highlight: [AB, CD, EF, GH]
    hint: |
      The enunciation.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        Cube roots preserve equality of ratios. $\blacksquare$

commentary: |
  "Equal triplicate ratios give equal ratios" is assumed, as the corresponding fact for duplicate ratios is in
  [[VI.22]].
