id: XI.38
kind: theorem
title: The midplanes of a cube and its diagonal bisect each other

paraphrase: |
  In a cube, the line where two "midplanes" (through the midpoints of opposite edges) meet, and a diagonal of the
  cube, bisect each other at the centre.

