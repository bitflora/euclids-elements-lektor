steps:
  - part: enunciation
    text: "If the sides of the opposite planes of a cube be bisected, and planes be carried through the points of section, the common section of the planes and the diameter of the cube bisect one another."
    highlight: [D, G]
    hint: |
      The centre of a cube bisects its diagonals and its mid-lines.

  - part: setting-out
    text: "For let the sides of the opposite planes CF, AH of the cube AF be bisected at the points K, L, M, N, O, Q, P, R, and through the points of section let the planes KN, OR be carried; let US be the common section of the planes, and DG the diameter of the cube AF."
    highlight: [D, G]
    hint: |
      Setup.

  - part: specification
    text: "I say that UT is equal to TS, and DT to TG."
    highlight: [D, G]
    hint: |
      To prove: *UT* = *TS*, *DT* = *TG*.

  - part: construction
    text: "For let DU, UE, BS, SG be joined."
    highlight: [D, E]
    hint: |
      Join *DU*, *UE*, *BS*, *SG*.

  - part: proof
    text: "Then, since DO is parallel to PE, the alternate angles DOU, UPE are equal to one another."
    highlight: [D, E]
    hint: |
      Alternate angles ([[I.29]]).

  - part: proof
    text: "And, since DO is equal to PE, and OU to UP, and they contain equal angles, therefore the base DU is equal to the base UE, the triangle DOU is equal to the triangle PUE, and the remaining angles are equal to the remaining angles; therefore the angle OUD is equal to the angle PUE."
    highlight: [D, E]
    hint: |
      Congruent triangles: *DU* = *UE* …

  - part: proof
    text: "For this reason DUE is a straight line."
    highlight: [D, E]
    hint: |
      … and *DUE* is straight ([[I.14]]).

  - part: proof
    text: "For the same reason, BSG is also a straight line, and BS is equal to SG."
    highlight: [B, G]
    hint: |
      Likewise *BSG* straight, *BS* = *SG*.

  - part: proof
    text: "Now, since CA is equal and parallel to DB, while CA is also equal and parallel to EG, therefore DB is also equal and parallel to EG."
    highlight: [D, B, E, G]
    hint: |
      *DB* equal and parallel to *EG* ([[XI.9]]) …

  - part: proof
    text: "And the straight lines DE, BG join their extremities; therefore DE is parallel to BG."
    highlight: [D, E, B, G]
    hint: |
      … so *DE* ∥ *BG* ([[I.33]]).

  - part: proof
    text: "Therefore the angle EDT is equal to the angle BGT, for they are alternate; and the angle DTU is equal to the angle GTS."
    highlight: [D, G]
    hint: |
      Alternate and vertical angles equal ([[I.29]], [[I.15]]) …

  - part: proof
    text: "Therefore DTU, GTS are two triangles which have two angles equal to two angles, and one side equal to one side, namely that subtending one of the equal angles, that is, DU equal to GS, for they are the halves of DE, BG; therefore they will also have the remaining sides equal to the remaining sides."
    highlight: [D, G]
    hint: |
      … triangles *DTU*, *GTS* congruent ([[I.26]]) …

  - part: proof
    text: "Therefore DT is equal to TG, and UT to TS."
    highlight: [D, G]
    hint: |
      … *DT* = *TG*, *UT* = *TS*.

  - part: conclusion
    text: "Therefore etc."
    highlight: [D, G]
    hint: |
      The enunciation.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        All these lines pass through the centre of symmetry. $\blacksquare$

commentary: |
  A lemma for [[XIII.17]] (the dodecahedron), placed here among the solid-geometry results.
