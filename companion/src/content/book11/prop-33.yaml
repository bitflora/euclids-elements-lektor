id: XI.33
kind: theorem
title: Similar parallelepipeds are in the triplicate ratio of their sides

paraphrase: |
  Similar parallelepipeds are to one another in the triplicate ratio of corresponding sides: if the sides are as
  $a : b$, the solids are as $a^3 : b^3$. The solid version of [[VI.20]].

