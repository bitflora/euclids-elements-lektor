id: XI.26
kind: problem
title: To copy a solid angle at a given point

paraphrase: |
  At a point {A} of a given line {AB}, construct a solid angle equal to a given solid angle at *D*.

diagram:
  width: 360
  height: 320
  pivot: "A,xyplane"
  elements:
    - "origin;point;free;110,140;0;0,50,100"
    - "x;point;fixed;330,210,100;0;120,50,100"
    - "yzplane;plane;perpendicular;origin,x;0;0;0;0"
    - "y;point;planeSlider;yzplane,-90,202,90;0;0,50,100"
    - "xyplane;plane;3points;origin,x,y;0;0;lightGray"
    - "z1;point;perpendicular;origin,y,yzplane;0;0"
    - "z;point;lineSlider;origin,z1,40,40,100;0"
    - "Oz;line;connect;origin,z;0;0;lightGray"
    - "ceiling;plane;parallel;xyplane,z;0;0;0;0"
    - "A;point;planeSlider;xyplane,180,240,150"
    - "B;point;planeSlider;xyplane,220,220,210"
    - "AB;line;connect;A,B"
    - "C;point;planeSlider;xyplane,150,200,20"
    - "D;point;planeSlider;xyplane,50,210,100"
    - "E;point;planeSlider;xyplane,110,190,160"
    - "F;point;planeSlider;ceiling,160,140,110"
    - "G;point;foot;F,xyplane"
    - "FG;line;connect;F,G"
    - "DCG;polygon;triangle;D,C,G;0;0;black;270,70,100"
    - "DGE;polygon;triangle;D,G,E;0;0;black;270,70,100"
    - "DCF;polygon;triangle;D,C,F;0;0;black;random"
    - "DEF;polygon;triangle;D,E,F;0;0;black;random"
    - "L;point;similar;B,A,xyplane,E,D,C,xyplane"
    - "K';point;similar;B,A,xyplane,E,D,G,xyplane;0;0"
    - "K;point;cutoff;A,K',D,G"
    - "ABK;polygon;triangle;A,B,K;0;0;black;270,70,100"
    - "AKL;polygon;triangle;A,K,L;0;0;black;270,70,100"
    - "KH;line;perpendicular;K,xyplane,F,G"
    - "H;point;last;KH"
    - "ALH;polygon;triangle;A,L,H;0;0;black;random"
    - "ABH;polygon;triangle;A,B,H;0;0;black;random"
  aliases: { BA: AB, GF: FG, HK: KH }
  caption: |
    Joyce's three-dimensional figure; drag to rotate.

steps:
  - part: enunciation
    text: "On a given straight line, and at a given point on it, to construct a solid angle equal to a given solid angle."
    highlight: [AB]
    hint: |
      Copy a trihedral angle.

  - part: setting-out
    text: "Let AB be the given straight line, A the given point on it, and the angle at D, contained by the angles EDC, EDF, FDC, the given solid angle; thus it is required to construct on the straight line AB, and at the point A on it, a solid angle equal to the solid angle at D."
    highlight: [AB]
    hint: |
      Setup.

  - part: construction
    text: "For let a point F be taken at random on DF, let FG be drawn from F perpendicular to the plane through ED, DC, and let it meet the plane at G, let DG be joined, let there be constructed on the straight line AB and at the point A on it the angle BAL equal to the angle EDC, and the angle BAK equal to the angle EDG, let AK be made equal to DG, let KH be set up from the point K at right angles to the plane through BA, AL, let KH be made equal to GF, and let HA be joined; I say that the solid angle at A, contained by the angles BAL, BAH, HAL is equal to the solid angle at D contained by the angles EDC, EDF, FDC."
    highlight: [AB]
    hint: |
      Drop a perpendicular *FG* from a point of one edge to the plane of the other two; copy the plane configuration at {A}; erect *KH* equal to *GF*.

  - part: construction
    text: "For let AB, DE be cut off equal to one another, and let HB, KB, FE, GE be joined."
    highlight: [AB]
    hint: |
      Make {AB} = *DE*; join.

  - part: proof
    text: "Then, since FG is at right angles to the plane of reference, it will also make right angles with all the straight lines which meet it and are in the plane of reference; therefore each of the angles FGD, FGE is right."
    highlight: [AB]
    hint: |
      Right angles at *G* …

  - part: proof
    text: "For the same reason each of the angles HKA, HKB is also right."
    highlight: [AB]
    hint: |
      … and at *K*.

  - part: proof
    text: "And, since the two sides KA, AB are equal to the two sides GD, DE respectively, and they contain equal angles, therefore the base KB is equal to the base GE."
    highlight: [AB]
    hint: |
      *KB* = *GE* ([[I.4]]) …

  - part: proof
    text: "But KH is also equal to GF, and they contain right angles; therefore HB is also equal to FE."
    highlight: [AB]
    hint: |
      … *HB* = *FE* …

  - part: proof
    text: "Again, since the two sides AK, KH are equal to the two sides DG, GF, and they contain right angles, therefore the base AH is equal to the base FD."
    highlight: [AB]
    hint: |
      … *AH* = *FD* …

  - part: proof
    text: "But AB is also equal to DE; therefore the two sides HA, AB are equal to the two sides DF, DE."
    highlight: [AB]
    hint: |
      … two sides equal …

  - part: proof
    text: "And the base HB is equal to the base FE; therefore the angle BAH is equal to the angle EDF."
    highlight: [AB]
    hint: |
      … so ∠*BAH* = ∠*EDF* ([[I.8]]).

  - part: proof
    text: "For the same reason the angle HAL is also equal to the angle FDC."
    highlight: [AB]
    hint: |
      Likewise ∠*HAL* = ∠*FDC*.

  - part: proof
    text: "And the angle BAL is also equal to the angle EDC."
    highlight: [AB]
    hint: |
      And ∠*BAL* = ∠*EDC* by construction.

  - part: proof
    text: "Therefore on the straight line AB, and at the point A on it, a solid angle has been constructed equal to the given solid angle at D."
    highlight: [AB]
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. F."
    hint: |
      What it was required to do.

reconstruction:
  lines:
    - text: |
        Copy the projection of one edge and its height; congruent triangles do the rest. $\blacksquare$
