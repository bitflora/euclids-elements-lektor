id: XI.17
kind: theorem
title: Parallel planes cut lines proportionally

paraphrase: |
  If two lines {AB}, {CD} are cut by three parallel planes at {A}, {E}, {B} and {C}, {F}, {D}, then {AE} : {EB} =
  {CF} : {FD}.

