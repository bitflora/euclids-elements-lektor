    Three parallel planes; {AD} meets the middle plane at {O}.

steps:
  - part: enunciation
    text: "If two straight lines be cut by parallel planes, they will be cut in the same ratios."
    highlight: [AB, CD]
    hint: |
      The spatial version of [[VI.2]].

  - part: setting-out
    text: "For let the two straight lines AB, CD be cut by the parallel planes GH, KL, MN at the points A, E, B and C, F, D; I say that, as the straight line AE is to EB, so is CF to FD."
    highlight: [AB, CD]
    hint: |
      Setup.

  - part: construction
    text: "For let AC, BD, AD be joined, let AD meet the plane KL at the point O, and let EO, OF be joined."
    highlight: [AC, BD, AD, EO, OF]
    hint: |
      Join {AC}, {BD}, {AD}; {AD} meets the middle plane at {O}; join {EO}, {OF}.

  - part: proof
    text: "Now, since the two parallel planes KL, MN are cut by the plane EBDO, their common sections EO, BD are parallel."
    highlight: [EO, BD]
    hint: |
      {EO} ∥ {BD} ([[XI.16]]).

  - part: proof
    text: "For the same reason, since the two parallel planes GH, KL are cut by the plane AOFC, their common sections AC, OF are parallel. [id.]"
    highlight: [AC, OF]
    hint: |
      {AC} ∥ {OF}.

  - part: proof
    text: "And, since the straight line EO has been drawn parallel to BD, one of the sides of the triangle ABD, therefore, proportionally, as AE is to EB, so is AO to OD."
    highlight: [AE, EB]
    hint: |
      {AE} : {EB} = {AO} : {OD} ([[VI.2]]).

  - part: proof
    text: "Again, since the straight line OF has been drawn parallel to AC, one of the sides of the triangle ADC, proportionally, as AO is to OD, so is CF to FD. [id.]"
    highlight: [CF, FD]
    hint: |
      {AO} : {OD} = {CF} : {FD}.

  - part: proof
    text: "But it was also proved that, as AO is to OD, so is AE to EB; therefore also, as AE is to EB, so is CF to FD."
    highlight: [AE, EB, CF, FD]
    hint: |
      So {AE} : {EB} = {CF} : {FD}.

  - part: conclusion
    text: "Therefore etc."
    highlight: [AE, EB, CF, FD]
    hint: |
      The enunciation.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        Two applications of [[VI.2]] through the diagonal {AD}. $\blacksquare$
