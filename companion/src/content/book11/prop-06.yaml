id: XI.6
kind: theorem
title: Two lines perpendicular to the same plane are parallel

paraphrase: |
  If {AB} and {CD} are both perpendicular to a plane, they are parallel.

diagram:
  width: 280
  height: 260
  elements:
    - "X;point;free;100000,100"
    - "Y;point;free;100,-100000"
    - "Z;point;free;50000,-100000"
