  caption: |
    {AB}, {CD} perpendicular to the plane at {B}, {D}; {DE} in the plane perpendicular to {BD}, equal to {AB}.

steps:
  - part: enunciation
    text: "If two straight lines be at right angles to the same plane, the straight lines will be parallel."
    highlight: [AB, CD]
    hint: |
      Perpendiculars to one plane are parallel.

  - part: setting-out
    text: "For let the two straight lines AB, CD be at right angles to the plane of reference; I say that AB is parallel to CD."
    highlight: [AB, CD]
    hint: |
      Setup.

  - part: construction
    text: "For let them meet the plane of reference at the points B, D, let the straight line BD be joined, let DE be drawn, in the plane of reference, at right angles to BD, let DE be made equal to AB, and let BE, AE, AD be joined."
    highlight: [BD, DE, BE, AE, AD]
    hint: |
      Join {BD}; draw {DE} ⊥ {BD} in the plane with {DE} = {AB}; join {BE}, {AE}, {AD}.

  - part: proof
    text: "Now, since AB is at right angles to the plane of reference, it will also make right angles with all the straight lines which meet it and are in the plane of reference."
    highlight: [AB]
    hint: |
      {AB} is perpendicular to every line in the plane through {B} …

  - part: proof
    text: "But each of the straight lines BD, BE is in the plane of reference and meets AB; therefore each of the angles ABD, ABE is right."
    highlight: [AB, BD, BE]
    hint: |
      … so ∠{ABD}, ∠{ABE} are right.

  - part: proof
    text: "For the same reason each of the angles CDB, CDE is also right."
    highlight: [CD]
    hint: |
      Likewise ∠{CDB}, ∠{CDE}.

  - part: proof
    text: "And, since AB is equal to DE, and BD is common, the two sides AB, BD are equal to the two sides ED, DB; and they include right angles; therefore the base AD is equal to the base BE."
    highlight: [AD, BE]
    hint: |
      [[I.4]]: {AD} = {BE}.

  - part: proof
    text: "And, since AB is equal to DE, while AD is also equal to BE, the two sides AB, BE are equal to the two sides ED, DA; and AE is their common base; therefore the angle ABE is equal to the angle EDA."
    highlight: [AE]
    hint: |
      [[I.8]]: ∠{ABE} = ∠{EDA}.

  - part: proof
    text: "But the angle ABE is right; therefore the angle EDA is also right; therefore ED is at right angles to DA."
    highlight: [DE, AD]
    hint: |
      So {ED} ⊥ {DA}.

  - part: proof
    text: "But it is also at right angles to each of the straight lines BD, DC; therefore ED is set up at right angles to the three straight lines BD, DA, DC at their point of meeting; therefore the three straight lines BD, DA, DC are in one plane."
    highlight: [DE]
    hint: |
      {ED} is perpendicular to {BD}, {DA}, {DC}: they lie in one plane ([[XI.5]]).

  - part: proof
    text: "But, in whatever plane DB, DA are, in that plane is AB also, for every triangle is in one plane; therefore the straight lines AB, BD, DC are in one plane."
    highlight: [AB, BD, CD]
    hint: |
      {AB} is in that plane too ([[XI.2]]).

  - part: proof
    text: "And each of the angles ABD, BDC is right; therefore AB is parallel to CD."
    highlight: [AB, CD]
    hint: |
      Two right angles at {B}, {D}: parallel ([[I.28]]).

  - part: conclusion
    text: "Therefore etc."
    highlight: [AB, CD]
    hint: |
      The enunciation.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        Both are parallel to the normal vector of the plane. $\blacksquare$
