    - "DE;line;connect;D,E;0;0;0"
    - "BE;line;connect;B,E;0;0;0"
    - "ABD;polygon;triangle;A,B,D;0;0;0"
    - "ABE;polygon;triangle;A,B,E;0;0;0"
