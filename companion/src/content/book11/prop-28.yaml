id: XI.28
kind: theorem
title: A diagonal plane bisects a parallelepiped

paraphrase: |
  A plane through diagonals of two opposite faces of a parallelepiped cuts it into two equal prisms.

diagram:
  width: 290
  height: 280
  elements:
    - "D0;point;free;-1000,250;0;0"
    - "D3;point;free;1000,250;0;0"
    - "A;point;lineSlider;D0,D3,195,0"
    - "D;point;lineSlider;D0,D3,40,0"
    - "H;point;free;60,100"
    - "G;point;free;240,180"
    - "C;point;parallelogram;G,A,D"
    - "B;point;parallelogram;H,D,C"
    - "E;point;parallelogram;H,D,A"
    - "F;point;parallelogram;E,A,G"
    - "CDEF;polygon;quadrilateral;C,D,E,F;0;0;black;60,70,100"
    - "AEFG;polygon;quadrilateral;A,E,F,G;0;0;black;60,100,80"
    - "ADE;polygon;triangle;A,D,E;0;0;black;60,100,100"
    - "CG;line;connect;C,G"
    - "BCDH;polygon;quadrilateral;B,C,D,H;0;0;black;0"
    - "BF;line;connect;B,F"
    - "HE;line;connect;H,E"
  aliases: { GC: CG, FB: BF, EH: HE }
  caption: |
    The plane *CDEF* through the diagonals *CF*, *DE* of opposite faces.

steps:
  - part: enunciation
    text: "If a parallelepipedal solid be cut by a plane through the diagonals of the opposite planes, the solid will be bisected by the plane."
    highlight: [CDEF]
    hint: |
      The diagonal plane halves the solid.

  - part: setting-out
    text: "For let the parallelepipedal solid AB be cut by the plane CDEF through the diagonals CF, DE of opposite planes; I say that the solid AB will be bisected by the plane CDEF."
    highlight: [CDEF]
    hint: |
      Setup.

  - part: proof
    text: "For, since the triangle CGF is equal to the triangle CFB, and ADE to DEH, while the parallelogram CA is also equal to the parallelogram EB, for they are opposite, and GE to CH, therefore the prism contained by the two triangles CGF, ADE and the three parallelograms GE, AC, CE is also equal to the prism contained by the two triangles CFB, DEH and the three parallelograms CH, BE, CE; for they are contained by planes equal both in multitude and in magnitude."
    highlight: [CDEF]
    hint: |
      The two prisms have equal triangular ends ([[I.34]]) and equal parallelogram sides, so they are equal ([[XI.Def.10]]).

  - part: proof
    text: "Hence the whole solid AB is bisected by the plane CDEF."
    highlight: [CDEF]
    hint: |
      So the solid is bisected.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        Central symmetry swaps the two halves. $\blacksquare$

commentary: |
  The two halves are mirror images, not congruent by a motion; [[XI.Def.10]] treats them as "equal and similar",
  which is exactly the weakness of that definition that Simson pointed out.
