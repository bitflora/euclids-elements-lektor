id: XI.25
kind: theorem
title: A parallelepiped cut parallel to its faces is divided as its bases

paraphrase: |
  If a parallelepiped is cut by a plane parallel to two opposite faces, the two parts are to one another as their
  bases — proved with the equimultiples of [[V.Def.5]].

