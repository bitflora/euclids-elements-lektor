id: XI.29
kind: theorem
title: Parallelepipeds on the same base and height, tops on the same lines, are equal

paraphrase: |
  Parallelepipeds on the same base and of the same height, whose upper edges lie on the same straight lines, are
  equal. The solid version of [[I.35]].

diagram:
  width: 300
  height: 300
  elements:
    - "F;point;fixed;70,130,0;black;green"
    - "1X;point;fixed;270,103,36;0;0"
    - "1Y;point;fixed;25,10,160;0;0"
