  caption: |
    Two parallelepipeds *CM*, *CN* on the base *AB*.

steps:
  - part: enunciation
    text: "Parallelepipedal solids which are on the same base and of the same height, and in which the extremities of the sides which stand up are on the same straight lines, are equal to one another."
    highlight: [A]
    hint: |
      Shearing preserves volume (first case).

  - part: setting-out
    text: "Let CM, CN be parallelepipedal solids on the same base AB and of the same height, and let the extremities of their sides which stand up, namely AG, AF, LM, LN, CD, CE, BH, BK, be on the same straight lines FN, DK; I say that the solid CM is equal to the solid CN."
    highlight: [A]
    hint: |
      Setup.

  - part: proof
    text: "For, since each of the figures CH, CK is a parallelogram, CB is equal to each of the straight lines DH, EK, hence DH is also equal to EK."
    highlight: [A]
    hint: |
      *DH* = *EK* (each equals *CB*, [[I.34]]).

  - part: proof
    text: "Let EH be subtracted from each; therefore the remainder DE is equal to the remainder HK."
    highlight: [A]
    hint: |
      Subtract *EH*: *DE* = *HK*.

  - part: proof
    text: "Hence the triangle DCE is also equal to the triangle HBK, and the parallelogram DG to the parallelogram HN."
    highlight: [A]
    hint: |
      So the end triangles and side parallelograms are equal ([[I.8]], [[I.4]], [[I.36]]).

  - part: proof
    text: "For the same reason the triangle AFG is also equal to the triangle MLN."
    highlight: [A]
    hint: |
      Likewise the triangles *AFG*, *MLN*.

  - part: proof
    text: "But the parallelogram CF is equal to the parallelogram BM, and CG to BN, for they are opposite; therefore the prism contained by the two triangles AFG, DCE and the three parallelograms AD, DG, CG is equal to the prism contained by the two triangles MLN, HBK and the three parallelograms BM, HN, BN."
    highlight: [A]
    hint: |
      So the two prisms cut off are equal.

  - part: proof
    text: "Let there be added to each the solid of which the parallelogram AB is the base and GEHM its opposite; therefore the whole parallelepipedal solid CM is equal to the whole parallelepipedal solid CN."
    highlight: [A]
    hint: |
      Add the common solid: the parallelepipeds are equal.

  - part: conclusion
    text: "Therefore etc."
    highlight: [A]
    hint: |
      The enunciation.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        Cavalieri: equal base, equal height, equal volume. $\blacksquare$
