id: XI.22
kind: theorem
title: Three angles satisfying the triangle inequality give a triangle

paraphrase: |
  If three plane angles ∠{ABC}, ∠{DEF}, ∠{GHK}, any two greater than the third, are contained by equal lines, then
  the three chords {AC}, {DF}, {GK} can form a triangle.

