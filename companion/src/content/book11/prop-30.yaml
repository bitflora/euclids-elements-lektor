steps:
  - part: enunciation
    text: "Parallelepipedal solids which are on the same base and of the same height, and in which the extremities of the sides which stand up are not on the same straight lines, are equal to one another."
    highlight: [A]
    hint: |
      Shearing preserves volume (general case).

  - part: setting-out
    text: "Let CM, CN be parallelepipedal solids on the same base AB and of the same height, and let the extremities of their sides which stand up, namely AF, AG, LM, LN, CD, CE, BH, BK, not be on the same straight lines; I say that the solid CM is equal to the solid CN."
    highlight: [A]
    hint: |
      Setup.

  - part: construction
    text: "For let NK, DH be produced and meet one another at R, and further let FM, GE be produced to P, Q; let AO, LP, CQ, BR be joined."
    highlight: [A]
    hint: |
      Extend the upper edges to meet, forming a third solid *CP*.

  - part: proof
    text: "Then the solid CM, of which the parallelogram ACBL is the base, and FDHM its opposite, is equal to the solid CP, of which the parallelogram ACBL is the base, and OQRP its opposite; for they are on the same base ACBL and of the same height, and the extremities of their sides which stand up, namely AF, AO, LM, LP, CD, CQ, BH, BR, are on the same straight lines FP, DR."
    highlight: [A]
    hint: |
      *CM* = *CP* ([[XI.29]]) …

  - part: proof
    text: "But the solid CP, of which the parallelogram ACBL is the base, and OQRP its opposite, is equal to the solid CN, of which the parallelogram ACBL is the base and GEKN its opposite; for they are again on the same base ACBL and of the same height, and the extremities of their sides which stand up, namely AG, AO, CE, CQ, LN, LP, BK, BR, are on the same straight lines GQ, NR."
    highlight: [A]
    hint: |
      … and *CP* = *CN* ([[XI.29]]) …

  - part: proof
    text: "Hence the solid CM is also equal to the solid CN."
    highlight: [A]
    hint: |
      … so *CM* = *CN*.

  - part: conclusion
    text: "Therefore etc."
    highlight: [A]
    hint: |
      The enunciation.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        Two shears in different directions. $\blacksquare$
