id: XI.8
kind: theorem
title: A parallel to a perpendicular is perpendicular

paraphrase: |
  If {AB} ∥ {CD} and {AB} is perpendicular to a plane, so is {CD}.

diagram:
  width: 270
  height: 270
  elements:
    - "X;point;free;100000,100"
    - "Y;point;free;100,-100000"
    - "Z;point;free;50000,-100000"
    - "P0;point;free;20,240;0;0,75,100"
