id: XI.35
kind: theorem
title: Equally inclined lines on equal angles have equal heights

paraphrase: |
  If two equal plane angles have lines set up at their vertices making equal angles with the arms, then the
  perpendiculars from points at equal distances on those lines to the planes are equal, and the lines make equal
  angles with the perpendiculars' feet. (The porism: equal heights.)

