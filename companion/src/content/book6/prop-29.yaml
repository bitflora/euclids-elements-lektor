id: VI.29
kind: problem
title: Application with an excess (solving x(a + x) = c)

paraphrase: |
  To a given line {AB}, apply a parallelogram equal to a given figure {C}, overshooting {AB} by a parallelogram similar
  to a given {D}. Always possible. In the square case this solves $x(a + x) = c$.

