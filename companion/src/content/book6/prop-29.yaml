  given: [Z0, Z1, A, B, C1, C2, C3, C4, C5, C, Y0, Y1, D1, D2, D3, D, D4, AB]
  caption: |
    Drag the corners of {C} and {D}, or slide {A}, {B}. {AO} is applied to {AB}, equal to {C}, and overshoots by {QP}, which has the shape
