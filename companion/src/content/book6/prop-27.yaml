id: VI.27
kind: theorem
title: The greatest parallelogram applied with a similar defect

paraphrase: |
  Of all parallelograms applied to a line {AB} and falling short of it by a parallelogram of a fixed shape (similar to
  {DB}), the greatest is the one applied to the half {AC}. In the square case: $x(a - x)$ is greatest when $x = a/2$.

