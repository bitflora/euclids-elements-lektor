id: VI.5
kind: theorem
title: Triangles with proportional sides are equiangular

paraphrase: |
  If the sides of triangles {ABC}, {DEF} are proportional ({AB} : {BC} = {DE} : {EF}, and so on), then the triangles are
  equiangular, the equal angles being opposite corresponding sides. The converse of [[VI.4]] (SSS similarity).

