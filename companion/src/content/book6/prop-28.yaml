  caption: |
    Drag the corners of {C} and {D}, or slide {A}, {B}. {ST} is the parallelogram applied to {AB}, equal to {C}, falling short by {QB},
    which has the shape of {D}. If {C} is made too large (larger than {AG}), the construction fails — that is [[VI.27]].

  equal:
    - [AE, EB]
    - [GO, KL]
    - [GP, LM]

steps:
  - part: enunciation
    text: "To a given straight line to apply a parallelogram equal to a given rectilineal figure and deficient by a parallelogrammic figure similar to a given one: thus the given rectilineal figure must not be greater than the parallelogram described on the half of the straight line and similar to the defect."
    highlight: [AB, C, D]
    hint: |
      "Application with defect" (ἔλλειψις): the geometric solution of a quadratic equation. The second clause is
      the *diorismos*, the condition for a solution.
    explain:
      implicit: |
        With {D} a square and $AB = a$, the problem is to cut {AB} at {S} so that $AS\cdot SB = c$: with $x = SB$,
        $x(a - x) = c$ — given the sum $a$ and the product $c$ of two lines, find them.
      fact: |
        The diorismos comes from [[VI.27]]: no parallelogram so applied exceeds the one on half the line.
    modern: |
      $$x(a - x) = c, \quad c \le \left(\tfrac a2\right)^2$$

  - part: setting-out
    text: "Let AB be the given straight line, C the given rectilineal figure to which the figure to be applied to AB is required to be equal, not being greater than the parallelogram described on the half of AB and similar to the defect, and D the parallelogram to which the defect is required to be similar;"
    highlight: [AB, C, D]
    hint: |
      The data, with the diorismos assumed.

  - part: specification
    text: "thus it is required to apply to the given straight line AB a parallelogram equal to the given rectilineal figure C and deficient by a parallelogrammic figure which is similar to D."
    highlight: [AB, C, D]
    hint: |
      The goal.

  - part: construction
    text: "Let AB be bisected at the point E, and on EB let EBFG be described similar and similarly situated to D; let the parallelogram AG be completed."
    highlight: [E, GB, AG]
    adds: [E, F, G, ABFH, H, GE, EBFG, AEGH, AE, EB, GF]
    hint: |
      Bisect ([[I.10]]); on the half {EB} draw {EBFG} with the shape of {D} ([[VI.18]]); complete {AG} on the other half.

  - part: proof
    text: "If then AG is equal to C, that which was enjoined will have been done; for there has been applied to the given straight line AB the parallelogram AG equal to the given rectilineal figure C and deficient by a parallelogrammic figure GB which is similar to D."
    highlight: [AG, C, GB]
    hint: |
      The extreme case: {C} equal to the maximum.

  - part: setting-out
    text: "But, if not, let HE be greater than C."
    highlight: [HE, C]
    hint: |
      Otherwise {HE} (= {AG}) is greater than {C}, by the diorismos.

  - part: proof
    text: "Now HE is equal to GB; therefore GB is also greater than C."
    highlight: [HE, GB, C]
    hint: |
      Equal bases {AE}, {EB}, same parallels ([[I.36]]).
    cites: [I.36]

  - part: construction
    text: "Let KLMN be constructed at once equal to the excess by which GB is greater than C and similar and similarly situated to D."
    highlight: [KLMN]
    adds: [FBBpFp, Fp, Bp, GEBpFp, Cp, D6, K, N, Lp, KNML, M, L, KL, LM]
    hint: |
      A parallelogram with the shape of {D} and the size of {GB} − {C} ([[VI.25]]).

  - part: proof
    text: "But D is similar to GB; therefore KM is also similar to GB."
    highlight: [D, GB, KM]
    hint: |
      [[VI.21]].

  - part: construction
    text: "Let, then, KL correspond to GE, and LM to GF."
    highlight: [KL, GE, LM, GF]
    hint: |
      Fix the correspondence of sides.

  - part: proof
    text: "Now, since GB is equal to C, KM, therefore GB is greater than KM;"
    highlight: [GB, C, KM]
    hint: |
      {GB} = {C} + {KM}.

  - part: proof
    text: "therefore also GE is greater than KL, and GF than LM."
    highlight: [GE, KL, GF, LM]
    hint: |
      Of similar figures, the greater has the greater sides ([[VI.20]], [[V.14]]).
    explain:
      implicit: |
        Euclid treats this as obvious. It follows because the figures are in the duplicate ratio of their
        sides: if the sides of {KM} were not less, {KM} would not be less.
    cites: [VI.20]

  - part: construction
    text: "Let GO be made equal to KL, and GP equal to LM; and let the parallelogram OGPQ be completed;"
    highlight: [GO, GP, OGPQ]
    adds: [O, P, GO, GP, T, Q, OGPQ]
    hint: |
      Copy {KM} into the corner {G} of {GB} ([[I.3]], [[I.31]]).

  - part: proof
    text: "therefore it is equal and similar to KM."
    highlight: [OGPQ, KM]
    hint: |
      Same sides and angles.

  - part: proof
    text: "Therefore GQ is also similar to GB; therefore GQ is about the same diameter with GB."
    highlight: [GQ, GB]
    hint: |
      [[VI.21]], then [[VI.26]]: {Q} lies on the diagonal of {GB}.

  - part: construction
    text: "Let GQB be their diameter, and let the figure be described."
    highlight: [GQB]
    adds: [GQB, R, S, AS, SB, ASQT, QR, QP, PFRQ, OQSE, QRBS, PFBS, ORBE, TOEA, Y, V, W, U, VWU]
    hint: |
      Draw the diagonal and the parallels through {Q}.

  - part: proof
    text: "Then, since BG is equal to C, KM, and in them GQ is equal to KM, therefore the remainder, the gnomon UWV, is equal to the remainder C."
    highlight: [BG, GQ, UWV, C]
    hint: |
      Remove {GQ} (= {KM}) from {BG} (= {C} + {KM}): the gnomon is left, equal to {C}.
    cites: [I.CN.3]

  - part: proof
    text: "And, since PR is equal to OS, let QB be added to each; therefore the whole PB is equal to the whole OB."
    highlight: [PR, OS, QB, PB, OB]
    hint: |
      Complements about the diagonal ([[I.43]]); add {QB}.
    cites: [I.43]

  - part: proof
    text: "But OB is equal to TE, since the side AE is also equal to the side EB; therefore TE is also equal to PB."
    highlight: [OB, TE, AE, EB, PB]
    hint: |
      Equal bases ([[I.36]]).

  - part: proof
    text: "Let OS be added to each; therefore the whole TS is equal to the whole, the gnomon VWU."
    highlight: [OS, TS, VWU]
    hint: |
      {TE} + {OS} = {TS}; {PB} + {OS} = the gnomon.

  - part: proof
    text: "But the gnomon VWU was proved equal to C; therefore TS is also equal to C."
    highlight: [VWU, C, TS]
    hint: |
      So {TS} = {C}.

  - part: conclusion
    text: "Therefore to the given straight line AB there has been applied the parallelogram ST equal to the given rectilineal figure C and deficient by a parallelogrammic figure QB which is similar to D."
    highlight: [ST, QB, C, D]
    hint: |
      Done: {ST} on {AS}, falling short of {AB} by {QB}, which is about the diagonal and so similar to {D} ([[VI.24]]).
    cites: [VI.24]

  - part: conclusion
    text: "Q. E. F."
    hint: |
      What it was required to do.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.* Square case: $AB = a$, unknown $x = SB$.
  lines:
    - steps: [1, 2, 3, 4, 5, 6]
      text: |
        If $c = (a/2)^2$, then $x = a/2$. Otherwise the square on the half exceeds $c$.
    - steps: [7, 8, 9, 10, 11, 12, 13, 14]
      text: |
        Take a square of side $y$ with $y^2 = (a/2)^2 - c$, and set it in the corner of the half-square.
    - steps: [15, 16, 17, 18, 19, 20]
      text: |
        Then $x = a/2 - y$ and $x(a - x) = (a/2 - y)(a/2 + y) = (a/2)^2 - y^2 = c$: the quadratic formula
        $x = \tfrac a2 - \sqrt{(\tfrac a2)^2 - c}$. $\blacksquare$
  closing: |
    Euclid gives only one root. The other, $x = \tfrac a2 + \sqrt{(\tfrac a2)^2 - c}$, corresponds to applying the
    parallelogram on the other side — the same pair of lines in the other order.

commentary: |
  VI.28 and [[VI.29]] generalise [[II.5]], [[II.6]] and [[II.14]]: what Book II did for rectangles and squares,
  Book VI does for parallelograms of any given shape. Joyce gives the algebraic reading: with {D} a square, the
  construction finds two lines with given sum $a$ and given product $c$.

historical: |
  The names of the conic sections come from this vocabulary. Apollonius called the curves *ellipse*
  (ἔλλειψις, "falling short"), *hyperbola* (ὑπερβολή, "exceeding", [[VI.29]]) and *parabola* (παραβολή,
  "application" exactly), after the way a certain rectangle is applied to a line in each.
