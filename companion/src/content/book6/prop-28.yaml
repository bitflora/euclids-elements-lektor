id: VI.28
kind: problem
title: Application with a defect (solving x(a − x) = c)

paraphrase: |
  To a given line {AB}, apply a parallelogram equal to a given figure {C}, falling short of {AB} by a parallelogram
  similar to a given {D}. Possible only if {C} is not greater than the parallelogram on half of {AB} with the shape of
  {D} ([[VI.27]]). In the square case this solves $x(a - x) = c$.

