id: VI.1
kind: theorem
title: Triangles and parallelograms of the same height are as their bases

paraphrase: |
  Triangles (and parallelograms) of the same height are to one another as their bases:
  {ABC} : {ACD} = {BC} : {CD}, and likewise for the parallelograms {EC}, {CF}.

diagram:
  width: 520
  height: 230
  elements:
    - "B0;point;free;-1000,200;0;0"
    - "B3;point;free;1000,200;0;0"
