id: VI.6
kind: theorem
title: Side-angle-side similarity

paraphrase: |
  If triangles {ABC}, {DEF} have the angle at {A} equal to the angle at {D}, and the sides about those angles
  proportional ({BA} : {AC} = {ED} : {DF}), then the triangles are equiangular.

diagram:
  width: 420
  height: 260
  elements:
    - "A;point;free;60,30"
    - "B;point;free;40,220"
    - "C;point;free;170,220"
    - "ABC;polygon;triangle;A,B,C;0;0;black;#efe4d2"
    - "D;point;free;260,60"
    - "E;point;free;248,175"
    - "F;point;similar;D,E,A,B,C"
    - "DEF;polygon;triangle;D,E,F;0;0;black;#dfe7ea"
    - "Gp;point;similar;D,F,E,F,D;0;0"
    - "G;point;cutoff;F,Gp,F,E"
    - "DFG;polygon;triangle;D,F,G;0;0;black;0"
    - "AB;line;connect;A,B;0;0;0"
    - "AC;line;connect;A,C;0;0;0"
    - "DE;line;connect;D,E;0;0;0"
    - "DF;line;connect;D,F;0;0;0"
    - "EF;line;connect;E,F;0;0;0"
    - "DG;line;connect;D,G;0;0;0"
    - "FG;line;connect;F,G;0;0;0"
    - "angBAC;sector;angleMarker;A,B,C"
    - "angEDF;sector;angleMarker;D,E,F"
    - "angABC;sector;angleMarker;B,A,C"
    - "angDEF;sector;angleMarker;E,D,F"
    - "angACB;sector;angleMarker;C,A,B"
    - "angDFE;sector;angleMarker;F,D,E"
    - "angFDG;sector;angleMarker;D,F,G"
    - "angDFG;sector;angleMarker;F,D,G"
    - "angDGF;sector;angleMarker;G,D,F"
  aliases:
    BA: AB
    ED: DE
    GD: DG
    GF: FG
    DGF: DFG
    angGDF: angFDG
  given: [A, B, C, ABC, D, E, F, DEF, AB, AC, DE, DF, EF, angBAC, angEDF]
  caption: |
    {DEF} is constructed with the angle at {D} equal to the angle at {A} and $BA : AC = ED : DF$. Drag the points. The
    auxiliary triangle {DGF} has the angles of {ABC}.

steps:
  - part: enunciation
    text: "If two triangles have one angle equal to one angle and the sides about the equal angles proportional, the triangles will be equiangular and will have those angles equal which the corresponding sides subtend."
    highlight: [ABC, DEF, angBAC, angEDF]
    hint: |
      SAS similarity — the analogue of [[I.4]].
    modern: |
      $$\angle A = \angle D,\ \frac{BA}{AC} = \frac{ED}{DF} \ \Rightarrow\ \triangle ABC \sim \triangle DEF$$

  - part: setting-out
    text: "Let ABC, DEF be two triangles having one angle BAC equal to one angle EDF and the sides about the equal angles proportional, so that, as BA is to AC, so is ED to DF;"
    highlight: [angBAC, angEDF, BA, AC, ED, DF]
    hint: |
      The data.

  - part: specification
    text: "I say that the triangle ABC is equiangular with the triangle DEF, and will have the angle ABC equal to the angle DEF, and the angle ACB to the angle DFE."
    highlight: [angABC, angDEF, angACB, angDFE]
    hint: |
      The goal.

  - part: construction
    text: "For on the straight line DF, and at the points D, F on it, let there be constructed the angle FDG equal to either of the angles BAC, EDF, and the angle DFG equal to the angle ACB;"
    highlight: [angFDG, angDFG, DG, FG]
    adds: [Gp, G, DFG, DG, FG, angFDG, angDFG, angDGF]
    hint: |
      Build on {DF} a triangle {DGF} with the angles of {ABC} ([[I.23]]).

  - part: proof
    text: "therefore the remaining angle at B is equal to the remaining angle at G."
    highlight: [angABC, angDGF]
    hint: |
      [[I.32]].

  - part: proof
    text: "Therefore the triangle ABC is equiangular with the triangle DGF."
    highlight: [ABC, DGF]
    hint: |
      All three angles match.

  - part: proof
    text: "Therefore, proportionally, as BA is to AC, so is GD to DF."
    highlight: [BA, AC, GD, DF]
    hint: |
      [[VI.4]].

  - part: proof
    text: "But, by hypothesis, as BA is to AC, so also is ED to DF; therefore also, as ED is to DF, so is GD to DF."
    highlight: [ED, DF, GD]
    hint: |
      [[V.11]].

  - part: proof
    text: "Therefore ED is equal to DG; and DF is common; therefore the two sides ED, DF are equal to the two sides GD, DF; and the angle EDF is equal to the angle GDF;"
    highlight: [ED, DG, DF, angEDF, angGDF]
    hint: |
      $ED = DG$ by [[V.9]]; and the angles at {D} are equal by construction.

  - part: proof
    text: "therefore the base EF is equal to the base GF, and the triangle DEF is equal to the triangle DGF, and the remaining angles will be equal to the remaining angles, namely those which the equal sides subtend."
    highlight: [EF, GF, DEF, DGF]
    hint: |
      SAS congruence ([[I.4]]).

  - part: proof
    text: "Therefore the angle DFG is equal to the angle DFE, and the angle DGF to the angle DEF."
    highlight: [angDFG, angDFE, angDGF, angDEF]
    hint: |
      Corresponding angles of the congruent triangles.

  - part: proof
    text: "But the angle DFG is equal to the angle ACB; therefore the angle ACB is also equal to the angle DFE."
    highlight: [angDFG, angACB, angDFE]
    hint: |
      By construction.

  - part: proof
    text: "And, by hypothesis, the angle BAC is also equal to the angle EDF; therefore the remaining angle at B is also equal to the remaining angle at E; therefore the triangle ABC is equiangular with the triangle DEF."
    highlight: [ABC, DEF]
    hint: |
      The third angle by [[I.32]].

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3, 4, 5, 6]
      text: |
        Build {DGF} on {DF} with the angles of {ABC}; [[VI.4]] gives $GD : DF = BA : AC = ED : DF$, so $GD = ED$.
    - steps: [7, 8, 9, 10, 11]
      text: |
        $\triangle DEF \cong \triangle DGF$ (SAS), so {DEF} has the angles of {DGF}, i.e. of {ABC}. $\blacksquare$

commentary: |
  The third similarity criterion, matching the congruence theorem [[I.4]] as [[VI.5]] matches [[I.8]].
  [[VI.7]] treats the trickier "angle-side-side" case.
