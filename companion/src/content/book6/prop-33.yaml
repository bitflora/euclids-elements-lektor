id: VI.33
kind: theorem
title: Angles in equal circles are as the arcs they stand on

paraphrase: |
  In equal circles, angles at the centre — and angles at the circumference — are proportional to the arcs they
  stand on: {BC} : {EF} = angle {BGC|angBGC} : angle {EHF|angEHF} = angle {BAC|angBAC} : angle {EDF|angEDF}.

