id: VI.20
kind: theorem
title: Similar polygons are in the duplicate ratio of their sides

paraphrase: |
  Similar polygons {ABCDE}, {FGHKL} can be cut into the same number of similar triangles, each pair in the ratio of
  the wholes; and the polygons are in the duplicate ratio of corresponding sides: areas scale as the square.

