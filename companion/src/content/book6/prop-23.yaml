id: VI.23
kind: theorem
title: Equiangular parallelograms are in the ratio compounded of their sides

paraphrase: |
  Two parallelograms {AC}, {CF} with equal angles have the ratio *compounded* of the ratios of their sides:
  {AC} : {CF} = ({BC} : {CG}) · ({DC} : {CE}).

