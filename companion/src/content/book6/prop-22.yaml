id: VI.22
kind: theorem
title: Similar figures on proportional lines are proportional

paraphrase: |
  If {AB} : {CD} = {EF} : {GH}, then similar figures on {AB}, {CD} ({KAB}, {LCD}) and similar figures on {EF}, {GH} ({MF},
  {NH}) are proportional: {KAB} : {LCD} = {MF} : {NH}. And conversely.

