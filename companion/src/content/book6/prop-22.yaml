  aliases:
    KAB: ABK
    LCD: CDL
    MF: EFM
    NH: GHN
    SR: QRS
  given: [U0, U1, A, B, C, D, E, F, G, H1, H, K, L, ABK, CDL, M, M1, N, N1, EFM, GHN, AB, CD, EF, GH]
  caption: |
    {H} is placed so that $AB : CD = EF : GH$; {LCD} is similar to {KAB} and {NH} to {MF}. {O}, {P} are the third
    proportionals, and {SR} on the arbitrary {QR} is the figure of the converse's reductio. Slide the points along the
    lines.

steps:
  - part: enunciation
    text: "If four straight lines be proportional, the rectilineal figures similar and similarly described upon them will also be proportional; and, if the rectilineal figures similar and similarly described upon them be proportional, the straight lines will themselves also be proportional."
    highlight: [AB, CD, EF, GH, KAB, LCD, MF, NH]
    hint: |
      $a : b = c : d \iff a^2 : b^2 = c^2 : d^2$, with "squares" replaced by any similar figures.
    modern: |
      $$\frac{AB}{CD} = \frac{EF}{GH} \iff \frac{[KAB]}{[LCD]} = \frac{[MF]}{[NH]}$$

  - part: setting-out
    text: "Let the four straight lines AB, CD, EF, GH be proportional, so that, as AB is to CD, so is EF to GH, and let there be described on AB, CD the similar and similarly situated rectilineal figures KAB, LCD, and on EF, GH the similar and similarly situated rectilineal figures MF, NH;"
    highlight: [AB, CD, EF, GH, KAB, LCD, MF, NH]
    hint: |
      The data ([[VI.18]] makes such figures).

  - part: specification
    text: "I say that, as KAB is to LCD, so is MF to NH."
    highlight: [KAB, LCD, MF, NH]
    hint: |
      The goal.

  - part: construction
    text: "For let there be taken a third proportional O to AB, CD, and a third proportional P to EF, GH."
    highlight: [O, P]
    adds: [L0, L1, O0, O1, O, P0, P1, P]
    hint: |
      [[VI.11]]: $AB : CD = CD : O$ and $EF : GH = GH : P$.

  - part: proof
    text: "Then since, as AB is to CD, so is EF to GH, and, as CD is to O, so is GH to P, therefore, ex aequali, as AB is to O, so is EF to P."
    highlight: [AB, O, EF, P]
    hint: |
      $CD : O = AB : CD = EF : GH = GH : P$, then *ex aequali* ([[V.22]]).

  - part: proof
    text: "But, as AB is to O, so is KAB to LCD, and, as EF is to P, so is MF to NH;"
    highlight: [AB, O, KAB, LCD, EF, P, MF, NH]
    hint: |
      The porism to [[VI.19]] (extended by [[VI.20]]): with three lines in continued proportion, first : third
      = figure on the first : similar figure on the second.

  - part: proof
    text: "therefore also, as KAB is to LCD, so is MF to NH."
    highlight: [KAB, LCD, MF, NH]
    hint: |
      [[V.11]].

  - part: setting-out
    text: "Next, let MF be to NH as KAB is to LCD;"
    highlight: [MF, NH, KAB, LCD]
    hint: |
      Converse.

  - part: specification
    text: "I say also that, as AB is to CD, so is EF to GH."
    highlight: [AB, CD, EF, GH]
    hint: |
      The goal.

  - part: construction
    text: "For, if EF is not to GH as AB to CD, let EF be to QR as AB to CD, and on QR let the rectilineal figure SR be described similar and similarly situated to either of the two MF, NH."
    highlight: [QR, SR]
    adds: [Q, R, S, S1, QRS, QR]
    hint: |
      Suppose not: take {QR} the fourth proportional ([[VI.12]]) and draw on it a figure like {MF} ([[VI.18]]).

  - part: proof
    text: "Since then, as AB is to CD, so is EF to QR, and there have been described on AB, CD the similar and similarly situated figures KAB, LCD, and on EF, QR the similar and similarly situated figures MF, SR, therefore, as KAB is to LCD, so is MF to SR."
    highlight: [KAB, LCD, MF, SR]
    hint: |
      By the first part.

  - part: proof
    text: "But also, by hypothesis, as KAB is to LCD, so is MF to NH; therefore also, as MF is to SR, so is MF to NH."
    highlight: [MF, SR, NH]
    hint: |
      [[V.11]].

  - part: proof
    text: "Therefore MF has the same ratio to each of the figures NH, SR;"
    highlight: [MF, NH, SR]
    hint: |
      Same ratio to both.

  - part: proof
    text: "therefore NH is equal to SR."
    highlight: [NH, SR]
    hint: |
      [[V.9]].

  - part: proof
    text: "But it is also similar and similarly situated to it; therefore GH is equal to QR."
    highlight: [NH, SR, GH, QR]
    hint: |
      Equal similar figures have equal corresponding sides.
    gap: |
      Joyce points out that this step is not justified in the text. It can be supplied: if {GH} were greater
      than {QR}, the similar figure on {GH} would be greater than that on {QR} (by [[VI.20]], the duplicate of a
      ratio of greater inequality is again of greater inequality), contradicting {NH} = {SR}.

  - part: proof
    text: "And, since, as AB is to CD, so is EF to QR, while QR is equal to GH, therefore, as AB is to CD, so is EF to GH."
    highlight: [AB, CD, EF, GH]
    hint: |
      Substitute ([[V.7]], [[V.11]]).
    cites: [V.7, V.11]

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3, 4, 5, 6]
      text: |
        $[KAB] : [LCD] = (AB : CD)^2$ and $[MF] : [NH] = (EF : GH)^2$ ([[VI.20]]); equal ratios have equal
        squares.
    - steps: [7, 8, 9, 10, 11, 12, 13, 14, 15]
      text: |
        Conversely, equal squares of positive ratios come from equal ratios. $\blacksquare$
  closing: |
    The converse is where Euclid needs a reductio: "equal squares, equal ratios" is a square root, which the
    theory of proportion does not provide directly.

commentary: |
  The squares on proportional lines are proportional — the basis for the many arguments in Book X that pass
  between lines and the squares on them.
