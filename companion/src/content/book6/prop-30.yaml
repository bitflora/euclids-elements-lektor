id: VI.30
kind: problem
title: Cutting a line in extreme and mean ratio

paraphrase: |
  Cut a given line {AB} at {E} so that {AB} : {AE} = {AE} : {EB} ([[VI.Def.3]]) — the golden section.

diagram:
  width: 280
  height: 350
  elements:
    - "A;point;free;50,220"
    - "B;point;free;220,220"
    - "ABHC;polygon;square;A,B;0;0;black;#efe4d2"
    - "H;point;vertex;ABHC,3"
    - "C;point;vertex;ABHC,4"
    - "M;point;midpoint;A,C;0;0"
    - "N;point;cutoff;M,A,M,B;0"
    - "E;point;cutoff;A,B,A,N"
    - "NAED;polygon;parallelogram;N,A,E;0;0;black;#dfe7ea"
    - "D;point;vertex;NAED,4"
    - "F;point;intersection;C,H,D,E"
    - "EF;line;connect;E,F"
    - "CNDF;polygon;quadrilateral;C,N,D,F;0;0;0;0"
    - "CAEF;polygon;quadrilateral;C,A,E,F;0;0;0;0"
    - "EBHF;polygon;quadrilateral;E,B,H,F;0;0;0;0"
    - "AB;line;connect;A,B;0;0;0"
    - "AC;line;connect;A,C;0;0;0"
    - "AE;line;connect;A,E;0;0;0"
    - "EB;line;connect;E,B;0;0;0"
    - "ED;line;connect;E,D;0;0;0"
  aliases:
    BC: ABHC
    AD: NAED
    CD: CNDF
    CE: CAEF
    BF: EBHF
    FE: EF
    BA: AB
  given: [A, B, AB]
  caption: |
    Drag {A} or {B}. On {AB} the square {BC}; to {AC} is applied {CD}, equal to {BC} and exceeding by the square {AD}. Then {E} cuts {AB}
    in extreme and mean ratio.

  equal:
    - [EF, AB]

steps:
  - part: enunciation
    text: "To cut a given finite straight line in extreme and mean ratio."
    highlight: [AB]
    hint: |
      The golden section, done with proportions ([[VI.Def.3]]).
    modern: |
      $$\frac{AB}{AE} = \frac{AE}{EB} = \varphi = \frac{1 + \sqrt5}{2}$$
    cites: [VI.Def.3]

  - part: setting-out
    text: "Let AB be the given finite straight line;"
    highlight: [AB]
    hint: |
      The data.

  - part: specification
    text: "thus it is required to cut AB in extreme and mean ratio."
    highlight: [AB]
    hint: |
      The goal.

  - part: construction
    text: "On AB let the square BC be described; and let there be applied to AC the parallelogram CD equal to BC and exceeding by the figure AD similar to BC."
    highlight: [BC, CD, AD]
    adds: [ABHC, H, C, M, N, E, NAED, D, F, EF, CNDF, CAEF, EBHF, AC, AE, EB, ED]
    hint: |
      The square on {AB} ([[I.46]]); then [[VI.29]] with a square excess: {CD} on {AC} equal to the square {BC}.

  - part: proof
    text: "Now BC is a square; therefore AD is also a square."
    highlight: [BC, AD]
    hint: |
      Similar to a square.

  - part: proof
    text: "And, since BC is equal to CD, let CE be subtracted from each; therefore the remainder BF is equal to the remainder AD."
    highlight: [BC, CD, CE, BF, AD]
    hint: |
      Remove the common rectangle {CE} ([[I.CN.3]]).
    cites: [I.CN.3]

  - part: proof
    text: "But it is also equiangular with it; therefore in BF, AD the sides about the equal angles are reciprocally proportional;"
    highlight: [BF, AD]
    hint: |
      Equal and equiangular: [[VI.14]].

  - part: proof
    text: "therefore, as FE is to ED, so is AE to EB."
    highlight: [FE, ED, AE, EB]
    hint: |
      The reciprocal proportion.

  - part: proof
    text: "But FE is equal to AB, and ED to AE."
    highlight: [FE, AB, ED, AE]
    hint: |
      Sides of the squares.

  - part: proof
    text: "Therefore, as BA is to AE, so is AE to EB."
    highlight: [BA, AE, EB]
    hint: |
      Extreme and mean ratio.
    cites: [V.7, V.11]

  - part: proof
    text: "And AB is greater than AE; therefore AE is also greater than EB."
    highlight: [AB, AE, EB]
    hint: |
      [[V.14]]: so {AE} is the greater segment.
    cites: [V.14]

  - part: conclusion
    text: "Therefore the straight line AB has been cut in extreme and mean ratio at E, and the greater segment of it is AE."
    highlight: [AB, E, AE]
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. F."
    hint: |
      What it was required to do.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.* Let $AB = a$, $AE = x$.
  lines:
    - steps: [1, 2, 3]
      text: |
        Solve $x(a + x) = a^2$ for the side $x$ of the square excess ([[VI.29]]): $x = \tfrac a2(\sqrt5 - 1)$.
    - steps: [4, 5, 6, 7, 8, 9]
      text: |
        Then $a(a - x) = x^2$, i.e. $a : x = x : (a - x)$. $\blacksquare$

commentary: |
  Joyce notes that this is the same cut as [[II.11]], where it is described by areas ("the rectangle on the
  whole and one part equals the square on the other"); by [[VI.17]] the two descriptions agree. Book IV
  used the cut for the pentagon; Book XIII uses it again for the icosahedron and dodecahedron.
