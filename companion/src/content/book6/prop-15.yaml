id: VI.15
kind: theorem
title: Equal triangles with an equal angle have reciprocally proportional sides

paraphrase: |
  Two triangles {ABC}, {ADE} with equal angles at {A} are equal in area exactly when the sides about those angles
  are reciprocally proportional: {CA} : {AD} = {EA} : {AB}.

diagram:
  width: 270
  height: 270
  elements:
    - "A;point;free;140,110"
    - "B;point;free;80,30"
    - "C;point;free;30,200"
    - "ABC;polygon;triangle;A,B,C;0;0;black;#efe4d2"
    - "D;point;lineSlider;A,C,200,50"
    - "Ep;point;extend;B,A,B,A;0;0"
    - "E;point;proportion;A,D,A,C,A,B,A,Ep"
    - "ADE;polygon;triangle;A,D,E;0;0;black;#dfe7ea"
    - "BD;line;connect;B,D"
    - "BAD;polygon;triangle;B,A,D;0;0;0;0"
    - "CA;line;connect;C,A;0;0;0"
    - "AD;line;connect;A,D;0;0;0"
    - "EA;line;connect;E,A;0;0;0"
    - "AB;line;connect;A,B;0;0;0"
    - "angBAC;sector;angleMarker;A,B,C"
    - "angDAE;sector;angleMarker;A,D,E"
  aliases:
    CAB: ABC
    EAD: ADE
  given: [A, B, C, ABC, D, Ep, E, ADE, CA, AD, EA, AB, angBAC, angDAE]
  caption: |
    {ADE} is constructed so that $CA : AD = EA : AB$; slide {D} along {CA} produced, or drag {A}, {B}, {C}. The two
    triangles always have equal area.

steps:
  - part: enunciation
    text: "In equal triangles which have one angle equal to one angle the sides about the equal angles are reciprocally proportional; and those triangles which have one angle equal to one angle, and in which the sides about the equal angles are reciprocally proportional, are equal."
    highlight: [ABC, ADE]
    hint: |
      The triangle version of [[VI.14]].
    modern: |
      $$\angle BAC = \angle DAE:\quad [ABC] = [ADE] \iff CA \cdot AB = EA \cdot AD$$

  - part: setting-out
    text: "Let ABC, ADE be equal triangles having one angle equal to one angle, namely the angle BAC to the angle DAE;"
    highlight: [ABC, ADE, angBAC, angDAE]
    hint: |
      The data.

  - part: specification
    text: "I say that in the triangles ABC, ADE the sides about the equal angles are reciprocally proportional, that is to say, that, as CA is to AD, so is EA to AB."
    highlight: [CA, AD, EA, AB]
    hint: |
      The goal.

  - part: construction
    text: "For let them be placed so that CA is in a straight line with AD;"
    highlight: [CA, AD]
    hint: |
      Vertically opposite angles at {A}.

  - part: proof
    text: "therefore EA is also in a straight line with AB."
    highlight: [EA, AB]
    hint: |
      [[I.14]].

  - part: construction
    text: "Let BD be joined."
    highlight: [BD]
    adds: [BD, BAD]
    hint: |
      The comparison triangle {BAD}.

  - part: proof
    text: "Since then the triangle ABC is equal to the triangle ADE, and BAD is another area, therefore, as the triangle CAB is to the triangle BAD, so is the triangle EAD to the triangle BAD."
    highlight: [CAB, EAD, BAD]
    hint: |
      [[V.7]].

  - part: proof
    text: "But, as CAB is to BAD, so is CA to AD, and, as EAD is to BAD, so is EA to AB. [id.]"
    highlight: [CAB, BAD, CA, AD, EAD, EA, AB]
    hint: |
      Triangles with a common vertex and bases on one line are as their bases ([[VI.1]]): {CAB}, {BAD} have vertex {B};
      {EAD}, {BAD} have vertex {D}.

  - part: proof
    text: "Therefore also, as CA is to AD, so is EA to AB."
    highlight: [CA, AD, EA, AB]
    hint: |
      [[V.11]].

  - part: proof
    text: "Therefore in the triangles ABC, ADE the sides about the equal angles are reciprocally proportional."
    highlight: [ABC, ADE]
    hint: |
      First part done.

  - part: setting-out
    text: "Next, let the sides of the triangles ABC, ADE be reciprocally proportional, that is to say, let EA be to AB as CA to AD;"
    highlight: [EA, AB, CA, AD]
    hint: |
      Converse.

  - part: specification
    text: "I say that the triangle ABC is equal to the triangle ADE."
    highlight: [ABC, ADE]
    hint: |
      The goal.

  - part: proof
    text: "For, if BD be again joined, since, as CA is to AD, so is EA to AB, while, as CA is to AD, so is the triangle ABC to the triangle BAD, and, as EA is to AB, so is the triangle EAD to the triangle BAD, therefore, as the triangle ABC is to the triangle BAD, so is the triangle EAD to the triangle BAD."
    highlight: [ABC, BAD, EAD]
    hint: |
      [[VI.1]] and [[V.11]].

  - part: proof
    text: "Therefore each of the triangles ABC, EAD has the same ratio to BAD."
    highlight: [ABC, EAD, BAD]
    hint: |
      Same ratio to the same.

  - part: proof
    text: "Therefore the triangle ABC is equal to the triangle EAD."
    highlight: [ABC, EAD]
    hint: |
      [[V.9]].

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3, 4, 5, 6, 7, 8, 9]
      text: |
        $[ABC] = \tfrac12 CA\cdot AB\sin A$ and $[ADE] = \tfrac12 AD\cdot EA\sin A$, so equal areas mean
        $CA\cdot AB = AD\cdot EA$, i.e. $CA : AD = EA : AB$.
    - steps: [10, 11, 12, 13, 14]
      text: |
        The same equivalence, read backwards. $\blacksquare$

commentary: |
  Joyce notes that VI.15 is used in [[VI.19]]. The proof is [[VI.14]]'s, with triangles for parallelograms.
