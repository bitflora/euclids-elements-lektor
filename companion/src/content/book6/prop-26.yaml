id: VI.26
kind: theorem
title: A similar parallelogram at a common angle lies about the diameter

paraphrase: |
  If a parallelogram {AF} similar to {ABCD}, and similarly placed, is cut from it at the common angle {DAB}, then {AF}
  lies along the same diagonal as {ABCD}. The converse of [[VI.24]].

diagram:
  width: 330
  height: 250
  elements:
    - "A;point;free;60,40"
