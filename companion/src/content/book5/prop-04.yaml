id: V.4
kind: theorem
title: Equimultiples of proportionals are proportional

paraphrase: |
  If {A} is to {B} as {C} is to {D}, then any multiples of {A} and {C} (the same multiple of each) are to any
  multiples of {B} and {D} (again the same multiple of each) in the same ratio: if $A : B = C : D$ then
  $pA : qB = pC : qD$.

