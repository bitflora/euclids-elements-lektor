  caption: |
    {D} is constructed so that $A : B = C : D$. {E}, {F} are twice {A}, {C}; {G}, {H} three times {B}, {D}.
    {K}, {L} are twice {E}, {F}; {M}, {N} three times {G}, {H}. Change {A}, {B} or {C} by dragging their
    right (or left) ends: whenever {K} overtakes {M}, {L} overtakes {N}.

steps:
  - part: enunciation
    text: "If a first magnitude have to a second the same ratio as a third to a fourth, any equimultiples whatever of the first and third will also have the same ratio to any equimultiples whatever of the second and fourth respectively, taken in corresponding order."
    highlight: [A, B, C, D, E, F, G, H]
    hint: |
      Multiply the antecedents by one number and the consequents by another: the proportion survives.
    modern: |
      $$A : B = C : D \ \Rightarrow\ pA : qB = pC : qD \quad \text{for all whole numbers } p, q$$

  - part: setting-out
    text: "For let a first magnitude A have to a second B the same ratio as a third C to a fourth D;"
    highlight: [A, B, C, D]
    hint: |
      The given proportion $A : B = C : D$.

  - part: setting-out
    text: "and let equimultiples E, F be taken of A, C, and G, H other, chance, equimultiples of B, D;"
    highlight: [E, F, G, H]
    hint: |
      {E} = $p${A}, {F} = $p${C}; {G} = $q${B}, {H} = $q${D}. "Chance" (τυχόντα): arbitrary, chosen
      independently of $p$.

  - part: specification
    text: "I say that, as E is to G, so is F to H."
    highlight: [E, G, F, H]
    hint: |
      The goal: $E : G = F : H$.

  - part: construction
    text: "For let equimultiples K, L be taken of E, F, and other, chance, equimultiples M, N of G, H."
    highlight: [K, L, M, N]
    hint: |
      To test $E : G = F : H$ by [[V.Def.5]], take arbitrary equimultiples: {K} = $m${E}, {L} = $m${F};
      {M} = $n${G}, {N} = $n${H}.
    explain:
      did: |
        Sets up the test of [[V.Def.5]] for the ratios to be proved equal.
      implicit: |
        $m$ and $n$ are arbitrary; the argument must work for every choice.
    cites: [V.Def.5]

  - part: proof
    text: "Since E is the same multiple of A that F is of C, and equimultiples K, L of E, F have been taken, therefore K is the same multiple of A that L is of C."
    highlight: [K, A, L, C]
    hint: |
      {K} = $m(p${A}$) = (mp)${A} and {L} = $(mp)${C}: multiples of multiples ([[V.3]]).

  - part: proof
    text: "For the same reason M is the same multiple of B that N is of D."
    highlight: [M, B, N, D]
    hint: |
      {M} = $(nq)${B}, {N} = $(nq)${D}.
    cites: [V.3]

  - part: proof
    text: "And, since, as A is to B, so is C to D, and of A, C equimultiples K, L have been taken, and of B, D other, chance, equimultiples M, N, therefore, if K is in excess of M, L also is in excess of N, if it is equal, equal, and if less, less."
    highlight: [K, M, L, N]
    hint: |
      Apply the hypothesis $A : B = C : D$ with the numbers $mp$ and $nq$.
    explain:
      fact: |
        [[V.Def.5]], read forwards: since $A : B = C : D$, any equimultiples of {A}, {C} compare with any
        equimultiples of {B}, {D} alike.
      follows: |
        {K}, {L} are equimultiples of {A}, {C} (by $mp$), and {M}, {N} of {B}, {D} (by $nq$).
    modern: |
      $(mp)A \gtreqless (nq)B \Rightarrow (mp)C \gtreqless (nq)D$

  - part: proof
    text: "And K, L are equimultiples of E, F, and M, N other, chance, equimultiples of G, H;"
    highlight: [K, L, E, F, M, N, G, H]
    hint: |
      But {K}, {L} are also equimultiples of {E}, {F}, and {M}, {N} of {G}, {H}.

  - part: proof
    text: "therefore, as E is to G, so is F to H."
    highlight: [E, G, F, H]
    hint: |
      [[V.Def.5]] read backwards: every comparison of $mE$ with $nG$ comes out as that of $mF$ with $nH$.
    explain:
      follows: |
        Since $m$ and $n$ were arbitrary, the comparison holds for all pairs, which is exactly what
        [[V.Def.5]] requires for $E : G = F : H$.

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.* Write $x \gtreqless y \Rightarrow u \gtreqless v$
    for "$x > y \Rightarrow u > v$, $x = y \Rightarrow u = v$, $x < y \Rightarrow u < v$".
  lines:
    - steps: [1, 2, 3]
      text: |
        Given: for all $m, n$, $mA \gtreqless nB \Rightarrow mC \gtreqless nD$. Let $E = pA$, $F = pC$,
        $G = qB$, $H = qD$. To show: for all $m, n$, $mE \gtreqless nG \Rightarrow mF \gtreqless nH$.
    - steps: [4, 5, 6]
      text: |
        Fix $m, n$. Then $mE = (mp)A$, $mF = (mp)C$, $nG = (nq)B$, $nH = (nq)D$ ([[V.3]]).
    - steps: [7, 8, 9]
      text: |
        The hypothesis with the numbers $mp$, $nq$ gives $(mp)A \gtreqless (nq)B \Rightarrow (mp)C \gtreqless (nq)D$,
        which is the required implication. $\blacksquare$
  closing: |
    The proof is a direct instance of the definition: the multiples needed for the conclusion are among the
    multiples the hypothesis already speaks about.

commentary: |
  The first theorem about ratios, and the first use of [[V.Def.5]] in both directions: forwards, to extract
  information from a given proportion; backwards, to establish a new one. Every proportion proved in
  Book V is ultimately proved this way, or derived from one that was.
  [[V.3]] is the special case of this theorem in which each antecedent is a multiple of its consequent
  (as Joyce observes), and it is the lemma that makes this proof work.
