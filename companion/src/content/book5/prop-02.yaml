id: V.2
kind: theorem
title: Adding equimultiples

paraphrase: |
  If {AB} is the same multiple of {C} that {DE} is of {F}, and {BG} is the same multiple of {C} that {EH} is
  of {F}, then {AG} is the same multiple of {C} that {DH} is of {F}. In algebra: $m c + n c = (m + n) c$.

