    {AB} is three times {C} and {BG} twice; {DE} is three times {F} and {EH} twice. The colours mark two
    *kinds* of magnitude: the theorem never compares the first pair with the second.

steps:
  - part: enunciation
    text: "If a first magnitude be the same multiple of a second that a third is of a fourth, and a fifth also be the same multiple of the second that a sixth is of the fourth, the sum of the first and fifth will also be the same multiple of the second that the sum of the third and sixth is of the fourth."
    highlight: [AG, DH, C, F]
    hint: |
      Adding equimultiples gives equimultiples.
    explain:
      implicit: |
        The first, second and fifth magnitudes are of one kind, the third, fourth and sixth of another
        (possibly different) kind. Nothing is ever compared across the two kinds.
    modern: |
      $$a = mc,\ b = md;\ a' = nc,\ b' = nd \ \Rightarrow\ a + a' = (m + n)c,\ b + b' = (m + n)d$$

  - part: setting-out
    text: "Let a first magnitude, AB, be the same multiple of a second, C, that a third, DE, is of a fourth, F, and let a fifth, BG, also be the same multiple of the second, C, that a sixth, EH, is of the fourth F;"
    highlight: [AB, C, DE, F, BG, EH]
    hint: |
      {AB} = $m${C}, {DE} = $m${F}; {BG} = $n${C}, {EH} = $n${F}. In the figure $m = 3$, $n = 2$.

  - part: specification
    text: "I say that the sum of the first and fifth, AG, will be the same multiple of the second, C, that the sum of the third and sixth, DH, is of the fourth, F."
    highlight: [AG, C, DH, F]
    hint: |
      The goal: {AG} and {DH} are equimultiples of {C} and {F}.

  - part: proof
    text: "For, since AB is the same multiple of C that DE is of F, therefore, as many magnitudes as there are in AB equal to C, so many also are there in DE equal to F."
    highlight: [AB, C, DE, F]
    hint: |
      As many copies of {C} in {AB} as of {F} in {DE} ([[V.Def.2]]).
    cites: [V.Def.2]

  - part: proof
    text: "For the same reason also, as many as there are in BG equal to C, so many are there also in EH equal to F;"
    highlight: [BG, C, EH, F]
    hint: |
      Likewise for {BG} and {EH}.

  - part: proof
    text: "therefore, as many as there are in the whole AG equal to C, so many also are there in the whole DH equal to F."
    highlight: [AG, DH]
    hint: |
      Add the counts: $m + n$ copies in each.
    explain:
      follows: |
        The copies of {C} in {AG} are those in {AB} followed by those in {BG}; the same for {F} in {DH}.
        Equal counts plus equal counts are equal counts.

  - part: proof
    text: "Therefore, whatever multiple AG is of C, that multiple also is DH of F."
    highlight: [AG, C, DH, F]
    hint: |
      Equal counts mean the same multiple.

  - part: conclusion
    text: "Therefore the sum of the first and fifth, AG, is the same multiple of the second, C, that the sum of the third and sixth, DH, is of the fourth, F."
    highlight: [AG, DH]
    hint: |
      The claim, in the words of the enunciation.

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: conclusion
    text: "Q.E.D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2]
      text: |
        Let $AB = mC$, $DE = mF$, $BG = nC$, $EH = nF$.
    - steps: [3, 4, 5, 6]
      text: |
        $AG = AB + BG = mC + nC = (m + n)C$ and likewise $DH = (m + n)F$: the same multiple, $m + n$.
        $\blacksquare$

commentary: |
  [[V.1]] distributes a number over a sum of magnitudes; V.2 distributes a magnitude over a sum of numbers.
  Together with [[V.3]] (multiples of multiples) they are the arithmetic of "how many times" on which
  the theory of ratio is built.

gaps: |
  - **Adding counts**: that $m$ copies followed by $n$ copies make $m + n$ copies is the arithmetic of
    whole numbers, which Euclid takes as known (it is not developed until Book VII, and never axiomatised).
