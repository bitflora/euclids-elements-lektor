id: V.3
kind: theorem
title: Multiples of multiples

paraphrase: |
  If {A} is the same multiple of {B} that {C} is of {D}, and {EF}, {GH} are equimultiples of {A}, {C}, then
  {EF} is the same multiple of {B} that {GH} is of {D}. In algebra: $m(n b) = (mn) b$.

