id: V.10
kind: theorem
title: The magnitude with the greater ratio is greater

paraphrase: |
  If {A} : {C} is greater than {B} : {C}, then {A} is greater than {B}; and if {C} : {B} is greater than {C} : {A}, then {B}
  is less than {A}. The converse of [[V.8]].

diagram:
  width: 250
  height: 90
  elements:
    - "U0;point;free;-1000,40;0;0"
    - "U1;point;free;1000,40;0;0"
    - "V0;point;free;-1000,75;0;0"
    - "V1;point;free;1000,75;0;0"
    - "A0;point;lineSlider;U0,U1,30,40;0"
    - "A1;point;lineSlider;U0,U1,120,40;0"
    - "A;line;connect;A0,A1;black;0;green"
    - "B0;point;lineSlider;U0,U1,150,40;0"
    - "B1;point;lineSlider;U0,U1,200,40;0"
    - "B;line;connect;B0,B1;black;0;green"
    - "C0;point;lineSlider;V0,V1,70,40;0"
    - "C1;point;lineSlider;V0,V1,170,40;0"
