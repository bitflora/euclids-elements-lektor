  caption: |
    {D} is constructed so that $A : B = C : D$, and {F} a little longer than would make $E : F$ the same, so
    that $E : F$ is less. {G}, {H} are twice {C}, {E}; {K}, {L} three times {D}, {F}; {M} is twice {A} and {N} three
    times {B}.

steps:
  - part: enunciation
    text: "If a first magnitude have to a second the same ratio as a third to a fourth, and the third have to the fourth a greater ratio than a fifth has to a sixth, the first will also have to the second a greater ratio than the fifth to the sixth."
    highlight: [A, B, C, D, E, F]
    hint: |
      $A : B = C : D > E : F \Rightarrow A : B > E : F$.
    modern: |
      $$A : B = C : D,\ C : D > E : F \ \Rightarrow\ A : B > E : F$$

  - part: setting-out
    text: "For let a first magnitude A have to a second B the same ratio as a third C has to a fourth D, and let the third C have to the fourth D a greater ratio than a fifth E has to a sixth F;"
    highlight: [A, B, C, D, E, F]
    hint: |
      The data.

  - part: specification
    text: "I say that the first A will also have to the second B a greater ratio than the fifth E to the sixth F."
    highlight: [A, B, E, F]
    hint: |
      The goal.

  - part: construction
    text: "For, since there are some equimultiples of C, E, and of D, F other, chance, equimultiples, such that the multiple of C is in excess of the multiple of D, while the multiple of E is not in excess of the multiple of F, let them be taken, and let G, H be equimultiples of C, E, and K, L other, chance, equimultiples of D, F, so that G is in excess of K, but H is not in excess of L;"
    highlight: [G, H, K, L]
    hint: |
      $C : D > E : F$ supplies a witness pair ([[V.Def.7]]): {G} = $m${C} > {K} = $n${D}, but {H} = $m${E} ≤ {L} = $n${F}.
    explain:
      fact: |
        [[V.Def.7]] read forwards: a greater ratio comes with at least one pair $m, n$ that separates the two
        ratios.

  - part: construction
    text: "and, whatever multiple G is of C, let M be also that multiple of A, and, whatever multiple K is of D, let N be also that multiple of B."
    highlight: [M, N]
    hint: |
      Use the same $m, n$ on {A}, {B}: {M} = $m${A}, {N} = $n${B}.

  - part: proof
    text: "Now, since, as A is to B, so is C to D, and of A, C equimultiples M, G have been taken, and of B, D other, chance, equimultiples N, K, therefore, if M is in excess of N, G is also in excess of K, if equal, equal, and if less, less."
    highlight: [M, N, G, K]
    hint: |
      $A : B = C : D$ forwards: {M} vs {N} goes like {G} vs {K}.

  - part: proof
    text: "But G is in excess of K; therefore M is also in excess of N."
    highlight: [G, K, M, N]
    hint: |
      So {M} > {N}.
    explain:
      implicit: |
        Again the converse direction: since {G} > {K}, {M} cannot be equal to or less than {N} (those would force
        {G} = {K} or {G} < {K}).

  - part: proof
    text: "But H is not in excess of L;"
    highlight: [H, L]
    hint: |
      By the choice of the witness pair.

  - part: proof
    text: "and M, H are equimultiples of A, E, and N, L other, chance, equimultiples of B, F; therefore A has to B a greater ratio than E has to F."
    highlight: [M, H, N, L, A, B, E, F]
    hint: |
      {M} > {N} but {H} ≤ {L}: the same pair $m, n$ separates $A : B$ from $E : F$ ([[V.Def.7]]).

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3, 4]
      text: |
        Since $C : D > E : F$, take $m, n$ with $mC > nD$ and $mE \le nF$ ([[V.Def.7]]).
    - steps: [5, 6]
      text: |
        Since $A : B = C : D$ and $mC > nD$, also $mA > nB$ ([[V.Def.5]]).
    - steps: [7, 8]
      text: |
        So $mA > nB$ and $mE \le nF$: $A : B > E : F$ ([[V.Def.7]]). $\blacksquare$

commentary: |
  Joyce notes that the companion statement for *less* ratios (if $A : B = C : D < E : F$ then
  $A : B < E : F$) is not stated but is used in [[V.20]], and that transitivity of "greater ratio" itself
  (if $a : b > c : d > e : f$ then $a : b > e : f$) is never proved in Book V.

  V.13 is used in [[V.14]], [[V.20]] and [[V.21]].
