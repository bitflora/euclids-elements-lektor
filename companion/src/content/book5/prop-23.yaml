id: V.23
kind: theorem
title: Ex aequali in perturbed proportion

paraphrase: |
  If {A} : {B} = {E} : {F} and {B} : {C} = {D} : {E} (the second triple matched crosswise), then still {A} : {C} = {D} : {F}.

