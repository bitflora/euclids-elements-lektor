    - "GK;line;connect;G,K;0;0;0"
    - "KO;line;connect;K,O;0;0;0"
    - "HO;line;connect;H,O;0;0;0"
    - "LM;line;connect;L,M;0;0;0"
    - "MN;line;connect;M,N;0;0;0"
