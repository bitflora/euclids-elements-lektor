id: V.17
kind: theorem
title: Separation (separando)

paraphrase: |
  If {AB} : {BE} = {CD} : {DF}, then {AE} : {EB} = {CF} : {FD}. In fractions: if $\frac{a + b}{b} = \frac{c + d}{d}$ then
  $\frac{a}{b} = \frac{c}{d}$.

diagram:
  width: 470
  height: 120
  elements:
    - "U0;point;free;-1000,30;0;0"
