id: V.15
kind: theorem
title: Parts and their equimultiples have the same ratio

paraphrase: |
  If {AB} and {DE} are the same multiple of {C} and {F}, then {C} : {F} = {AB} : {DE}. In algebra: $c : f = nc : nf$.

diagram:
  width: 380
  height: 150
  elements:
    - "U0;point;free;-1000,30;0;0"
    - "U1;point;free;1000,30;0;0"
