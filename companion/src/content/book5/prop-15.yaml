  caption: |
    {AB} is three times {C}, {DE} three times {F}. Drag the ends of {C} and {F}.

steps:
  - part: enunciation
    text: "Parts have the same ratio as the same multiples of them taken in corresponding order."
    highlight: [C, F, AB, DE]
    hint: |
      $C : F = nC : nF$.
    explain:
      implicit: |
        {C} and {F} must be of the same kind (they form a ratio), and so must {AB}, {DE}.
    modern: |
      $$c : f = nc : nf$$

  - part: setting-out
    text: "For let AB be the same multiple of C that DE is of F;"
    highlight: [AB, C, DE, F]
    hint: |
      {AB} = $n${C}, {DE} = $n${F}; in the figure $n = 3$.

  - part: specification
    text: "I say that, as C is to F, so is AB to DE."
    highlight: [C, F, AB, DE]
    hint: |
      The goal.

  - part: proof
    text: "For, since AB is the same multiple of C that DE is of F, as many magnitudes as there are in AB equal to C, so many are there also in DE equal to F."
    highlight: [AB, C, DE, F]
    hint: |
      The same number of copies in each ([[V.Def.2]]).

  - part: construction
    text: "Let AB be divided into the magnitudes AG, GH, HB equal to C, and DE into the magnitudes DK, KL, LE equal to F;"
    highlight: [AG, GH, HB, DK, KL, LE]
    hint: |
      Mark off the copies.

  - part: proof
    text: "then the multitude of the magnitudes AG, GH, HB will be equal to the multitude of the magnitudes DK, KL, LE."
    highlight: [AG, GH, HB, DK, KL, LE]
    hint: |
      Three each.

  - part: proof
    text: "And, since AG, GH, HB are equal to one another, and DK, KL, LE are also equal to one another, therefore, as AG is to DK, so is GH to KL, and HB to LE."
    highlight: [AG, DK, GH, KL, HB, LE]
    hint: |
      Equal magnitudes to equal magnitudes: the same ratio ([[V.7]]).
    explain:
      implicit: |
        [[V.7]] gives $AG : DK = GH : DK$ and $GH : DK = GH : KL$; [[V.11]] joins them. Heath's bracket
        cites only [[V.7]].
    cites: [V.11]

  - part: proof
    text: "Therefore, as one of the antecedents is to one of the consequents, so will all the antecedents be to all the consequents;"
    highlight: [AG, DK, AB, DE]
    hint: |
      [[V.12]]: equal ratios, summed.

  - part: proof
    text: "therefore, as AG is to DK, so is AB to DE."
    highlight: [AG, DK, AB, DE]
    hint: |
      {AB} = {AG} + {GH} + {HB} and {DE} = {DK} + {KL} + {LE}.

  - part: proof
    text: "But AG is equal to C and DK to F; therefore, as C is to F, so is AB to DE."
    highlight: [AG, C, DK, F, AB, DE]
    hint: |
      Replace {AG}, {DK} by the equal {C}, {F} ([[V.7]], [[V.11]]).
    cites: [V.7, V.11]

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3, 4, 5, 6, 7, 8, 9]
      text: |
        Directly from [[V.Def.5]]: for all $p, q$,
        $$p(nC) \gtreqless q(nF) \iff n(pC) \gtreqless n(qF) \iff pC \gtreqless qF.$$
        So $nC : nF = C : F$. $\blacksquare$

commentary: |
  A ratio is unchanged when both terms are multiplied by the same number: the first step toward treating
  ratios like fractions. Used in [[V.16]], and in Book VI for parallelograms that are double the triangles
  on the same base ([[VI.1]]).
