id: V.8
kind: theorem
title: The greater has the greater ratio

paraphrase: |
  If {AB} is greater than {C}, then {AB} has to any magnitude {D} a greater ratio than {C} has to {D}, and {D} has
  to {C} a greater ratio than it has to {AB}.

