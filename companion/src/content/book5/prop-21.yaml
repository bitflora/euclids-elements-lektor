id: V.21
kind: theorem
title: Perturbed proportion, comparing the extremes

paraphrase: |
  If {A} : {B} = {E} : {F} and {B} : {C} = {D} : {E} (a *perturbed* proportion), then {A} greater than, equal to or less
  than {C} makes {D} greater than, equal to or less than {F}. The lemma for [[V.23]].

