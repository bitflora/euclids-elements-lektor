  caption: |
    {E} and {F} are constructed so that $B : C = D : E$ and $A : B = E : F$. Drag the ends of {A}, {B}, {C}, {D}.

steps:
  - part: enunciation
    text: "If there be three magnitudes, and others equal to them in multitude, which taken two and two together are in the same ratio, and the proportion of them be perturbed, then, if ex aequali the first magnitude is greater than the third, the fourth will also be greater than the sixth; if equal, equal; and if less, less."
    highlight: [A, B, C, D, E, F]
    hint: |
      $A : B = E : F$, $B : C = D : E$ and $A \gtreqless C$ give $D \gtreqless F$.
    explain:
      fact: |
        *Perturbed* ([[V.Def.18]]): the second triple is matched crosswise.
    cites: [V.Def.18]

  - part: setting-out
    text: "Let there be three magnitudes A, B, C, and others D, E, F equal to them in multitude, which taken two and two are in the same ratio, and let the proportion of them be perturbed, so that, as A is to B, so is E to F, and, as B is to C, so is D to E, and let A be greater than C ex aequali;"
    highlight: [A, B, C, D, E, F]
    hint: |
      Take the case {A} > {C}.

  - part: specification
    text: "I say that D will also be greater than F; if A is equal to C, equal; and if less, less."
    highlight: [D, F]
    hint: |
      The goal.

  - part: proof
    text: "For, since A is greater than C, and B is some other magnitude, therefore A has to B a greater ratio than C has to B."
    highlight: [A, C, B]
    hint: |
      [[V.8]].

  - part: proof
    text: "But, as A is to B, so is E to F, and, as C is to B, inversely, so is E to D."
    highlight: [A, B, E, F, C, D]
    hint: |
      $A : B = E : F$; inverting $B : C = D : E$ gives $C : B = E : D$.
    cites: [V.7]

  - part: proof
    text: "Therefore also E has to F a greater ratio than E has to D."
    highlight: [E, F, D]
    hint: |
      $E : F = A : B > C : B = E : D$ ([[V.13]] and its unstated companion).

  - part: proof
    text: "But that to which the same has a greater ratio is less; therefore F is less than D; therefore D is greater than F."
    highlight: [F, D]
    hint: |
      [[V.10]], second part.

  - part: proof
    text: "Similarly we can prove that, if A be equal to C, D will also be equal to F; and if less, less."
    highlight: [A, C, D, F]
    hint: |
      The other cases.
    cites: [V.9]

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3, 4, 5, 6, 7, 8]
      text: |
        With ratios as numbers: $F = E\,B/A$ and $D = E\,B/C$, so
        $D \gtreqless F \iff 1/C \gtreqless 1/A \iff A \gtreqless C$. $\blacksquare$

commentary: |
  The perturbed twin of [[V.20]]. Joyce notes that both this and [[V.23]] rely on [[V.Def.4]] being taken
  as an axiom (through [[V.8]]).
