id: V.20
kind: theorem
title: Ex aequali, comparing the extremes

paraphrase: |
  If {A} : {B} = {D} : {E} and {B} : {C} = {E} : {F}, then {A} greater than, equal to or less than {C} makes {D} greater
  than, equal to or less than {F}. The lemma for [[V.22]].

