  caption: |
    {E} and {F} are constructed so that $A : B = D : E$ and $B : C = E : F$. Drag the ends of {A}, {B}, {C}, {D}:
    {D} is longer than {F} exactly when {A} is longer than {C}.

steps:
  - part: enunciation
    text: "If there be three magnitudes, and others equal to them in multitude, which taken two and two are in the same ratio, and if ex aequali the first be greater than the third, the fourth will also be greater than the sixth; if equal, equal; and, if less, less."
    highlight: [A, B, C, D, E, F]
    hint: |
      $A : B = D : E$, $B : C = E : F$ and $A \gtreqless C$ give $D \gtreqless F$.
    explain:
      implicit: |
        {A} is compared with {C} and {D} with {F}, so {A}, {B}, {C} are of one kind and {D}, {E}, {F} of one (perhaps
        different) kind.

  - part: setting-out
    text: "Let there be three magnitudes A, B, C, and others D, E, F equal to them in multitude, which taken two and two are in the same ratio, so that, as A is to B, so is D to E, and as B is to C, so is E to F; and let A be greater than C ex aequali;"
    highlight: [A, B, C, D, E, F]
    hint: |
      Take the case {A} > {C}.

  - part: specification
    text: "I say that D will also be greater than F; if A is equal to C, equal; and, if less, less."
    highlight: [D, F]
    hint: |
      The goal.

  - part: proof
    text: "For, since A is greater than C, and B is some other magnitude, and the greater has to the same a greater ratio than the less has, therefore A has to B a greater ratio than C has to B."
    highlight: [A, C, B]
    hint: |
      $A : B > C : B$ ([[V.8]]).

  - part: proof
    text: "But, as A is to B, so is D to E, and, as C is to B, inversely, so is F to E;"
    highlight: [A, B, D, E, C, F]
    hint: |
      $A : B = D : E$; and inverting $B : C = E : F$ gives $C : B = F : E$ (porism to [[V.7]]).
    cites: [V.7]

  - part: proof
    text: "therefore D has also to E a greater ratio than F has to E."
    highlight: [D, E, F]
    hint: |
      $D : E = A : B > C : B = F : E$ ([[V.13]]).
    explain:
      implicit: |
        [[V.13]] covers "the same as, then greater than"; here Euclid also needs "greater than, then the same
        as" ($A : B > C : B = F : E$), the unstated companion Joyce mentions.

  - part: proof
    text: "But, of magnitudes which have a ratio to the same, that which has a greater ratio is greater; therefore D is greater than F."
    highlight: [D, F]
    hint: |
      [[V.10]].

  - part: proof
    text: "Similarly we can prove that, if A be equal to C, D will also be equal to F; and if less, less."
    highlight: [A, C, D, F]
    hint: |
      The other cases ([[V.7]], [[V.9]] for equality).
    cites: [V.9]

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3, 4, 5, 6, 7, 8]
      text: |
        With ratios as numbers: $D/E = A/B$ and $F/E = C/B$, so $D - F = E(A - C)/B$, which has the sign of
        $A - C$. $\blacksquare$

commentary: |
  A lemma: [[V.22]] needs to know that, in an *ex aequali* arrangement, the extremes compare alike. The
  perturbed version is [[V.21]].
