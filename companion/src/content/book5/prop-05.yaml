id: V.5
kind: theorem
title: A multiple of a difference is the difference of the multiples

paraphrase: |
  If {AB} is the same multiple of {CD} that a piece {AE} cut from it is of a piece {CF} cut from {CD}, then the
  rest {EB} is that same multiple of the rest {FD}. In algebra: $m a - m b = m(a - b)$.

