  caption: |
    {D} and {F} are constructed so that all three ratios agree. {G}, {H}, {K} are twice {A}, {C}, {E}; {L}, {M}, {N}
    three times {B}, {D}, {F}. Drag the ends of {A}, {B}, {C}, {E}: the three comparisons — {G} with {L}, {H} with
    {M}, {K} with {N} — always come out alike.

steps:
  - part: enunciation
    text: "Ratios which are the same with the same ratio are also the same with one another."
    highlight: [A, B, C, D, E, F]
    hint: |
      Transitivity: $A : B = C : D$ and $C : D = E : F$ give $A : B = E : F$.
    explain:
      implicit: |
        Because a ratio is not an object but a relation defined by [[V.Def.5]], even this has to be proved.
        With V.11, "the same ratio" behaves like an equality: reflexive and symmetric by the form of the
        definition, transitive by this proposition.
    modern: |
      $$A : B = C : D,\ C : D = E : F \ \Rightarrow\ A : B = E : F$$

  - part: setting-out
    text: "For, as A is to B, so let C be to D, and, as C is to D, so let E be to F;"
    highlight: [A, B, C, D, E, F]
    hint: |
      The two given proportions. The three pairs may be of three different kinds.

  - part: specification
    text: "I say that, as A is to B, so is E to F."
    highlight: [A, B, E, F]
    hint: |
      The goal.

  - part: construction
    text: "For of A, C, E let equimultiples G, H, K be taken, and of B, D, F other, chance, equimultiples L, M, N."
    highlight: [G, H, K, L, M, N]
    hint: |
      The test of [[V.Def.5]], set up for all three ratios at once: $m$ times the antecedents, $n$ times the
      consequents.
    cites: [V.Def.5]

  - part: proof
    text: "Then since, as A is to B, so is C to D, and of A, C equimultiples G, H have been taken, and of B, D other, chance, equimultiples L, M, therefore, if G is in excess of L, H is also in excess of M, if equal, equal, and if less, less."
    highlight: [G, L, H, M]
    hint: |
      $A : B = C : D$ forwards: {G} vs {L} goes like {H} vs {M}.
    cites: [V.Def.5]

  - part: proof
    text: "Again, since, as C is to D, so is E to F, and of C, E equimultiples H, K have been taken, and of D, F other, chance, equimultiples M, N, therefore, if H is in excess of M, K is also in excess of N, if equal, equal, and if less, less."
    highlight: [H, M, K, N]
    hint: |
      $C : D = E : F$ forwards: {H} vs {M} goes like {K} vs {N}.
    cites: [V.Def.5]

  - part: proof
    text: "But we saw that, if H was in excess of M, G was also in excess of L; if equal, equal; and if less, less; so that, in addition, if G is in excess of L, K is also in excess of N, if equal, equal, and if less, less."
    highlight: [G, L, K, N]
    hint: |
      Chain the two: {G} vs {L} goes like {K} vs {N}.
    explain:
      follows: |
        Whichever of >, =, < holds between {G} and {L}, the same holds between {H} and {M} (previous step
        but one), and hence between {K} and {N}.
      implicit: |
        Euclid writes "if {H} was in excess of {M}, {G} was also in excess of {L}" — the converse of what was
        shown. It is valid because the three cases are exhaustive and exclusive: the implication in each
        direction follows from the implications for all three cases.

  - part: proof
    text: "And G, K are equimultiples of A, E, while L, N are other, chance, equimultiples of B, F;"
    highlight: [G, K, L, N]
    hint: |
      These are exactly the multiples [[V.Def.5]] needs for $A : B = E : F$.

  - part: proof
    text: "therefore, as A is to B, so is E to F."
    highlight: [A, B, E, F]
    hint: |
      [[V.Def.5]], backwards.

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3]
      text: |
        For each $m, n$, the hypotheses say that $mA$ vs $nB$, $mC$ vs $nD$ and $mE$ vs $nF$ have pairwise the
        same outcome (>, = or <).
    - steps: [4, 5, 6, 7, 8]
      text: |
        "Same outcome" is transitive, so $mA$ vs $nB$ has the same outcome as $mE$ vs $nF$ for every $m, n$:
        $A : B = E : F$. $\blacksquare$
  closing: |
    In terms of cuts: $A : B$ and $C : D$ determine the same set of fractions $n/m$, as do $C : D$ and
    $E : F$; so $A : B$ and $E : F$ do too.

commentary: |
  Joyce remarks that what is notable is not the proof, which follows straight from the definition, but that
  Eudoxus (or Euclid) saw that it needed proving. V.11 is cited constantly from here on, often silently:
  every chain "as {A} is to {B}, so is {C} to {D}, and so is {E} to {F}" relies on it.
