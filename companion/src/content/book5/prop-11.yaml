id: V.11
kind: theorem
title: Ratios the same as the same ratio are the same

paraphrase: |
  If {A} : {B} = {C} : {D} and {C} : {D} = {E} : {F}, then {A} : {B} = {E} : {F}. "Sameness of ratio" is transitive.

