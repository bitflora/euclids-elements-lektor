id: V.6
kind: theorem
title: Subtracting equimultiples

paraphrase: |
  If {AB}, {CD} are the same multiple of {E}, {F}, and pieces {AG}, {CH} cut from them are again the same
  multiple of {E}, {F}, then the remainders {GB}, {HD} are either equal to {E}, {F} or the same multiple of them.
  In algebra: $m e - n e = (m - n) e$.

