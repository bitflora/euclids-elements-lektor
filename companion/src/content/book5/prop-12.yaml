  caption: |
    {D} and {F} are constructed so that the three ratios agree. {G}, {H}, {K} are twice {A}, {C}, {E}; {L}, {M}, {N}
    three times {B}, {D}, {F}.

  equal:
    - [L, H]

steps:
  - part: enunciation
    text: "If any number of magnitudes be proportional, as one of the antecedents is to one of the consequents, so will all the antecedents be to all the consequents."
    highlight: [A, B, C, D, E, F]
    hint: |
      Equal ratios: the sum of the antecedents is to the sum of the consequents in the same ratio.
    explain:
      implicit: |
        All six magnitudes must be of one kind, since the antecedents are added together, and so are the
        consequents.
    modern: |
      $$\frac{a_1}{b_1} = \frac{a_2}{b_2} = \dots = \frac{a_k}{b_k} \ \Rightarrow\ \frac{a_1}{b_1} = \frac{a_1 + a_2 + \dots + a_k}{b_1 + b_2 + \dots + b_k}$$

  - part: setting-out
    text: "Let any number of magnitudes A, B, C, D, E, F be proportional, so that, as A is to B, so is C to D and E to F;"
    highlight: [A, B, C, D, E, F]
    hint: |
      $A : B = C : D = E : F$.

  - part: specification
    text: "I say that, as A is to B, so are A, C, E to B, D, F."
    highlight: [A, B, C, D, E, F]
    hint: |
      Goal: $A : B = (A + C + E) : (B + D + F)$.

  - part: construction
    text: "For of A, C, E let equimultiples G, H, K be taken, and of B, D, F other, chance, equimultiples L, M, N."
    highlight: [G, H, K, L, M, N]
    hint: |
      The test of [[V.Def.5]].
    cites: [V.Def.5]

  - part: proof
    text: "Then since, as A is to B, so is C to D, and E to F, and of A, C, E equimultiples G, H, K have been taken, and of B, D, F other, chance, equimultiples L, M, N, therefore, if G is in excess of L, H is also in excess of M, and K of N, if equal, equal, and if less, less;"
    highlight: [G, L, H, M, K, N]
    hint: |
      All three comparisons go alike.
    cites: [V.Def.5]

  - part: proof
    text: "so that, in addition, if G is in excess of L, then G, H, K are in excess of L, M, N, if equal, equal, and if less, less."
    highlight: [G, H, K, L, M, N]
    hint: |
      Add them up: if each exceeds, the sums exceed; if each is equal, the sums are equal; if each falls short,
      the sums fall short.
    explain:
      implicit: |
        Adding inequalities: $G > L$, $H > M$, $K > N$ give $G + H + K > L + M + N$. Euclid treats this as
        evident (it is a form of [[I.CN.2]] and [[I.CN.5]]).

  - part: proof
    text: "Now G and G, H, K are equimultiples of A and A, C, E, since, if any number of magnitudes whatever are respectively equimultiples of any magnitudes equal in multitude, whatever multiple one of the magnitudes is of one, that multiple also will all be of all."
    highlight: [G, H, K, A, C, E]
    hint: |
      {G} + {H} + {K} = $m$({A} + {C} + {E}), by [[V.1]], which Heath quotes in full.

  - part: proof
    text: "For the same reason L and L, M, N are also equimultiples of B and B, D, F;"
    highlight: [L, M, N, B, D, F]
    hint: |
      {L} + {M} + {N} = $n$({B} + {D} + {F}).

  - part: proof
    text: "therefore, as A is to B, so are A, C, E to B, D, F."
    highlight: [A, B, C, D, E, F]
    hint: |
      [[V.Def.5]], backwards.

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3, 4, 5]
      text: |
        Fix $m, n$. If $mA > nB$ then $mC > nD$ and $mE > nF$; adding, $m(A + C + E) > n(B + D + F)$
        ([[V.1]]). Likewise for $=$ and $<$.
    - steps: [6, 7, 8]
      text: |
        So $A : B = (A + C + E) : (B + D + F)$ by [[V.Def.5]]. $\blacksquare$

commentary: |
  The "adding fractions the wrong way" rule that is right for *equal* fractions: if
  $\frac{a}{b} = \frac{c}{d}$ then both equal $\frac{a + c}{b + d}$. It is used in [[V.15]] and,
  repeatedly, in Book VI ([[VI.20]]) and in Book XII.
