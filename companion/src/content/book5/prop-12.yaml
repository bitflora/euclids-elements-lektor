id: V.12
kind: theorem
title: Sum of antecedents to sum of consequents

paraphrase: |
  If {A} : {B} = {C} : {D} = {E} : {F}, then each of these ratios equals ({A} + {C} + {E}) : ({B} + {D} + {F}).

