id: V.22
kind: theorem
title: Ex aequali

paraphrase: |
  If {A} : {B} = {D} : {E} and {B} : {C} = {E} : {F}, then {A} : {C} = {D} : {F} — and so on for any number of
  magnitudes. The middle terms "cancel".

