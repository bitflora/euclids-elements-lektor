  caption: |
    {E} and {F} are constructed from {A}, {B}, {C}, {D}. {G}, {H} are twice {A}, {D}; {K}, {L} three times {B}, {E};
    {M}, {N} twice {C}, {F}. Drag the ends of the top lines.

steps:
  - part: enunciation
    text: "If there be any number of magnitudes whatever, and others equal to them in multitude, which taken two and two together are in the same ratio, they will also be in the same ratio ex aequali."
    highlight: [A, B, C, D, E, F]
    hint: |
      $A : B = D : E$ and $B : C = E : F$ give $A : C = D : F$ ([[V.Def.17]]).
    modern: |
      $$\frac{A}{B} = \frac{D}{E},\ \frac{B}{C} = \frac{E}{F} \ \Rightarrow\ \frac{A}{C} = \frac{D}{F}$$
    cites: [V.Def.17]

  - part: setting-out
    text: "Let there be any number of magnitudes A, B, C, and others D, E, F equal to them in multitude, which taken two and two together are in the same ratio, so that, as A is to B, so is D to E, and, as B is to C, so is E to F;"
    highlight: [A, B, C, D, E, F]
    hint: |
      Three and three. "Any number", but Euclid takes three.

  - part: specification
    text: "I say that they will also be in the same ratio ex aequali, ⟨that is, as A is to C, so is D to F⟩."
    highlight: [A, C, D, F]
    hint: |
      The goal. The words in angle brackets are Heath's addition, to say what *ex aequali* means here.

  - part: construction
    text: "For of A, D let equimultiples G, H be taken, and of B, E other, chance, equimultiples K, L; and, further, of C, F other, chance, equimultiples M, N."
    highlight: [G, H, K, L, M, N]
    hint: |
      Three independent multipliers: {G}, {H} = $p$ × {A}, {D}; {K}, {L} = $q$ × {B}, {E}; {M}, {N} = $r$ × {C}, {F}.
    explain:
      did: |
        Only $p$ and $r$ matter for the test of $A : C = D : F$ ([[V.Def.5]]); the middle multiplier $q$ is
        a scaffold, to carry the hypotheses over to the multiples.

  - part: proof
    text: "Then, since, as A is to B, so is D to E, and of A, D equimultiples G, H have been taken, and of B, E other, chance, equimultiples K, L, therefore, as G is to K, so is H to L."
    highlight: [G, K, H, L]
    hint: |
      $pA : qB = pD : qE$ ([[V.4]]).

  - part: proof
    text: "For the same reason also, as K is to M, so is L to N."
    highlight: [K, M, L, N]
    hint: |
      $qB : rC = qE : rF$ ([[V.4]]).
    cites: [V.4]

  - part: proof
    text: "Since, then, there are three magnitudes G, K, M, and others H, L, N equal to them in multitude, which taken two and two together are in the same ratio, therefore, ex aequali, if G is in excess of M, H is also in excess of N; if equal, equal; and if less, less."
    highlight: [G, M, H, N]
    hint: |
      Apply [[V.20]] to the multiples: {G} vs {M} goes like {H} vs {N}.

  - part: proof
    text: "And G, H are equimultiples of A, D, and M, N other, chance, equimultiples of C, F."
    highlight: [G, H, M, N]
    hint: |
      The multiples [[V.Def.5]] asks for.

  - part: proof
    text: "Therefore, as A is to C, so is D to F."
    highlight: [A, C, D, F]
    hint: |
      $pA$ vs $rC$ always goes like $pD$ vs $rF$: [[V.Def.5]].

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3]
      text: |
        Fix $p, r$; pick any $q$.
    - steps: [4, 5]
      text: |
        By [[V.4]], $pA : qB = pD : qE$ and $qB : rC = qE : rF$.
    - steps: [6, 7, 8]
      text: |
        By [[V.20]], $pA \gtreqless rC \Rightarrow pD \gtreqless rF$. So $A : C = D : F$ by [[V.Def.5]].
        $\blacksquare$
  closing: |
    For more than three terms, apply the result repeatedly (an induction Euclid leaves implicit).

commentary: |
  *Ex aequali* is how Euclid composes ratios without multiplying them. It is everywhere in Book VI (e.g.
  [[VI.22]], [[VI.23]]) and in the solid geometry of Books XI–XII. Joyce notes that Book VII proves the
  analogue for numbers separately ([[VII.14]]).

  Unlike [[V.23]], this proof does not alternate, so {A}, {B}, {C} and {D}, {E}, {F} may be of two different
  kinds.
