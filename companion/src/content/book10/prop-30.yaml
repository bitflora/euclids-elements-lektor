id: X.30
kind: problem
title: Rational lines in square only, the square on the greater exceeding by an incommensurable square

paraphrase: |
  As [[X.29]], but with $\sqrt{AB^2 - AF^2}$ incommensurable in length with {AB}. Example: $AB = \sqrt2$,
  $AF = 1$.

diagram:
  width: 280
  height: 200
  elements:
    - "A0;point;free;-1000,130;0;0"
    - "A3;point;free;1000,130;0;0"
