id: X.29
kind: problem
title: Rational lines in square only, the square on the greater exceeding by a commensurable square

paraphrase: |
  Find rational lines {AB}, {AF}, commensurable in square only, such that $\sqrt{AB^2 - AF^2}$ is commensurable
  in length with {AB}. Example: $AB = 3$, $AF = \sqrt5$, $BF = 2$.

diagram:
  width: 260
  height: 200
  elements:
    - "A0;point;free;-1000,130;0;0"
    - "A3;point;free;1000,130;0;0"
    - "C0;point;free;-1000,160;0;0"
