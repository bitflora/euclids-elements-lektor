id: X.25
kind: theorem
title: A rectangle on medials commensurable in square only is rational or medial

paraphrase: |
  If {AB}, {BC} are medial and commensurable in square only, the rectangle {AC} is either rational or medial.

diagram:
  width: 340
  height: 270
  elements:
    - "A0;point;free;-1000,40;0;0"
