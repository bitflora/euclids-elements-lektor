id: X.51
kind: problem
title: To find the fourth binomial

paraphrase: |
  Construct a fourth binomial {EG} ([[X.Def.II.4]]): greater term {EF} commensurable with the rational line {D},
  but $\sqrt{EF^2 - FG^2}$ incommensurable with {EF}.

