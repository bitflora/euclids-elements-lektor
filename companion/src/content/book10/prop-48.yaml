id: X.48
kind: problem
title: To find the first binomial

paraphrase: |
  Construct a first binomial line {EG} = {EF} + {FG} ([[X.Def.II.1]]): the greater term {EF} commensurable in
  length with the rational line {D}, and $\sqrt{EF^2 - FG^2}$ commensurable with {EF}.

