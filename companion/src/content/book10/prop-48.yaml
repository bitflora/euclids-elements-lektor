  aliases: { BA: AB, GE: EG, FE: EF, GF: FG, CA: AC, BC: CB }
  caption: |
    Numbers {AC}, {CB} with {AB} : {BC} a ratio of squares but {AB} : {AC} not; sq({EF}) : sq({FG}) = {BA} :
    {AC}; sq({EF}) = sq({FG}) + sq({H}).

steps:
  - part: enunciation
    text: "To find the first binomial straight line."
    highlight: [EG]
    hint: |
      E.g. $3 + \sqrt5$.
    modern: |
      $EF = \rho$, $FG = \rho\sqrt{1 - k^2}$ with $k$ rational, $1 - k^2$ not a square: $1 + \sqrt{5}/3$, or scaled,
      $3 + \sqrt5$.

  - part: construction
    text: "Let two numbers AC, CB be set out such that the sum of them AB has to BC the ratio which a square number has to a square number, but has not to CA the ratio which a square number has to a square number; let any rational straight line D be set out, and let EF be commensurable in length with D."
    highlight: [AC, CB, D, EF]
    hint: |
      Numbers {AC}, {CB} with {AB} : {BC} square to square, {AB} : {AC} not (lemma 1 of [[X.28]]); {EF}
      commensurable in length with the rational {D}.

  - part: proof
    text: "Therefore EF is also rational."
    highlight: [EF]
    hint: |
      {EF} rational.

  - part: construction
    text: "Let it be contrived that, as the number BA is to AC, so is the square on EF to the square on FG."
    highlight: [EF, FG]
    hint: |
      sq({EF}) : sq({FG}) = {BA} : {AC} ([[X.6]], porism).

  - part: proof
    text: "But AB has to AC the ratio which a number has to a number; therefore the square on EF also has to the square on FG the ratio which a number has to a number, so that the square on EF is commensurable with the square on FG."
    highlight: [EF, FG]
    hint: |
      A ratio of numbers: commensurable squares.

  - part: proof
    text: "And EF is rational; therefore FG is also rational."
    highlight: [FG]
    hint: |
      {FG} rational.

  - part: proof
    text: "And, since BA has not to AC the ratio which a square number has to a square number, neither, therefore, has the square on EF to the square on FG the ratio which a square number has to a square number; therefore EF is incommensurable in length with FG."
    highlight: [EF, FG]
    hint: |
      Not a ratio of squares: {EF}, {FG} incommensurable in length ([[X.9]]).

  - part: proof
    text: "Therefore EF, FG are rational straight lines commensurable in square only; therefore EG is binomial."
    highlight: [EG]
    hint: |
      So {EG} is a binomial ([[X.36]]).

  - part: specification
    text: "I say that it is also a first binomial straight line."
    highlight: [EG]
    hint: |
      And a *first* binomial.

  - part: proof
    text: "For since, as the number BA is to AC, so is the square on EF to the square on FG, while BA is greater than AC, therefore the square on EF is also greater than the square on FG."
    highlight: [EF, FG]
    hint: |
      {BA} > {AC}, so {EF} > {FG}.

  - part: construction
    text: "Let then the squares on FG, H be equal to the square on EF."
    highlight: [H]
    hint: |
      Let sq({EF}) = sq({FG}) + sq({H}).

  - part: proof
    text: "Now since, as BA is to AC, so is the square on EF to the square on FG, therefore, convertendo, as AB is to BC, so is the square on EF to the square on H."
    highlight: [EF, H]
    hint: |
      Convertendo: sq({EF}) : sq({H}) = {AB} : {BC} ([[V.19]], porism).

  - part: proof
    text: "But AB has to BC the ratio which a square number has to a square number; therefore the square on EF also has to the square on H the ratio which a square number has to a square number."
    highlight: [EF, H]
    hint: |
      A ratio of squares …

  - part: proof
    text: "Therefore EF is commensurable in length with H; therefore the square on EF is greater than the square on FG by the square on a straight line commensurable with EF."
    highlight: [EF, H]
    hint: |
      … so {EF}, {H} commensurable in length ([[X.9]]).

  - part: proof
    text: "And EF, FG are rational, and EF is commensurable in length with D."
    highlight: [EF, D]
    hint: |
      And the greater term {EF} is commensurable with {D}.

  - part: proof
    text: "Therefore EF is a first binomial straight line."
    highlight: [EG]
    hint: |
      First binomial ([[X.Def.II.1]]).
    cites: [X.Def.II.1]

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - steps: [1, 2, 3, 4, 5, 6, 7]
      text: |
        $EF^2 : FG^2 = m^2 : (m^2 - n^2)$ with $m^2 - n^2$ not a square.
    - steps: [8, 9, 10, 11, 12, 13, 14, 15]
      text: |
        Then $H = \sqrt{EF^2 - FG^2} = EF\cdot n/m$. $\blacksquare$

commentary: |
  [[X.48]]–[[X.53]] construct the six binomials; [[X.85]]–[[X.90]] the six apotomes in exactly the same way.
