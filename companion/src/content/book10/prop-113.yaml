    - "G3;point;free;135,1000;0;0"
    - "A1;point;lineSlider;A0,A3,0,60;0"
    - "A2;point;lineSlider;A0,A3,0,150;0"
    - "A;line;connect;A1,A2;black"
    - "B;point;lineSlider;C0,C3,0,205"
