    *BD* an apotome with annex *DC*; rect(*BD*, {KH}) = sq({A}).

steps:
  - part: enunciation
    text: "The square on a rational straight line, if applied to an apotome, produces as breadth the binomial straight line the terms of which are commensurable with the terms of the apotome and in the same ratio; and further the binomial so arising has the same order as the apotome."
    highlight: [A, KH]
    hint: |
      Dividing by an apotome gives a binomial.

  - part: setting-out
    text: "Let A be a rational straight line and BD an apotome, and let the rectangle BD, KH be equal to the square on A, so that the square on the rational straight line A when applied to the apotome BD produces KH as breadth; I say that KH is a binomial straight line the terms of which are commensurable with the terms of BD and in the same ratio; and further KH has the same order as BD."
    highlight: [A, KH]
    hint: |
      Setup.

  - part: proof
    text: "For let DC be the annex to BD; therefore BC, CD are rational straight lines commensurable in square only."
    highlight: [BC]
    hint: |
      The annex *DC*; {BC}, *CD* rational, commensurable in square only.

  - part: construction
    text: "Let the rectangle BC, G be also equal to the square on A."
    highlight: [BC, G]
    hint: |
      rect({BC}, {G}) = sq({A}).

  - part: proof
    text: "But the square on A is rational; therefore the rectangle BC, G is also rational."
    highlight: [G]
    hint: |
      Rational …

  - part: proof
    text: "And it has been applied to the rational straight line BC; therefore G is rational and commensurable in length with BC."
    highlight: [G, BC]
    hint: |
      … so {G} rational, commensurable with {BC}.

  - part: proof
    text: "Since now the rectangle BC, G is equal to the rectangle BD, KH, therefore, proportionally, as CB is to BD, so is KH to G."
    highlight: [KH, G]
    hint: |
      {CB} : *BD* = {KH} : {G}.

  - part: proof
    text: "But BC is greater than BD; therefore KH is also greater than G."
    highlight: [KH, G]
    hint: |
      {KH} > {G}.

  - part: construction
    text: "Let KE be made equal to G; therefore KE is commensurable in length with BC."
    highlight: [G]
    hint: |
      *KE* = {G}, commensurable with {BC}.

  - part: proof
    text: "And since, as CB is to BD, so is HK to KE, therefore, convertendo, as BC is to CD, so is KH to HE."
    highlight: [KH]
    hint: |
      Convertendo: {BC} : *CD* = {KH} : *HE*.

  - part: construction
    text: "Let it be contrived that, as KH is to HE, so is HF to FE; therefore also the remainder KF is to FH as KH is to HE, that is, as BC is to CD."
    highlight: [F]
    hint: |
      Choose {F} with {KH} : *HE* = *HF* : *FE*; then *KF* : *FH* = {BC} : *CD*.

  - part: proof
    text: "But BC, CD are commensurable in square only; therefore KF, FH are also commensurable in square only."
    highlight: [F]
    hint: |
      *KF*, *FH* commensurable in square only.

  - part: proof
    text: "And since, as KH is to HE, so is KF to FH, while, as KH is to HE, so is HF to FE, therefore also, as KF is to FH, so is HF to FE, so that also, as the first is to the third, so is the square on the first to the square on the second; therefore also, as KF is to FE, so is the square on KF to the square on FH."
    highlight: [F]
    hint: |
      *KF* : *FH* = *HF* : *FE* …

  - part: proof
    text: "But the square on KF is commensurable with the square on FH, for KF, FH are commensurable in square; therefore KF is also commensurable in length with FE, so that KF is also commensurable in length with KE."
    highlight: [F]
    hint: |
      … so *KF* commensurable with *KE*.

  - part: proof
    text: "But KE is rational and commensurable in length with BC; therefore KF is also rational and commensurable in length with BC."
    highlight: [F]
    hint: |
      *KF* rational, commensurable with {BC}.

  - part: proof
    text: "And, since, as BC is to CD, so is KF to FH, alternately, as BC is to KF, so is DC to FH."
    highlight: [F]
    hint: |
      Alternately {BC} : *KF* = *DC* : *FH* …

  - part: proof
    text: "But BC is commensurable with KF; therefore FH is also commensurable in length with CD."
    highlight: [F]
    hint: |
      … so *FH* commensurable with *CD*.

  - part: proof
    text: "But BC, CD are rational straight lines commensurable in square only; therefore KF, FH are also rational straight lines commensurable in square only; therefore KH is binomial."
    highlight: [KH]
    hint: |
      *KF*, *FH* rational, commensurable in square only: {KH} a binomial.

  - part: proof
    text: "If now the square on BC is greater than the square on CD by the square on a straight line commensurable with BC, the square on KF will also be greater than the square on FH by the square on a straight line commensurable with KF."
    highlight: [KH]
    hint: |
      Same order: commensurable excess carries over …

  - part: proof
    text: "And, if BC is commensurable in length with the rational straight line set out, so also is KF; if CD is commensurable in length with the rational straight line set out, so also is FH, but, if neither of the straight lines BC, CD, then neither of the straight lines KF, FH."
    highlight: [KH]
    hint: |
      … and the corresponding term …

  - part: proof
    text: "But, if the square on BC is greater than the square on CD by the square on a straight line incommensurable with BC, the square on KF is also greater than the square on FH by the square on a straight line incommensurable with KF."
    highlight: [KH]
    hint: |
      … incommensurable excess carries over …

  - part: proof
    text: "And, if BC is commensurable with the rational straight line set out, so also is KF; if CD is so commensurable, in length with the rational straight line set out, so also is FH; but, if neither of the straight lines BC, CD, then neither of the straight lines KF, FH."
    highlight: [KH]
    hint: |
      … likewise.

  - part: proof
    text: "Therefore KH is a binomial straight line, the terms of which KF, FH are commensurable with the terms BC, CD of the apotome and in the same ratio, and further KH has the same order as BD."
    highlight: [KH]
    hint: |
      So {KH} is a binomial of the same order, terms proportional.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        $\rho^2/(\sqrt a - \sqrt b) = \rho^2(\sqrt a + \sqrt b)/(a - b)$. $\blacksquare$
