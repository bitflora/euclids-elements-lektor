id: X.113
kind: theorem
title: "Rationalising: a rational square divided by an apotome is a binomial"

paraphrase: |
  The square on a rational line {A}, applied to an apotome *BD*, gives as breadth a binomial {KH} whose terms are
  commensurable with the apotome's terms, in the same ratio and of the same order.

diagram:
  width: 175
  height: 230
  elements:
    - "A0;point;free;30,-1000;0;0"
