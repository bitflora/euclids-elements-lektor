id: X.72
kind: theorem
title: The side of the sum of two incommensurable medial areas

paraphrase: |
  If two medial areas {AB}, {CD} incommensurable with each other are added, the side of the sum is either a
  second bimedial or the side of the sum of two medial areas.

diagram:
  width: 390
  height: 210
  elements:
