id: X.54
kind: theorem
title: The side of a rational line times a first binomial is a binomial

paraphrase: |
  If an area {AC} is contained by a rational line {AB} and a first binomial {AD}, the side of the square equal
  to it is a binomial. In algebra: $\sqrt{\rho\,(a + \sqrt{b})}$ is of the form $\sqrt x + \sqrt y$ — a
  "denesting" of a nested square root.

