id: X.17
kind: theorem
title: When the roots of the quadratic are commensurable

paraphrase: |
  Apply to the greater line {BC} a rectangle {BD}·{DC} equal to a quarter of the square on the less line {A},
  deficient by a square. Then {BD}, {DC} are commensurable in length exactly when $\sqrt{BC^2 - A^2}$ is
  commensurable with {BC}.

diagram:
  width: 260
  height: 170
  elements:
