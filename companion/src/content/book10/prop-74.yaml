id: X.74
kind: theorem
title: The first apotome of a medial

paraphrase: |
  Subtracting from a medial {AB} a medial {BC}, commensurable with it in square only and containing with it a
  rational rectangle, leaves an irrational {AC}: a *first apotome of a medial*. (Cf. the first bimedial,
  [[X.37]].)

diagram:
  width: 250
  height: 65
  elements:
    - "A0;point;free;-1000,35"
    - "A3;point;free;1000,35"
    - "A;point;lineSlider;A0,A3,30,0"
    - "B;point;lineSlider;A0,A3,210,0"
    - "C;point;lineSlider;A0,A3,100,0"
    - "AB;line;connect;A,B"
    - "AC;line;connect;A,C;0;0;0"
    - "BC;line;connect;B,C;0;0;0"
  aliases: { BA: AB, CA: AC, CB: BC }
  caption: |
    {AC} = {AB} − {BC}.

steps:
  - part: enunciation
    text: "If from a medial straight line there be subtracted a medial straight line which is commensurable with the whole in square only, and which contains with the whole a rational rectangle, the remainder is irrational. And let it be called a first apotome of a medial straight line."
    highlight: [AC]
    hint: |
      Medial − medial with rational rectangle.
    modern: |
      $\sqrt[4]{27} - \sqrt[4]{3}$.

  - part: setting-out
    text: "For from the medial straight line AB let there be subtracted the medial straight line BC which is commensurable with AB in square only and with AB makes the rectangle AB, BC rational; I say that the remainder AC is irrational;"
    highlight: [AB, BC]
    hint: |
      Setup.

  - part: specification
    text: "and let it be called a first apotome of a medial straight line."
    highlight: [AC]
    hint: |
      And let it be named.

  - part: proof
    text: "For, since AB, BC are medial, the squares on AB, BC are also medial."
    highlight: [AB, BC]
    hint: |
      The squares are medial.

  - part: proof
    text: "But twice the rectangle AB, BC is rational; therefore the squares on AB, BC are incommensurable with twice the rectangle AB, BC; therefore twice the rectangle AB, BC is also incommensurable with the remainder, the square on AC, [Cf. ] since, if the whole is incommensurable with one of the magnitudes, the original magnitudes will also be incommensurable."
    highlight: [AC]
    hint: |
      2·rect rational, so incommensurable with the squares, hence with sq({AC}) ([[II.7]]).

  - part: proof
    text: "But twice the rectangle AB, BC is rational; therefore the square on AC is irrational; therefore AC is irrational."
    highlight: [AC]
    hint: |
      So {AC} irrational.

  - part: proof
    text: "And let it be called a first apotome of a medial straight line."
    hint: |
      The name.

reconstruction:
  lines:
    - steps: [3, 4, 5]
      text: |
        $AC^2 = $ medial $-$ rational, irrational. $\blacksquare$
