  caption: |
    sq({AB}) is applied to the rational line {DE} as {DF}, with breadth {DG}; {DH} = sq({AC}), {KL} =
    sq({CB}); the rest, *MF*, is 2·rect({AC},{CB}), bisected at {N}.

steps:
  - part: enunciation
    text: "The square on the second bimedial straight line applied to a rational straight line produces as breadth the third binomial."
    highlight: [AB, DG]
    hint: |
      Squaring undoes [[X.56]]: a second bimedial squared and divided by a rational line is a third binomial.

  - part: proof
    text: "Let AB be a second bimedial straight line divided into its medials at C, so that AC is the greater segment; let DE be any rational straight line, and to DE let there be applied the parallelogram DF equal to the square on AB and producing DG as its breadth; I say that DG is a third binomial straight line."
    highlight: [AB, DE, DF, DG]
    hint: |
      Setup.

  - part: construction
    text: "Let the same construction be made as before shown."
    highlight: [DH, KL]
    hint: |
      The construction of [[X.60]].

  - part: proof
    text: "Then, since AB is a second bimedial divided at C, therefore AC, CB are medial straight lines commensurable in square only and containing a medial rectangle, so that the sum of the squares on AC, CB is also medial."
    highlight: [AC, CB]
    hint: |
      {AC}, {CB} medial, commensurable in square only, medial rectangle: the sum of squares is medial.

  - part: proof
    text: "And it is equal to DL; therefore DL is also medial."
    highlight: [DH, KL]
    hint: |
      So *DL* is medial …

  - part: proof
    text: "And it is applied to the rational straight line DE; therefore MD is also rational and incommensurable in length with DE."
    highlight: [DM]
    hint: |
      … and {DM} rational, incommensurable with {DE}.

  - part: proof
    text: "For the same reason, MG is also rational and incommensurable in length with ML, that is, with DE; therefore each of the straight lines DM, MG is rational and incommensurable in length with DE."
    highlight: [MG]
    hint: |
      Likewise {MG}.

  - part: proof
    text: "And, since AC is incommensurable in length with CB, and, as AC is to CB, so is the square on AC to the rectangle AC, CB, therefore the square on AC is also incommensurable with the rectangle AC, CB."
    highlight: [AC, CB]
    hint: |
      sq({AC}) incommensurable with rect({AC},{CB}) …

  - part: proof
    text: "Hence the sum of the squares on AC, CB is incommensurable with twice the rectangle AC, CB, that is, DL is incommensurable with MF, so that DM is also incommensurable with MG."
    highlight: [DM, MG]
    hint: |
      … so the sum of squares with 2·rect, and {DM} with {MG}.

  - part: proof
    text: "And they are rational; therefore DG is binomial."
    highlight: [DG]
    hint: |
      Binomial.

  - part: specification
    text: "It is to be proved that it is also a third binomial straight line."
    highlight: [DG]
    hint: |
      A third binomial:

  - part: proof
    text: "In manner similar to the foregoing we may conclude that DM is greater than MG, and that DK is commensurable with KM."
    highlight: [DM, MG, DK, KM]
    hint: |
      As before, {DM} > {MG} and {DK}, {KM} commensurable …

  - part: proof
    text: "And the rectangle DK, KM is equal to the square on MN; therefore the square on DM is greater than the square on MG by the square on a straight line commensurable with DM."
    highlight: [DM, MG]
    hint: |
      … so the excess is commensurable with {DM}.

  - part: proof
    text: "And neither of the straight lines DM, MG is commensurable in length with DE."
    highlight: [DM, MG, DE]
    hint: |
      Neither term commensurable with {DE}.

  - part: proof
    text: "Therefore DG is a third binomial straight line."
    highlight: [DG]
    hint: |
      Third binomial ([[X.Def.II.3]]).

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        $AB^2 = (AC^2 + CB^2) + 2AC\cdot CB$; divided by $\rho$, the two parts give the terms {DM}, {MG} of
        a binomial, whose kind is read off from which part is rational and from [[X.17]]/[[X.18]].
        $\blacksquare$
