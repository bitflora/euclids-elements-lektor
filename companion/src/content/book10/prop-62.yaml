id: X.62
kind: theorem
title: The square on a second bimedial applied to a rational line gives a third binomial

paraphrase: |
  If the square on a second bimedial {AB} is applied to a rational line {DE}, the breadth {DG} is a third
  binomial. The converse of [[X.56]].

