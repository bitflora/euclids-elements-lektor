id: X.75
kind: theorem
title: The second apotome of a medial

paraphrase: |
  Subtracting from a medial {AB} a medial {CB}, commensurable with it in square only and containing with it a
  *medial* rectangle, leaves an irrational {AC}: a *second apotome of a medial*.

diagram:
  width: 310
  height: 200
  elements:
    - "A0;point;free;-1000,40;0;0"
