id: X.97
kind: theorem
title: The square on an apotome applied to a rational line gives a first apotome

paraphrase: |
  If the square on an apotome {AB} is applied to a rational line {CD}, the breadth {CF} is a first apotome. The
  converse of [[X.91]].

