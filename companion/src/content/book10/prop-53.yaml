id: X.53
kind: problem
title: To find the sixth binomial

paraphrase: |
  Construct a sixth binomial {FH} ([[X.Def.II.6]]): neither term commensurable with the rational line {E}, and
  $\sqrt{FG^2 - GH^2}$ incommensurable with {FG}. A lemma on two squares placed corner to corner follows.

diagram:
  width: 160
  height: 270
  elements:
    - "A0;point;free;40,-1000;0;0"
    - "A3;point;free;40,1000;0;0"
    - "D0;point;free;70,-1000;0;0"
