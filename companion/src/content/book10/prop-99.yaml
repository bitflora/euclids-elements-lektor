id: X.99
kind: theorem
title: The square on a second apotome of a medial applied to a rational line gives a third apotome

paraphrase: |
  If the square on a second apotome of a medial {AB} is applied to a rational line {CD}, the breadth {CF} is a third apotome. The
  converse of [[X.93]].

