  caption: |
    sq({AB}) is applied to the rational line {DE} as {DF}, with breadth {DG}; {DH} = sq({AC}), {KL} =
    sq({CB}); the rest, *MF*, is 2·rect({AC},{CB}), bisected at {N}.

steps:
  - part: enunciation
    text: "The square on the first bimedial straight line applied to a rational straight line produces as breadth the second binomial."
    highlight: [AB, DG]
    hint: |
      Squaring undoes [[X.55]]: a first bimedial squared and divided by a rational line is a second binomial.

  - part: proof
    text: "Let AB be a first bimedial straight line divided into its medials at C, of which medials AC is the greater; let a rational straight line DE be set out, and let there be applied to DE the parallelogram DF equal to the square on AB, producing DG as its breadth; I say that DG is a second binominal straight line."
    highlight: [AB, DE, DF, DG]
    hint: |
      Setup.

  - part: construction
    text: "For let the same construction as before be made."
    highlight: [DH, KL]
    hint: |
      The construction of [[X.60]].

  - part: proof
    text: "Then, since AB is a first bimedial divided at C, therefore AC, CB are medial straight lines commensurable in square only, and containing a rational rectangle, so that the squares on AC, CB are also medial."
    highlight: [AC, CB]
    hint: |
      {AC}, {CB} medial, commensurable in square only, rational rectangle; the sum of squares is medial …

  - part: proof
    text: "Therefore DL is medial."
    highlight: [DH, KL]
    hint: |
      … so *DL* is medial …

  - part: proof
    text: "And it has been applied to the rational straight line DE; therefore MD is rational and incommensurable in length with DE."
    highlight: [DM]
    hint: |
      … and {DM} rational, incommensurable in length with {DE}.

  - part: proof
    text: "Again, since twice the rectangle AC, CB is rational, MF is also rational."
    highlight: [MG]
    hint: |
      2·rect rational …

  - part: proof
    text: "And it is applied to the rational straight line ML; therefore MG is also rational and commensurable in length with ML, that is, DE; therefore DM is incommensurable in length with MG."
    highlight: [MG, DM]
    hint: |
      … so {MG} commensurable with {DE} ([[X.20]]); hence {DM}, {MG} incommensurable.

  - part: proof
    text: "And they are rational; therefore DM, MG are rational straight lines commensurable in square only; therefore DG is binomial."
    highlight: [DG]
    hint: |
      {DG} binomial.

  - part: specification
    text: "It is next to be proved that it is also a second binomial straight line."
    highlight: [DG]
    hint: |
      A second binomial:

  - part: proof
    text: "For, since the squares on AC, CB are greater than twice the rectangle AC, CB, therefore DL is also greater than MF, so that DM is also greater than MG."
    highlight: [DM, MG]
    hint: |
      {DM} > {MG}.

  - part: proof
    text: "And, since the square on AC is commensurable with the square on CB, DH is also commensurable with KL, so that DK is also commensurable with KM."
    highlight: [DK, KM]
    hint: |
      {DK}, {KM} commensurable.

  - part: proof
    text: "And the rectangle DK, KM is equal to the square on MN; therefore the square on DM is greater than the square on MG by the square on a straight line commensurable with DM."
    highlight: [DM, MG]
    hint: |
      So the excess is commensurable with {DM} ([[X.17]]).

  - part: proof
    text: "And MG is commensurable in length with DE."
    highlight: [MG, DE]
    hint: |
      The lesser term {MG} is commensurable with {DE}.

  - part: proof
    text: "Therefore DG is a second binomial straight line."
    highlight: [DG]
    hint: |
      Second binomial ([[X.Def.II.2]]).

reconstruction:
  lines:
    - text: |
        $AB^2 = (AC^2 + CB^2) + 2AC\cdot CB$; divided by $\rho$, the two parts give the terms {DM}, {MG} of
        a binomial, whose kind is read off from which part is rational and from [[X.17]]/[[X.18]].
        $\blacksquare$
