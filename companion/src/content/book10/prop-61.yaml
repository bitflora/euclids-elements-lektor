id: X.61
kind: theorem
title: The square on a first bimedial applied to a rational line gives a second binomial

paraphrase: |
  If the square on a first bimedial {AB} is applied to a rational line {DE}, the breadth {DG} is a second
  binomial. The converse of [[X.55]].

