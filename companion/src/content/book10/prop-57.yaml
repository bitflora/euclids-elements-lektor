  caption: |
    As in [[X.54]]: {AD} = {AE} + {ED} on the rational {AB}; squares {SN} = {AH}, {NQ} = {GK}; {MO} is the
    side of {AC}.

steps:
  - part: enunciation
    text: "If an area be contained by a rational straight line and the fourth binomial, the “side” of the area is the irrational straight line called major."
    highlight: [AC, MO]
    hint: |
      √(rational × fourth binomial) = major.

  - part: proof
    text: "For let the area AC be contained by the rational straight line AB and the fourth binomial AD divided into its terms at E, of which terms let AE be the greater; I say that the “side” of the area AC is the irrational straight line called major."
    highlight: [AC, AB, AD]
    hint: |
      Setup.

  - part: proof
    text: "For, since AD is a fourth binomial straight line, therefore AE, ED are rational straight lines commensurable in square only, the square on AE is greater than the square on ED by the square on a straight line incommensurable with AE, and AE is commensurable in length with AB."
    highlight: [AE, ED]
    hint: |
      Fourth binomial: {AE} commensurable with {AB}, the excess incommensurable with {AE} ([[X.Def.II.4]]).

  - part: construction
    text: "Let DE be bisected at F, and let there be applied to AE a parallelogram, the rectangle AG, GE, equal to the square on EF; therefore AG is incommensurable in length with GE."
    highlight: [AG, GE, EF]
    hint: |
      Now {AG}, {GE} are *incommensurable* ([[X.18]]).

  - part: construction
    text: "Let GH, EK, FL be drawn parallel to AB, and let the rest of the construction be as before; it is then manifest that MO is the “side” of the area AC."
    highlight: [SQ, MO]
    hint: |
      Same construction: {MO} is the side.

  - part: specification
    text: "It is next to be proved that MO is the irrational straight line called major."
    highlight: [MO]
    hint: |
      {MO} is major.

  - part: proof
    text: "Since AG is incommensurable with EG, AH is also incommensurable with GK, that is, SN with NQ; therefore MN, NO are incommensurable in square."
    highlight: [MN, NO]
    hint: |
      {AH}, {GK} incommensurable, so {MN}, {NO} incommensurable in square.

  - part: proof
    text: "And, since AE is commensurable with AB, AK is rational; and it is equal to the squares on MN, NO; therefore the sum of the squares on MN, NO is also rational."
    highlight: [MN, NO]
    hint: |
      *AK* is rational ([[X.19]]) and equals sq({MN}) + sq({NO}).

  - part: proof
    text: "And, since DE is incommensurable in length with AB, that is, with EK, while DE is commensurable with EF, therefore EF is incommensurable in length with EK."
    highlight: [EF, EK]
    hint: |
      {EF}, {EK} incommensurable in length …

  - part: proof
    text: "Therefore EK, EF are rational straight lines commensurable in square only; therefore LE, that is, MR, is medial."
    highlight: [MN, NO]
    hint: |
      … so *MR* = rect({MN},{NO}) is medial.

  - part: proof
    text: "And it is contained by MN, NO; therefore the rectangle MN, NO is medial."
    highlight: [MN, NO]
    hint: |
      Medial rectangle.

  - part: proof
    text: "And the [sum] of the squares on MN, NO is rational, and MN, NO are incommensurable in square."
    highlight: [MN, NO]
    hint: |
      Rational sum of squares, incommensurable in square.

  - part: proof
    text: "But, if two straight lines incommensurable in square and making the sum of the squares on them rational, but the rectangle contained by them medial, be added together, the whole is irrational and is called major."
    highlight: [MO]
    hint: |
      [[X.39]].

  - part: proof
    text: "Therefore MO is the irrational straight line called major and is the “side” of the area AC."
    highlight: [MO]
    hint: |
      Major.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - steps: [5, 6, 7, 8, 9, 10, 11, 12]
      text: |
        $\rho\,AD$ splits into incommensurable parts with rational sum and medial mean: the major. $\blacksquare$
