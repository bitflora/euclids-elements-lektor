id: X.80
kind: theorem
title: Only one medial line can be annexed to a first apotome of a medial

paraphrase: |
  A first apotome of a medial {AB} has only one annex {BC} of the kind its definition ([[X.74]]) requires. The subtractive
  counterpart of [[X.43]].

diagram:
  width: 240
  height: 65
  elements:
    - "A0;point;free;-1000,35"
    - "A3;point;free;1000,35"
    - "A;point;lineSlider;A0,A3,30,0"
    - "B;point;lineSlider;A0,A3,90,0"
    - "C;point;lineSlider;A0,A3,180,0"
    - "D;point;lineSlider;A0,A3,210,0"
    - "AD;line;connect;A,D"
    - "AB;line;connect;A,B;0;0;0"
    - "BC;line;connect;B,C;0;0;0"
    - "AC;line;connect;A,C;0;0;0"
    - "BD;line;connect;B,D;0;0;0"
  aliases: { DA: AD, BA: AB, CB: BC, CA: AC, DB: BD }
  caption: |
    {AB} with the annex {BC} (whole {AC}) and, supposedly, a second annex {BD} (whole {AD}).

steps:
  - part: enunciation
    text: "To a first apotome of a medial straight line only one medial straight line can be annexed which is commensurable with the whole in square only and which contains with the whole a rational rectangle."
    highlight: [AB, BC]
    hint: |
      The annex is unique.

  - part: setting-out
    text: "For let AB be a first apotome of a medial straight line, and let BC be an annex to AB; therefore AC, CB are medial straight lines commensurable in square only and such that the rectangle AC, CB which they contain is rational; I say that no other medial straight line can be annexed to AB which is commensurable with the whole in square only and which contains with the whole a rational area."
    highlight: [AB, BC, AC]
    hint: |
      {AB} a first apotome of a medial, annex {BC}. To prove: unique.

  - part: proof
    text: "For, if possible, let DB also be so annexed; therefore AD, DB are medial straight lines commensurable in square only and such that the rectangle AD, DB which they contain is rational."
    highlight: [BD, AD]
    hint: |
      Suppose another annex {BD}.

  - part: proof
    text: "Now, since the excess of the squares on AD, DB over twice the rectangle AD, DB is also the excess of the squares on AC, CB over twice the rectangle AC, CB, for they exceed by the same, the square on AB, therefore, alternately, the excess of the squares on AD, DB over the squares on AC, CB is also the excess of twice the rectangle AD, DB over twice the rectangle AC, CB."
    highlight: [AD, BD, AC, BC]
    hint: |
      The differences correspond, as in [[X.79]].

  - part: proof
    text: "But twice the rectangle AD, DB exceeds twice the rectangle AC, CB by a rational area, for both are rational."
    highlight: [AD, BD, AC, BC]
    hint: |
      The doubled rectangles are rational, so their difference is rational …

  - part: proof
    text: "Therefore the squares on AD, DB also exceed the squares on AC, CB by a rational area: which is impossible, for both are medial, and a medial area does not exceed a medial by a rational area."
    highlight: [AD, BD, AC, BC]
    hint: |
      … making two medial areas differ by a rational one: impossible ([[X.26]]).

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        As [[X.43]]: two annexes would make two medial areas differ by a rational area, contradicting [[X.26]].
        $\blacksquare$
