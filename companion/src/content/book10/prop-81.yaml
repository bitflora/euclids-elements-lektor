id: X.81
kind: theorem
title: Only one medial line can be annexed to a second apotome of a medial

paraphrase: |
  A second apotome of a medial {AB} has only one annex. The subtractive counterpart of [[X.44]].

diagram:
  width: 200
  height: 280
  elements:
