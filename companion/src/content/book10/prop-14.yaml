id: X.14
kind: theorem
title: Proportional lines keep the commensurability of the "excess" line

paraphrase: |
  If {A} : {B} = {C} : {D}, and $E = \sqrt{A^2 - B^2}$, $F = \sqrt{C^2 - D^2}$, then {E} is commensurable with
  {A} exactly when {F} is commensurable with {C}.

