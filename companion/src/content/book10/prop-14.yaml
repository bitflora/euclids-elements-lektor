steps:
  - part: enunciation
    text: "If four straight lines be proportional, and the square on the first be greater than the square on the second by the square on a straight line commensurable with the first, the square on the third will also be greater than the square on the fourth by the square on a straight line commensurable with the third."
    highlight: [A, B, C, D]
    hint: |
      Whether $\sqrt{a^2 - b^2}$ is commensurable with $a$ depends only on the ratio $a : b$.
    modern: |
      $a : b = c : d \Rightarrow \sqrt{a^2 - b^2} : a = \sqrt{c^2 - d^2} : c$.

  - part: enunciation
    text: "And, if the square on the first be greater than the square on the second by the square on a straight line incommensurable with the first, the square on the third will also be greater than the square on the fourth by the square on a straight line in- commensurable with the third."
    hint: |
      And likewise for incommensurable.

  - part: setting-out
    text: "Let A, B, C, D be four straight lines in proportion, so that, as A is to B, so is C to D; and let the square on A be greater than the square on B by the square on E, and let the square on C be greater than the square on D by the square on F;"
    highlight: [A, B, C, D, E, F]
    hint: |
      The setup.

  - part: specification
    text: "I say that, if A is commensurable with E, C is also commensurable with F, and, if A is incommensurable with E, C is also incommensurable with F."
    highlight: [A, E, C, F]
    hint: |
      To prove.

  - part: proof
    text: "For since, as A is to B, so is C to D, therefore also, as the square on A is to the square on B, so is the square on C to the square on D."
    highlight: [A, B, C, D]
    hint: |
      Squares in the same ratio ([[VI.22]]).

  - part: proof
    text: "But the squares on E, B are equal to the square on A, and the squares on D, F are equal to the square on C."
    highlight: [E, B, D, F]
    hint: |
      sq({A}) = sq({E}) + sq({B}), sq({C}) = sq({D}) + sq({F}).

  - part: proof
    text: "Therefore, as the squares on E, B are to the square on B, so are the squares on D, F to the square on D; therefore, separando, as the square on E is to the square on B, so is the square on F to the square on D; therefore also, as E is to B, so is F to D; therefore, inversely, as B is to E, so is D to F."
    highlight: [E, B, F, D]
    hint: |
      Separando ([[V.17]]): sq({E}) : sq({B}) = sq({F}) : sq({D}), so {E} : {B} = {F} : {D} ([[VI.22]]).

  - part: proof
    text: "But, as A is to B, so also is C to D; therefore, ex aequali, as A is to E, so is C to F."
    highlight: [A, E, C, F]
    hint: |
      Ex aequali ([[V.22]]): {A} : {E} = {C} : {F}.

  - part: proof
    text: "Therefore, if A is commensurable with E, C is also commensurable with F, and, if A is incommensurable with E, C is also incommensurable with F."
    highlight: [A, E, C, F]
    hint: |
      So commensurability carries over ([[X.11]]).

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

reconstruction:
  lines:
    - steps: [3, 4, 5, 6]
      text: |
        With $c = ka$, $d = kb$: $\sqrt{c^2 - d^2} = k\sqrt{a^2 - b^2}$, so $f/c = e/a$. $\blacksquare$

commentary: |
  Heath's enunciation is printed in two paragraphs, both treated here as the enunciation. The proposition is
  the tool behind the six kinds of binomials and apotomes, which are classified by whether $\sqrt{a^2 - b^2}$
  is commensurable with $a$ ([[X.Def.II.1]]).
