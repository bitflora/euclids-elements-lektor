id: X.101
kind: theorem
title: The square on the line that produces with a rational area a medial whole applied to a rational line gives a fifth apotome

paraphrase: |
  If the square on the line that produces with a rational area a medial whole {AB} is applied to a rational line {CD}, the breadth {CF} is a fifth apotome. The
  converse of [[X.95]].

