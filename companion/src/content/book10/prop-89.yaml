id: X.89
kind: problem
title: To find the fifth apotome

paraphrase: |
  Construct a fifth apotome {BC} ([[X.Def.III.5]]): the annex commensurable with the rational line {A}, the excess
  incommensurable with the whole. Example: $\sqrt6 - 2$.

diagram:
  width: 280
  height: 100
  elements:
    - "A0;point;free;-1000,40;0;0"
    - "A3;point;free;1000,40;0;0"
    - "H0;point;free;-1000,75;0;0"
    - "H3;point;free;1000,75;0;0"
    - "A1;point;lineSlider;A0,A3,30,0;0"
    - "A2;point;lineSlider;A0,A3,100,0;0"
    - "A;line;connect;A1,A2;black"
    - "C;point;lineSlider;A0,A3,165,0"
    - "G;point;lineSlider;A0,A3,240,0"
    - "D;point;lineSlider;H0,H3,230,0"
    - "E;point;lineSlider;H0,H3,150,0"
    - "F;point;lineSlider;H0,H3,190,0"
    - "DE;line;connect;D,E;0;0;blue"
    - "B';point;proportion;F,E,E,D,C,G,G,C;0;0"
    - "B;point;meanProportional;C,G,G,B',G,C"
    - "BG;line;connect;B,G"
    - "H1;point;lineSlider;H0,H3,30,0;0"
    - "M;point;midpoint;B,G;0;0"
    - "BGcirc;circle;radius;M,G;0;0;0;0"
    - "CGcirc;circle;radius;G,C;0;0;0;0"
    - "bich;line;bichord;BGcirc,CGcirc;0;0;0"
