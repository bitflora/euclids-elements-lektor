id: X.44
kind: theorem
title: A second bimedial divides at only one point

paraphrase: |
  A second bimedial line splits into its two medial terms in only one way.

diagram:
  width: 350
  height: 200
  elements:
    - "A0;point;free;-1000,40;0;0"
    - "A3;point;free;1000,40;0;0"
