id: X.111
kind: theorem
title: The apotome is not the same as the binomial

paraphrase: |
  No line is both an apotome and a binomial. (The two families of irrationals are disjoint.)

diagram:
  width: 240
  height: 210
  elements:
    - "A0;point;free;-1000,40;0;0"
    - "A3;point;free;1000,40;0;0"
    - "D0;point;free;40,-1000;0;0"
    - "D3;point;free;40,1000;0;0"
    - "A;point;lineSlider;A0,A3,50,0"
    - "B;point;lineSlider;A0,A3,160,0"
    - "AB;line;connect;A,B"
    - "D;point;lineSlider;D0,D3,0,75"
    - "C;point;lineSlider;D0,D3,0,190"
    - "E';point;perpendicular;D,C;0;0"
    - "E;point;proportion;D,C,A,B,A,B,D,E'"
    - "CE;polygon;parallelogram;E,D,C;0;0;black;random"
    - "M;point;midpoint;D,E;0;0"
    - "F;point;extend;D,E,D,M"
    - "EF;line;connect;E,F"
    - "G;point;midpoint;D,F"
    - "DE;line;connect;D,E;0;0;0"
    - "DF;line;connect;D,F;0;0;0"
    - "DG;line;connect;D,G;0;0;0"
    - "GE;line;connect;G,E;0;0;0"
    - "GF;line;connect;G,F;0;0;0"
    - "EG;line;connect;E,G;0;0;0"
    - "DC;line;connect;D,C;0;0;0"
    - "FE;line;connect;F,E;0;0;0"
    - "FG;line;connect;F,G;0;0;0"
  aliases: { BA: AB, ED: DE, FD: DF, GD: DG, CD: DC }
  caption: |
    sq({AB}) applied to the rational line {DC} as {CE}, with breadth {DE}.

steps:
  - part: enunciation
    text: "The apotome is not the same with the binomial straight line."
    highlight: [AB]
    hint: |
      An apotome is never a binomial.

  - part: setting-out
    text: "Let AB be an apotome; I say that AB is not the same with the binomial straight line."
    highlight: [AB]
    hint: |
      Setup.

  - part: construction
    text: "For, if possible, let it be so; let a rational straight line DC be set out, and to CD let there be applied the rectangle CE equal to the square on AB and producing DE as breadth."
    highlight: [CE, DE]
    hint: |
      Suppose it were; apply sq({AB}) to a rational line {DC}, breadth {DE}.

  - part: proof
    text: "Then, since AB is an apotome, DE is a first apotome."
    highlight: [DE]
    hint: |
      As an apotome, {DE} is a first apotome ([[X.97]]).

  - part: proof
    text: "Let EF be the annex to it; therefore DF, FE are rational straight lines commensurable in square only, the square on DF is greater than the square on FE by the square on a straight line commensurable with DF, and DF is commensurable in length with the rational straight line DC set out."
    highlight: [EF, DF]
    hint: |
      Its annex {EF}: {DF}, {FE} rational, commensurable in square only, {DF} commensurable with {DC}.

  - part: proof
    text: "Again, since AB is binomial, therefore DE is a first binomial straight line."
    highlight: [DE]
    hint: |
      As a binomial, {DE} is a first binomial ([[X.60]]).

  - part: proof
    text: "Let it be divided into its terms at G, and let DG be the greater term; therefore DG, GE are rational straight lines commensurable in square only, the square on DG is greater than the square on GE by the square on a straight line commensurable with DG, and the greater term DG is commensurable in length with the rational straight line DC set out."
    highlight: [DG, GE]
    hint: |
      Its terms {DG}, {GE}, {DG} commensurable with {DC}.

  - part: proof
    text: "Therefore DF is also commensurable in length with DG; therefore the remainder GF is also commensurable in length with DF."
    highlight: [DF, DG, GF]
    hint: |
      So {DF}, {DG} commensurable, and so {GF} with {DF}.

  - part: proof
    text: "But DF is incommensurable in length with EF; therefore FG is also incommensurable in length with EF."
    highlight: [GF, EF]
    hint: |
      {FG} incommensurable with {EF}.

  - part: proof
    text: "Therefore GF, FE are rational straight lines commensurable in square only; therefore EG is an apotome."
    highlight: [EG]
    hint: |
      So {EG} is an apotome …

  - part: proof
    text: "But it is also rational: which is impossible."
    highlight: [EG]
    hint: |
      … but it is rational: impossible.

  - part: proof
    text: "Therefore the apotome is not the same with the binomial straight line."
    highlight: [AB]
    hint: |
      So no apotome is a binomial.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        If $a - b = c + d$ with $a, c$ rational in length, then $a - c = b + d$ would be rational in length and an
        apotome at once. $\blacksquare$

commentary: |
  The closing result of Book X's classification: together with [[X.42]]–[[X.47]], [[X.79]]–[[X.84]] and the
  application theorems, it shows that the thirteen kinds of irrational — medial, the six additive and the six
  subtractive — are all different.
