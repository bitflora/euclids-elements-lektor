    - "FK;line;connect;F,K;0;0;0"
    - "KH;line;connect;K,H;0;0;0"
    - "FG;line;connect;F,G;0;0;0"
  aliases: { GK: GFKL, HF: FH, KF: FK, HK: KH, GF: FG }
  caption: |
    {BC} and {BD} applied to the rational line {FG} as {GH} and {GK}, with breadths {FH} and {FK}; the remainder
