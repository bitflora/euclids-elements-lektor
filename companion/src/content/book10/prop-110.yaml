steps:
  - part: enunciation
    text: "If from a medial area there be subtracted a medial area incommensurable with the whole, the two remaining irrational straight lines arise, either a second apotome of a medial straight line or a straight line which produces with a medial area a medial whole."
    highlight: [BC, BD]
    hint: |
      √(medial − medial).

  - part: setting-out
    text: "For, as in the foregoing figures, let there be subtracted from the medial area BC the medial area BD incommensurable with the whole; I say that the “side” of EC is one of two irrational straight lines, either a second apotome of a medial straight line or a straight line which produces with a medial area a medial whole."
    highlight: [BC, BD]
    hint: |
      Setup.

  - part: proof
    text: "For, since each of the rectangles BC, BD is medial, and BC is incommensurable with BD, it follows that each of the straight lines FH, FK will be rational and incommensurable in length with FG."
    highlight: [FH, FK]
    hint: |
      Both breadths rational, incommensurable with {FG}.

  - part: proof
    text: "And, since BC is incommensurable with BD, that is, GH with GK, HF is also incommensurable with FK; therefore FH, FK are rational straight lines commensurable in square only; therefore KH is an apotome."
    highlight: [FH, FK, KH]
    hint: |
      Incommensurable with each other: {KH} an apotome.

  - part: proof
    text: "If then the square on FH is greater than the square on FK by the square on a straight line commensurable with FH, while neither of the straight lines FH, FK is commensurable in length with the rational straight line FG set out, KH is a third apotome."
    highlight: [KH]
    hint: |
      Commensurable excess, neither term commensurable with {FG}: a third apotome …

  - part: proof
    text: "But KL is rational, and the rectangle contained by a rational straight line and a third apotome is irrational, and the “side” of it is irrational, and is called a second apotome of a medial straight line; so that the “side” of LH, that is, of EC, is a second apotome of a medial straight line."
    highlight: [KH]
    hint: |
      … side: second apotome of a medial ([[X.93]]).

  - part: proof
    text: "But, if the square on FH is greater than the square on FK by the square on a straight line incommensurable with FH, while neither of the straight lines HF, FK is commensurable in length with FG, KH is a sixth apotome."
    highlight: [KH]
    hint: |
      Incommensurable excess: a sixth apotome …

  - part: proof
    text: "But the “side” of the rectangle contained by a rational straight line and a sixth apotome is a straight line which produces with a medial area a medial whole."
    highlight: [KH]
    hint: |
      … side: produces with a medial area a medial whole ([[X.96]]).

  - part: proof
    text: "Therefore the “side” of LH, that is, of EC, is a straight line which produces with a medial area a medial whole."
    highlight: [KH]
    hint: |
      So for *EC*.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        A third or sixth apotome: [[X.93]], [[X.96]]. $\blacksquare$
