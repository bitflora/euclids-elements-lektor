id: X.86
kind: problem
title: To find the second apotome

paraphrase: |
  Construct a second apotome {BC} = {BG} − {GC} ([[X.Def.III.2]]): now the annex {GC} is commensurable with the
  rational line {A}. Example: $\sqrt{12} - 3$.

diagram:
  width: 280
  height: 90
  elements:
    - "A0;point;free;-1000,30;0;0"
    - "A3;point;free;1000,30;0;0"
    - "H0;point;free;-1000,65;0;0"
    - "H3;point;free;1000,65;0;0"
