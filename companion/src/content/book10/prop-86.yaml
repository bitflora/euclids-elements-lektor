steps:
  - part: enunciation
    text: "To find the second apotome."
    highlight: [BC]
    hint: |
      Mirror of [[X.49]].

  - part: construction
    text: "Let a rational straight line A be set out, and GC commensurable in length with A; therefore GC is rational."
    highlight: [A]
    hint: |
      *GC* commensurable with {A}.

  - part: construction
    text: "Let two square numbers DE, EF be set out, and let their difference DF not be square."
    highlight: [DE]
    hint: |
      Square numbers *DE*, *EF*, non-square difference.

  - part: construction
    text: "Now let it be contrived that, as FD is to DE, so is the square on CG to the square on GB."
    highlight: [BG]
    hint: |
      sq(*CG*) : sq({GB}) = *FD* : *DE*.

  - part: proof
    text: "Therefore the square on CG is commensurable with the square on GB."
    highlight: [BG]
    hint: |
      Commensurable squares …

  - part: proof
    text: "But the square on CG is rational; therefore the square on GB is also rational; therefore BG is rational."
    highlight: [BG]
    hint: |
      … {BG} rational.

  - part: proof
    text: "And, since the square on GC has not to the square on GB the ratio which a square number has to a square number, CG is incommensurable in length with GB."
    highlight: [BG]
    hint: |
      Incommensurable in length with *CG*.

  - part: proof
    text: "And both are rational; therefore CG, GB are rational straight lines commensurable in square only; therefore BC is an apotome."
    highlight: [BC]
    hint: |
      {BC} an apotome.

  - part: specification
    text: "I say next that it is also a second apotome."
    highlight: [BC]
    hint: |
      A second apotome:

  - part: construction
    text: "For let the square on H be that by which the square on BG is greater than the square on GC."
    highlight: [BG]
    hint: |
      Let sq(*H*) = sq({BG}) − sq(*GC*).

  - part: proof
    text: "Since then, as the square on BG is to the square on GC, so is the number ED to the number DF, therefore, convertendo, as the square on BG is to the square on H, so is DE to EF."
    highlight: [BG]
    hint: |
      Convertendo …

  - part: proof
    text: "And each of the numbers DE, EF is square; therefore the square on BG has to the square on H the ratio which a square number has to a square number; therefore BG is commensurable in length with H."
    highlight: [BG]
    hint: |
      … square to square …

  - part: proof
    text: "And the square on BG is greater than the square on GC by the square on H; therefore the square on BG is greater than the square on GC by the square on a straight line commensurable in length with BG."
    highlight: [BG]
    hint: |
      … so the excess is commensurable with {BG}.

  - part: proof
    text: "And CG, the annex, is commensurable with the rational straight line A set out."
    highlight: [A]
    hint: |
      The annex *CG* is commensurable with {A}.

  - part: proof
    text: "Therefore BC is a second apotome."
    highlight: [BC]
    hint: |
      Second apotome.

  - part: proof
    text: "Therefore the second apotome BC has been found."
    highlight: [BC]
    hint: |
      Found.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        As [[X.49]] with "−". $\blacksquare$
