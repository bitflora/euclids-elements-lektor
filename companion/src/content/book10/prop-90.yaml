id: X.90
kind: problem
title: To find the sixth apotome

paraphrase: |
  Construct a sixth apotome {FH} ([[X.Def.III.6]]): neither term commensurable with the rational line {A}, the
  excess incommensurable with the whole. Example: $\sqrt5 - \sqrt3$.

