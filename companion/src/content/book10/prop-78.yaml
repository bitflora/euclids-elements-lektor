id: X.78
kind: theorem
title: That which produces with a medial area a medial whole

paraphrase: |
  Subtracting from {AB} a line {BC} incommensurable with it in square, the squares adding to a medial area and
  the rectangle medial and incommensurable with it, leaves an irrational {AC}: "that which produces with a
  medial area a medial whole" (counterpart of [[X.41]]).

