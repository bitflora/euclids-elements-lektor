id: X.88
kind: problem
title: To find the fourth apotome

paraphrase: |
  Construct a fourth apotome {BC} = {BG} − {GC} ([[X.Def.III.4]]): the whole commensurable with the rational line
  {A}, the excess incommensurable with the whole. Example: $3 - \sqrt3$.

