  caption: |
    sq({AB}) is applied to the rational line {DE} as {DF}, with breadth {DG}; {DH} = sq({AC}), {KL} =
    sq({CB}); the rest, *MF*, is 2·rect({AC},{CB}), bisected at {N}.

steps:
  - part: enunciation
    text: "The square on the major straight line applied to a rational straight line produces as breadth the fourth binomial."
    highlight: [AB, DG]
    hint: |
      Squaring undoes [[X.57]]: a major squared and divided by a rational line is a fourth binomial.

  - part: proof
    text: "Let AB be a major straight line divided at C, so that AC is greater than CB; let DE be a rational straight line, and to DE let there be applied the parallelogram DF equal to the square on AB and producing DG as its breadth; I say that DG is a fourth binomial straight line."
    highlight: [AB, DE, DF, DG]
    hint: |
      Setup.

  - part: construction
    text: "Let the same construction be made as before shown."
    highlight: [DH, KL]
    hint: |
      The construction of [[X.60]].

  - part: proof
    text: "Then, since AB is a major straight line divided at C, AC, CB are straight lines incommensurable in square which make the sum of the squares on them rational, but the rectangle contained by them medial."
    highlight: [AC, CB]
    hint: |
      {AC}, {CB} incommensurable in square; rational sum of squares, medial rectangle.

  - part: proof
    text: "Since then the sum of the squares on AC, CB is rational, therefore DL is rational; therefore DM is also rational and commensurable in length with DE."
    highlight: [DM]
    hint: |
      *DL* rational, so {DM} commensurable with {DE}.

  - part: proof
    text: "Again, since twice the rectangle AC, CB, that is, MF, is medial, and it is applied to the rational straight line ML, therefore MG is also rational and incommensurable in length with DE; therefore DM is also incommensurable in length with MG."
    highlight: [MG]
    hint: |
      *MF* medial, so {MG} rational, incommensurable with {DE}.

  - part: proof
    text: "Therefore DM, MG are rational straight lines commensurable in square only; therefore DG is binomial."
    highlight: [DG]
    hint: |
      {DG} binomial.

  - part: specification
    text: "It is to be proved that it is also a fourth binomial straight line."
    highlight: [DG]
    hint: |
      A fourth binomial:

  - part: proof
    text: "In manner similar to the foregoing we can prove that DM is greater than MG, and that the rectangle DK, KM is equal to the square on MN."
    highlight: [DM, MG, DK, KM, MN]
    hint: |
      As before, {DM} > {MG} and rect({DK},{KM}) = sq({MN}).

  - part: proof
    text: "Since then the square on AC is incommensurable with the square on CB, therefore DH is also incommensurable with KL, so that DK is also incommensurable with KM."
    highlight: [DK, KM]
    hint: |
      Squares incommensurable, so {DK}, {KM} incommensurable.

  - part: proof
    text: "But, if there be two unequal straight lines, and to the greater there be applied a parallelogram equal to the fourth part of the square on the less and deficient by a square figure, and if it divide it into incommensurable parts, then the square on the greater will be greater than the square on the less by the square on a straight line incommensurable in length with the greater; therefore the square on DM is greater than the square on MG by the square on a straight line incommensurable with DM."
    highlight: [DM, MG]
    hint: |
      So the excess is incommensurable with {DM} ([[X.18]]).

  - part: proof
    text: "And DM, MG are rational straight lines commensurable in square only, and DM is commensurable with the rational straight line DE set out."
    highlight: [DM, DE]
    hint: |
      {DM} commensurable with {DE}.

  - part: proof
    text: "Therefore DG is a fourth binomial straight line."
    highlight: [DG]
    hint: |
      Fourth binomial ([[X.Def.II.4]]).

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        $AB^2 = (AC^2 + CB^2) + 2AC\cdot CB$; divided by $\rho$, the two parts give the terms {DM}, {MG} of
        a binomial, whose kind is read off from which part is rational and from [[X.17]]/[[X.18]].
        $\blacksquare$
