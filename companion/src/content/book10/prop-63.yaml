id: X.63
kind: theorem
title: The square on a major line applied to a rational line gives a fourth binomial

paraphrase: |
  If the square on a major {AB} is applied to a rational line {DE}, the breadth {DG} is a fourth
  binomial. The converse of [[X.57]].

