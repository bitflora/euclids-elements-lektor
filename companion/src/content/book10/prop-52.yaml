id: X.52
kind: problem
title: To find the fifth binomial

paraphrase: |
  Construct a fifth binomial {EG} ([[X.Def.II.5]]): the lesser term {EF} commensurable with the rational line
  {D}, and $\sqrt{FG^2 - EF^2}$ incommensurable with {FG}.

