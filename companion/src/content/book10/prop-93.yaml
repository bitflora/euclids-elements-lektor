steps:
  - part: enunciation
    text: "If an area be contained by a rational straight line and a third apotome, the “side” of the area is a second apotome of a medial straight line."
    highlight: [AB, LN]
    hint: |
      √(rational × third apotome).

  - part: setting-out
    text: "For let the area AB be contained by the rational straight line AC and the third apotome AD; I say that the “side” of the area AB is a second apotome of a medial straight line."
    highlight: [AB, AC, AD]
    hint: |
      Setup.

  - part: proof
    text: "For let DG be the annex to AD; therefore AG, GD are rational straight lines commensurable in square only, and neither of the straight lines AG, GD is commensurable in length with the rational straight line AC set out, while the square on the whole AG is greater than the square on the annex DG by the square on a straight line commensurable with AG."
    highlight: [AG, DG]
    hint: |
      Annex {DG}; neither term commensurable with {AC} ([[X.Def.III.3]]).

  - part: proof
    text: "Since then the square on AG is greater than the square on GD by the square on a straight line commensurable with AG, therefore, if there be applied to AG a parallelogram equal to the fourth part of the square on DG and deficient by a square figure, it will divide it into commensurable parts."
    highlight: [AG]
    hint: |
      Excess commensurable with {AG}.

  - part: construction
    text: "Let then DG be bisected at E, let there be applied to AG a parallelogram equal to the square on EG and deficient by a square figure, and let it be the rectangle AF, FG."
    highlight: [AF, FG, EG]
    hint: |
      Bisect and apply.

  - part: construction
    text: "Let EH, FI, GK be drawn through the points E, F, G parallel to AC."
    highlight: [EH]
    hint: |
      Parallels.

  - part: proof
    text: "Therefore AF, FG are commensurable; therefore AI is also commensurable with FK."
    highlight: [AF, FG]
    hint: |
      {AF}, {FG} commensurable: *AI*, *FK* commensurable.

  - part: proof
    text: "And, since AF, FG are commensurable in length, therefore AG is also commensurable in length with each of the straight lines AF, FG."
    highlight: [AG, AF, FG]
    hint: |
      {AG} commensurable with each.

  - part: proof
    text: "But AG is rational and incommensurable in length with AC; so that AF, FG are so also."
    highlight: [AF, FG, AC]
    hint: |
      Incommensurable with {AC}.

  - part: proof
    text: "Therefore each of the rectangles AI, FK is medial."
    highlight: [AF, FG]
    hint: |
      *AI*, *FK* medial.

  - part: proof
    text: "Again, since DE is commensurable in length with EG, therefore DG is also commensurable in length with each of the straight lines DE, EG."
    highlight: [DE, EG, DG]
    hint: |
      {DE}, {EG} commensurable with {DG} …

  - part: proof
    text: "But GD is rational and incommensurable in length with AC; therefore each of the straight lines DE, EG is also rational and incommensurable in length with AC; therefore each of the rectangles DH, EK is medial."
    highlight: [DE, EG]
    hint: |
      … rational, incommensurable with {AC}: *DH*, *EK* medial.

  - part: proof
    text: "And, since AG, GD are commensurable in square only, therefore AG is incommensurable in length with GD."
    highlight: [AG, DG]
    hint: |
      {AG}, {GD} incommensurable in length.

  - part: proof
    text: "But AG is commensurable in length with AF, and DG with EG; therefore AF is incommensurable in length with EG."
    highlight: [AF, EG]
    hint: |
      So {AF}, {EG} incommensurable.

  - part: proof
    text: "But, as AF is to EG, so is AI to EK; therefore AI is incommensurable with EK."
    highlight: [AF, EG]
    hint: |
      So *AI*, *EK* incommensurable.

  - part: construction
    text: "Now let the square LM be constructed equal to AI, and let there be subtracted NO equal to FK and being about the same angle with LM; therefore LM, NO are about the same diameter."
    highlight: [LM, NO]
    hint: |
      Squares {LM}, {NO}.

  - part: construction
    text: "Let PR be their diameter, and let the figure be drawn."
    highlight: [LM, NO]
    hint: |
      Diameter.

  - part: proof
    text: "Now, since the rectangle AF, FG is equal to the square on EG, therefore, as AF is to EG, so is EG to FG."
    highlight: [EG]
    hint: |
      rect({AF},{FG}) = sq({EG}), so {AF} : {EG} = {EG} : {FG} ([[VI.17]]).

  - part: proof
    text: "But, as AF is to EG, so is AI to EK, and, as EG is to FG, so is EK to FK; therefore also, as AI is to EK, so is EK to FK; therefore EK is a mean proportional between AI, FK."
    highlight: [LM, NO]
    hint: |
      *EK* is the mean between *AI*, *FK* ([[VI.1]]).

  - part: proof
    text: "But MN is also a mean proportional between the squares LM, NO, and AI is equal to LM, and FK to NO; therefore EK is also equal to MN."
    highlight: [LM, NO]
    hint: |
      *MN* is the mean between {LM}, {NO} (lemma of [[X.53]]), so *EK* = *MN*.

  - part: proof
    text: "But MN is equal to LO, and EK equal to DH; therefore the whole DK is also equal to the gnomon UVW and NO."
    highlight: [LM, NO]
    hint: |
      *DK* = gnomon + {NO}.

  - part: proof
    text: "But AK is also equal to LM, NO; therefore the remainder AB is equal to ST, that is, to the square on LN; therefore LN is the “side” of the area AB."
    highlight: [LN, AB]
    hint: |
      {LN} is the side of {AB}.

  - part: specification
    text: "I say that LN is a second apotome of a medial straight line."
    highlight: [LN]
    hint: |
      A second apotome of a medial:

  - part: proof
    text: "For, since AI, FK were proved medial, and are equal to the squares on LP, PN, therefore each of the squares on LP, PN is also medial; therefore each of the straight lines LP, PN is medial."
    highlight: [LP, PN]
    hint: |
      sq({LP}), sq({PN}) medial.

  - part: proof
    text: "And, since AI is commensurable with FK, therefore the square on LP is also commensurable with the square on PN."
    highlight: [LP, PN]
    hint: |
      Commensurable with each other.

  - part: proof
    text: "Again, since AI was proved incommensurable with EK, therefore LM is also incommensurable with MN, that is, the square on LP with the rectangle LP, PN; so that LP is also incommensurable in length with PN; therefore LP, PN are medial straight lines commensurable in square only."
    highlight: [LP, PN]
    hint: |
      {LM} incommensurable with *MN*: {LP}, {PN} incommensurable in length.

  - part: specification
    text: "I say next that they also contain a medial rectangle."
    highlight: [LP, PN]
    hint: |
      And their rectangle:

  - part: proof
    text: "For, since EK was proved medial, and is equal to the rectangle LP, PN, therefore the rectangle LP, PN is also medial, so that LP, PN are medial straight lines commensurable in square only which contain a medial rectangle."
    highlight: [LP, PN]
    hint: |
      *EK* medial = rect({LP},{PN}).

  - part: proof
    text: "Therefore LN is a second apotome of a medial straight line; and it is the “side” of the area AB."
    highlight: [LN]
    hint: |
      [[X.75]]; it is the side of {AB}.

  - part: proof
    text: "Therefore the “side” of the area AB is a second apotome of a medial straight line."
    highlight: [LN]
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        Mirror of [[X.56]]. $\blacksquare$
