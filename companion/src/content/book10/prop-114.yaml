steps:
  - part: enunciation
    text: "If an area be contained by an apotome and the binomial straight line the terms of which are commensurable with the terms of the apotome and in the same ratio, the “side” of the area is rational."
    highlight: [CD, G]
    hint: |
      Apotome × matching binomial = rational.

  - part: setting-out
    text: "For let an area, the rectangle AB, CD, be contained by the apotome AB and the binomial straight line CD, and let CE be the greater term of the latter; let the terms CE, ED of the binomial straight line be commensurable with the terms AF, FB of the apotome and in the same ratio; and let the “side” of the rectangle AB, CD be G; I say that G is rational."
    highlight: [CD]
    hint: |
      Setup.

  - part: construction
    text: "For let a rational straight line H be set out, and to CD let there be applied a rectangle equal to the square on H and producing KL as breadth."
    highlight: [H]
    hint: |
      Apply sq({H}) to {CD}: breadth *KL*.

  - part: proof
    text: "Therefore KL is an apotome."
    highlight: [KM]
    hint: |
      *KL* is an apotome ([[X.112]]) …

  - part: proof
    text: "Let its terms be KM, ML commensurable with the terms CE, ED of the binomial straight line and in the same ratio."
    highlight: [KM]
    hint: |
      … with terms {KM}, *ML* proportional to *CE*, *ED*.

  - part: proof
    text: "But CE, ED are also commensurable with AF, FB and in the same ratio; therefore, as AF is to FB, so is KM to ML."
    highlight: [AF, KM]
    hint: |
      So {AF} : *FB* = {KM} : *ML*.

  - part: proof
    text: "Therefore, alternately, as AF is to KM, so is BF to LM; therefore also the remainder AB is to the remainder KL as AF is to KM."
    highlight: [AF, KM]
    hint: |
      Alternately, and by [[V.19]], *AB* : *KL* = {AF} : {KM}.

  - part: proof
    text: "But AF is commensurable with KM; therefore AB is also commensurable with KL."
    highlight: [AF, KM]
    hint: |
      {AF}, {KM} commensurable, so *AB*, *KL* are.

  - part: proof
    text: "And, as AB is to KL, so is the rectangle CD, AB to the rectangle CD, KL; therefore the rectangle CD, AB is also commensurable with the rectangle CD, KL."
    highlight: [CD]
    hint: |
      rect({CD}, *AB*) commensurable with rect({CD}, *KL*) …

  - part: proof
    text: "But the rectangle CD, KL is equal to the square on H; therefore the rectangle CD, AB is commensurable with the square on H."
    highlight: [H]
    hint: |
      … which equals sq({H}).

  - part: proof
    text: "But the square on G is equal to the rectangle CD, AB; therefore the square on G is commensurable with the square on H."
    highlight: [G, H]
    hint: |
      sq({G}) = rect({CD}, *AB*) is commensurable with sq({H}) …

  - part: proof
    text: "But the square on H is rational; therefore the square on G is also rational; therefore G is rational."
    highlight: [G]
    hint: |
      … rational: {G} rational.

  - part: proof
    text: "And it is the “side” of the rectangle CD, AB."
    highlight: [G]
    hint: |
      And {G} is the side.

  - part: conclusion
    text: "Therefore etc."
    highlight: [G]
    hint: |
      The enunciation, now proved.

reconstruction:
  lines:
    - text: |
        $(\sqrt a - \sqrt b)\cdot k(\sqrt a + \sqrt b) = k(a - b)$, rational. $\blacksquare$

commentary: |
  The porism printed after it: a rational area can be contained by irrational lines.
