id: X.114
kind: theorem
title: An apotome times a binomial with proportional terms has a rational side

paraphrase: |
  If an area is contained by an apotome *AB* and a binomial {CD} whose terms are commensurable with the apotome's
  terms and in the same ratio, its side {G} is rational. In algebra: $(\sqrt a - \sqrt b)(\sqrt a + \sqrt b) =
  a - b$.

