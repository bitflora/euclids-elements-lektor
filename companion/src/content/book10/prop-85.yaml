id: X.85
kind: problem
title: To find the first apotome

paraphrase: |
  Construct a first apotome {BC} = {BG} − {GC} ([[X.Def.III.1]]): the whole {BG} commensurable with the rational
  line {A}, and $\sqrt{BG^2 - GC^2}$ commensurable with {BG}. Example: $3 - \sqrt5$.

