steps:
  - part: enunciation
    text: "To find the first apotome."
    highlight: [BC]
    hint: |
      The subtractive twin of [[X.48]].

  - part: construction
    text: "Let a rational straight line A be set out, and let BG be commensurable in length with A; therefore BG is also rational."
    highlight: [A, BG]
    hint: |
      {BG} commensurable in length with the rational {A}.

  - part: construction
    text: "Let two square numbers DE, EF be set out, and let their difference FD not be square; therefore neither has ED to DF the ratio which a square number has to a square number."
    highlight: [DE]
    hint: |
      Square numbers *DE*, *EF* with non-square difference *FD*.

  - part: construction
    text: "Let it be contrived that, as ED is to DF, so is the square on BG to the square on GC; therefore the square on BG is commensurable with the square on GC."
    highlight: [BG, GC]
    hint: |
      sq({BG}) : sq({GC}) = *ED* : *DF*: commensurable squares.

  - part: proof
    text: "But the square on BG is rational; therefore the square on GC is also rational; therefore GC is also rational."
    highlight: [GC]
    hint: |
      {GC} rational.

  - part: proof
    text: "And, since ED has not to DF the ratio which a square number has to a square number, therefore neither has the square on BG to the square on GC the ratio which a square number has to a square number; therefore BG is incommensurable in length with GC."
    highlight: [BG, GC]
    hint: |
      Not square to square: incommensurable in length.

  - part: proof
    text: "And both are rational; therefore BG, GC are rational straight lines commensurable in square only; therefore BC is an apotome."
    highlight: [BC]
    hint: |
      {BC} an apotome ([[X.73]]).

  - part: specification
    text: "I say next that it is also a first apotome."
    highlight: [BC]
    hint: |
      A first apotome:

  - part: construction
    text: "For let the square on H be that by which the square on BG is greater than the square on GC."
    highlight: [BG, GC]
    hint: |
      Let sq(*H*) = sq({BG}) − sq({GC}).

  - part: proof
    text: "Now since, as ED is to FD, so is the square on BG to the square on GC, therefore also, convertendo, as DE is to EF, so is the square on GB to the square on H."
    highlight: [BG]
    hint: |
      Convertendo, sq({BG}) : sq(*H*) = *DE* : *EF*, square to square …

  - part: proof
    text: "But DE has to EF the ratio which a square number has to a square number, for each is square; therefore the square on GB also has to the square on H the ratio which a square number has to a square number; therefore BG is commensurable in length with H."
    highlight: [BG]
    hint: |
      … so *H* is commensurable with {BG}.

  - part: proof
    text: "And the square on BG is greater than the square on GC by the square on a straight line commensurable in length with BG."
    highlight: [BG, GC]
    hint: |
      The excess is commensurable with the whole.

  - part: proof
    text: "And the whole BG is commensurable in length with the rational straight line A set out."
    highlight: [BG, A]
    hint: |
      And {BG} is commensurable with {A}.

  - part: proof
    text: "Therefore BC is a first apotome."
    highlight: [BC]
    hint: |
      First apotome ([[X.Def.III.1]]).

  - part: proof
    text: "Therefore the first apotome BC has been found. (Being) that which it was required to find."
    highlight: [BC]
    hint: |
      Found.

reconstruction:
  lines:
    - text: |
        As [[X.48]] with "−": $BG = \rho$, $GC = \rho\sqrt{1 - k^2}$. $\blacksquare$

commentary: |
  [[X.85]]–[[X.90]] mirror [[X.48]]–[[X.53]] exactly.
