id: X.100
kind: theorem
title: The square on a minor line applied to a rational line gives a fourth apotome

paraphrase: |
  If the square on a minor line {AB} is applied to a rational line {CD}, the breadth {CF} is a fourth apotome. The
  converse of [[X.94]].

diagram:
  width: 370
  height: 180
  elements:
    - "A0;point;free;-1000,40;0;0"
