id: X.96
kind: theorem
title: The side of a rational line times a sixth apotome produces with a medial area a medial whole

paraphrase: |
  If an area {AB} is contained by a rational line {AC} and a sixth apotome {AD}, its side {LN} is "that which produces
  with a medial area a medial whole".

