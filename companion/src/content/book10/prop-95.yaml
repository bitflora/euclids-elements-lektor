steps:
  - part: enunciation
    text: "If an area be contained by a rational straight line and a fifth apotome, the “side” of the area is a straight line which produces with a rational area a medial whole."
    highlight: [AB, LN]
    hint: |
      √(rational × fifth apotome).

  - part: setting-out
    text: "For let the area AB be contained by the rational straight line AC and the fifth apotome AD; I say that the “side” of the area AB is a straight line which produces with a rational area a medial whole."
    highlight: [AB, AC, AD]
    hint: |
      Setup.

  - part: proof
    text: "For let DG be the annex to AD; therefore AG, GD are rational straight lines commensurable in square only, the annex GD is commensurable in length with the rational straight line AC set out, and the square on the whole AG is greater than the square on the annex DG by the square on a straight line incommensurable with AG."
    highlight: [AG, DG]
    hint: |
      Annex {DG}, commensurable with {AC} ([[X.Def.III.5]]).

  - part: proof
    text: "Therefore, if there be applied to AG a parallelogram equal to the fourth part of the square on DG and deficient by a square figure, it will divide it into incommensurable parts."
    highlight: [AG]
    hint: |
      [[X.18]]: incommensurable parts.

  - part: construction
    text: "Let then DG be bisected at the point E, let there be applied to AG a parallelogram equal to the square on EG and deficient by a square figure, and let it be the rectangle AF, FG; therefore AF is incommensurable in length with FG."
    highlight: [AF, FG, EG]
    hint: |
      Bisect and apply.

  - part: proof
    text: "Now, since AG is incommensurable in length with CA, and both are rational, therefore AK is medial."
    highlight: [AG, AC]
    hint: |
      *AK* medial.

  - part: proof
    text: "Again, since DG is rational and commensurable in length with AC, DK is rational."
    highlight: [DG, AC]
    hint: |
      *DK* rational.

  - part: construction
    text: "Now let the square LM be constructed equal to AI, and let the square NO equal to FK and about the same angle, the angle LPM, be subtracted; therefore the squares LM, NO are about the same diameter."
    highlight: [LM, NO]
    hint: |
      Squares {LM}, {NO}.

  - part: construction
    text: "Let PR be their diameter, and let the figure be drawn."
    highlight: [LM, NO]
    hint: |
      Diameter.

  - part: proof
    text: "Similarly then we can prove that LN is the “side” of the area AB."
    highlight: [LN, AB]
    hint: |
      {LN} is the side, as before.

  - part: specification
    text: "I say that LN is the straight line which produces with a rational area a medial whole."
    highlight: [LN]
    hint: |
      Of the named kind:

  - part: proof
    text: "For, since AK was proved medial and is equal to the squares on LP, PN, therefore the sum of the squares on LP, PN is medial."
    highlight: [LP, PN]
    hint: |
      Sum of squares medial.

  - part: proof
    text: "Again, since DK is rational and is equal to twice the rectangle LP, PN, the latter is itself also rational."
    highlight: [LP, PN]
    hint: |
      2·rect rational.

  - part: proof
    text: "And, since AI is incommensurable with FK, therefore the square on LP is also incommensurable with the square on PN; therefore LP, PN are straight lines incommensurable in square which make the sum of the squares on them medial but twice the rectangle contained by them rational."
    highlight: [LP, PN]
    hint: |
      Incommensurable in square.

  - part: proof
    text: "Therefore the remainder LN is the irrational straight line called that which produces with a rational area a medial whole; and it is the “side” of the area AB."
    highlight: [LN]
    hint: |
      [[X.77]].

  - part: proof
    text: "Therefore the “side” of the area AB is a straight line which produces with a rational area a medial whole."
    highlight: [LN, AB]
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        Mirror of [[X.58]]. $\blacksquare$
