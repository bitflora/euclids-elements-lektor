id: X.95
kind: theorem
title: The side of a rational line times a fifth apotome produces with a rational area a medial whole

paraphrase: |
  If an area {AB} is contained by a rational line {AC} and a fifth apotome {AD}, its side {LN} is "that which produces
  with a rational area a medial whole".

