id: X.18
kind: theorem
title: When the roots of the quadratic are incommensurable

paraphrase: |
  The counterpart of [[X.17]]: the segments {BD}, {DC} are incommensurable exactly when $\sqrt{BC^2 - A^2}$ is
  incommensurable with {BC}. A bracketed lemma follows on the terminology of rational lines.

diagram:
  width: 270
  height: 190
  elements:
    - "A0;point;free;-1000,40;0;0"
