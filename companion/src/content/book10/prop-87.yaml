id: X.87
kind: problem
title: To find the third apotome

paraphrase: |
  Construct a third apotome {FH} = *FG* − *GH* ([[X.Def.III.3]]): neither term commensurable with the rational
  line {A}, the excess commensurable with the whole. Example: $\sqrt8 - \sqrt6$.

