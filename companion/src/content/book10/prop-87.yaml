steps:
  - part: enunciation
    text: "To find the third apotome."
    highlight: [FH]
    hint: |
      Mirror of [[X.50]].

  - part: construction
    text: "Let a rational straight line A be set out, let three numbers E, BC, CD be set out which have not to one another the ratio which a square number has to a square number, but let CB have to BD the ratio which a square number has to a square number."
    highlight: [A, E, BC]
    hint: |
      Numbers {E}, {BC}, *CD*, no two in a square ratio, with *BC* : *BD* square to square.

  - part: construction
    text: "Let it be contrived that, as E is to BC, so is the square on A to the square on FG, and, as BC is to CD, so is the square on FG to the square on GH."
    highlight: [A]
    hint: |
      sq({A}) : sq(*FG*) = {E} : {BC}; sq(*FG*) : sq(*GH*) = {BC} : *CD*.

  - part: proof
    text: "Since then, as E is to BC, so is the square on A to the square on FG, therefore the square on A is commensurable with the square on FG."
    highlight: [A]
    hint: |
      sq(*FG*) commensurable with sq({A}) …

  - part: proof
    text: "But the square on A is rational; therefore the square on FG is also rational; therefore FG is rational."
    highlight: [A]
    hint: |
      … *FG* rational.

  - part: proof
    text: "And, since E has not to BC the ratio which a square number has to a square number, therefore neither has the square on A to the square on FG the ratio which a square number has to a square number; therefore A is incommensurable in length with FG."
    highlight: [A]
    hint: |
      *FG* incommensurable in length with {A}.

  - part: proof
    text: "Again, since, as BC is to CD, so is the square on FG to the square on GH, therefore the square on FG is commensurable with the square on GH."
    highlight: [FH]
    hint: |
      sq(*GH*) commensurable with sq(*FG*) …

  - part: proof
    text: "But the square on FG is rational; therefore the square on GH is also rational; therefore GH is rational."
    highlight: [FH]
    hint: |
      … *GH* rational.

  - part: proof
    text: "And, since BC has not to CD the ratio which a square number has to a square number, therefore neither has the square on FG to the square on GH the ratio which a square number has to a square number; therefore FG is incommensurable in length with GH."
    highlight: [FH]
    hint: |
      *FG*, *GH* incommensurable in length.

  - part: proof
    text: "And both are rational; therefore FG, GH are rational straight lines commensurable in square only; therefore FH is an apotome."
    highlight: [FH]
    hint: |
      {FH} an apotome.

  - part: specification
    text: "I say next that it is also a third apotome."
    highlight: [FH]
    hint: |
      A third apotome:

  - part: proof
    text: "For since, as E is to BC, so is the square on A to the square on FG, and, as BC is to CD, so is the square on FG to the square on HG, therefore, ex aequali, as E is to CD, so is the square on A to the square on HG."
    highlight: [A]
    hint: |
      Ex aequali sq({A}) : sq(*GH*) = {E} : *CD* …

  - part: proof
    text: "But E has not to CD the ratio which a square number has to a square number; therefore neither has the square on A to the square on GH the ratio which a square number has to a square number; therefore A is incommensurable in length with GH."
    highlight: [A]
    hint: |
      … so *GH* is incommensurable with {A}.

  - part: proof
    text: "Therefore neither of the straight lines FG, GH is commensurable in length with the rational straight line A set out."
    highlight: [A]
    hint: |
      Neither term commensurable with {A}.

  - part: construction
    text: "Now let the square on K be that by which the square on FG is greater than the square on GH."
    highlight: [FH]
    hint: |
      Let sq(*K*) = sq(*FG*) − sq(*GH*).

  - part: proof
    text: "Since then, as BC is to CD, so is the square on FG to the square on GH, therefore, convertendo, as BC is to BD, so is the square on FG to the square on K."
    highlight: [FH]
    hint: |
      Convertendo: sq(*FG*) : sq(*K*) = {BC} : *BD* …

  - part: proof
    text: "But BC has to BD the ratio which a square number has to a square number; therefore the square on FG also has to the square on K the ratio which a square number has to a square number."
    highlight: [FH]
    hint: |
      … square to square …

  - part: proof
    text: "Therefore FG is commensurable in length with K, and the square on FG is greater than the square on GH by the square on a straight line commensurable with FG."
    highlight: [FH]
    hint: |
      … so the excess is commensurable with *FG*.

  - part: proof
    text: "And neither of the straight lines FG, GH is commensurable in length with the rational straight line A set out; therefore FH is a third apotome."
    highlight: [FH]
    hint: |
      Third apotome.

  - part: proof
    text: "Therefore the third apotome FH has been found."
    highlight: [FH]
    hint: |
      Found.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        As [[X.50]] with "−". $\blacksquare$
