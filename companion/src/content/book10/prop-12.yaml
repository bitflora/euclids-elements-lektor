steps:
  - part: enunciation
    text: "Magnitudes commensurable with the same magnitude are commensurable with one another also."
    highlight: [A, B, C]
    hint: |
      Commensurability is transitive.
    modern: |
      $a/c,\ c/b \in \mathbb{Q} \Rightarrow a/b \in \mathbb{Q}$.

  - part: setting-out
    text: "For let each of the magnitudes A, B be commensurable with C;"
    highlight: [A, B, C]
    hint: |
      {A}, {B} each commensurable with {C}.

  - part: specification
    text: "I say that A is also commensurable with B."
    highlight: [A, B]
    hint: |
      To prove.

  - part: proof
    text: "For, since A is commensurable with C, therefore A has to C the ratio which a number has to a number."
    highlight: [A, C]
    hint: |
      [[X.5]].

  - part: construction
    text: "Let it have the ratio which D has to E."
    highlight: [D, E]
    hint: |
      {A} : {C} = {D} : {E}.

  - part: proof
    text: "Again, since C is commensurable with B, therefore C has to B the ratio which a number has to a number."
    highlight: [C, B]
    hint: |
      [[X.5]] again.

  - part: construction
    text: "Let it have the ratio which F has to G."
    highlight: [F, G]
    hint: |
      {C} : {B} = {F} : {G}.

  - part: construction
    text: "And, given any number of ratios we please, namely the ratio which D has to E and that which F has to G, let the numbers H, K, L be taken continuously in the given ratios; so that, as D is to E, so is H to K, and, as F is to G, so is K to L."
    highlight: [H, K, L]
    hint: |
      Numbers {H}, {K}, {L} with {H} : {K} = {D} : {E} and {K} : {L} = {F} : {G} (cf. [[VIII.4]]).

  - part: proof
    text: "Since, then, as A is to C, so is D to E, while, as D is to E, so is H to K, therefore also, as A is to C, so is H to K."
    highlight: [A, C, H, K]
    hint: |
      {A} : {C} = {H} : {K}.

  - part: proof
    text: "Again, since, as C is to B, so is F to G, while, as F is to G, so is K to L, therefore also, as C is to B, so is K to L."
    highlight: [C, B, K, L]
    hint: |
      {C} : {B} = {K} : {L}.

  - part: proof
    text: "But also, as A is to C, so is H to K; therefore, ex aequali, as A is to B, so is H to L."
    highlight: [A, B, H, L]
    hint: |
      Ex aequali: {A} : {B} = {H} : {L}.

  - part: proof
    text: "Therefore A has to B the ratio which a number has to a number; therefore A is commensurable with B."
    highlight: [A, B]
    hint: |
      A ratio of numbers, so commensurable ([[X.6]]).

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - steps: [3, 4, 5, 6, 7, 8, 9, 10, 11]
      text: |
        $a/b = (a/c)(c/b) \in \mathbb{Q}$. $\blacksquare$

commentary: |
  Euclid cannot multiply ratios, so he chains them with [[VIII.4]] and ex aequali. Used throughout Book X and
  in [[XIII.11]].
