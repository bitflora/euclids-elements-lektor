id: X.112
kind: theorem
title: "Rationalising: a rational square divided by a binomial is an apotome"

paraphrase: |
  The square on a rational line {A}, applied to a binomial {BC}, gives as breadth an apotome *EF* whose terms are
  commensurable with the binomial's terms, in the same ratio and of the same order. In algebra:
  $\dfrac{\rho^2}{\sqrt a + \sqrt b} = \rho^2\dfrac{\sqrt a - \sqrt b}{a - b}$.

