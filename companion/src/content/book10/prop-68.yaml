id: X.68
kind: theorem
title: A line commensurable with a major line is major

paraphrase: |
  A line {CD} commensurable (in length) with a major {AB} is itself a major.

diagram:
  width: 250
  height: 95
  elements:
    - "A0;point;free;-1000,30;0;0"
    - "A3;point;free;1000,30;0;0"
    - "C0;point;free;-1000,65;0;0"
    - "C3;point;free;1000,65;0;0"
    - "A;point;lineSlider;A0,A3,60,0"
    - "B;point;lineSlider;A0,A3,180,0"
    - "AB;line;connect;A,B"
    - "C;point;lineSlider;C0,C3,30,0"
    - "D;point;lineSlider;C0,C3,210,0"
    - "CD;line;connect;C,D"
    - "E;point;lineSlider;A0,A3,130,0"
    - "F;point;proportion;A,B,C,D,A,E,C,C3"
    - "AE;line;connect;A,E;0;0;0"
    - "EB;line;connect;E,B;0;0;0"
    - "CF;line;connect;C,F;0;0;0"
    - "FD;line;connect;F,D;0;0;0"
    - "BE;line;connect;B,E;0;0;0"
    - "DF;line;connect;D,F;0;0;0"
  aliases: { BA: AB, DC: CD, EA: AE, FC: CF }
  caption: |
    {AB} divided at {E}; {CD} commensurable with {AB}, divided at {F} in the same ratio.

steps:
  - part: enunciation
    text: "A straight line commensurable with a major straight line is itself also major."
    highlight: [AB, CD]
    hint: |
      The kinds of irrational are closed under rational scaling.
    modern: |
      $CD = r\,AB$ with $r \in \mathbb Q$ $\Rightarrow$ $CD$ is of the same kind.

  - part: setting-out
    text: "Let AB be major, and let CD be commensurable with AB; I say that CD is major."
    highlight: [AB, CD]
    hint: |
      {CD} commensurable with {AB}.

  - part: proof
    text: "Let AB be divided at E; therefore AE, EB are straight lines incommensurable in square which make the sum of the squares on them rational, but the rectangle contained by them medial."
    highlight: [AE, EB]
    hint: |
      The parts of {AB}.

  - part: construction
    text: "Let the same construction be made as before."
    highlight: [CF, FD]
    hint: |
      Divide {CD} proportionally.

  - part: proof
    text: "Then since, as AB is to CD, so is AE to CF, and EB to FD, therefore also, as AE is to CF, so is EB to FD."
    highlight: [AE, CF, EB, FD]
    hint: |
      {AE} : {CF} = {EB} : {FD}.

  - part: proof
    text: "But AB is commensurable with CD; therefore AE, EB are also commensurable with CF, FD respectively."
    highlight: [AE, CF, EB, FD]
    hint: |
      Corresponding parts commensurable.

  - part: proof
    text: "And since, as AE is to CF, so is EB to FD, alternately also, as AE is to EB, so is CF to FD; therefore also, componendo, as AB is to BE, so is CD to DF; therefore also, as the square on AB is to the square on BE, so is the square on CD to the square on DF."
    highlight: [AB, CD]
    hint: |
      Componendo and squaring: sq({AB}) : sq({BE}) = sq({CD}) : sq({DF}).

  - part: proof
    text: "Similarly we can prove that, as the square on AB is to the square on AE, so also is the square on CD to the square on CF."
    highlight: [AB, CD]
    hint: |
      Likewise for {AE}, {CF}.

  - part: proof
    text: "Therefore also, as the square on AB is to the squares on AE, EB, so is the square on CD to the squares on CF, FD; therefore also, alternately, as the square on AB is to the square on CD, so are the squares on AE, EB to the squares on CF, FD."
    highlight: [AB, CD]
    hint: |
      So sq({AB}) : sq({CD}) = (sum of squares on {AE}, {EB}) : (sum on {CF}, {FD}).

  - part: proof
    text: "But the square on AB is commensurable with the square on CD; therefore the squares on AE, EB are also commensurable with the squares on CF, FD."
    highlight: [AE, EB, CF, FD]
    hint: |
      Those sums are commensurable …

  - part: proof
    text: "And the squares on AE, EB together are rational; therefore the squares on CF, FD together are rational."
    highlight: [CF, FD]
    hint: |
      … so the sum on {CF}, {FD} is rational.

  - part: proof
    text: "Similarly also twice the rectangle AE, EB is commensurable with twice the rectangle CF, FD."
    highlight: [CF, FD]
    hint: |
      Likewise the doubled rectangles are commensurable …

  - part: proof
    text: "And twice the rectangle AE, EB is medial; therefore twice the rectangle CF, FD is also medial."
    highlight: [CF, FD]
    hint: |
      … so 2·rect({CF},{FD}) is medial.

  - part: proof
    text: "Therefore CF, FD are straight lines incommensurable in square which make, at the same time, the sum of the squares on them rational, but the rectangle contained by them medial; therefore the whole CD is the irrational straight line called major."
    highlight: [CD]
    hint: |
      So {CD} is major ([[X.39]]).

  - part: proof
    text: "Therefore a straight line commensurable with the major straight line is major."
    highlight: [CD]
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        Scaling by a rational $r$ multiplies the terms by $r$ and their squares and rectangle by $r^2$, preserving
        every property in the definition. $\blacksquare$
