id: X.60
kind: theorem
title: The square on a binomial applied to a rational line gives a first binomial

paraphrase: |
  If the square on a binomial {AB} is applied to a rational line {DE}, the breadth {DG} is a first
  binomial. The converse of [[X.54]].

