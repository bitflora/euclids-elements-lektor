  caption: |
    sq({AB}) is applied to the rational line {DE} as {DF}, with breadth {DG}; {DH} = sq({AC}), {KL} =
    sq({CB}); the rest, *MF*, is 2·rect({AC},{CB}), bisected at {N}.

steps:
  - part: enunciation
    text: "The square on the binomial straight line applied to a rational straight line produces as breadth the first binomial."
    highlight: [AB, DG]
    hint: |
      Squaring undoes [[X.54]]: a binomial squared and divided by a rational line is a first binomial.

  - part: proof
    text: "Let AB be a binomial straight line divided into its terms at C, so that AC is the greater term; let a rational straight line DE be set out, and let DEFG equal to the square on AB be applied to DE producing DG as its breadth; I say that DG is a first binomial straight line."
    highlight: [AB, DE, DF, DG]
    hint: |
      Setup.

  - part: construction
    text: "For let there be applied to DE the rectangle DH equal to the square on AC, and KL equal to the square on BC; therefore the remainder, twice the rectangle AC, CB, is equal to MF."
    highlight: [DH, KL]
    hint: |
      Apply sq({AC}) as {DH} and sq({CB}) as {KL}; the remainder *MF* = 2·rect.

  - part: construction
    text: "Let MG be bisected at N, and let NO be drawn parallel [to ML or GF]."
    highlight: [MG, N]
    hint: |
      Bisect {MG} at {N}; draw {NO}.

  - part: proof
    text: "Therefore each of the rectangles MO, NF is equal to once the rectangle AC, CB."
    highlight: [MG]
    hint: |
      *MO* = *NF* = rect({AC},{CB}).

  - part: proof
    text: "Now, since AB is a binomial divided into its terms at C, therefore AC, CB are rational straight lines commensurable in square only; therefore the squares on AC, CB are rational and commensurable with one another, so that the sum of the squares on AC, CB is also rational."
    highlight: [AC, CB]
    hint: |
      {AC}, {CB} rational, commensurable in square only ([[X.36]]): the sum of squares is rational …

  - part: proof
    text: "And it is equal to DL; therefore DL is rational."
    highlight: [DH, KL]
    hint: |
      … and equals *DL*.

  - part: proof
    text: "And it is applied to the rational straight line DE; therefore DM is rational and commensurable in length with DE."
    highlight: [DM]
    hint: |
      So {DM} is rational and commensurable in length with {DE} ([[X.20]]).

  - part: proof
    text: "Again, since AC, CB are rational straight lines commensurable in square only, therefore twice the rectangle AC, CB, that is MF, is medial."
    highlight: [MG]
    hint: |
      2·rect is medial ([[X.21]]) …

  - part: proof
    text: "And it is applied to the rational straight line ML; therefore MG is also rational and incommensurable in length with ML, that is, DE."
    highlight: [MG]
    hint: |
      … so {MG} is rational, incommensurable in length with {DE} ([[X.22]]).

  - part: proof
    text: "But MD is also rational and is commensurable in length with DE; therefore DM is incommensurable in length with MG."
    highlight: [DM, MG]
    hint: |
      Hence {DM}, {MG} incommensurable in length ([[X.13]]) …

  - part: proof
    text: "And they are rational; therefore DM, MG are rational straight lines commensurable in square only; therefore DG is binomial."
    highlight: [DG]
    hint: |
      … and {DG} is a binomial ([[X.36]]).

  - part: specification
    text: "It is next to be proved that it is also a first binomial straight line."
    highlight: [DG]
    hint: |
      A first binomial:

  - part: proof
    text: "Since the rectangle AC, CB is a mean proportional between the squares on AC, CB, therefore MO is also a mean proportional between DH, KL."
    highlight: [DH, KL]
    hint: |
      rect({AC},{CB}) is the mean between the squares (lemma of [[X.53]]), so *MO* is the mean between {DH},
      {KL} …

  - part: proof
    text: "Therefore, as DH is to MO, so is MO to KL, that is, as DK is to MN, so is MN to MK; therefore the rectangle DK, KM is equal to the square on MN."
    highlight: [DK, KM, MN]
    hint: |
      … whence rect({DK},{KM}) = sq({MN}) ([[VI.1]], [[VI.17]]).

  - part: proof
    text: "And, since the square on AC is commensurable with the square on CB, DH is also commensurable with KL, so that DK is also commensurable with KM."
    highlight: [DK, KM]
    hint: |
      Squares commensurable, so {DK}, {KM} commensurable.

  - part: proof
    text: "And, since the squares on AC, CB are greater than twice the rectangle AC, CB, therefore DL is also greater than MF, so that DM is also greater than MG."
    highlight: [DM, MG]
    hint: |
      Sum of squares > 2·rect (lemma of [[X.59]]), so {DM} > {MG}.

  - part: proof
    text: "And the rectangle DK, KM is equal to the square on MN, that is, to the fourth part of the square on MG, and DK is commensurable with KM."
    highlight: [DK, KM, MN]
    hint: |
      So rect({DK},{KM}) = ¼ sq({MG}) with {DK}, {KM} commensurable …

  - part: proof
    text: "But, if there be two unequal straight lines, and to the greater there be applied a parallelogram equal to the fourth part of the square on the less and deficient by a square figure, and if it divide it into commensurable parts, the square on the greater is greater than the square on the less by the square on a straight line commensurable with the greater; therefore the square on DM is greater than the square on MG by the square on a straight line commensurable with DM."
    highlight: [DM, MG]
    hint: |
      … hence the excess is commensurable with {DM} ([[X.17]]).

  - part: proof
    text: "And DM, MG are rational, and DM, which is the greater term, is commensurable in length with the rational straight line DE set out."
    highlight: [DM, DE]
    hint: |
      And the greater term {DM} is commensurable with {DE}.

  - part: proof
    text: "Therefore DG is a first binomial straight line."
    highlight: [DG]
    hint: |
      First binomial ([[X.Def.II.1]]).

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        $AB^2 = (AC^2 + CB^2) + 2AC\cdot CB$; divided by $\rho$, the two parts give the terms {DM}, {MG} of
        a binomial, whose kind is read off from which part is rational and from [[X.17]]/[[X.18]].
        $\blacksquare$

commentary: |
  [[X.60]]–[[X.65]] are the converses of [[X.54]]–[[X.59]]: together they set up a one-to-one
  correspondence between the six binomials and the six additive irrationals. They are used in [[X.66]]–[[X.72]]
  and in [[X.111]].
