steps:
  - part: enunciation
    text: "To a straight line which produces with a medial area a medial whole only one straight line can be annexed which is incommensurable in square with the whole straight line and which with the whole straight line makes the sum of the squares on them medial and twice the rectangle contained by them both medial and also incommensurable with the sum of the squares on them."
    highlight: [AB]
    hint: |
      Uniqueness, reduced to [[X.79]].

  - part: setting-out
    text: "Let AB be the straight line which produces with a medial area a medial whole, and BC an annex to it; therefore AC, CB are straight lines incommensurable in square which fulfil the aforesaid conditions."
    highlight: [AB, BC, AC]
    hint: |
      {AB}, annex {BC}.

  - part: specification
    text: "I say that no other straight line can be annexed to AB which fulfils the aforesaid conditions."
    highlight: [AB]
    hint: |
      To prove: unique.

  - part: proof
    text: "For, if possible, let BD be so annexed, so that AD, DB are also straight lines incommensurable in square which make the squares on AD, DB added together medial, twice the rectangle AD, DB medial, and also the squares on AD, DB incommensurable with twice the rectangle AD, DB."
    highlight: [BD, AD]
    hint: |
      Suppose another annex {BD}.

  - part: construction
    text: "Let a rational straight line EF be set out, let EG equal to the squares on AC, CB be applied to EF, producing EM as breadth, and let HG equal to twice the rectangle AC, CB be applied to EF, producing HM as breadth; therefore the remainder, the square on AB, is equal to EL; therefore AB is the “side” of EL."
    highlight: [EM, HM]
    hint: |
      Apply to the rational {EF}, as in [[X.81]].

  - part: construction
    text: "Again, let EI equal to the squares on AD, DB be applied to EF, producing EN as breadth."
    highlight: [EN]
    hint: |
      Likewise for {AD}, {DB}.

  - part: proof
    text: "But the square on AB is also equal to EL; therefore the remainder, twice the rectangle AD, DB, is equal to HI."
    highlight: [HN]
    hint: |
      The remainders.

  - part: proof
    text: "Now, since the sum of the squares on AC, CB is medial and is equal to EG, therefore EG is also medial."
    highlight: [EM]
    hint: |
      Squares medial …

  - part: proof
    text: "And it is applied to the rational straight line EF, producing EM as breadth; therefore EM is rational and incommensurable in length with EF."
    highlight: [EM]
    hint: |
      … {EM} rational, incommensurable with {EF}.

  - part: proof
    text: "Again, since twice the rectangle AC, CB is medial and is equal to HG, therefore HG is also medial."
    highlight: [HM]
    hint: |
      2·rect medial …

  - part: proof
    text: "And it is applied to the rational straight line EF, producing HM as breadth; therefore HM is rational and incommensurable in length with EF."
    highlight: [HM]
    hint: |
      … {HM} likewise.

  - part: proof
    text: "And, since the squares on AC, CB are incommensurable with twice the rectangle AC, CB, EG is also incommensurable with HG; therefore EM is also incommensurable in length with MH."
    highlight: [EM, HM]
    hint: |
      Incommensurable with each other.

  - part: proof
    text: "And both are rational; therefore EM, MH are rational straight lines commensurable in square only; therefore EH is an apotome, and HM an annex to it."
    highlight: [EH, HM]
    hint: |
      {EH} an apotome, annex {HM}.

  - part: proof
    text: "Similarly we can prove that EH is again an apotome and HN an annex to it."
    highlight: [HN]
    hint: |
      Likewise annex {HN} …

  - part: proof
    text: "Therefore to an apotome different rational straight lines are annexed which are commensurable with the wholes in square only: which was proved impossible."
    highlight: [EH]
    hint: |
      … two annexes: contradicting [[X.79]].

  - part: proof
    text: "Therefore no other straight line can be so annexed to AB."
    highlight: [AB]
    hint: |
      So no other.

  - part: proof
    text: "Therefore to AB only one straight line can be annexed which is incommensurable in square with the whole and which with the whole makes the squares on them added together medial, twice the rectangle contained by them medial, and also the squares on them incommensurable with twice the rectangle contained by them."
    highlight: [AB]
    hint: |
      Only one.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        Applying to $\rho$ turns the two annexes into two annexes of one apotome, contradicting [[X.79]].
        $\blacksquare$
