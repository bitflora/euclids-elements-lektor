id: X.50
kind: problem
title: To find the third binomial

paraphrase: |
  Construct a third binomial {FH} = {FG} + {GH} ([[X.Def.II.3]]): $\sqrt{FG^2 - GH^2}$ commensurable with
  {FG}, but neither term commensurable in length with the rational line {E}.

diagram:
  width: 360
  height: 130
  elements:
    - "K0;point;free;-1000,30;0;0"
    - "K3;point;free;1000,30;0;0"
    - "E0;point;free;-1000,65;0;0"
    - "E3;point;free;1000,65;0;0"
    - "F0;point;free;-1000,100;0;0"
    - "F3;point;free;1000,100;0;0"
