id: X.4
kind: problem
title: The greatest common measure of three commensurable magnitudes

paraphrase: |
  Given three commensurable magnitudes {A}, {B}, {C}, find their greatest common measure: first that of {A},
  {B}, then that of the result and {C}. As [[VII.3]] for numbers.

diagram:
  width: 280
  height: 165
  elements:
    - "A0;point;free;-1000,30;0;0"
