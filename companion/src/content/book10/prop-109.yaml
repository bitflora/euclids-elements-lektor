id: X.109
kind: theorem
title: "Medial minus rational: the side is a first apotome of a medial or produces with a rational area a medial whole"

paraphrase: |
  If a rational area {BD} is subtracted from a medial area {BC}, the side of the remainder is a first apotome of a
  medial or the line that produces with a rational area a medial whole.

