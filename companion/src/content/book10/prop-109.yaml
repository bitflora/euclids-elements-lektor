steps:
  - part: enunciation
    text: "If from a medial area a rational area be subtracted, there arise two other irrational straight lines, either a first apotome of a medial straight line or a straight line which produces with a rational area a medial whole."
    highlight: [BC, BD]
    hint: |
      √(medial − rational).

  - part: setting-out
    text: "For from the medial area BC let the rational area BD be subtracted."
    highlight: [BC, BD]
    hint: |
      Setup.

  - part: specification
    text: "I say that the “side” of the remainder EC becomes one of two irrational straight lines, either a first apotome of a medial straight line or a straight line which produces with a rational area a medial whole."
    highlight: [BC]
    hint: |
      To prove.

  - part: construction
    text: "For let a rational straight line FG be set out, and let the areas be similarly applied."
    highlight: [GH, GK]
    hint: |
      Apply to a rational line {FG}.

  - part: proof
    text: "It follows then that FH is rational and incommensurable in length with FG, while KF is rational and commensurable in length with FG; therefore FH, FK are rational straight lines commensurable in square only; therefore KH is an apotome, and FK the annex to it."
    highlight: [FH, FK, KH]
    hint: |
      {FH} incommensurable with {FG}, {KF} commensurable: {KH} an apotome.

  - part: proof
    text: "Now the square on HF is greater than the square on FK either by the square on a straight line commensurable with HF or by the square on a straight line incommensurable with it."
    highlight: [FH, FK]
    hint: |
      Two cases.

  - part: proof
    text: "If then the square on HF is greater than the square on FK by the square on a straight line commensurable with HF, while the annex FK is commensurable in length with the rational straight line FG set out, KH is a second apotome."
    highlight: [KH]
    hint: |
      Commensurable excess, annex commensurable with {FG}: a second apotome …

  - part: proof
    text: "But FG is rational; so that the “side” of LH, that is, of EC, is a first apotome of a medial straight line."
    highlight: [KH]
    hint: |
      … side: first apotome of a medial ([[X.92]]).

  - part: proof
    text: "But, if the square on HF is greater than the square on FK by the square on a straight line incommensurable with HF, while the annex FK is commensurable in length with the rational straight line FG set out, KH is a fifth apotome; so that the “side” of EC is a straight line which produces with a rational area a medial whole."
    highlight: [KH]
    hint: |
      Incommensurable excess: a fifth apotome; side: produces with a rational area a medial whole ([[X.95]]).

reconstruction:
  lines:
    - text: |
        A second or fifth apotome: [[X.92]], [[X.95]]. $\blacksquare$
