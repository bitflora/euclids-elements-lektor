id: X.6
kind: theorem
title: Magnitudes in the ratio of numbers are commensurable

paraphrase: |
  If {A} : {B} = {D} : {E} for numbers {D}, {E}, then {A} and {B} are commensurable. The converse of [[X.5]];
  with a porism on constructing figures in a given numerical ratio.

