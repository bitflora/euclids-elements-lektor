id: X.102
kind: theorem
title: The square on the line that produces with a medial area a medial whole applied to a rational line gives a sixth apotome

paraphrase: |
  If the square on the line that produces with a medial area a medial whole {AB} is applied to a rational line {CD}, the breadth {CF} is a sixth apotome. The
  converse of [[X.96]].

diagram:
  width: 370
  height: 180
  elements:
    - "A0;point;free;-1000,40;0;0"
