id: X.108
kind: theorem
title: "Rational minus medial: the side is an apotome or a minor"

paraphrase: |
  If a medial area {BD} is subtracted from a rational area {BC}, the side of the remainder is an apotome or a minor
  line. The subtractive counterpart of [[X.71]].

