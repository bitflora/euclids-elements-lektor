id: X.98
kind: theorem
title: The square on a first apotome of a medial applied to a rational line gives a second apotome

paraphrase: |
  If the square on a first apotome of a medial {AB} is applied to a rational line {CD}, the breadth {CF} is a second apotome. The
  converse of [[X.92]].

