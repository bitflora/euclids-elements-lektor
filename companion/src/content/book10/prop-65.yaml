  caption: |
    sq({AB}) is applied to the rational line {DE} as {DF}, with breadth {DG}; {DH} = sq({AC}), {KL} =
    sq({CB}); the rest, *MF*, is 2·rect({AC},{CB}), bisected at {N}.

steps:
  - part: enunciation
    text: "The square on the side of the sum of two medial areas applied to a rational straight line produces as breadth the sixth binomial."
    highlight: [AB, DG]
    hint: |
      Squaring undoes [[X.59]]: a side of the sum of two medial areas squared and divided by a rational line is a sixth binomial.

  - part: proof
    text: "Let AB be the side of the sum of two medial areas, divided at C, let DE be a rational straight line, and let there be applied to DE the parallelogram DF equal to the square on AB, producing DG as its breadth; I say that DG is a sixth binomial straight line."
    highlight: [AB, DE, DF, DG]
    hint: |
      Setup.

  - part: construction
    text: "For let the same construction be made as before."
    highlight: [DH, KL]
    hint: |
      The construction of [[X.60]].

  - part: proof
    text: "Then, since AB is the side of the sum of two medial areas, divided at C, therefore AC, CB are straight lines incommensurable in square which make the sum of the squares on them medial, the rectangle contained by them medial, and moreover the sum of the squares on them incommensurable with the rectangle contained by them, so that, in accordance with what was before proved, each of the rectangles DL, MF is medial."
    highlight: [AC, CB]
    hint: |
      Both the sum of squares and 2·rect medial, incommensurable with each other.

  - part: proof
    text: "And they are applied to the rational straight line DE; therefore each of the straight lines DM, MG is rational and incommensurable in length with DE."
    highlight: [DM, MG]
    hint: |
      So {DM}, {MG} rational, incommensurable with {DE}.

  - part: proof
    text: "And, since the sum of the squares on AC, CB is incommensurable with twice the rectangle AC, CB, therefore DL is incommensurable with MF."
    highlight: [DM, MG]
    hint: |
      *DL* incommensurable with *MF* …

  - part: proof
    text: "Therefore DM is also incommensurable with MG; therefore DM, MG are rational straight lines commensurable in square only; therefore DG is binomial."
    highlight: [DG]
    hint: |
      … so {DM}, {MG} incommensurable: {DG} binomial.

  - part: specification
    text: "I say next that it is also a sixth binomial straight line."
    highlight: [DG]
    hint: |
      A sixth binomial:

  - part: proof
    text: "Similarly again we can prove that the rectangle DK, KM is equal to the square on MN, and that DK is incommensurable in length with KM; and, for the same reason, the square on DM is greater than the square on MG by the square on a straight line incommensurable in length with DM."
    highlight: [DK, KM, DM]
    hint: |
      {DK}, {KM} incommensurable: the excess is incommensurable with {DM}.

  - part: proof
    text: "And neither of the straight lines DM, MG is commensurable in length with the rational straight line DE set out."
    highlight: [DM, MG, DE]
    hint: |
      Neither term commensurable with {DE}.

  - part: proof
    text: "Therefore DG is a sixth binomial straight line."
    highlight: [DG]
    hint: |
      Sixth binomial ([[X.Def.II.6]]).

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        $AB^2 = (AC^2 + CB^2) + 2AC\cdot CB$; divided by $\rho$, the two parts give the terms {DM}, {MG} of
        a binomial, whose kind is read off from which part is rational and from [[X.17]]/[[X.18]].
        $\blacksquare$
