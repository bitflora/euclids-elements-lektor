id: X.65
kind: theorem
title: The square on the side of the sum of two medial areas applied to a rational line gives a sixth binomial

paraphrase: |
  If the square on a side of the sum of two medial areas {AB} is applied to a rational line {DE}, the breadth {DG} is a sixth
  binomial. The converse of [[X.59]].

