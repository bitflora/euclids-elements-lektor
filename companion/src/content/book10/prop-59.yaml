id: X.59
kind: theorem
title: The side of a rational line times a sixth binomial is the side of the sum of two medial areas

paraphrase: |
  If an area {AC} is contained by a rational line {AB} and a sixth binomial {AD}, its side {MO} is "the side of
  the sum of two medial areas". A bracketed lemma follows.

