id: X.41
kind: theorem
title: The side of the sum of two medial areas

paraphrase: |
  The sum of two lines incommensurable in square whose squares add to a medial area and whose rectangle is
  medial and incommensurable with that sum is irrational: "the side of the sum of two medial areas". A lemma
  follows, preparing the uniqueness theorems [[X.42]]–[[X.47]].

