id: X.9
kind: theorem
title: Lines are commensurable in length exactly when their squares are as square numbers

paraphrase: |
  Two straight lines {A}, {B} are commensurable in length if and only if the squares on them are in the
  ratio of a square number to a square number.

diagram:
  width: 240
  height: 90
  elements:
    - "A0;point;free;-1000,30;0;0"
    - "A3;point;free;1000,30;0;0"
    - "C0;point;free;-1000,65;0;0"
    - "C3;point;free;1000,65;0;0"
    - "U1;point;free;1000,0;0;0"
    - "U2;point;free;1000,10;0;0"
    - "A1;point;lineSlider;A0,A3,30,0;0"
    - "A2;point;lineSlider;A0,A3,120,0;0"
    - "A;line;connect;A1,A2;black"
    - "B1;point;lineSlider;A0,A3,150,0;0"
    - "B2;point;lineSlider;A0,A3,200,0;0"
    - "B;line;connect;B1,B2;black"
    - "C1;point;lineSlider;C0,C3,30,0;0"
    - "C2;point;lineSlider;C0,C3,80,0;0"
    - "C;line;connect;C1,C2;black;0;blue"
    - "D1;point;lineSlider;C0,C3,150,0;0"
    - "D2;point;proportion;A1,A2,B1,B2,C1,C2,D1,C3;0"
    - "D;line;connect;D1,D2;black;0;blue"
  caption: |
    {A} : {B} = {C} : {D} with {C}, {D} numbers.

steps:
  - part: enunciation
    text: "The squares on straight lines commensurable in length have to one another the ratio which a square number has to a square number; and squares which have to one another the ratio which a square number has to a square number will also have their sides commensurable in length. But the squares on straight lines incommensurable in length have not to one another the ratio which a square number has to a square number; and squares which have not to one another the ratio which a square number has to a square number will not have their sides commensurable in length either."
    highlight: [A, B]
    hint: |
      $a, b$ commensurable in length $\iff$ $a^2 : b^2 = m^2 : n^2$.
    modern: |
      $a/b \in \mathbb{Q} \iff a^2/b^2$ is the square of a rational.

  - part: setting-out
    text: "For let A, B be commensurable in length;"
    highlight: [A, B]
    hint: |
      First direction.

  - part: specification
    text: "I say that the square on A has to the square on B the ratio which a square number has to a square number."
    highlight: [A, B]
    hint: |
      To prove.

  - part: proof
    text: "For, since A is commensurable in length with B, therefore A has to B the ratio which a number has to a number."
    highlight: [A, B]
    hint: |
      Their ratio is that of numbers ([[X.5]]) …

  - part: construction
    text: "Let it have to it the ratio which C has to D."
    highlight: [C, D]
    hint: |
      … say {C} : {D}.

  - part: proof
    text: "Since then, as A is to B, so is C to D, while the ratio of the square on A to the square on B is duplicate of the ratio of A to B, for similar figures are in the duplicate ratio of their corresponding sides; and the ratio of the square on C to the square on D is duplicate of the ratio of C to D, for between two square numbers there is one mean proportional number, and the square number has to the square number the ratio duplicate of that which the side has to the side; therefore also, as the square on A is to the square on B, so is the square on C to the square on D."
    highlight: [A, B, C, D]
    hint: |
      Squares on lines are in the duplicate ratio ([[VI.20]], porism); square numbers likewise ([[VIII.11]]).
      So sq({A}) : sq({B}) = {C}² : {D}².

  - part: specification
    text: "Next, as the square on A is to the square on B, so let the square on C be to the square on D;"
    highlight: [A, B, C, D]
    hint: |
      Second direction.

  - part: specification
    text: "I say that A is commensurable in length with B."
    highlight: [A, B]
    hint: |
      To prove.

  - part: proof
    text: "For since, as the square on A is to the square on B, so is the square on C to the square on D, while the ratio of the square on A to the square on B is duplicate of the ratio of A to B, and the ratio of the square on C to the square on D is duplicate of the ratio of C to D, therefore also, as A is to B, so is C to D."
    highlight: [A, B, C, D]
    hint: |
      Equal duplicate ratios, so equal ratios: {A} : {B} = {C} : {D}.
    explain:
      implicit: |
        That ratios with equal duplicates are equal is not proved as such; for lines it follows from
        [[VI.22]].
    gap: |
      "Duplicate ratios equal ⇒ ratios equal" is used without proof.

  - part: proof
    text: "Therefore A has to B the ratio which the number C has to the number D; therefore A is commensurable in length with B."
    highlight: [A, B]
    hint: |
      So {A}, {B} are commensurable ([[X.6]]).

  - part: specification
    text: "Next, let A be incommensurable in length with B;"
    highlight: [A, B]
    hint: |
      Third part (contrapositive).

  - part: specification
    text: "I say that the square on A has not to the square on B the ratio which a square number has to a square number."
    highlight: [A, B]
    hint: |
      To prove.

  - part: proof
    text: "For, if the square on A has to the square on B the ratio which a square number has to a square number, A will be commensurable with B."
    highlight: [A, B]
    hint: |
      By the second part.

  - part: proof
    text: "But it is not; therefore the square on A has not to the square on B the ratio which a square number has to a square number."
    highlight: [A, B]
    hint: |
      Done.

  - part: specification
    text: "Again, let the square on A not have to the square on B the ratio which a square number has to a square number;"
    highlight: [A, B]
    hint: |
      Fourth part.

  - part: specification
    text: "I say that A is incommensurable in length with B."
    highlight: [A, B]
    hint: |
      To prove.

  - part: proof
    text: "For, if A is commensurable with B, the square on A will have to the square on B the ratio which a square number has to a square number."
    highlight: [A, B]
    hint: |
      By the first part.

  - part: proof
    text: "But it has not; therefore A is not commensurable in length with B."
    highlight: [A, B]
    hint: |
      Done.

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: porism
    text: "Porism. And it is manifest from what has been proved that straight lines commensurable in length are always commensurable in square also, but those commensurable in square are not always commensurable in length also."
    hint: |
      Porism: commensurable in length ⇒ commensurable in square, not conversely.

  - part: lemma
    text: "[Lemma. It has been proved in the arithmetical books that similar plane numbers have to one another the ratio which a square number has to a square number, and that, if two numbers have to one another the ratio which a square number has to a square number, they are similar plane numbers."
    hint: |
      A bracketed lemma, probably added later: recalls [[VIII.26]] and its converse.

  - part: lemma
    text: "And it is manifest from these propositions that numbers which are not similar plane numbers, that is, those which have not their sides proportional, have not to one another the ratio which a square number has to a square number."
    hint: |
      Numbers that are not similar plane numbers are not as square to square …

  - part: lemma
    text: "For, if they have, they will be similar plane numbers: which is contrary to the hypothesis."
    hint: |
      … since otherwise they would be similar plane numbers.

  - part: lemma
    text: "Therefore numbers which are not similar plane numbers have not to one another the ratio which a square number has to a square number.]"
    hint: |
      Conclusion of the lemma.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3, 4, 5]
      text: |
        $a/b = m/n \Rightarrow a^2/b^2 = m^2/n^2$.
    - steps: [6, 7, 8, 9]
      text: |
        $a^2/b^2 = m^2/n^2 \Rightarrow a/b = m/n$ (positive square roots).
    - steps: [10, 11, 12, 13, 14, 15, 16, 17]
      text: |
        The other two statements are the contrapositives. $\blacksquare$

commentary: |
  The key to Book X: commensurability of lines is reduced to arithmetic. Heath's commentary discusses a
  famous scholium attributing the discovery to Theaetetus, whose work on "powers" (square roots) Plato describes
  in the *Theaetetus* (147d): Theodorus showed $\sqrt3, \sqrt5, \dots, \sqrt{17}$ incommensurable with the
  unit one by one; Theaetetus generalised to all non-square numbers.

  Consequence: $\sqrt{n}$ is commensurable with 1 iff $n$ is a perfect square.

historical: |
  Joyce discusses the scholium at length. Most historians accept that the contents of [[X.9]], and the
  classification of irrationals in Book X generally, go back to Theaetetus (died 369 BC).
