  aliases: { BA: AB, GE: EG, FE: EF, GF: FG, CA: AC, BC: CB }
  caption: |
    As in [[X.48]], with the ratio inverted: sq({EF}) : sq({FG}) = {CA} : {AB}.

steps:
  - part: enunciation
    text: "To find the second binomial straight line."
    highlight: [EG]
    hint: |
      E.g. $3 + \sqrt{12}$.
    modern: |
      Lesser term rational in length: $3 + \sqrt{12}$, $\sqrt{12 - 9} = \sqrt3 = \tfrac12\sqrt{12}$.

  - part: construction
    text: "Let two numbers AC, CB be set out such that the sum of them AB has to BC the ratio which a square number has to a square number, but has not to AC the ratio which a square number has to a square number; let a rational straight line D be set out, and let EF be commensurable in length with D; therefore EF is rational."
    highlight: [AC, CB, D, EF]
    hint: |
      Numbers as in [[X.48]]; {EF} commensurable in length with {D}.

  - part: construction
    text: "Let it be contrived then that, as the number CA is to AB, so also is the square on EF to the square on FG; therefore the square on EF is commensurable with the square on FG."
    highlight: [EF, FG]
    hint: |
      sq({EF}) : sq({FG}) = {CA} : {AB}: commensurable squares.

  - part: proof
    text: "Therefore FG is also rational."
    highlight: [FG]
    hint: |
      {FG} rational.

  - part: proof
    text: "Now, since the number CA has not to AB the ratio which a square number has to a square number, neither has the square on EF to the square on FG the ratio which a square number has to a square number."
    highlight: [EF, FG]
    hint: |
      Not a ratio of squares …

  - part: proof
    text: "Therefore EF is incommensurable in length with FG; therefore EF, FG are rational straight lines commensurable in square only; therefore EG is binomial."
    highlight: [EG]
    hint: |
      … so {EG} is a binomial.

  - part: specification
    text: "It is next to be proved that it is also a second binomial straight line."
    highlight: [EG]
    hint: |
      A second binomial.

  - part: proof
    text: "For since, inversely, as the number BA is to AC, so is the square on GF to the square on FE, while BA is greater than AC, therefore the square on GF is greater than the square on FE."
    highlight: [FG, EF]
    hint: |
      Inversely sq({GF}) : sq({FE}) = {BA} : {AC}, so {GF} is the greater term.

  - part: construction
    text: "Let the squares on EF, H be equal to the square on GF; therefore, convertendo, as AB is to BC, so is the square on FG to the square on H."
    highlight: [H, FG]
    hint: |
      sq({GF}) = sq({EF}) + sq({H}); convertendo sq({FG}) : sq({H}) = {AB} : {BC}.

  - part: proof
    text: "But AB has to BC the ratio which a square number has to a square number; therefore the square on FG also has to the square on H the ratio which a square number has to a square number."
    highlight: [FG, H]
    hint: |
      A ratio of squares …

  - part: proof
    text: "Therefore FG is commensurable in length with H; so that the square on FG is greater than the square on FE by the square on a straight line commensurable with FG."
    highlight: [FG, H]
    hint: |
      … so {FG}, {H} commensurable in length.

  - part: proof
    text: "And FG, FE are rational straight lines commensurable in square only, and EF, the lesser term, is commensurable in length with the rational straight line D set out."
    highlight: [EF, D]
    hint: |
      And the lesser term {EF} is commensurable with {D}.

  - part: proof
    text: "Therefore EG is a second binomial straight line."
    highlight: [EG]
    hint: |
      Second binomial.
    cites: [X.Def.II.2]

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - steps: [1, 2, 3, 4, 5]
      text: |
        As [[X.48]] with the terms' roles exchanged. $\blacksquare$
