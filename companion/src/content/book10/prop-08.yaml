id: X.8
kind: theorem
title: Magnitudes not as a number to a number are incommensurable

paraphrase: |
  If the ratio of {A} to {B} is not a ratio of numbers, {A} and {B} are incommensurable.

diagram:
  width: 160
  height: 100
  elements:
    - "A0;point;free;-1000,40;0;0"
    - "A3;point;free;1000,40;0;0"
    - "B0;point;free;-1000,70;0;0"
    - "B3;point;free;1000,70;0;0"
    - "A1;point;lineSlider;A0,A3,30,0;0"
    - "A2;point;lineSlider;A0,A3,130,0;0"
    - "A;line;connect;A1,A2;black"
    - "B1;point;lineSlider;B0,B3,30,0;0"
    - "B2;point;lineSlider;B0,B3,109,0;0"
    - "B;line;connect;B1,B2;black"
  caption: |
    Two magnitudes whose ratio is not that of numbers.

steps:
  - part: enunciation
    text: "If two magnitudes have not to one another the ratio which a number has to a number, the magnitudes will be incommensurable."
    highlight: [A, B]
    hint: |
      Irrational ratio ⇒ incommensurable.
    modern: |
      $a/b \notin \mathbb{Q} \Rightarrow a, b$ incommensurable.

  - part: setting-out
    text: "For let the two magnitudes A, B not have to one another the ratio which a number has to a number;"
    highlight: [A, B]
    hint: |
      Not a ratio of numbers.

  - part: specification
    text: "I say that the magnitudes A, B are incommensurable."
    highlight: [A, B]
    hint: |
      To prove.

  - part: proof
    text: "For, if they are commensurable, A will have to B the ratio which a number has to a number."
    highlight: [A, B]
    hint: |
      Otherwise their ratio would be that of numbers ([[X.5]]).

  - part: proof
    text: "But it has not; therefore the magnitudes A, B are incommensurable."
    highlight: [A, B]
    hint: |
      It is not.

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

reconstruction:
  lines:
    - steps: [3, 4]
      text: |
        Contrapositive of [[X.5]]. $\blacksquare$

commentary: |
  Used frequently, beginning with [[X.11]].
