id: X.64
kind: theorem
title: The square on the side of a rational plus a medial area applied to a rational line gives a fifth binomial

paraphrase: |
  If the square on a side of a rational plus a medial area {AB} is applied to a rational line {DE}, the breadth {DG} is a fifth
  binomial. The converse of [[X.58]].

