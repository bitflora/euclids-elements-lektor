id: X.91
kind: theorem
title: The side of a rational line times a first apotome is an apotome

paraphrase: |
  If an area {AB} is contained by a rational line {AC} and a first apotome {AD}, its side {LN} is an apotome. The
  subtractive twin of [[X.54]]: $\sqrt{\rho(a - \sqrt b)} = \sqrt u - \sqrt v$.

