id: X.71
kind: theorem
title: The side of a rational plus a medial area

paraphrase: |
  If a rational area {AB} and a medial area {CD} are added, the side of the sum is one of four irrationals: a
  binomial, a first bimedial, a major, or a "side of a rational plus a medial area".

diagram:
  width: 390
  height: 220
  elements:
    - "A0;point;free;-1000,40;0;0"
    - "A3;point;free;1000,40;0;0"
