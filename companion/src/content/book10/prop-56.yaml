steps:
  - part: enunciation
    text: "If an area be contained by a rational straight line and the third binomial, the “side” of the area is the irrational straight line called a second bimedial."
    highlight: [AC, MO]
    hint: |
      √(rational × third binomial) = second bimedial.

  - part: proof
    text: "For let the area ABCD be contained by the rational straight line AB and the third binomial AD divided into its terms at E, of which terms AE is the greater; I say that the “side” of the area AC is the irrational straight line called a second bimedial."
    highlight: [AC, AB, AD]
    hint: |
      Setup.

  - part: construction
    text: "For let the same construction be made as before."
    highlight: [SQ]
    hint: |
      The construction of [[X.54]].

  - part: proof
    text: "Now, since AD is a third binomial straight line, therefore AE, ED are rational straight lines commensurable in square only, the square on AE is greater than the square on ED by the square on a straight line commensurable with AE, and neither of the terms AE, ED is commensurable in length with AB."
    highlight: [AE, ED]
    hint: |
      Neither term commensurable with {AB} ([[X.Def.II.3]]).

  - part: proof
    text: "Then, in manner similar to the foregoing, we shall prove that MO is the “side” of the area AC, and MN, NO are medial straight lines commensurable in square only; so that MO is bimedial."
    highlight: [MO, MN, NO]
    hint: |
      As in [[X.55]], {MO} is the side and {MN}, {NO} are medial, commensurable in square only.

  - part: specification
    text: "It is next to be proved that it is also a second bimedial straight line."
    highlight: [MO]
    hint: |
      Now: a *second* bimedial.

  - part: proof
    text: "Since DE is incommensurable in length with AB, that is, with EK, and DE is commensurable with EF, therefore EF is incommensurable in length with EK."
    highlight: [EF, EK]
    hint: |
      {DE} incommensurable with {AB} = {EK}, commensurable with {EF}: {EF}, {EK} incommensurable ([[X.13]]).

  - part: proof
    text: "And they are rational; therefore FE, EK are rational straight lines commensurable in square only."
    highlight: [EF, EK]
    hint: |
      Rational, commensurable in square only …

  - part: proof
    text: "Therefore EL, that is, MR, is medial."
    highlight: [MN, NO]
    hint: |
      … so *EL* = *MR* is medial ([[X.21]]) …

  - part: proof
    text: "And it is contained by MN, NO; therefore the rectangle MN, NO is medial."
    highlight: [MN, NO]
    hint: |
      … i.e. rect({MN},{NO}) is medial.

  - part: proof
    text: "Therefore MO is a second bimedial straight line."
    highlight: [MO]
    hint: |
      Second bimedial ([[X.38]]).

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - steps: [6, 7, 8, 9, 10]
      text: |
        As [[X.55]], but now the mean $\rho\,EF$ is medial. $\blacksquare$
