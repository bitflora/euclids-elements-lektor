id: X.1
kind: theorem
title: Repeatedly removing more than half leaves less than any given magnitude

paraphrase: |
  Given two unequal magnitudes, if more than half is taken from the greater, then more than half of the
  remainder, and so on, eventually what is left is less than the smaller magnitude. This is the principle
  behind the "method of exhaustion" of Book XII.

