id: X.115
kind: theorem
title: From a medial line arise infinitely many irrationals

paraphrase: |
  Starting from a medial line {A}, repeatedly taking the mean proportional with a rational line produces
  infinitely many irrational lines, none of the same kind as any earlier one. The classification of Book X is
  not exhaustive.

