steps:
  - part: enunciation
    text: "From a medial straight line there arise irrational straight lines infinite in number, and none of them is the same as any of the preceding."
    highlight: [A]
    hint: |
      The irrationals never end: $\sqrt[4]{q}, \sqrt[8]{q}, \sqrt[16]{q}, \dots$

  - part: setting-out
    text: "Let A be a medial straight line; I say that from A there arise irrational straight lines infinite in number, and none of them is the same as any of the preceding."
    highlight: [A]
    hint: |
      Setup.

  - part: construction
    text: "Let a rational straight line B be set out, and let the square on C be equal to the rectangle B, A; therefore C is irrational; for that which is contained by an irrational and a rational straight line is irrational."
    highlight: [B, C]
    hint: |
      sq({C}) = rect({B},{A}): irrational, so {C} is irrational.

  - part: proof
    text: "And it is not the same with any of the preceding; for the square on none of the preceding, if applied to a rational straight line produces as breadth a medial straight line."
    highlight: [C]
    hint: |
      Not one of the thirteen: applied to a rational line, its square gives a medial breadth, which no earlier kind does.

  - part: construction
    text: "Again, let the square on D be equal to the rectangle B, C; therefore the square on D is irrational."
    highlight: [D]
    hint: |
      sq({D}) = rect({B},{C}), irrational.

  - part: proof
    text: "Therefore D is irrational; and it is not the same with any of the preceding, for the square on none of the preceding, if applied to a rational straight line, produces C as breadth."
    highlight: [D]
    hint: |
      {D} irrational and new for the same reason.

  - part: proof
    text: "Similarly, if this arrangement proceeds ad infinitum, it is manifest that from the medial straight line there arise irrational straight lines infinite in number, and none is the same with any of the preceding."
    highlight: [A, B, C, D]
    hint: |
      And so on without end.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - text: |
        $A = \sqrt[4]{q}$, $C = \sqrt{A} = \sqrt[8]q$, $D = \sqrt[16]q$, …; each square, divided by $\rho$, is the
        previous line. $\blacksquare$

commentary: |
  The last proposition of Book X; Heath, with Heiberg, considers it a later addition. Its point: Euclid's
  thirteen kinds are only the beginning of an infinite hierarchy of irrationals.
