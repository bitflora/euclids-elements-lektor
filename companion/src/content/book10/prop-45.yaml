id: X.45
kind: theorem
title: A major line divides at only one point

paraphrase: |
  The major splits into its two terms in only one way.

diagram:
  width: 250
  height: 70
  elements:
    - "A0;point;free;-1000,40;0;0"
    - "A3;point;free;1000,40;0;0"
    - "A;point;lineSlider;A0,A3,30,0"
    - "B;point;lineSlider;A0,A3,220,0"
    - "AB;line;connect;A,B;0;0"
    - "C;point;lineSlider;A0,A3,170,0"
    - "D;point;lineSlider;A0,A3,130,0"
    - "AC;line;connect;A,C;0;0;0"
    - "CB;line;connect;C,B;0;0;0"
    - "AD;line;connect;A,D;0;0;0"
    - "DB;line;connect;D,B;0;0;0"
  aliases: { BA: AB, CA: AC, BC: CB, DA: AD, BD: DB }
  caption: |
    {AB} divided at {C} and, supposedly, at {D}.

steps:
  - part: enunciation
    text: "A major straight line is divided at one and the same point only."
    highlight: [AB]
    hint: |
      Uniqueness, as in [[X.42]].

  - part: setting-out
    text: "Let AB be a major straight line divided at C, so that AC, CB are incommensurable in square and make the sum of the squares on AC, CB rational, but the rectangle AC, CB medial; I say that AB is not so divided at another point."
    highlight: [AC, CB]
    hint: |
      The division at {C}.

  - part: proof
    text: "For, if possible, let it be divided at D also, so that AD, DB are also incommensurable in square and make the sum of the squares on AD, DB rational, but the rectangle contained by them medial."
    highlight: [AD, DB]
    hint: |
      Suppose another at {D}.

  - part: proof
    text: "Then, since that by which the squares on AC, CB differ from the squares on AD, DB is also that by which twice the rectangle AD, DB differs from twice the rectangle AC, CB, while the squares on AC, CB exceed the squares on AD, DB by a rational area—for both are rational— therefore twice the rectangle AD, DB also exceeds twice the rectangle AC, CB by a rational area, though they are medial: which is impossible."
    highlight: [AC, CB, AD, DB]
    hint: |
      The sums of squares and the doubled rectangles differ by the same amount; that makes two medial areas
      differ by a rational area — impossible ([[X.26]]).
    cites: [X.26]

  - part: proof
    text: "Therefore a major straight line is not divided at different points; therefore it is only divided at one and the same point."
    highlight: [AB]
    hint: |
      Only one division.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - steps: [2, 3]
      text: |
        As [[X.42]]. $\blacksquare$
