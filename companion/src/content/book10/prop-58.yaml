id: X.58
kind: theorem
title: The side of a rational line times a fifth binomial is the side of a rational plus a medial area

paraphrase: |
  If an area {AC} is contained by a rational line {AB} and a fifth binomial {AD}, its side {MO} is "the side of
  a rational plus a medial area".

