  caption: |
    As in [[X.54]]: {AD} = {AE} + {ED} on the rational {AB}; {MO} is the side of {AC}.

steps:
  - part: enunciation
    text: "If an area be contained by a rational straight line and the fifth binomial, the “side” of the area is the irrational straight line called the side of a rational plus a medial area."
    highlight: [AC, MO]
    hint: |
      √(rational × fifth binomial).

  - part: proof
    text: "For let the area AC be contained by the rational straight line AB and the fifth binomial AD divided into its terms at E, so that AE is the greater term; I say that the “side” of the area AC is the irrational straight line called the side of a rational plus a medial area."
    highlight: [AC, AB, AD]
    hint: |
      Setup.

  - part: construction
    text: "For let the same construction be made as before shown; it is then manifest that MO is the “side” of the area AC."
    highlight: [MO]
    hint: |
      Same construction; {MO} is the side.

  - part: specification
    text: "It is then to be proved that MO is the side of a rational plus a medial area."
    highlight: [MO]
    hint: |
      To prove.

  - part: proof
    text: "For, since AG is incommensurable with GE, therefore AH is also commensurable with HE, that is, the square on MN with the square on NO; therefore MN, NO are incommensurable in square."
    highlight: [MN, NO]
    hint: |
      {AG}, {GE} incommensurable ([[X.18]]), so {MN}, {NO} incommensurable in square.

  - part: proof
    text: "And, since AD is a fifth binomial straight line, and ED the lesser segment, therefore ED is commensurable in length with AB."
    highlight: [ED, AB]
    hint: |
      Fifth binomial: the lesser {ED} commensurable with {AB} ([[X.Def.II.5]]).

  - part: proof
    text: "But AE is incommensurable with ED; therefore AB is also incommensurable in length with AE."
    highlight: [AB, AE]
    hint: |
      So {AB}, {AE} incommensurable in length ([[X.13]]).

  - part: proof
    text: "Therefore AK, that is, the sum of the squares on MN, NO, is medial."
    highlight: [MN, NO]
    hint: |
      *AK* = sq({MN}) + sq({NO}) is medial ([[X.21]]).

  - part: proof
    text: "And, since DE is commensurable in length with AB, that is, with EK, while DE is commensurable with EF, therefore EF is also commensurable with EK."
    highlight: [EF, EK]
    hint: |
      {EF} commensurable with {EK} …

  - part: proof
    text: "And EK is rational; therefore EL, that is, MR, that is, the rectangle MN, NO, is also rational."
    highlight: [MN, NO]
    hint: |
      … so rect({MN},{NO}) is rational ([[X.19]]).

  - part: proof
    text: "Therefore MN, NO are straight lines incommensurable in square which make the sum of the squares on them medial, but the rectangle contained by them rational."
    highlight: [MN, NO]
    hint: |
      Medial sum of squares, rational rectangle.

  - part: proof
    text: "Therefore MO is the side of a rational plus a medial area and is the “side” of the area AC."
    highlight: [MO]
    hint: |
      [[X.40]].

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  lines:
    - steps: [3, 4, 5, 6, 7, 8, 9, 10, 11]
      text: |
        Medial sum of squares, rational mean: the side of a rational plus a medial area. $\blacksquare$
