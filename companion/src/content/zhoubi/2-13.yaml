id: ZB.2.13
title: The four extremes; Zhao Shuang's notes on the chart of the seven orbits
paraphrase: |
  The farthest the sun's light ever reaches is 167,000 *li* beyond the winter-solstice path. That is
  a circle of radius $238{,}000 + 167{,}000 = 405{,}000$ *li* around the pole: diameter 810,000 *li*,
  circumference 2,430,000 *li*. Its north–south and east–west extents from Zhou follow by addition,
  subtraction and the *gou-gu* rule. Chenzi ends: "this is the method of the square and the circle."

  Zhao explains how to read the great chart (drawn in [[ZB.3.1]]). It is in two layers. The blue
  layer is a circle around the observer: the limit of sight, where heaven and earth seem to meet.
  The yellow layer carries the ecliptic and the lunar lodges and turns about the pole. Sunrise is
  the sun entering the blue circle, sunset its leaving. The directions east, west, south and north
  are relative to the observer, not absolute. At the pole a year is one day and one night.

parallels:
  - id: I.47
    relation: same
    note: |
      The east–west half-width of the illuminated world at Zhou is found as a leg of a right triangle,
      $\sqrt{405{,}000^2 - 103{,}000^2}$.
  - id: III.3
    relation: related
    note: |
      The east–west line through Zhou is a chord of the outer circle; the north–south diameter bisects it
      (III.3), so "halving gives each" side.

