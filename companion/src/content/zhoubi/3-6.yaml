id: ZB.3.6
title: The sun's daily north–south travel — a worked division
paraphrase: |
  A summary of the shadow rule, then a calculation. The sun moves 119,000 *li* between the
  solstices in half a year, $182\tfrac58$ days. So it moves 651 *li* 182 *bu* $\tfrac{798}{1461}$
  per day. The method is spelled out step by step: convert both numbers to eighths, then do long
  division into *li* and then hundreds, tens and units of *bu*.

steps:
  - classic: |
      So the winter-solstice shadow is 1 *zhang* 3 *chi* 5 *cun*, the summer-solstice shadow 1 *chi* 6 *cun*.
      The winter shadow is long, the summer shadow short. The shadow changes by a *cun* for a difference of a
      thousand *li*. So between the winter and summer solstices the sun travels 119,000 *li* north and
      south. The four extremes are 810,000 *li* in diameter and 2,430,000 *li* in circumference. Divided into
      degrees, each degree is 6,652 *li* 293 *bu* 327/1461 *bu*. This is the distance between degrees.
    hint: |
      A recapitulation: $135 - 16 = 119$ *cun* of shadow gives 119,000 *li*.
    modern: $(135 - 16)\ \text{cun} \times 1{,}000\ \text{li/cun} = 119{,}000$ *li*.
  - classic: |
      Its daily north–south travel is 651 *li* 182 *bu* and 798/1461 of a *bu*.
    modern: $\dfrac{119{,}000}{182\frac58} = \dfrac{952{,}000}{1461} = 651$ *li* $182\tfrac{798}{1461}$ *bu*.
  - classic: |
      The method: set out 119,000 *li* as the dividend, and the half-year, $182\tfrac58$ days, as the divisor.
  - zhao: |
      The half year runs from the outer to the inner orbit; taking it as divisor and dividing the distance
      gives the distance travelled in one day.
  - classic: |
      Make them commensurable.
  - zhao: |
      "Making commensurable" means that the numbers are not of the same kind, so the divisor is brought
      into line [with the dividend], so that they can be combined: multiply by 8.
    explain:
      fact: |
        Multiply dividend and divisor by the denominator 8 to clear the fraction:
        $\dfrac{119{,}000}{1461/8} = \dfrac{952{,}000}{1461}$.
  - classic: |
      This gives 952,000 as the dividend.
    modern: $119{,}000 \times 8 = 952{,}000$.
  - zhao: |
      Converting the 119,000 *li*.
  - classic: |
      The result, 1461, is the divisor. Divide.
    modern: $182 \times 8 + 5 = 1461$.
  - zhao: |
      Converting $182\tfrac58$ days.
  - classic: |
      Each time the dividend contains the divisor, one gets one *li*. For what is not used up, triple it;
      each time it contains the divisor, one gets a hundred *bu*.
    modern: $952{,}000 = 651 \cdot 1461 + 889$; $889 \cdot 3 = 2667 = 1 \cdot 1461 + 1206$, so 1 hundred *bu*.
  - zhao: |
      One *li* is 300 *bu*; strictly one should multiply by 300. "Triple it" is said because, not wishing to
      change the divisor, one takes one place as hundreds; so the result in that place is named as hundreds.
    hint: |
      With counting rods, multiplying by 3 and reading the answer as hundreds is the same as multiplying by
      300; it keeps the numbers small.
  - classic: |
      For what is not used up, multiply by ten; each time it contains the divisor, one gets ten *bu*.
    modern: $1206 \cdot 10 = 12{,}060 = 8 \cdot 1461 + 372$, so 8 tens of *bu*.
  - zhao: |
      Above, the multiplication was by 300; so here "multiply by ten" takes the place as tens, and [the
      result] is named as tens.
  - classic: |
      For what is not used up, multiply by ten; each time it contains the divisor, one gets one *bu*.
    modern: $372 \cdot 10 = 3720 = 2 \cdot 1461 + 798$, so 2 *bu*. In all, 182 *bu*.
  - zhao: |
      Multiplying by ten again takes just the single place, so [the result] is named as units.
  - classic: |
      What is not used up is named [as a fraction] with the divisor.
    modern: $651$ *li* $182\tfrac{798}{1461}$ *bu*.
  - zhao: |
      The places end at single *bu*, so the remainder is named as a fraction of the divisor: a leftover
      part of a *bu*.
