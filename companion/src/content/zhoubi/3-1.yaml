  caption: |
    The chart on its square of silk: 810,000 *li* on a side, just holding the circle of the four
    extremes. At 1 *fen* per 1,000 *li* that is 810 *fen*, i.e. 8 *chi* 1 *cun*.

steps:
  - classic: |
      In drawing this chart, take a *zhang* as a *chi*, a *chi* as a *cun*, a *cun* as a *fen*: one *fen* is
      a thousand *li*. In all, use a square of silk 8 *chi* 1 *cun* [on a side]. Now we use a square of silk
      4 *chi* 5 *fen*, one *fen* being two thousand *li*.
    hint: |
      The units go down by tens: 1 *zhang* = 10 *chi* = 100 *cun* = 1,000 *fen*. "Take a *zhang* as a
      *chi*" etc. means shrinking everything tenfold, repeatedly, until 1 *fen* stands for 1,000 *li*.
    highlight: [silk, extreme]
    modern: |
      $810{,}000 \text{ li} \div 1{,}000 = 810$ *fen* = 8 *chi* 1 *cun*; at half scale, $405$ *fen* =
      4 *chi* 5 *fen* (about 93 cm).
  - zhao: |
      The square is the chart of the four extremes, which fully [shows] the meaning of the seven orbits.
  - classic: |
      Mr Lü says: "Within the four seas, east to west is 28,000 *li*, north to south 26,000 *li*."
    hint: |
      A quotation from the *Lüshi chunqiu* (呂氏春秋, about 239 BCE). The habitable world is tiny
      compared with the 810,000-*li* disc lit by the sun.
  - zhao: |
      Mr Lü is Lü Buwei, chancellor of Qin, who compiled the *Lüshi chunqiu*. This meaning is in its first
      chapter, "Youshi". It is not the original text of the *Zhou bi*. The *Erya* says: "The Nine Yi, Eight
      Di, Seven Rong and Six Man are called the Four Seas." Giving the numbers east to west and north to
      south is meant to show where carts and horses reach. The *Hetu kuodixiang* says that there are nine
      provinces with rulers, cut off from the civilising virtue of the Middle Kingdom and not governed by
      it; it also says that the extent of the eight extremes is 223,500 [myriad?] *li* east to west and
      233,500 north to south. The "Dixing" chapter of the *Huainanzi* says that Yu sent Dazhang to pace
      from the eastern extreme to the western, and Shuhai to pace from the northern extreme to the
      southern, and the numbers were all the same. But how could such vastness be paced? Later students
      do not know. A *yi* means ten myriads.
    hint: |
      Zhao collects other ancient figures for the size of the world, and doubts them. The "four seas" are
      the barbarian peoples round China.
    dispute: |
      The figures quoted from the *Hetu kuodixiang* (二億二萬三千五百里) are hard to construe with the
      *yi* of 100,000 that Zhao defines; the text may be corrupt.
