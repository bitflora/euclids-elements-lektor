id: ZB.3.1
title: Drawing the chart — its scale; the world within the four seas
paraphrase: |
  How to draw the chart of the seven orbits. At a scale of 1 *fen* (a tenth of a *cun*) to 1,000
  *li*, the circle of the four extremes (810,000 *li*) needs a square of silk 8 *chi* 1 *cun* on a
  side. At half that scale, 1 *fen* to 2,000 *li*, a square 4 *chi* 5 *fen* will do. The classic then
  quotes the *Lüshi chunqiu*: the inhabited world "within the four seas" is only 28,000 by 26,000
  *li*.

