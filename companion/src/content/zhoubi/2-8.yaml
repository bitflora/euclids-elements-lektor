id: ZB.2.8
title: Sighting the pole — Zhou is 103,000 li from the pole
paraphrase: |
  The same rule, one *cun* of shadow for a thousand *li*, applied to the north pole. Sighting the
  pole star past the top of an 8-*chi* gnomon, the line of sight meets the ground 1 *zhang* 3 *cun*
  (103 *cun*) behind the gnomon. So Zhou is 103,000 *li* south of the point beneath the pole. Chenzi
  then explains the name: the gnomon (*bi*) of Zhou, because these measurements were made at Zhou.

parallels:
  - id: VI.4
    relation: same
    note: |
      As for the sun, the gnomon and its "*gou*" (here the distance back to the eye) form a small
      triangle similar to the large one with the pole's height and distance; so their sides are
      proportional (VI.4).

diagram:
  width: 330
  height: 260
  elements:
    - "P;point;fixed;40,30;black;black"
    - "X;point;fixed;40,230;black;black"
    - "Z;point;fixed;246,230;black;black"
    - "G;point;fixed;246,190;black;black"
    - "E;point;fixed;297.5,230;black;black"
    - "PX;line;connect;P,X;0;0;#33587a"
    - "XE;line;connect;X,E;0;0;#9a3b2b"
    - "PE;line;connect;P,E;0;0;#8a6d12"
    - "ZG;line;connect;Z,G;0;0;black"
    - "ZE;line;connect;Z,E;0;0;black"
    - "angX;sector;angleMarker;X,E,P,12;0;0;black;0"
    - "angZ;sector;angleMarker;Z,E,G,10;0;0;black;0"
  equal:
    - [angX, angZ]
  given: [P, X, Z, G, E, PX, XE, PE, ZG, ZE, angX, angZ]
  caption: |
    Not to scale. From the eye at {E} on the ground, the pole {P} is sighted past the top {G} of the
    gnomon {ZG} (8 *chi*). {ZE} is 1 *zhang* 3 *cun* = 103 *cun*. With the pole as high as the sun
    (80,000 *li*), the distance {XE} to the point beneath the pole is 103,000 *li*.

steps:
  - classic: |
      The rule says: the gnomon of Zhou is 8 *chi* long; the *gou* increases or decreases by one *cun* for
      a thousand *li*.
    hint: The rule of [[ZB.2.3]], stated generally.
    modern: $\Delta s = 1$ *cun* per $1{,}000$ *li* of distance, for a gnomon of 80 *cun*.
  - zhao: |
      The *gou* means the shadow. That is, the shadow cast on instruments on the earth from heaven
      hanging above differs everywhere by one *cun* per thousand *li*.
  - classic: |
      So it says: the pole is [what measures] the breadth and length of heaven.
  - zhao: |
      That is, once the distance of the pole is fixed, the breadth and length of heaven can be known.
  - classic: |
      Now set up a gnomon 8 *chi* high and sight the pole: its *gou* is 1 *zhang* 3 *cun*. From this one sees
      that from Zhou north to beneath the pole is 103,000 *li*.
    hint: |
      Sighting from the ground past the gnomon's top to the pole star, the eye is 103 *cun* behind the
      gnomon; at a thousand *li* per *cun* that is 103,000 *li*.
    highlight: [ZE, XE]
    explain:
      fact: |
        The triangles {G}{Z}{E} and {P}{X}{E} are similar. With $ZG = 80$ *cun* and $PX$ assumed equal to
        the sun's height, 80,000 *li*, the scale is 1,000 *li* per *cun*, so $XE = 103 \times 1{,}000$.
      implicit: |
        That the pole star is as high as the sun: in the *gaitian* model heaven is a canopy at a constant
        height above the earth, and the stars, sun and pole are all on it. 1 *zhang* 丈 = 10 *chi*.
    modern: $XE = ZE \cdot \dfrac{PX}{ZG} = 103 \cdot \dfrac{80{,}000}{80} = 103{,}000$ *li*.
    cites: [VI.4]
  - zhao: |
      This refers to the moments, at the winter solstice, when the sun is at *mao* or *you* [6 a.m. or 6
      p.m.], or to midnight at the equinoxes: then the pole [star], to the side of the pole, is level with
      the centre of heaven. So it is taken as the distance from Zhou to the centre of heaven.
    hint: |
      The pole star is not exactly at the pole; it circles it daily ([[ZB.4.3]]). It is due east or
      west of the true pole at certain hours, and then its north–south distance equals the pole's.
  - classic: |
      Rong Fang said: "What is [meant by] the 'gnomon of Zhou'?" Chenzi said: "In ancient times the Son of
      Heaven governed [from] Zhou.
  - zhao: |
      "The Son of Heaven in ancient times" means King Cheng of Zhou. He governed Zhou and resided at the
      royal city, so it says: "Of old the former kings laid out the capital: they surveyed the nine regions,
      leaving no land unplanned; with the jade tablet they measured the shadow, neither too short nor too
      long, at the place where wind and rain meet; only then could they found the royal city." This is
      what is meant.
    hint: |
      The jade tablet (*tugui* 土圭) of the *Rites of Zhou* measured the noon shadow at the solstice; the
      capital was placed where it had the prescribed length.
  - classic: |
      These numbers are sighted from Zhou; so it is called the gnomon of Zhou.
  - zhao: |
      That is, the Zhou capital, south of the [Yellow] River, was the centre of the four quarters, so it was
      made the station for sighting.
  - classic: |
      The *bi* is the gnomon."
  - zhao: |
      It is used to do the work, so it is called *bi* [thigh-bone]; by it one catches the sighting, so it is
      called *biao* [marker]. The shadow is the *gou*; so they are called *gou* and *gu*.
