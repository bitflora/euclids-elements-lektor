id: ZB.1.3
title: Bend the trysquare — gou 3, gu 4, hypotenuse 5; Zhao Shuang's hypotenuse diagram
paraphrase: |
  Shang Gao's famous answer. Take a right angle (the trysquare) with legs 3 and 4; the diagonal
  joining their ends is 5. Squaring the sides, $9 + 16 = 25$: "the two trysquares together make 25".
  The classic gives this one case and a figure. It does not state the general theorem or prove it;
  Zhao Shuang's commentary does both, in the essay that follows. Zhao already reads the general rule into
  this passage, as a method for finding any one side from the other two.

  Zhao Shuang's short essay on the "gou-gu, circle and square diagrams" (勾股圓方圖). It states the
  theorem in general, $a^2 + b^2 = c^2$, and proves it by a figure. In the *hypotenuse diagram*
  (弦圖), the square on the hypotenuse is cut into four red right triangles, each half of the
  rectangle $a \times b$, and a yellow central square on the difference $b - a$. So
  $c^2 = 2ab + (b-a)^2$, and since $2ab + (b-a)^2 = a^2 + b^2$, the theorem follows. Zhao then
  lists, with figures, rules for finding the sides of a right triangle from other data: sums,
  differences, and the "trysquare" (gnomon) left when one square is cut from another.

parallels:
  - id: I.47
    relation: same
    note: |
      The classic states one case, $3^2 + 4^2 = 5^2$; Zhao's essay states and proves the general
      theorem, differently from Euclid. Euclid divides the square on the hypotenuse into two
      rectangles and shows each equal to a square on a leg, by congruent triangles (I.4) and
      parallelograms on the same base (I.41). Zhao cuts the hypotenuse square into four triangles
      and a square, and rearranges them.
  - id: I.48
    relation: related
    note: |
      Read the other way: a triangle with sides 3, 4, 5 has a right angle. Builders used the
      3-4-5 rope to set out right angles. Euclid proves the general converse.
  - id: II.7
    relation: same
    note: |
      Zhao's step from $2ab + (b-a)^2$ to $a^2 + b^2$ is II.7: the square on a whole line and the
      square on one part together equal twice the rectangle of the whole and that part, plus the
      square on the remainder.
  - id: II.6
    relation: same
    note: |
      The "trysquare of the gou area": the square on the hypotenuse less the square on the *gu*
      is a gnomon equal to a rectangle of breadth $c - b$ and length $c + b$. In Euclid's terms,
      $(c+b)(c-b) + b^2 = c^2$, which is II.6 (II.5 in another arrangement).
  - id: II.9
    relation: same
    note: |
      "Twice the hypotenuse area fills the large outer square with a yellow square to spare":
      $2(a^2 + b^2) = (a+b)^2 + (b-a)^2$. Euclid's II.9 and II.10 prove exactly this.
  - id: II.8
    relation: related
    note: |
      Zhao's last rule finds two lines from their sum and their product, using $(x+y)^2 - 4xy = (x-y)^2$.
      II.8 is this identity: four times the rectangle plus the square on the difference equals the
      square on the sum.

