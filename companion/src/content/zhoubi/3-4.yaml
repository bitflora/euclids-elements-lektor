id: ZB.3.4
title: The seven orbits — diameters, circumferences, li per degree
paraphrase: |
  A table. For each orbit the classic gives its diameter, its circumference (three times the
  diameter), and the length of one degree on it: the circumference divided by $365\tfrac14$. The
  quotient is expressed in *li*, *bu* (300 to the *li*) and 1461sts of a *bu*. Every value in the
  text checks.

  | orbit | diameter (*li*) | circumference (*li*) | one degree |
  |---|---|---|---|
  | 1 (summer) | 238,000 | 714,000 | 1,954 *li* 247 *bu* 933/1461 |
  | 2 | 277,666⅔ | 833,000 | 2,280 *li* 188 *bu* 1332/1461 |
  | 3 | 317,333⅓ | 952,000 | 2,606 *li* 130 *bu* 270/1461 |
  | 4 (equinox) | 357,000 | 1,071,000 | 2,932 *li* 71 *bu* 669/1461 |
  | 5 | 396,666⅔ | 1,190,000 | 3,258 *li* 12 *bu* 1068/1461 |
  | 6 | 436,333⅓ | 1,309,000 | 3,583 *li* 254 *bu* 6/1461 |
  | 7 (winter) | 476,000 | 1,428,000 | 3,909 *li* 195 *bu* 405/1461 |

