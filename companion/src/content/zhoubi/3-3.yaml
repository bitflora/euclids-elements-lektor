steps:
  - classic: |
      So the interval between orbits is $19{,}833\tfrac13$ *li*, that is, [the third being] 100 *bu*.
    highlight: [band]
    modern: $119{,}000 \div 6 = 19{,}833\tfrac13$ *li*; $\tfrac13$ *li* $= 100$ *bu*.
  - zhao: |
      This number: the summer and winter solstices are 119,000 *li* apart; divide by the six intervals and
      you get it. Halve both the divisor and the remainder.
    hint: $119{,}000 / 6 = 19{,}833$ remainder 2, i.e. $\tfrac26 = \tfrac13$.
  - classic: |
      To find the diameter of the next orbit, double [the interval] and add it to the diameter of the inner
      orbit.
    hint: The diameter grows by twice the interval, once on each side.
    modern: $d_2 = d_1 + 2 \cdot 19{,}833\tfrac13 = 238{,}000 + 39{,}666\tfrac23 = 277{,}666\tfrac23$.
  - zhao: |
      Double the interval of one orbit and add it to the inner orbit.
  - classic: |
      Multiply it by two, and add it to the diameter of the inner orbit.
    modern: $d_3 = d_1 + 2 \cdot (2 \cdot 19{,}833\tfrac13)$.
  - zhao: |
      Multiply the doubled interval by two and add it to the inner orbit's diameter: this gives the
      diameter of the third orbit.
  - classic: |
      The following orbits are like this.
    modern: $d_n = 238{,}000 + (n-1)\cdot 39{,}666\tfrac23$ *li*.
  - zhao: |
      Each following one is according to the number.
