id: ZB.3.3
title: The spacing of the orbits
paraphrase: |
  The summer and winter orbits are 119,000 *li* apart in radius; six intervals make each
  $19{,}833\tfrac13$ *li*, i.e. 19,833 *li* and 100 *bu* (300 *bu* = 1 *li*). Each next orbit's
  diameter is the previous one's plus twice the interval.

diagram:
  width: 400
  height: 400
  elements:
