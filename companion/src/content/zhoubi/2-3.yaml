id: ZB.2.3
title: The gnomon and its shadow — one cun for a thousand li
paraphrase: |
  Chenzi gives the data. A gnomon (*bi* 髀, an upright pole) 8 *chi* high, set up at Zhou at noon on
  the summer solstice, casts a shadow of 1 *chi* 6 *cun*. A thousand *li* further south the shadow
  is 1.5 *chi*, a thousand *li* further north 1.7 *chi*. The shadow changes by 1 *cun* for every
  thousand *li*. The gnomon is the *gu* of a right triangle and its shadow the *gou*. Chenzi then
  waits for the day when the shadow is 6 *chi*, so that the triangle is 6-8-10.

