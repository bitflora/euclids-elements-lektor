id: ZB.4.4
title: Measuring the pole's circle with a gnomon and a cord
paraphrase: |
  Tie a cord to the top of an 8-*chi* gnomon. Sight the pole star along the cord and mark where the
  cord meets the ground. At 6 p.m. and 6 a.m. on the winter solstice the two marks are 2 *chi* 3
  *cun* apart. So the star's circle is 23,000 *li* across, by the rule of one *cun* for a thousand
  *li*. The line between the marks runs due east–west, and its midpoint joined to the gnomon runs
  due north–south. The mark for the true pole is 1 *zhang* 3 *cun* from the gnomon, so the pole is
  103,000 *li* from Zhou. The star's northern and southern extremes are 114,500 and 91,500 *li*.

parallels:
  - id: VI.4
    relation: same
    note: |
      Gnomon and cord make a small right triangle similar to the large one through the star; the distance
      along the ground is to the mark as the star's height is to the gnomon (VI.4).
  - id: I.10
    relation: related
    note: |
      "Fold [the line] in the middle": the midpoint of the two marks, found by folding a cord, is the point
      Euclid constructs with ruler and compass in I.10. Joined to the gnomon it gives the north–south line,
      perpendicular to the east–west one (compare I.11).

