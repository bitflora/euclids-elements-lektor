steps:
  - classic: |
      At the winter solstice, when the sun is at *you* [6 p.m.], set up an 8-*chi* gnomon, tie a cord to the
      top of the gnomon, sight the great star in the middle of the north pole, pull the cord to the ground,
      and mark [the point].
    hint: |
      The cord is held taut so that the star, the gnomon's top and the cord's end on the ground are in a
      straight line.
    highlight: [ZG]
  - zhao: |
      *Dian* means "top", *xi* means "look up", *zhi* means "reach". "Mark it" means that the great star
      sighted, the top of the gnomon and the cord reaching the ground are aligned, and [the point] is marked.
  - classic: |
      Then at dawn, when the sun is at *mao* [6 a.m.], again pull the cord and sight the star, [from] the top
      along the cord to the ground, and mark its end. [The two marks] are 2 *chi* 3 *cun* apart.
    hint: |
      In twelve hours the star has gone from its western to its eastern extreme; the cord's end moves
      correspondingly on the ground.
  - zhao: |
      When the sun is at *mao* and *you*, sight [the star] down to the ground; [this gives] their separation.
  - classic: |
      So the pole's [circle] is 23,000 *li* east to west.
    modern: $23$ *cun* $\times 1{,}000$ *li/cun* $= 23{,}000$ *li*; the *xuanji*'s radius is 11,500 *li*.
  - zhao: |
      For shadows, one *cun* is a thousand *li*; so this gives the number of *li* reached east and west.
    hint: |
      The same scale as for the sun: the pole star, like the sun, is 80,000 *li* up, ten thousand times
      the gnomon's 8 *chi*.
  - classic: |
      The two ends are separated exactly east and west.
  - zhao: |
      The two ends where the cord reached the ground, being in line, give true east–west.
  - classic: |
      Fold [the line between them] in the middle and point it at the gnomon: [this is] true north–south.
    hint: |
      Halving the line between the marks (by folding a cord) gives its midpoint; the line from there to
      the gnomon is the meridian.
    cites: [I.10]
  - zhao: |
      The midpoint of the two marked ends, with the gnomon, gives true north–south.
  - classic: |
      These times are all measured with the water clock: they are the times of east, west, south and north.
    hint: Night-time hours were read from a clepsydra (漏, a water clock).
  - zhao: |
      At the winter solstice, when the sun is at *mao* and *you*, [the star] is due east and west of the
      north pole, and the sun is not seen. Measuring with the clepsydra: a day and night are 100 *ke*; from
      midnight to noon and from noon to midnight are always 50 *ke* each, winter or summer. Halving gives 25
      *ke*, [from midnight to] the pole's *mao* and *you* times. *Kui* also means "to measure".
    hint: A *ke* 刻 is a hundredth of a day, 14.4 minutes.
  - classic: |
      The mark where the cord reaches the ground is 1 *zhang* 3 *cun* from the gnomon; so the centre of
      heaven is 103,000 *li* from Zhou.
    highlight: [OV, V]
    hint: The same sighting as in [[ZB.2.8]], now explained.
    cites: [VI.4]
  - zhao: |
      When the north pole [star] is east and west, it is level with the centre of heaven; so the *gou* sighted
      with the gnomon gives the *li* from [the centre of] heaven to Zhou.
  - classic: |
      How does one know the times of its north and south extremes? By the extreme of its northern excursion
      at midnight at the winter solstice, passing the centre of heaven by 11,500 *li* to the north; and by the
      extreme of its southern excursion at the summer solstice, falling short of the centre of heaven by
      11,500 *li*. In each case tie a cord to the gnomon's top and sight it. [For] the northern extreme the
      mark on the ground is 1 *zhang* 1 *chi* 4½ *cun*; so it is 114,500 *li* from Zhou,
    highlight: [AU, U]
    modern: $103{,}000 + 11{,}500 = 114{,}500$ *li*, i.e. 114.5 *cun*.
    dispute: |
      The Sibu Congkan reads 十二萬四千五百里, "124,500"; Gutenberg's 114,500 agrees with the mark of
      114½ *cun* and is followed.
  - classic: |
      passing the centre of heaven by 11,500 *li*. [For] the southern extreme the mark on the ground is
      9 *chi* 1½ *cun*; so it is 91,500 *li* from Zhou, falling short of the centre of heaven by 11,500 *li*.
      This is the method for how far the *xuanji*'s four extremes pass and fall short to north and south:
      the true *gou* for east, west, south and north.
    highlight: [BW, W]
    modern: $103{,}000 - 11{,}500 = 91{,}500$ *li*, i.e. 91.5 *cun*.
  - zhao: |
      The gnomon is the *gu*, the shadow the *gou*: [here] where the cord reaches the ground. Also adding
      the "difference within the trysquare": 26,632 *li* and a fraction. The method: set out 810,000 *li*,
      subtract Zhou's east–west [extent], 783,367 *li* and a fraction; the remainder is 26,633 *li*. Take one
      *li* and break it into 1,566,735 parts; subtract 143,311, leaving 1,423,424. So the east–west
      diameter [falls short by] 26,632 and 1,423,424/1,566,735 *li*.
    dispute: |
      Only the first sentence concerns this passage. The rest is the calculation for the east–west
      shortfall of [[ZB.2.14]]: $810{,}000 - \sqrt{810{,}000^2 - 206{,}000^2} = 26{,}632.909$, with the
      root's fractional part expressed in the old style over $2 \times 783{,}367 + 1$. It seems to have
      been misplaced, and may be Zhen Luan's work rather than Zhao's.
