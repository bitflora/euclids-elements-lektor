  caption: |
    A side view, much exaggerated. The cord runs from the ground past the top {G} of the gnomon {ZG}
    to the pole star. Sighting the star at its northern extreme {A}, the true pole {O} and its southern
    extreme {B} puts the cord's end at {U} (1 *zhang* 1 *chi* 4.5 *cun* from the gnomon), {V} (1 *zhang*
