steps:
  - classic: |
      Next it says: at the winter solstice [the sun's light] shines 167,000 *li* to the north beyond the
      northern orbit,
    highlight: [extreme, h7]
  - zhao: |
      In the eleventh month, at the winter solstice, the sun is in Qianniu, on the diameter in the north
      [at midnight]. Because it is in the north, it says "shines beyond the northern orbit".
  - classic: |
      making a diameter of 810,000 *li*
    modern: $476{,}000 + 2 \cdot 167{,}000 = 810{,}000$ *li*.
  - zhao: |
      Double the illumination and add it to the seventh orbit's diameter.
  - classic: |
      and a circumference of 2,430,000 *li*.
  - zhao: |
      Three times [the diameter]: the circumference of the seventh orbit increased by twice [the
      illumination, times three].
  - classic: |
      Divided into $365\tfrac14$ degrees, each degree is 6,652 *li* 293 *bu* and 327/1461 of a *bu*.
      Beyond, to the north, no one knows.
    modern: $\dfrac{4 \cdot 2{,}430{,}000}{1461} = 6652$ *li* $293\tfrac{327}{1461}$ *bu*.
  - zhao: |
      Beyond the 810,000 *li*.
  - classic: |
      As for "knowing": some suppose it can be known, some suppose it is hard to know. This says that the
      highest sages know it without study.
    hint: |
      An admission of the limits of the method: measurement reaches only as far as the sun's light.
  - zhao: |
      The highest sage's understanding reaches everything, his clarity sees everything. The *Kaolingyao*
      says, "The subtle and the patterned come out of darkness; only he examines their forms." This is what
      is meant.
    hint: The *Kaolingyao* (考靈曜) is a Han apocryphal text on astronomy.
