id: ZB.3.5
title: Beyond the outer orbit — what is not known
paraphrase: |
  At the winter solstice the sun's light reaches 167,000 *li* beyond the outer orbit, which gives
  the circle of the four extremes: diameter 810,000 *li*, circumference 2,430,000 *li*, a degree
  6,652 *li* 293 *bu* 327/1461. What lies beyond is not known. The classic adds that some think it
  knowable and some not, and only the highest sages know without study.

