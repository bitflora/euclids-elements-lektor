id: ZB.2.10
title: How far one can see; where the sun's light reaches
paraphrase: |
  Human sight reaches as far as the sun's light, 167,000 *li*. That is why the sun rises and sets.
  It is visible while within 167,000 *li* of the observer and invisible beyond. A series of
  subtractions then locates the edges of sight and of sunlight relative to Zhou, the pole and
  the sun's circles.

diagram:
  width: 400
  height: 400
  elements:
    - "P;point;fixed;200,200;black;black"
    - "Z;point;fixed;200,249;black;black"
    - "k1;point;fixed;256.7,200;0;0"
    - "k7;point;fixed;313.3,200;0;0"
    - "summer;circle;radius;P,k1;0;0;#b45309;0"
    - "winter;circle;radius;P,k7;0;0;#33587a;0"
    - "Zk;point;fixed;279.5,249;0;0"
    - "sight;circle;radius;Z,Zk;0;0;#7e22ce;0"
    - "A;point;fixed;200,256.7;black;black"
    - "B;point;fixed;200,313.3;black;black"
    - "N;point;fixed;200,169.5;black;black"
    - "S;point;fixed;200,328.5;black;black"
    - "NS;line;connect;N,S;0;0;#7e22ce"
  given: [P, Z, summer, winter, sight, A, B, N, S, NS]
  caption: |
    The circle of sight around Zhou {Z} (purple, radius 167,000 *li*). Its northern edge {N} lies
    64,000 *li* beyond the pole {P}; its southern edge {S} lies 32,000 *li* beyond the winter-solstice
    noon sun {B}. The sun is visible whenever it is inside this circle.

steps:
  - classic: |
      The distance that people can see should be the same as the reach of the sun's light.
    hint: |
      A symmetry: if the sun's light reaches the observer, the observer can see the sun. Sunrise and
      sunset are the moments the sun's circle crosses the edge of this region.
    highlight: [sight]
  - zhao: |
      When the sun is within 167,000 *li* of me, [its light] reaches me and I see the sun: so it is sunrise.
      When the sun is more than 167,000 *li* from me, the sun does not see me and I do not see the sun: so
      it is sunset. That is, the sun and the eye see each other within 167,000 *li*. So it says, "the
      distance seen should be as the reach of the sun's light".
    explain:
      fact: |
        In the *gaitian*, the sun never goes below the horizon. It "sets" by going too far away to be
        seen. Day length then depends on how much of the sun's daily circle lies within 167,000 *li*
        of the observer.
  - classic: |
      From Zhou one can see 64,000 *li* north beyond the pole.
    highlight: [N, P]
    modern: $167{,}000 - 103{,}000 = 64{,}000$ *li*.
  - zhao: |
      From here on, all the cases of subtracting take the 167,000 *li* of the sun's light, or of human
      sight, and subtract from it. Here one subtracts the 103,000 *li* from the pole to Zhou.
  - classic: |
      South, it is 32,000 *li* beyond the winter-solstice sun.
    highlight: [S, B]
    modern: $167{,}000 - 135{,}000 = 32{,}000$ *li*.
  - zhao: |
      Subtract the 135,000 *li* from Zhou to the winter-solstice noon sun.
  - classic: |
      The summer-solstice noon light reaches 48,000 *li* south beyond the winter-solstice noon light.
    modern: $167{,}000 - 119{,}000 = 48{,}000$ *li*.
    hint: |
      The light of the summer sun at {A} reaches 167,000 *li*; the winter sun {B} is 119,000 *li*
      beyond {A}.
  - zhao: |
      Subtract the 119,000 *li* between the [summer and] winter noon [positions].
  - classic: |
      [It reaches] 16,000 *li* south beyond what people can see.
    modern: $(16{,}000 + 167{,}000) - 167{,}000 = 16{,}000$ *li*.
  - zhao: |
      The summer-solstice noon sun is 16,000 *li* from Zhou.
  - classic: |
      North, it reaches 151,000 *li* beyond Zhou,
    modern: $167{,}000 - 16{,}000 = 151{,}000$ *li*.
  - zhao: |
      Subtract the 16,000 *li* from Zhou to the summer-solstice noon [sun].
  - classic: |
      and 48,000 *li* beyond the pole.
    modern: $167{,}000 - 119{,}000 = 48{,}000$ *li*.
  - zhao: |
      Subtract the 119,000 *li* from the pole to the summer-solstice sun.
  - classic: |
      The sun's light at midnight at the winter solstice falls 7,000 *li* short, to the south, of what
      people can see,
    hint: |
      At winter midnight the sun is 238,000 *li* north of the pole. Its light reaches 71,000 *li* short
      of the pole, while sight from Zhou reaches 64,000 *li* beyond it. The gap is 7,000 *li*.
  - zhao: |
      Double the distance reached by the sun's light, subtract it from the winter-solstice path diameter
      of 476,000 *li*, and also subtract the 135,000 *li* from Zhou to the winter noon sun.
    modern: $476{,}000 - 2 \cdot 167{,}000 - 135{,}000 = 7{,}000$ *li*.
  - classic: |
      and falls 71,000 *li* short of beneath the pole.
    modern: $238{,}000 - 167{,}000 = 71{,}000$ *li*.
  - zhao: |
      From the pole to the midnight [sun], subtract the 167,000 *li* illuminated.
  - classic: |
      At the summer solstice the noon and midnight light overlap by 96,000 *li* across the pole.
    modern: $2 \cdot 167{,}000 - 238{,}000 = 96{,}000$ *li*.
    hint: |
      The summer circle is small enough that the sun's light at noon and at midnight overlaps: the pole
      has continuous daylight.
  - zhao: |
      Double the sun's illumination and subtract the summer-solstice path diameter: the remainder is the
      overlap.
  - classic: |
      At the winter solstice the noon and midnight light fail to meet by 142,000 *li*, each falling 71,000
      *li* short of beneath the pole.
    modern: $476{,}000 - 2 \cdot 167{,}000 = 142{,}000$; half is $71{,}000$ *li*.
  - zhao: |
      Double the sun's illumination and subtract it from the winter-solstice path diameter: the remainder
      is the gap. Halve it: [the amount] each falls short of beneath the pole.
