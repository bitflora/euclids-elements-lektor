  given: [S, X, G, Z, W, N, M, V, h0, t1, t2, t3, m1, m2, ji, yi, bing, jia, SX, XV, St3, t3V, h0m2, ZG, MN, ZW, MV, SW, SV]
  caption: |
    Not to scale. Two gnomons {ZG} and {MN} of height $h$, a distance $d$ = {Z}{M} apart, with shadows
    {ZW} and {MV}. The sun is at {S}. Green {丙|bing} equals green {己|ji}; yellow {甲|jia} equals
    yellow {乙|yi}. The sun's height above the gnomon tops is the length of {甲|jia}.

steps:
  - classic: |
      Using the ratio to compute it: for 80 *li*, a diameter of 1 *li*; for 100,000 *li*, a diameter of
      1,250 *li*.
    hint: |
      The "rule of three" (*lü* 率): scale the tube's 80 : 1 up to the sun's distance.
    modern: $d = 100{,}000 \times \dfrac{1}{80} = 1{,}250$ *li*.
    cites: [VI.4]
  - zhao: |
      The rule should be: take the bore's diameter as the *gou* ratio and the tube's length as the *gu*
      ratio; the sun's distance from the observer is the large *gu*, and the large *gu*'s *gou* is the sun's
      diameter. The method: multiply the large *gu* by the *gou* ratio and divide by the *gu* ratio. Here
      80 *li* is the divisor and 100,000 *li* the dividend; dividing dividend by divisor gives the sun's
      diameter.
    hint: |
      Zhao writes the proportion as a "small" and a "large" *gou-gu*: $1 : 80 = d : 100{,}000$.
    explain:
      fact: |
        This is the Chinese "rule of three" (今有術, the "suppose" method of the *Nine Chapters*):
        the unknown is the known term times the ratio of the two given terms.
  - classic: |
      So it says: the sun's diameter is 1,250 *li*.
    hint: |
      The real sun is about 1.4 million km across. The Zhou bi's sun, 1,250 *li* (about 550 km), is
      tiny and near, as a flat earth requires.
  - zhao: |
      Zhao Junqing says: the yellow *jia* and the yellow *yi* are exactly equal in area.
    zh: 趙君卿曰黃甲與黃乙其實正等
    hint: The claim on which everything rests. The two yellow rectangles have the same area.
    highlight: [jia, yi]
    explain:
      did: |
        {乙|yi} lies between the two gnomons, below their tops: $h \times d$. {甲|jia} lies above the
        gnomon tops, with width the difference of the shadows, $\Delta = MV - ZW$, and height
        $H - h$ up to the sun: $\Delta \times (H - h)$.
      follows: |
        By I.43 applied to the rectangle with diagonal {S}{V}, the piece above and right of {N} equals the
        piece below and left of it: {丙|bing} + {甲|jia} = {己|ji} + {乙|yi}. Applied to the rectangle
        with diagonal {S}{W}, the same for the first gnomon gives {丙|bing} = {己|ji} (the green piece
        above {G} has width {ZW} and is drawn here moved over beside {甲|jia}). Subtracting, {甲|jia} =
        {乙|yi}.
    modern: $\Delta\,(H - h) = h\,d$.
    cites: [I.43]
    figure: 0
  - zhao: |
      Multiply the gnomon's height by the distance between the two gnomons to make the area of yellow
      *jia*. Divide by the difference of the shadows, which is the breadth of yellow *jia*: the result
      turns out to be the length of yellow *jia*, reaching up to the sun.
    zh: 以表高乘兩表相去爲黃甲之實以影差爲黃甲之廣而一所得則變得黃甲之袤上與日齊
    hint: |
      The rule: the sun's height above the gnomon tops is gnomon height × separation ÷ shadow
      difference.
    highlight: [jia]
    modern: $H - h = \dfrac{h\,d}{\Delta}.$
    explain:
      fact: |
        With the classic's numbers, $h = 8$ *chi*, $d = 2{,}000$ *li*, $\Delta = 2$ *cun*:
        $H - h = 80 \times 2000 / 2 = 80{,}000$ *li* (working in *cun* for $h$ and $\Delta$).
  - zhao: |
      According to the diagram one should add the gnomon's height; when it says 80,000 *li*, that is from
      the gnomon [top] upward, and one adds it again.
    zh: 按圖當加表高今言八萬里者從表以上復加之
    hint: |
      The full height of the sun is $H = \dfrac{hd}{\Delta} + h$. The 8 *chi* is negligible beside
      80,000 *li*, so the classic omits it.
    highlight: [ZG]
  - zhao: |
      The green *bing* and the green *ji* are also equal in area. Yellow *jia* joined to green *bing*, and
      yellow *yi* joined to green *ji*, are also equal in area. In each case the difference of the shadows
      is taken as breadth.
    hint: |
      The two applications of I.43, for the first gnomon and for the second, which together give
      "*jia* equals *yi*".
    highlight: [bing, ji]
    explain:
      did: |
        First gnomon: {丙|bing} $= ZW \times (H - h)$ and {己|ji} $= XZ \times h$ are the complements
        about the diagonal {S}{W}. Second gnomon: {丙|bing} + {甲|jia} $= MV \times (H-h)$ and {己|ji} +
        {乙|yi} $= XM \times h$ are the complements about the diagonal {S}{V}.
      follows: |
        Subtract the first equality from the second. What is left is {甲|jia} = {乙|yi}.
    cites: [I.43]

commentary: |
  This is the method later called *chongcha* 重差, "double difference". Liu Hui's *Sea Island
  Mathematical Manual* (海島算經, 263 CE) extends it to the height and distance of an island. The proof
  never uses similar triangles or ratios. It uses only the equality of complements in a rectangle and
  subtraction of equal areas. Euclid uses I.43 the same way in I.44, to "apply" an area to a given
  line. Zhao's proof is close to Euclid's Book I in spirit, though not in form.
