id: ZB.2.6
title: The diameter of the sun; Zhao Shuang's sun-height diagram
paraphrase: |
  Combine the tube ratio (1 : 80, [[ZB.2.4]]) with the slant distance (100,000 *li*,
  [[ZB.2.5]]): the sun's diameter is $100{,}000 / 80 = 1{,}250$ *li*.

  Zhao's second diagram essay proves the "double difference" rule for the sun's height. Set up
  two gnomons of height $h$ a distance $d$ apart, and let their shadows differ by $\Delta$. Then
  the sun is $\dfrac{h\,d}{\Delta}$ above the gnomon tops. The proof uses rectangles of equal area,
  the "complements" about the diagonal of a rectangle. This is Euclid's I.43.

parallels:
  - id: VI.4
    relation: same
    note: |
      The bore and the tube length, the sun's diameter and its distance: two similar triangles, whose
      sides are in proportion (VI.4). Zhao calls the tube's triangle the small *gou-gu* and the sun's
      triangle the large one. The same proportion gives the double-difference rule for the sun's
      height, which Zhao instead proves with areas, the way Book I would.
  - id: I.43
    relation: same
    note: |
      Zhao's "yellow *jia* and yellow *yi* are exactly equal in area" rests on the fact that in a rectangle
      cut by lines through a point of its diagonal, the two pieces off the diagonal (the complements)
      are equal. This is I.43. Zhao uses it for both gnomons and subtracts.

