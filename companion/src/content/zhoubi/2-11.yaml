  caption: |
    The east–west line through Zhou {Z} meets the summer circle at {U} and {V}. In the right triangle
    {P}{Z}{V}, the hypotenuse {PV} is the summer radius (119,000 *li*) and {PZ} is 103,000 *li*, so
    {ZV} = 59,598½ *li*. On the winter circle the same line reaches {W} and {Y}, 214,557½ *li* away,
    outside the circle of sight (purple).

steps:
  - classic: |
      On the day of the summer solstice, looking due east and west, the sun, directly east and west of
      Zhou, is 59,598½ *li* from Zhou.
    highlight: [UV, PV, PZ]
    modern: $\sqrt{119{,}000^2 - 103{,}000^2} = 59{,}598.7$ *li*.
    cites: [I.47, III.3]
  - zhao: |
      The method: take the summer-solstice path diameter, 238,000 *li*, as the hypotenuse, and twice the
      pole's distance from Zhou, 206,000 *li*, as the *gu*, and find the *gou*. Subtract the *gu* multiplied
      by itself from the hypotenuse multiplied by itself, extract the square root of the remainder, and you
      get a *gou* of 119,197 *li* and a fraction. Halve it: that is each half, [east and west] of Zhou.
    hint: |
      Zhao works with the whole diameter and twice the distance, then halves the result. It is the same
      right triangle, doubled.
    highlight: [UV]
    modern: |
      $$\sqrt{238{,}000^2 - 206{,}000^2} = 119{,}197.3,\qquad \tfrac12 \cdot 119{,}197.3 = 59{,}598.7.$$
    cites: [I.47]
    explain:
      did: |
        "*Gou* multiplied by itself, subtracted from hypotenuse multiplied by itself, root extracted" is the
        rule $b = \sqrt{c^2 - a^2}$ from [[ZB.1.3]].
  - classic: |
      On the day of the winter solstice the sun is not seen due east and west.
    adds: [sight, W, Y, WY, PY]
    highlight: [WY, sight]
  - zhao: |
      Due east and west means Zhou's *mao* and *you* [directions]. The sun is beyond 167,000 *li*, so it
      is not seen.
  - classic: |
      By calculation, [the point] beneath the sun is 214,557½ *li* from Zhou.
    highlight: [WY, PY]
    modern: $\sqrt{238{,}000^2 - 103{,}000^2} = 214{,}557.7$ *li*, more than 167,000.
    cites: [I.47]
  - zhao: |
      The method: take the winter-solstice path diameter, 476,000 *li*, as the hypotenuse, twice the pole's
      distance from Zhou, 206,000 *li*, as the *gou*, and find the *gu*. Subtract the *gou* multiplied by itself
      from the hypotenuse multiplied by itself, extract the root of the remainder: 429,115 *li* and a
      fraction. Halve it: the east and west numbers.
    dispute: |
      The Sibu Congkan writes 二十萬六十里, "200,060"; the context (twice 103,000) requires 二十萬六千里,
      206,000.
