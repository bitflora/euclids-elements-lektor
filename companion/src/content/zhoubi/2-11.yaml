id: ZB.2.11
title: Due east and west of Zhou — a chord of the sun's circle
paraphrase: |
  How far east and west of Zhou does the sun pass? The line through Zhou running east–west is a
  chord of the sun's daily circle. Its half is a leg of a right triangle whose hypotenuse is the
  circle's radius and whose other leg is Zhou's distance from the pole. At the summer solstice the
  sun passes 59,598½ *li* due east and west of Zhou. At the winter solstice it would be 214,557½
  *li*, beyond the range of sight, so the sun is never seen due east or west.

parallels:
  - id: I.47
    relation: same
    note: |
      Zhao finds the chord by the *gou-gu* rule: half the chord is $\sqrt{R^2 - d^2}$, where $R$ is the
      circle's radius and $d$ the distance of the chord from the centre.
  - id: III.3
    relation: related
    note: |
      That the east–west line through Zhou is cut in half by the north–south diameter, so that "halving
      gives each" side, is III.3: a diameter perpendicular to a chord bisects it.

