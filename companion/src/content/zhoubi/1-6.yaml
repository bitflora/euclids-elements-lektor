id: ZB.1.6
title: Round heaven, square earth — the circle from the square
paraphrase: |
  Heaven is round and earth is square. Zhao Shuang warns that this is symbolic, not the real shape
  of the world, and he gives the Zhou bi's actual cosmology: heaven and earth are parallel, each
  bulging up in the middle. He then shows how the "circle comes from the square" by four rules for
  the area of a circle, all with $\pi = 3$. A circle inscribed in a square covers three quarters of
  it.

parallels:
  - id: XII.2
    relation: related
    note: |
      Zhao's rule "diameter times itself, times 3, divided by 4" says a circle's area is a fixed
      fraction of the square on its diameter. Euclid proves that circles are to one another as the
      squares on their diameters (XII.2), without giving the fraction. Zhao's fraction, $\tfrac34$,
      is $\pi/4$ with $\pi = 3$.

