  caption: |
    "Lay the trysquare on its back to sight a height." The eye is at {E}; the trysquare's legs are
    {EF} (flat) and {FG} (upright). Sighting along {E}{G} to the top {T} of a tower {BT} gives two
    right triangles with the same angle at {E}, so ${BT} : {EB} = {FG} : {EF}$. Drag {G} to aim at a
    taller or shorter tower.

steps:
  - classic: |
      The Duke of Zhou said: "Great indeed is this account of number!
  - zhao: |
      His mind grasped the meaning of the art of number, so he exclaimed "great indeed".
  - classic: |
      May I ask the way of using the trysquare?"
  - zhao: |
      That is, how to use the gnomon properly, and the methods of sighting and measuring.
    hint: |
      The "gnomon" (*biao* 表) is a vertical pole whose shadow is measured. Zhao treats it as one leg
      of a trysquare, with the shadow as the other.
  - classic: |
      Shang Gao said: "Lay the trysquare flat to make the cord true.
    hint: |
      With one leg of the trysquare along a plumb line, the other leg is level. It sets out
      horizontal and vertical lines.
    dispute: The Sibu Congkan has 商高日, a misprint of 曰, "said".
  - zhao: |
      This is to find the trueness of the cord and fix the body of level and plumb. He wishes to guard
      against an error of a hair's breadth, which leads to a loss of a thousand *li*.
    hint: A small error in levelling becomes a large one over a long sightline.
  - classic: |
      Lay the trysquare on its back to sight a height; turn it over to measure a depth; lay it on its
      side to know a distance.
    hint: |
      Three sighting methods, all by similar triangles. Held upright (on its back), it measures
      heights; turned downward, depths, as of a valley or well; lying horizontal, distances across.
    highlight: [EG, GT, FG, BT]
    explain:
      did: |
        In the figure, the observer at {E} holds the trysquare with leg {EF} level and leg {FG} upright,
        and sights past the end {G} to the top {T} of the object.
      fact: |
        The small triangle {E}{F}{G} and the large triangle {E}{B}{T} both have a right angle and share
        the angle at {E}. So they are similar, and their sides are proportional:
        $BT = EB \cdot \dfrac{FG}{EF}$.
      implicit: |
        The distance {E}{B} must be known; if it is not, the Chinese surveyors' "double difference" method
        uses two sightings ([[ZB.2.5]]).
    modern: $\dfrac{BT}{EB} = \dfrac{FG}{EF}.$
    cites: [VI.4]
  - zhao: |
      This means that its uses have no fixed form, but bend to follow the matter at hand. The methods
      are in the *Nine Chapters*.
    hint: |
      The *Nine Chapters on the Mathematical Art* (九章算術) has a whole chapter of right-triangle
      problems (chapter 9, "Gou-gu").
  - classic: |
      Swing the trysquare round to make a circle; put trysquares together to make a square.
    hint: |
      Turned about one end, a leg of the trysquare sweeps out a circle. Two trysquares fitted
      together make a rectangle, or a square if the legs are equal.
    dispute: |
      Some modern readers see "swinging the trysquare" as the property that every right angle whose arms
      pass through two fixed points has its vertex on the circle with those points as diameter (the
      converse of Euclid III.31). The text gives no detail; Zhao's comment speaks only of making
      circles and squares.
  - zhao: |
      Having traced out the principles, one can also construct circles and squares. That is, there is
      nothing the trysquare cannot reach.
