id: ZB.1.4
title: The uses of the trysquare
paraphrase: |
  The Duke of Zhou asks how the trysquare is used, and Shang Gao lists six uses in six short phrases.
  Laid flat, it levels a line; held up, it sights a height; turned down, it measures a depth; laid on
  its side, it finds a distance. Swung round, it makes a circle; two together make a square. The
  sighting uses all rest on similar right triangles: the small triangle of the trysquare and the
  large triangle out to the object have proportional sides.

parallels:
  - id: VI.4
    relation: related
    note: |
      Sighting a height with the trysquare relies on similar triangles: in equiangular triangles the
      sides about the equal angles are proportional. Euclid proves this as VI.4. Shang Gao only names
      the methods; they are worked out in [[ZB.2.5]] and in the Nine Chapters.

