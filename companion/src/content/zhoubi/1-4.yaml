    caption: |
      The two trysquares (gnomons), after Zhao's left and right figures, each in a square on the
      hypotenuse (5 × 5). Left: the square on the *gu* (4 × 4, yellow) sits in the corner; the green
      gnomon around it is the area of the *gou*, $9 = 1 \times 9$, of breadth $c - b = 1$. Right: the
