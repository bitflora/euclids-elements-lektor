id: ZB.3.2
title: Seven orbits, six intervals, six months
paraphrase: |
  The sun's daily circle changes through the year between the inner orbit (summer solstice) and the
  outer orbit (winter solstice). The Zhou bi draws seven orbits (*heng* 衡) with six equal intervals,
  one for each month of the half-year of $182\tfrac58$ days. In a year the sun goes once out and
  once in; in each month of $30\tfrac7{16}$ days it crosses one interval.

