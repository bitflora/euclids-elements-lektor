steps:
  - classic: |
      Heaven is like a covering hat; earth is modelled on an upturned bowl.
    hint: |
      The *gaitian* picture: two parallel domes, heaven above, earth below.
    highlight: [t2, t3, e2, e3]
  - zhao: |
      What is seen is called an image; what has form is called a model. Being above, [heaven] is compared to
      a hat; being below, [earth] is likened to a bowl. "Image" and "model" mean the same, and the hat and the
      bowl are alike in shape. The words vary and different vessels are used to distinguish the honoured
      from the lowly: one looks up to the image and down to the model. The names differ.
  - classic: |
      Heaven is 80,000 *li* from earth.
    highlight: [a3b3]
  - zhao: |
      Their vaulted heights follow one another; they are 80,000 *li* apart.
  - classic: |
      On the day of the winter solstice, although [the sun] is on the outer orbit, it is still 20,000 *li*
      above the ground beneath the pole.
    highlight: [U, level]
    modern: $80{,}000 - 60{,}000 = 20{,}000$ *li*.
  - zhao: |
      Heaven and earth vault up; the height falls away by 60,000 *li* to the outer orbit. On the day of the
      winter solstice, though [the sun] is on the outer orbit, looking across, it is in line with the level
      ground; it is always 20,000 *li* above the ground beneath the north pole. That is, the sun and moon
      do not block each other, so [the sun] can spread its light by day and let in the [moon's] brightness by
      night.
  - classic: |
      So the sun gives rise to the moon.
    hint: The moon's light is the sun's.
  - zhao: |
      The sun is the essence of yang, like the light of fire; the moon is the essence of yin, like the light
      of water. The moon holds the image, so the moon's light arises where the sun shines on it, and its
      dark part arises where it is screened from the sun. Facing the sun, it is full of light; approaching the
      sun, its brightness is all gone. The moon receives the sun's light and takes its form from it; so it
      says "the sun gives rise to the moon".
    hint: |
      A correct account of the moon's phases: full moon opposite the sun, new moon beside it. Zhang Heng
      gives the same explanation in the *Ling xian*.
  - classic: |
      The moon's light then comes out, so there is a bright moon.
  - zhao: |
      Only after receiving the sun can it spread its light and complete its brightness.
  - classic: |
      The stars and planets can then [shine] in their ranks.
  - zhao: |
      The *Ling xian* says: "The many stars □ shine; through water and fire they pass on light, so they can
      form their ranks."
    dispute: One character of the quotation is illegible in the scan (□).
  - classic: |
      So from the autumn equinox to the winter solstice the essences of the three lights are faint, because
      their paths are far.
    hint: The "three lights" are the sun, moon and stars.
  - zhao: |
      The sun goes from the middle orbit to the outer orbit; its distance grows by the day, and because of the
      distance its light is faint. It does not speak of the period from the winter solstice to the spring
      equinox, [because then too] everything is outside the middle orbit; that it is the same can be known.
  - classic: |
      This is the nature of heaven and earth, of yin and yang: it is so of itself.
  - zhao: |
      It is so of itself; so it is called "nature".
