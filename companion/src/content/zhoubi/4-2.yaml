id: ZB.4.2
title: Heaven like a hat, earth like a bowl; how the moon shines
paraphrase: |
  Heaven is like a conical hat and earth like an upturned bowl, 80,000 *li* apart everywhere. Even
  on the outer orbit the winter sun is 20,000 *li* above the ground beneath the pole. The moon has no
  light of its own: it shines by the sun's light, full when it faces the sun and dark when near it.
  From autumn to winter the sun, moon and stars are dimmer because they are farther away.

