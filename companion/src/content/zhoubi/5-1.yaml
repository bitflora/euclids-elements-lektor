id: ZB.5.1
title: How far the solstice and equinox lodges are from the pole
paraphrase: |
  The sun is in the lodge Qianniu at the winter solstice (on the outer orbit), in Dongjing at the summer
  solstice (inner orbit), and in Lou and Jiao at the equinoxes (middle orbit). Their distances from the
  pole star, in *li*, are converted into degrees: each is divided by the length of a degree on the inner
  orbit, 1,954 *li* 247 *bu* $\tfrac{933}{1461}$. The worked division gives Qianniu 115 degrees and
  some, Lou and Jiao 91, Dongjing 66. Every figure in the text checks.

diagram:
  width: 400
  height: 400
  elements:
    - "P;point;fixed;200,200;black;black"
    - "k1;point;fixed;256.7,200;0;0"
    - "k4;point;fixed;285,200;0;0"
    - "k7;point;fixed;313.3,200;0;0"
    - "h1;circle;radius;P,k1;0;0;#b45309;0"
    - "h4;circle;radius;P,k4;0;0;#5b6b2f;0"
    - "h7;circle;radius;P,k7;0;0;#33587a;0"
    - "Q;point;fixed;200,313.3;black;#33587a"
    - "D;point;fixed;200,143.3;black;#b45309"
    - "L;point;fixed;285,200;black;#5b6b2f"
    - "J;point;fixed;115,200;black;#5b6b2f"
    - "PQ;line;connect;P,Q;0;0;#33587a"
    - "PD;line;connect;P,D;0;0;#b45309"
