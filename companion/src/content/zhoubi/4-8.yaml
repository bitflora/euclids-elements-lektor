id: ZB.4.8
title: Where the sun rises and sets among the lodges
paraphrase: |
  Lay the 28 lodges round the circle by their measured widths, oriented with the sky: when Dongjing is
  on the meridian at midnight, Qianniu is due north. The circle is also divided into the twelve
  "branches" (directions) of $30\tfrac{7}{16}$ degrees. At a solstice sunrise, place a movable rod on
  the rim so that it, the central gnomon and the gnomon's shadow are in line. The rod's position
  shows the lodge and degree in which the sun rises. Sunset is found the same way.

