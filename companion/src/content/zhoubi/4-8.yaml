  caption: |
    Seen from above, north at the top. The rim is divided into twelve branches of $30\tfrac7{16}$ degrees
    (thin spokes): *zi* at the north, *wu* at the south, *mao* at the east, *you* at the west. At
    sunrise a movable rod {R} is set on the rim in line with the central gnomon {O} and the tip {T} of its
    shadow. The lodge marked on the rim at {R} is where the sun rises.

steps:
  - classic: |
      Where the sun sets is also fixed with this circle.
  - zhao: |
      The same as the circle for sighting the stars.
  - classic: |
      To know [where] the sun rises and sets,
  - zhao: |
      Lay out the lodges of the east, west, south and north faces of the twenty-eight lodges, each
      corresponding to its direction; set up a gnomon and sight, to know in which lodge the sun rises and
      sets, and how many degrees there are from rising to setting.
  - classic: |
      lay out the twenty-eight lodges according to the $365\tfrac14$ degrees.
    dispute: This sentence is in the Sibu Congkan but not in the Gutenberg text.
  - zhao: |
      Lay out the twenty-eight lodges by the degrees of the circle on the ground, so that the lodges of the
      four faces each correspond to their direction.
  - classic: |
      When Dongjing is on the meridian at midnight, the beginning of Qianniu faces the middle of *zi* [north].
    highlight: [s0]
  - zhao: |
      Dongjing and Qianniu are opposite lodges: when Dongjing faces *wu* [south], Qianniu faces *zi*.
  - classic: |
      Dongjing [then] lies $30\tfrac{7}{16}$ degrees west of the central gnomon, facing the middle of *wei*;
      and the beginning of Qianniu should face the middle of *chou*.
    highlight: [s1]
    modern: $365\tfrac14 \div 12 = 30\tfrac{7}{16}$ degrees per branch.
  - zhao: |
      The degrees of the circuit of heaven are divided into twelve positions, each of the twelve branches
      occupying one, corresponding to the twelve months: from *wu* to *wei* is $30\tfrac{7}{16}$ degrees. *Wei*
      and *chou* are opposite, and the method of dividing where Dongjing and Qianniu lie has been set out
      above.
  - classic: |
      Then heaven and earth agree.
  - zhao: |
      *Xie* means to agree. Place Dongjing and Qianniu opposite each other at *chou* and *wei*; then the lodges
      of heaven agree with the circle drawn on the ground.
  - classic: |
      Then lay out the twenty-eight lodges round the circle.
  - zhao: |
      From where Dongjing and Qianniu lie, lay out the twelve positions.
  - classic: |
      When they are laid out and fixed, set up a true gnomon again at the centre of the circle of degrees.
    highlight: [O]
  - zhao: |
      The centre of the circle of degrees is the crossing of the warp and weft.
  - classic: |
      At the winter and summer solstices, watch for the sun as it first rises; set up a movable rod on the
      degree [marks] and sight the shadow of the central gnomon.
    highlight: [R, RT]
  - zhao: |
      On the degree where the sun rises, set up a movable rod; in each case sight the shadow of the central
      gnomon. The reason for this: facing the glare, one cannot look at the sun again, but this way one can
      observe it.
    hint: |
      One cannot sight the sun directly. Instead the rod is placed so that it lines up with the central
      gnomon's shadow, which points directly away from the sun.
  - classic: |
      When the shadow is aligned, [the rod marks] the lodge and degree where the sun rises.
    highlight: [RT]
  - zhao: |
      The movable rod, the central gnomon and the shadow are aligned; beneath the movable rod is the lodge
      and degree where the sun rises.
  - classic: |
      Sunset is done the same way.
  - zhao: |
      This is found by the method for sunrise.

commentary: |
  The method treats a direction on the horizon as if it were a position among the stars. For the
  equinoxes and solstices, where the sun rises along the horizon differs from where it lies among
  the lodges; the Zhou bi does not distinguish the two. The procedure measures directions on a
  flat ground circle, and fits the classic's flat-earth astronomy.
