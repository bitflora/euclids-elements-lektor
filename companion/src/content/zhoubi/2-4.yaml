id: ZB.2.4
title: Sighting the sun through a tube — 80 to 1
paraphrase: |
  Look at the sun through a bamboo tube 8 *chi* long with a bore 1 *cun* across. The sun exactly
  fills the bore. So the sun's diameter is $\tfrac{1}{80}$ of its distance from the eye. This ratio,
  with the distance found in [[ZB.2.5]], gives the sun's size in [[ZB.2.6]].

parallels:
  - id: VI.4
    relation: same
    note: |
      The tube and the sun subtend the same angle at the eye, so the bore is to the tube's length as the
      sun's diameter is to its distance: the sides of equiangular triangles are proportional (VI.4).

