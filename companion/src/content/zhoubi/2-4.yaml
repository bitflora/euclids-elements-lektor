steps:
  - classic: |
      Then take a bamboo tube with a bore 1 *cun* across and 8 *chi* long. Catch the sun in it and look:
      the bore exactly covers the sun,
    hint: The tube is aimed at the sun until the sun's disc exactly fills the opening.
    highlight: [EM, EN]
  - zhao: |
      Looking at the sun's image through a bore of one *cun*: if the tube is longer, [the sun] is larger
      [than the bore]; if shorter, it is smaller; at exactly 8 *chi* it just fills it. "Catch" means
      "seek", "cover" means "overlay".
    explain:
      did: |
        "Larger" and "smaller" compare the sun with the bore. With a longer tube the bore subtends a
        smaller angle, which the sun more than fills.
  - classic: |
      and the sun fits the opening of the bore.
  - zhao: |
      "Covers" is as when two circles coincide. He says "8 *chi*" again to state the fixed value. It also
      means: near, it is large; far, it is small. The 6-*chi* shadow is taken as the standard.
    hint: |
      The sighting is made when the shadow is 6 *chi* ([[ZB.2.3]]). The sun is then at the slant
      distance of 100,000 *li* that is computed in the next section.
  - classic: |
      From this one sees that the ratio is: for 80 *cun*, a diameter of 1 *cun*."
    highlight: [PQ, MN]
    modern: $\dfrac{\text{sun's diameter}}{\text{sun's distance}} = \dfrac{PQ}{EP} = \dfrac{1}{80}.$
    explain:
      fact: |
        The real apparent diameter of the sun is about half a degree, a ratio of about 1 : 107, so the
        Zhou bi's 1 : 80 is about a third too large. The bore would have to be read very precisely.
    cites: [VI.4]
  - zhao: |
      This is taken as the ratio of the sun's diameter.
