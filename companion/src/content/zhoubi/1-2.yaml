id: ZB.1.2
title: Numbers come from the circle and the square
paraphrase: |
  Shang Gao answers that numbers come from the circle and the square, the square from the trysquare
  (ju 矩, the carpenter's L-square, i.e. a right angle), and the trysquare from multiplication.
  Zhao Shuang makes this concrete. With $\pi$ taken as 3, a circle of diameter 1 has
  circumference 3 and a square of side 1 has perimeter 4. Straighten the two perimeters out, set
  them at right angles, and the slant line joining their ends is 5.

