id: ZB.2.9
title: Day and night at the pole — the sun's light reaches 167,000 li
paraphrase: |
  From spring to autumn equinox the region beneath the pole always has sunlight; from autumn to
  spring it never does. At the equinoxes the sun's light just reaches the pole. Since the equinox
  sun is 178,500 *li* from the pole, and its light stops at the edge of the polar region 11,500
  *li* short of the pole, the sun's light reaches 167,000 *li* in every direction.

diagram:
