id: ZB.6.1
title: Where the sun rises and sets at the solstices
paraphrase: |
  Divide the horizon into the twelve branches. At the winter solstice the sun rises in *chen*
  (east-south-east) and sets in *shen* (west-south-west), lighting only three branches; at the summer
  solstice it rises in *yin* (east-north-east) and sets in *xu* (west-north-west), lighting nine.
  So winter is cold, because little sunlight is seen, and summer is hot.

