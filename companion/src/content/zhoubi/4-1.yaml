id: ZB.4.1
title: Noon in one quarter, midnight in the opposite one
paraphrase: |
  The second volume restates the shape of the world: the region under the pole is 60,000 *li*
  higher than where people live, and heaven is shaped the same way. The sun's light reaches 810,000
  *li* across. Because the sun circles the pole, it is noon in the quarter it is over and midnight in
  the opposite quarter. Day and night trade places, but every quarter has the same seasons. In
  effect the Zhou bi describes time zones.

