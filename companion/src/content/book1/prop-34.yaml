id: I.34
kind: theorem
title: Opposite sides and angles of a parallelogram

paraphrase: |
  In a parallelogram, opposite sides are equal, opposite angles are equal, and a diagonal cuts it
  into two equal halves.

diagram:
  width: 290
  height: 200
  elements:
    - "A;point;free;90,50"
    - "B;point;free;250,50"
