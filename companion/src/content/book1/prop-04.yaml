id: I.4
kind: theorem
title: Side–angle–side

paraphrase: |
  If two triangles have two sides and the angle between them equal, they are equal in every
  respect: the third sides are equal, the triangles are equal, and the remaining angles are
  equal in pairs. In modern terms: **SAS congruence**.

