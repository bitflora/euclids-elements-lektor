id: I.32
kind: theorem
title: The angles of a triangle sum to two right angles

paraphrase: |
  Extend a side of a triangle: the exterior angle *equals* the sum of the two remote interior
  angles. Consequently the three angles of a triangle add up to two right angles (180°).

