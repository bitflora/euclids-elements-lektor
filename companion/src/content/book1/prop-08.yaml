id: I.8
kind: theorem
title: Side–side–side

paraphrase: |
  If two triangles have all three sides equal in pairs, the angles contained by the equal sides
  are equal. With [[I.4]] it follows that the triangles are equal in every respect: **SSS
  congruence**.

