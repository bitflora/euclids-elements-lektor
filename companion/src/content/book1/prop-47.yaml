  caption: |
    Drag {B} or {C}, and slide {A}: it stays on the circle with diameter {BC}, so the angle at {A}
    is always right. The two shaded pairs — square {GB} and rectangle {BL}, square {HC} and
    rectangle {CL} — keep equal areas.

