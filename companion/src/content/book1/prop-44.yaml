id: I.44
kind: problem
title: Applying a parallelogram to a given line

paraphrase: |
  Given a segment {AB}, a triangle {C} and an angle {D|angD}: construct on {AB} a parallelogram
  with an angle equal to {D|angD} and area equal to {C}.

