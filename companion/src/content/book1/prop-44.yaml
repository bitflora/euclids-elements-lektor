  given: [A, B, AB, C, D1D2, D2D3, D, angD]
  caption: |
    Slide {A}, {B}, {E} along the base line, and move the corners of the triangle {C} and the angle
    {D|angD}. The parallelogram {LB} on {AB} keeps the area of {C} and the angle {D|angD}.

steps:
  - part: enunciation
    text: "To a given straight line to apply, in a given rectilineal angle, a parallelogram equal to a given triangle."
    highlight: [AB, C, LB, angD]
    hint: |
      A problem: build, *on a given segment*, a parallelogram with given angle and given area. The
      classic "application of areas".
    explain:
      fact: |
        To "apply" (παραβάλλειν) a figure to a line means to build it with that line as one side.

  - part: setting-out
    text: "Let AB be the given straight line, C the given triangle and D the given rectilineal angle;"
    highlight: [AB, C, angD]
    hint: |
      The data.

  - part: specification
    text: "thus it is required to apply to the given straight line AB, in an angle equal to the angle D, a parallelogram equal to the given triangle C."
    highlight: [AB, C, angD]
    hint: |
      The goal.

  - part: construction
    text: "Let the parallelogram BEFG be constructed equal to the triangle C, in the angle EBG which is equal to D;"
    highlight: [BF, angGBE]
    adds: [E, F, G, BEFG, BE, BG, EF, FG, angGBE]
    hint: |
      First make *some* parallelogram {BEFG|BF} with the right area and angle ([[I.42]]).

  - part: construction
    text: "let it be placed so that BE is in a straight line with AB;"
    highlight: [BE, AB]
    hint: |
      Put it next to {AB}, with {BE} continuing {AB}.
    explain:
      implicit: |
        "Placed" suggests moving the parallelogram. Heath remarks that Euclid could instead have built
        it there from the start, by carrying out I.42 with {BE} on {AB} produced.

  - part: construction
    text: "let FG be drawn through to H, and let AH be drawn through A parallel to either BG or EF."
    highlight: [HF, AH, H]
    adds: [H, HF, AH]
    hint: |
      Extend {FG} to {H}, on the parallel to {BG} through {A} ([[I.31]]).

  - part: construction
    text: "Let HB be joined."
    highlight: [HB]
    adds: [HB]
    hint: |
      Join {HB}: it will be the diagonal of a large parallelogram.

  - part: proof
    text: "Then, since the straight line HF falls upon the parallels AH, EF, the angles AHF, HFE are equal to two right angles."
    highlight: [angAHF, angHFE, HF]
    adds: [angAHF, angHFE]
    hint: |
      Interior angles on one side of a transversal of parallels ([[I.29]]).
    explain:
      implicit: |
        "Falls" is in the aorist in the Greek (ἐνέπεσεν), here and later (Heath's note on line 14).

  - part: proof
    text: "Therefore the angles BHG, GFE are less than two right angles;"
    highlight: [angBHG, angHFE]
    adds: [angBHG]
    hint: |
      ∠{BHG} is part of ∠{AHF}, so the pair at {H} and {F} falls short.

  - part: proof
    text: "and straight lines produced indefinitely from angles less than two right angles meet;"
    highlight: [angBHG, angHFE]
    hint: |
      **Postulate 5** ([[I.Post.5]]), quoted.

  - part: proof
    text: "therefore HB, FE, when produced, will meet."
    highlight: [HB, EF]
    hint: |
      So {HB} and {FE} meet — the second (and last) direct use of the postulate in Book I after [[I.29]].

  - part: construction
    text: "Let them be produced and meet at K;"
    highlight: [K, HK, EK]
    adds: [K, HK, EK]
    hint: |
      Call the meeting point {K}.

  - part: construction
    text: "through the point K let KL be drawn parallel to either EA or FH,"
    highlight: [KL]
    adds: [KL, L]
    hint: |
      Through {K}, a parallel to the base line ([[I.31]]).

  - part: construction
    text: "and let HA, GB be produced to the points L, M."
    highlight: [AL, BM, L, M]
    adds: [AL, BM, M, LM, KM, LB]
    hint: |
      Extend {HA} to {L} and {GB} to {M}. The parallelogram {LB} (= {LABM|LB}) on {AB} is the answer.

  - part: proof
    text: "Then HLKF is a parallelogram, HK is its diameter, and AG, ME are parallelograms, and LB, BF the so-called complements, about HK;"
    highlight: [HLKF, HK, AG, ME, LB, BF]
    hint: |
      {HK} is the diagonal of the big parallelogram {HLKF}; {LB} and {BF} are its complements.

  - part: proof
    text: "therefore LB is equal to BF."
    highlight: [LB, BF]
    hint: |
      Complements are equal ([[I.43]]).

  - part: proof
    text: "But BF is equal to the triangle C; therefore LB is also equal to C."
    highlight: [LB, BF, C]
    hint: |
      So {LB} has the area of {C} ([[I.CN.1]]).

  - part: proof
    text: "And, since the angle GBE is equal to the angle ABM,"
    highlight: [angGBE, angABM]
    adds: [angABM]
    hint: |
      Vertical angles ([[I.15]]).

  - part: proof
    text: "while the angle GBE is equal to D, the angle ABM is also equal to the angle D."
    highlight: [angGBE, angABM, angD]
    hint: |
      So {LB} has the angle {D|angD}.

  - part: conclusion
    text: "Therefore the parallelogram LB equal to the given triangle C has been applied to the given straight line AB, in the angle ABM which is equal to D."
    highlight: [LB, AB, angABM]
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. F."
    hint: |
      What it was required to do.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.* Algebraically, the problem is a division:
    find the second side $x$ of a parallelogram with first side $a = AB$, angle $\delta$, and area
    $S$; i.e. $a\, x \sin\delta = S$.
  lines:
    - steps: [1, 2, 3, 4]
      text: Build any parallelogram $BF$ with angle $\delta$ and area $S$, with sides $b = BE$ and $y = BG$, so $b\,y \sin\delta = S$.
    - steps: [5, 6, 7, 8, 9, 10, 11, 12, 13]
      text: |
        The diagonal $HK$ cuts the line $BG$ produced at $M$ so that $BM : BG = BE : AB$ (similar
        triangles). With $x = BM$: $a x = b y$.
    - steps: [14, 15, 16, 17, 18]
      text: Hence $[LB] = a\,x \sin\delta = b\,y\sin\delta = S$. $\blacksquare$
  closing: |
    Euclid performs the division $x = by/a$ with no theory of proportion at all — only the equality
    of complements ([[I.43]]).

commentary: |
  One of the most important constructions in the *Elements*. With [[I.45]] it lets any rectilinear
  area be "applied" to any segment, which is the geometric equivalent of dividing an area by a
  length. Books II and VI extend it to applications that fall short or exceed — the geometric
  solution of quadratic equations.

gaps: |
  - **"Placed"** (step 2): moving the parallelogram is a kind of superposition, avoidable as Heath notes.
  - **Intersections** of the parallels, taken from the figure.

historical: |
  Proclus, citing Eudemus, calls the application of areas an ancient discovery of the Pythagoreans.
  Its three forms — *parabolē* (exact application), *elleipsis* (falling short) and *hyperbolē*
  (exceeding) — gave Apollonius the names of the conic sections: parabola, ellipse, hyperbola.
