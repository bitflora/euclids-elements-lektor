id: I.23
kind: problem
title: Copying an angle

paraphrase: |
  Given an angle {DCE|angDCE}, and a line {AB} with a point {A} on it, construct at {A} an angle
  on {AB} equal to the given angle.

diagram:
  width: 340
  height: 220
  elements:
    - "D;point;free;270,35"
    - "C;point;free;210,70"
    - "E;point;free;290,150"
    - "D1;line;extend;C,D,C,D;0;0"
    - "E1;line;extend;C,E,C,E;0;0"
    - "CDE;polygon;triangle;C,D,E;0;0;black;#dfe7ea"
    - "A;point;free;20,200"
    - "B;point;free;190,200"
    - "AB;line;connect;A,B"
    - "DE;line;connect;D,E"
    - "G;point;cutoff;A,B,C,E"
    - "AGF;polygon;similar;A,G,C,E,D;0;0;black;#efe4d2"
    - "F;point;vertex;AGF,3"
    - "CD;line;connect;C,D;0;0;0"
    - "CE;line;connect;C,E;0;0;0"
    - "AF;line;connect;A,F;0;0;0"
    - "AG;line;connect;A,G;0;0;0"
    - "FG;line;connect;F,G;0;0;0"
    - "angDCE;sector;angleMarker;C,D,E"
    - "angFAG;sector;angleMarker;A,F,G"
  aliases:
    AFG: AGF
    DC: CD
    FA: AF
    GF: FG
    DCE: angDCE
    FAG: angFAG
  given: [A, B, AB, C, D, E, D1, E1, angDCE]
  caption: |
    Drag {C}, {D}, {E} to change the given angle, or {A}, {B} to move the line. Triangle {AFG} is
    rebuilt with sides equal to those of {CDE}, so ∠{FAG} always matches ∠{DCE}.

steps:
  - part: enunciation
    text: "On a given straight line and at a point on it to construct a rectilineal angle equal to a given rectilineal angle."
    highlight: [angDCE, angFAG, AB, A]
    hint: |
      A problem: copy a given angle to a given place on a given line.

  - part: setting-out
    text: "Let AB be the given straight line, A the point on it, and the angle DCE the given rectilineal angle;"
    highlight: [AB, A, angDCE]
    hint: |
      The data.

  - part: specification
    text: "thus it is required to construct on the given straight line AB, and at the point A on it, a rectilineal angle equal to the given rectilineal angle DCE."
    highlight: [AB, A, angDCE]
    hint: |
      The goal restated.

  - part: construction
    text: "On the straight lines CD, CE respectively let the points D, E be taken at random;"
    highlight: [D, E]
    hint: |
      Pick any point on each arm of the angle.
    explain:
      implicit: |
        The letters {D} and {E} already name the angle; here Euclid treats them as points chosen on
        its arms.

  - part: construction
    text: "let DE be joined,"
    highlight: [DE, CDE]
    adds: [DE, CDE]
    hint: |
      Join {DE}, making a triangle {CDE} ([[I.Post.1]]).
    cites: [I.Post.1]

  - part: construction
    text: "and out of three straight lines which are equal to the three straight lines CD, DE, CE let the triangle AFG be constructed in such a way that CD is equal to AF, CE to AG, and further DE to FG."
    highlight: [AGF, AF, AG, FG]
    adds: [AGF, F, G]
    hint: |
      Build a copy {AFG} of triangle {CDE} at {A}, along {AB}, using [[I.22]].
    explain:
      did: |
        Applies I.22 with the three sides of {CDE}.
      justification: "[[I.22]] (not bracketed by Heath)."
      implicit: |
        That I.22's condition holds — it does, because {CD}, {DE}, {CE} already form a triangle
        ([[I.20]]). And that the copy is placed with {AG} *along* {AB}, which means starting I.22's
        construction from {A} in the direction of {B}.
    cites: [I.22]
    modern: |
      $$AF = CD,\quad AG = CE,\quad FG = DE$$

  - part: proof
    text: "Then, since the two sides DC, CE are equal to the two sides FA, AG respectively, and the base DE is equal to the base FG, the angle DCE is equal to the angle FAG."
    highlight: [angDCE, angFAG, CDE, AGF]
    adds: [angFAG]
    hint: |
      SSS ([[I.8]]): the angles opposite the equal bases are equal.
    modern: |
      $$\triangle CDE \cong \triangle AFG \;\Longrightarrow\; \angle DCE = \angle FAG$$

  - part: conclusion
    text: "Therefore on the given straight line AB, and at the point A on it, the rectilineal angle FAG has been constructed equal to the given rectilineal angle DCE."
    highlight: [angFAG, angDCE]
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. F."
    hint: |
      What it was required to do.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.* In Hilbert's system angle transfer is an
    *axiom* (III.4): on a given side of a given ray there is exactly one ray making a given angle
    with it. In ruler-and-compass terms, Euclid's construction proves the existence half.
  lines:
    - steps: [1, 2, 3, 4]
      text: Choose $D$, $E$ on the arms; $\triangle CDE$ has sides $CD$, $DE$, $CE$.
    - steps: [5]
      text: |
        Let $G$ on ray $AB$ with $AG = CE$, and $F$ (on a chosen side of $AB$) with $AF = CD$,
        $GF = DE$ — possible by I.22, since these lengths satisfy the triangle inequality.
    - steps: [6, 7]
      text: SSS gives $\angle FAG = \angle DCE$. $\blacksquare$

commentary: |
  I.23 is the angle-copying tool used constantly from here on: in [[I.24]], [[I.31]] (parallels),
  [[I.42]] and [[I.44]]. It completes a small set of "transfer" constructions — segments ([[I.2]],
  [[I.3]]) and now angles — that let Euclid move magnitudes without superposition.

gaps: |
  - **Which side of {AB}?** Either side gives a correct angle; Euclid does not choose.
  - **Placement**: I.22 builds a triangle somewhere; that it can be built with a side along {AB}
    from {A} requires following its construction from that point.

historical: |
  Proclus, citing Eudemus, says that this problem was the discovery of Oenopides of Chios.
