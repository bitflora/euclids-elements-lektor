    - "angABC;sector;angleMarker;B,A,C"
    - "angACB;sector;angleMarker;C,A,B"
    - "angCBD;sector;angleMarker;B,C,D"
    - "angBCE;sector;angleMarker;C,B,E"
    - "angABG;sector;angleMarker;B,A,G"
    - "angACF;sector;angleMarker;C,A,F"
    - "angAFC;sector;angleMarker;F,A,C"
    - "angAGB;sector;angleMarker;G,A,B"
