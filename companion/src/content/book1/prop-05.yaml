id: I.5
kind: theorem
title: The base angles of an isosceles triangle (pons asinorum)

paraphrase: |
  In a triangle with two equal sides, the angles opposite those sides are equal; and if the
  equal sides are extended past the base, the angles formed below the base are equal too.

diagram:
  width: 340
  height: 290
  pivot: M
  elements:
    - "B;point;free;120,150"
    - "C;point;free;220,150"
    - "M;point;midpoint;B,C;0;0"
    - "MM;line;perpendicular;M,B;0;0;0"
    - "A;point;lineSlider;MM,170,35"
    - "ABC;polygon;triangle;A,B,C;0;0;black;#efe4d2"
    - "BD;line;extend;A,B,A,B"
    - "D;point;last;BD;black;0"
    - "CE;line;extend;A,C,A,C"
    - "E;point;last;CE;black;0"
    - "F;point;lineSlider;BD,90,215"
    - "AG;line;cutoff;A,E,A,F;0;0;0"
    - "G;point;last;AG"
    - "FC;line;connect;F,C"
    - "BG;line;connect;B,G"
    - "AB;line;connect;A,B;0;0;0"
    - "AC;line;connect;A,C;0;0;0"
    - "BC;line;connect;B,C;0;0;0"
    - "AF;line;connect;A,F;0;0;0"
    - "AE;line;connect;A,E;0;0;0"
    - "BF;line;connect;B,F;0;0;0"
    - "CG;line;connect;C,G;0;0;0"
    - "AFC;polygon;triangle;A,F,C;0;0;0;0"
    - "AGB;polygon;triangle;A,G,B;0;0;0;0"
    - "BFC;polygon;triangle;B,F,C;0;0;0;0"
