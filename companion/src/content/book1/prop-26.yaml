id: I.26
kind: theorem
title: Angle–side–angle and angle–angle–side

paraphrase: |
  Two triangles with two pairs of equal angles and one pair of equal sides are equal in every
  respect — whether the side lies between the two angles (**ASA**) or opposite one of them (**AAS**).

