id: I.33
kind: theorem
title: Joining equal parallels gives equal parallels

paraphrase: |
  If {AB} and {CD} are equal and parallel, the lines {AC} and {BD} joining their ends (on the same
  side) are also equal and parallel. In other words: the figure {ABDC|CABD} is a parallelogram.

diagram:
  width: 270
  height: 160
  elements:
    - "A;point;free;40,40"
    - "B;point;free;180,40"
    - "C;point;free;80,120"
    - "CABD;polygon;parallelogram;C,A,B;0;0;black;#efe4d2"
    - "D;point;vertex;CABD,4"
    - "BC;line;connect;B,C"
    - "AB;line;connect;A,B;0;0;0"
    - "CD;line;connect;C,D;0;0;0"
    - "AC;line;connect;A,C;0;0;0"
    - "BD;line;connect;B,D;0;0;0"
    - "AD;line;connect;A,D;0;0;0"
    - "ABC;polygon;triangle;A,B,C;0;0;0;0"
    - "DCB;polygon;triangle;D,C,B;0;0;0;0"
    - "angABC;sector;angleMarker;B,C,A,22;0;0;red;red"
    - "angBCD;sector;angleMarker;C,B,D,22;0;0;red;red"
    - "angACB;sector;angleMarker;C,A,B,22;0;0;blue;blue"
    - "angCBD;sector;angleMarker;B,C,D,22;0;0;blue;blue"
  aliases:
    DC: CD
    CB: BC
    CBA: angABC
    BCD: angBCD
    ACB: angACB
    CBD: angCBD
  given: [A, B, C, D, CABD]
  caption: |
    Drag {A}, {B} or {C}; {D} is placed so that {CD} is equal and parallel to {AB}.

steps:
  - part: enunciation
    text: "The straight lines joining equal and parallel straight lines (at the extremities which are) in the same directions (respectively) are themselves also equal and parallel."
    highlight: [AB, CD, AC, BD]
    hint: |
      Join the corresponding ends of two equal parallel segments: the joining lines are equal and
      parallel too.
    explain:
      implicit: |
        The bracketed words are Heath's: the Greek says only "joining … in the same directions"
        (Heath's note on line 1). Joining the *crossed* ends ({AD}, {BC}) would give the diagonals instead.

  - part: setting-out
    text: "Let AB, CD be equal and parallel, and let the straight lines AC, BD join them (at the extremities which are) in the same directions (respectively);"
    highlight: [AB, CD, AC, BD]
    hint: |
      The data: {AB} = {CD} and {AB} ∥ {CD}.

  - part: specification
    text: "I say that AC, BD are also equal and parallel."
    highlight: [AC, BD]
    hint: |
      The goal: {AC} = {BD} and {AC} ∥ {BD}.

  - part: construction
    text: "Let BC be joined."
    highlight: [BC]
    adds: [BC]
    hint: |
      Draw the diagonal {BC}, splitting the figure into two triangles.

  - part: proof
    text: "Then, since AB is parallel to CD, and BC has fallen upon them, the alternate angles ABC, BCD are equal to one another."
    highlight: [AB, CD, BC, angABC, angBCD]
    adds: [angABC, angBCD]
    hint: |
      Parallels cut by {BC}: alternate angles equal ([[I.29]]).
    modern: |
      $$\angle ABC = \angle BCD$$

  - part: proof
    text: "And, since AB is equal to CD, and BC is common, the two sides AB, BC are equal to the two sides DC, CB;"
    highlight: [ABC, DCB, AB, CD, BC]
    hint: |
      Triangles {ABC} and {DCB}: {AB} = {DC} and {BC} shared.
    explain:
      implicit: |
        Heath writes "{DC}, {CB}" and "{DCB}" so that corresponding letters line up; the Greek has
        "{BC}, {CD}" and "{BCD}". Euclid, Heath notes, prefers alphabetical order to matching order
        (his note on lines 15 and 18).

  - part: proof
    text: "and the angle ABC is equal to the angle BCD;"
    highlight: [angABC, angBCD]
    hint: |
      With the equal angles between.

  - part: proof
    text: "therefore the base AC is equal to the base BD, and the triangle ABC is equal to the triangle DCB, and the remaining angles will be equal to the remaining angles respectively, namely those which the equal sides subtend;"
    highlight: [AC, BD, ABC, DCB]
    hint: |
      SAS ([[I.4]]). In particular {AC} = {BD}.
    modern: |
      $$\triangle ABC \cong \triangle DCB,\quad AC = DB$$

  - part: proof
    text: "therefore the angle ACB is equal to the angle CBD."
    highlight: [angACB, angCBD]
    adds: [angACB, angCBD]
    hint: |
      And the angles at {C} and {B} opposite the equal sides {AB}, {DC}.
    modern: |
      $$\angle ACB = \angle CBD$$

  - part: proof
    text: "And, since the straight line BC falling on the two straight lines AC, BD has made the alternate angles equal to one another, AC is parallel to BD."
    highlight: [AC, BD, angACB, angCBD]
    hint: |
      Equal alternate angles ⇒ parallel ([[I.27]]).

  - part: proof
    text: "And it was also proved equal to it."
    highlight: [AC, BD]
    hint: |
      Equal and parallel.

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.* In vector terms the theorem is almost
    immediate:
  lines:
    - steps: [1, 2]
      text: |
        $\vec{AB} = \vec{CD}$ (equal, parallel, same direction).
    - steps: [3, 4, 5, 6, 7, 8, 9]
      text: |
        Then $\vec{AC} = \vec{AB} + \vec{BC} = \vec{CD} + \vec{BC} = \vec{BD}$. $\blacksquare$
  closing: |
    The vector identity hides the parallel postulate: it is what makes the plane a vector space at
    all.

commentary: |
  I.33 is the bridge to parallelograms. Euclid has never defined a parallelogram; the word first
  appears in [[I.34]]. Proclus remarks that I.33 is what shows a parallelogram to exist, built from
  one segment and an equal parallel one.

gaps: |
  - **"In the same directions"**: that {A}, {C} and {B}, {D} are on the same side of {BC} — needed
    for the angles to be alternate.

historical: |
  Proclus observes that I.33 lets Euclid introduce the parallelogram in I.34 without a separate
  definition: the figure is generated here.
