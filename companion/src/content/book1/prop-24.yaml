id: I.24
kind: theorem
title: The hinge theorem

paraphrase: |
  Two triangles with two pairs of equal sides: the one whose angle between those sides is larger
  has the larger third side. (Picture the two sides as the arms of a hinge: open it wider and the
  ends move apart.)

diagram:
  width: 330
  height: 270
  elements:
