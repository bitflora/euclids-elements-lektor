id: II.14
kind: problem
title: Squaring a rectilinear figure

paraphrase: |
  Given any rectilinear figure {A}, construct a square of the same area. First turn {A} into a
  rectangle ([[I.45]]), then turn the rectangle into a square by finding the mean proportional of its
  sides.

diagram:
  width: 470
  height: 260
  elements:
    - "A1;point;free;80,40;0"
