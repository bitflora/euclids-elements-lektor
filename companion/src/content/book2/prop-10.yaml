id: II.10
kind: theorem
title: Squares on a line bisected and produced

paraphrase: |
  Bisect {AB} at {C} and extend it to {D}. The squares on {AD} and {DB} together are twice the
  squares on the half {AC} and on {CD}. In algebra, with half $a$ and extension $b$:
  $(2a + b)^2 + b^2 = 2\big(a^2 + (a + b)^2\big)$.

