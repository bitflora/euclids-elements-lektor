id: II.8
kind: theorem
title: Four rectangles and a square

paraphrase: |
  Cut {AB} at {C}. Four times the rectangle on {AB}, {BC}, plus the square on {AC}, equals the
  square on {AB} and {BC} laid end to end. In algebra, with $AB = a$, $BC = b$:
  $4ab + (a - b)^2 = (a + b)^2$.

