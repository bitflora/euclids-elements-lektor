id: II.5
kind: theorem
title: Equal and unequal segments (difference of squares)

paraphrase: |
  Cut {AB} in half at {C} and somewhere else at {D}. The rectangle on the unequal pieces {AD},
  {DB}, plus the square on the gap {CD}, equals the square on the half. In algebra:
  $(a + b)(a - b) + b^2 = a^2$, where $a$ is the half and $b$ the gap.

