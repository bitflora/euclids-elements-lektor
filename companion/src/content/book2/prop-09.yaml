id: II.9
kind: theorem
title: Squares on unequal segments

paraphrase: |
  Cut {AB} in half at {C} and elsewhere at {D}. The squares on the unequal pieces {AD}, {DB}
  together are twice the squares on the half {AC} and the gap {CD}. In algebra:
  $(a + b)^2 + (a - b)^2 = 2(a^2 + b^2)$.

diagram:
  width: 310
  height: 250
  elements:
    - "A;point;free;40,200"
    - "B;point;free;270,200"
    - "AB;line;connect;A,B"
    - "C;point;midpoint;AB"
    - "D;point;lineSlider;AB,200,200"
    - "CE;line;perpendicular;C,B"
    - "E;point;last;CE"
    - "AE;line;connect;A,E"
    - "BE;line;connect;B,E"
    - "Fp;point;parallelogram;E,C,D;0;0"
    - "F;point;intersection;D,Fp,B,E"
    - "FG;line;parallel;F,D,C"
    - "G;point;last;FG"
