id: II.1
kind: theorem
title: The distributive law, in rectangles

paraphrase: |
  Take two lines, {A} and {BC}, and cut {BC} into pieces. The rectangle on {A} and {BC} equals the
  sum of the rectangles on {A} and each piece. In algebra: $a(b + c + d) = ab + ac + ad$.

