id: II.7
kind: theorem
title: The square of a difference

paraphrase: |
  Cut {AB} at {C}. The squares on the whole {AB} and on the piece {BC} together equal twice the
  rectangle on {AB}, {BC} plus the square on the other piece {CA}. In algebra, with $AB = a$,
  $BC = b$: $a^2 + b^2 = 2ab + (a - b)^2$.

