id: II.6
kind: theorem
title: A line bisected and produced

paraphrase: |
  Bisect {AB} at {C} and extend it by {BD}. The rectangle on {AD} and {DB}, plus the square on the
  half {CB}, equals the square on {CD}. In algebra, with half $a$ and extension $b$:
  $(2a + b)b + a^2 = (a + b)^2$.

