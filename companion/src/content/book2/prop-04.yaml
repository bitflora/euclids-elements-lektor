  given: [A, B, C, AB]
  caption: |
    Slide {A}, {B} and the cut {C}. The two squares on the diagonal and the two equal rectangles
    always fill the big square.

  equal:
    - [CB, CG, GK, KB]
    - [angCGB, angADB, angABD]
