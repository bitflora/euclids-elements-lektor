id: II.4
kind: theorem
title: The square of a sum

paraphrase: |
  Cut {AB} at {C}. The square on the whole equals the squares on the two pieces plus twice the
  rectangle on the pieces. In algebra: $(a + b)^2 = a^2 + b^2 + 2ab$.

diagram:
  width: 230
  height: 220
  elements:
    - "A0;point;free;-1000,40;0"
    - "A3;point;free;1000,40;0"
