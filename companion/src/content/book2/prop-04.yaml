  aliases:
    HF: DFGH
    CK: CBKG
    KC: CBKG
    CGKB: CBKG
    AG: ACGH
    GE: GKEF
    BA: AB
    BC: CB
    GC: CG
    BK: KB
    EB: BE
    CGB: angCGB
    ADB: angADB
    ABD: angABD
    GBC: angABD
    KBC: angKBC
    GCB: angGCB
    BCG: angGCB
    CGK: angCGK
