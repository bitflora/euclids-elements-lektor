id: VIII.2
kind: problem
title: The least geometric progression with a given ratio

paraphrase: |
  Given a ratio {A} : {B} in lowest terms, find the least numbers, as many as wanted, in continued
  proportion in that ratio. For four terms: {A}³, {A}²{B}, {A}{B}², {B}³.

