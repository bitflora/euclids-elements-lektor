id: VIII.9
kind: theorem
title: Coprime ends of a progression are powers

paraphrase: |
  If {A} and {B} are coprime and {C}, {D} fall between them in continued proportion, then as many numbers fall
  in continued proportion between each of {A}, {B} and the unit. In effect: {A} and {B} are cubes (squares, if
  one mean; $n$th powers in general).

