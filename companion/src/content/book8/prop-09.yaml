steps:
  - part: enunciation
    text: "If two numbers be prime to one another, and numbers fall between them in continued proportion, then, however many numbers fall between them in continued proportion, so many will also fall between each of them and an unit in continued proportion."
    highlight: [A, B, E]
    hint: |
      Coprime ends of a geometric progression of $n$ terms are $(n-1)$th powers.
    modern: |
      $\gcd(a, b) = 1$ and $a, c_1, \dots, c_k, b$ geometric $\Rightarrow$ $a = f^{k+1}$, $b = g^{k+1}$.

  - part: setting-out
    text: "Let A, B be two numbers prime to one another, and let C, D fall between them in continued proportion, and let the unit E be set out;"
    highlight: [A, C, D, B, E]
    hint: |
      {A}, {C}, {D}, {B} in continued proportion, {A}, {B} coprime; {E} the unit.

  - part: specification
    text: "I say that, as many numbers as fall between A, B in continued proportion, so many will also fall between either of the numbers A, B and the unit in continued proportion."
    highlight: [A, B, E]
    hint: |
      To prove: two numbers fall between {E} and {A}, and between {E} and {B}.

  - part: construction
    text: "For let two numbers F, G, the least that are in the ratio of A, C, D, B, be taken, three numbers H, K, L with the same property, and others more by one continually, until their multitude is equal to the multitude of A, C, D, B."
    highlight: [F, G, H, K, L]
    hint: |
      The ratio in lowest terms {F} : {G}; then the least progressions {H}, {K}, {L} and so on ([[VIII.2]]).

  - part: construction
    text: "Let them be taken, and let them be M, N, O, P."
    highlight: [M, N, O, P]
    hint: |
      The four-term one {M}, {N}, {O}, {P}.

  - part: proof
    text: "It is now manifest that F by multiplying itself has made H and by multiplying H has made M, while G by multiplying itself has made L and by multiplying L has made P."
    highlight: [F, H, M, G, L, P]
    hint: |
      {H} = {F}², {M} = {F}³; {L} = {G}², {P} = {G}³ ([[VIII.2]], porism).

  - part: proof
    text: "And, since M, N, O, P are the least of those which have the same ratio with F, G, and A, C, D, B are also the least of those which have the same ratio with F, G, while the multitude of the numbers M, N, O, P is equal to the multitude of the numbers A, C, D, B, therefore M, N, O, P are equal to A, C, D, B respectively;"
    highlight: [M, N, O, P, A, C, D, B]
    hint: |
      {A}, {C}, {D}, {B} is least ([[VIII.1]], coprime extremes), so it *is* {M}, {N}, {O}, {P}.

  - part: proof
    text: "therefore M is equal to A, and P to B."
    highlight: [M, A, P, B]
    hint: |
      {A} = {F}³, {B} = {G}³.

  - part: proof
    text: "Now, since F by multiplying itself has made H, therefore F measures H according to the units in F."
    highlight: [F, H]
    hint: |
      {H} = {F}·{F}.

  - part: proof
    text: "But the unit E also measures F according to the units in it; therefore the unit E measures the number F the same number of times as F measures H."
    highlight: [E, F, H]
    hint: |
      As the unit to {F}, so {F} to {H}.

  - part: proof
    text: "Therefore, as the unit E is to the number F, so is F to H."
    highlight: [E, F, H]
    hint: |
      {E} : {F} = {F} : {H} ([[VII.Def.20]]).

  - part: proof
    text: "Again, since F by multiplying H has made M, therefore H measures M according to the units in F."
    highlight: [H, M, F]
    hint: |
      {M} = {F}·{H}.

  - part: proof
    text: "But the unit E also measures the number F according to the units in it; therefore the unit E measures the number F the same number of times as H measures M."
    highlight: [E, F, H, M]
    hint: |
      Likewise.

  - part: proof
    text: "Therefore, as the unit E is to the number F, so is H to M."
    highlight: [E, F, H, M]
    hint: |
      {E} : {F} = {H} : {M}.
    cites: [VII.Def.20]

  - part: proof
    text: "But it was also proved that, as the unit E is to the number F, so is F to H; therefore also, as the unit E is to the number F, so is F to H, and H to M."
    highlight: [E, F, H, M]
    hint: |
      {E}, {F}, {H}, {M} are in continued proportion.

  - part: proof
    text: "But M is equal to A; therefore, as the unit E is to the number F, so is F to H, and H to A."
    highlight: [E, F, H, A]
    hint: |
      Two numbers {F}, {H} fall between the unit and {A}.

  - part: proof
    text: "For the same reason also, as the unit E is to the number G, so is G to L and L to B."
    highlight: [E, G, L, B]
    hint: |
      And {G}, {L} between the unit and {B}.

  - part: proof
    text: "Therefore, as many numbers as have fallen between A, B in continued proportion, so many numbers also have fallen between each of the numbers A, B and the unit E in continued proportion."
    highlight: [A, B, E]
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [4, 5, 6, 7, 8]
      text: |
        With ratio $f : g$ in lowest terms, the least four-term progression is $f^3, f^2g, fg^2, g^3$; a
        progression with coprime ends is least ([[VIII.1]]), so $a = f^3$, $b = g^3$.
    - steps: [9, 10, 11, 12, 13, 14, 15, 16, 17]
      text: |
        And $1, f, f^2, f^3$ and $1, g, g^2, g^3$ are progressions. $\blacksquare$

commentary: |
  Joyce's example: 8 and 27 are coprime and 8, 12, 18, 27 is a progression; so 8 and 27 are cubes. Euclid
  has no word for "$n$th power"; "as many numbers fall between it and the unit" is how he says it.
