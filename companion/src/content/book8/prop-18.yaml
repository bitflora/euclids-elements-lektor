id: VIII.18
kind: theorem
title: One mean between similar plane numbers

paraphrase: |
  Between two similar plane numbers {A} = {C}{D} and {B} = {E}{F} (with {C} : {D} = {E} : {F}) there is one
  mean proportional, and {A} : {B} is the duplicate of {C} : {E}.

