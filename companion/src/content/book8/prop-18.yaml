steps:
  - part: enunciation
    text: "Between two similar plane numbers there is one mean proportional number; and the plane number has to the plane number the ratio duplicate of that which the corresponding side has to the corresponding side."
    highlight: [A, B]
    hint: |
      Generalises [[VIII.11]] from squares to similar rectangles of numbers.
    modern: |
      $c : d = e : f \Rightarrow cd : de = de : ef$, and $cd : ef = (c : e)^2$.

  - part: setting-out
    text: "Let A, B be two similar plane numbers, and let the numbers C, D be the sides of A, and E, F of B."
    highlight: [A, B, C, D, E, F]
    hint: |
      {A} = {C}{D}, {B} = {E}{F}.

  - part: proof
    text: "Now, since similar plane numbers are those which have their sides proportional, therefore, as C is to D, so is E to F."
    highlight: [C, D, E, F]
    hint: |
      [[VII.Def.21]].

  - part: specification
    text: "I say then that between A, B there is one mean proportional number, and A has to B the ratio duplicate of that which C has to E, or D to F, that is, of that which the corresponding side has to the corresponding side."
    highlight: [A, B]
    hint: |
      Two claims.

  - part: proof
    text: "Now since, as C is to D, so is E to F, therefore, alternately, as C is to E, so is D to F."
    highlight: [C, E, D, F]
    hint: |
      Alternate ([[VII.13]]).

  - part: proof
    text: "And, since A is plane, and C, D are its sides, therefore D by multiplying C has made A."
    highlight: [D, C, A]
    hint: |
      {A} = {D}{C}.

  - part: proof
    text: "For the same reason also E by multiplying F has made B."
    highlight: [E, F, B]
    hint: |
      {B} = {E}{F}.

  - part: construction
    text: "Now let D by multiplying E make G."
    highlight: [G]
    hint: |
      The mean: {G} = {D}{E}.

  - part: proof
    text: "Then, since D by multiplying C has made A, and by multiplying E has made G, therefore, as C is to E, so is A to G."
    highlight: [C, E, A, G]
    hint: |
      [[VII.17]].

  - part: proof
    text: "But, as C is to E, so is D to F; therefore also, as D is to F, so is A to G."
    highlight: [D, F, A, G]
    hint: |
      {A} : {G} = {D} : {F}.

  - part: proof
    text: "Again, since E by multiplying D has made G, and by multiplying F has made B, therefore, as D is to F, so is G to B."
    highlight: [D, F, G, B]
    hint: |
      [[VII.17]].

  - part: proof
    text: "But it was also proved that, as D is to F, so is A to G; therefore also, as A is to G, so is G to B."
    highlight: [A, G, B]
    hint: |
      {A} : {G} = {G} : {B}.

  - part: proof
    text: "Therefore A, G, B are in continued proportion."
    highlight: [A, G, B]
    hint: |
      In continued proportion.

  - part: proof
    text: "Therefore between A, B there is one mean proportional number."
    highlight: [G]
    hint: |
      First claim.

  - part: specification
    text: "I say next that A also has to B the ratio duplicate of that which the corresponding side has to the corresponding side, that is, of that which C has to E or D to F."
    highlight: [A, B]
    hint: |
      Second claim.

  - part: proof
    text: "For, since A, G, B are in continued proportion, A has to B the ratio duplicate of that which it has to G."
    highlight: [A, G, B]
    hint: |
      [[V.Def.9]].

  - part: proof
    text: "And, as A is to G, so is C to E, and so is D to F."
    highlight: [A, G]
    hint: |
      Shown above.

  - part: proof
    text: "Therefore A also has to B the ratio duplicate of that which C has to E or D to F."
    highlight: [A, B]
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.* Let $c : e = d : f = r$.
  lines:
    - steps: [5, 6, 7, 8, 9, 10, 11, 12, 13]
      text: |
        $cd : de = c : e = r$ and $de : ef = d : f = r$.
    - steps: [14, 15, 16, 17]
      text: |
        So $cd : ef = r^2$. $\blacksquare$

commentary: |
  The converse is [[VIII.20]]. Joyce's second figure (not used here) draws the numbers as rectangles, which
  is the picture behind the word "plane".
