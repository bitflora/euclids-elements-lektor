  caption: |
    {C}, {D} are the two means between {A} and {B}; {E}, {F}, {G}, {H} are least in their ratio.

steps:
  - part: enunciation
    text: "Similar solid numbers have to one another the ratio which a cube number has to a cube number."
    highlight: [A, B]
    hint: |
      The solid version of [[VIII.26]].
    modern: |
      $a, b$ similar solid $\Rightarrow a : b = s^3 : t^3$.

  - part: setting-out
    text: "Let A, B be similar solid numbers;"
    highlight: [A, B]
    hint: |
      {A}, {B} similar solid numbers.

  - part: specification
    text: "I say that A has to B the ratio which a cube number has to a cube number."
    highlight: [A, B]
    hint: |
      To prove.

  - part: proof
    text: "For, since A, B are similar solid numbers, therefore two mean proportional numbers fall between A, B."
    highlight: [A, B]
    hint: |
      [[VIII.19]].

  - part: construction
    text: "Let C, D so fall, and let E, F, G, H, the least numbers of those which have the same ratio with A, C, D, B, and equal with them in multitude, be taken;"
    highlight: [C, D, E, F, G, H]
    hint: |
      Means {C}, {D}; least numbers {E}, {F}, {G}, {H}.

  - part: proof
    text: "therefore the extremes of them E, H are cube."
    highlight: [E, H]
    hint: |
      The porism of [[VIII.2]].

  - part: proof
    text: "And, as E is to H, so is A to B; therefore A also has to B the ratio which a cube number has to a cube number."
    highlight: [E, H, A, B]
    hint: |
      Ex aequali ([[VII.14]]).
    cites: [VII.14]

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6]
      text: |
        With side ratio $u/v$, $a/b = u^3/v^3$. $\blacksquare$

commentary: |
  The last proposition of Book VIII. Book IX continues the theory with squares, cubes and products of
  similar numbers ([[IX.1]]–[[IX.10]]).
