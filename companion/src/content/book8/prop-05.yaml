id: VIII.5
kind: theorem
title: Plane numbers are in the ratio compounded of their sides

paraphrase: |
  If {A} = {C}·{D} and {B} = {E}·{F}, then {A} : {B} is the ratio compounded of {C} : {E} and {D} : {F}. In
  fractions: $\tfrac{cd}{ef} = \tfrac{c}{e}\cdot\tfrac{d}{f}$.

