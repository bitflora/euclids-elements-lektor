  caption: |
    {A} = {C}{D}, {B} = {E}{F}. {G}, {H}, {K} are least with {G} : {H} = {C} : {E} and {H} : {K} = {D} :
    {F}; {L} = {D}{E}.

  equal:
    - [A, G]
    - [B, K]

steps:
  - part: enunciation
    text: "Plane numbers have to one another the ratio compounded of the ratios of their sides."
    highlight: [A, B]
    hint: |
      $cd : ef$ is the ratio $c : e$ compounded with $d : f$.
    explain:
      fact: |
        *Compounding* two ratios $p : q$ and $q' : r'$: find numbers $x, y, z$ with $x : y = p : q$ and $y : z
        = q' : r'$; then $x : z$ is the compound ratio ([[VIII.4]] supplies $x, y, z$). In modern terms it is
        the product of the fractions.
    modern: |
      $\dfrac{cd}{ef} = \dfrac{c}{e} \cdot \dfrac{d}{f}$.

  - part: setting-out
    text: "Let A, B be plane numbers, and let the numbers C, D be the sides of A, and E, F of B;"
    highlight: [A, B, C, D, E, F]
    hint: |
      {A} = {C}{D}, {B} = {E}{F} ([[VII.Def.16]]).

  - part: specification
    text: "I say that A has to B the ratio compounded of the ratios of the sides."
    highlight: [A, B]
    hint: |
      To prove.

  - part: construction
    text: "For, the ratios being given which C has to E and D to F, let the least numbers G, H, K that are continuously in the ratios C: E, D: F be taken, so that, as C is to E, so is G to H, and, as D is to F, so is H to K."
    highlight: [G, H, K]
    hint: |
      By [[VIII.4]]: {G} : {H} = {C} : {E} and {H} : {K} = {D} : {F}. Then {G} : {K} is the compound ratio.

  - part: construction
    text: "And let D by multiplying E make L."
    highlight: [L]
    hint: |
      An intermediate product {L} = {D}{E}.

  - part: proof
    text: "Now, since D by multiplying C has made A, and by multiplying E has made L, therefore, as C is to E, so is A to L."
    highlight: [C, E, A, L]
    hint: |
      [[VII.17]]: {C} : {E} = {D}{C} : {D}{E} = {A} : {L}.

  - part: proof
    text: "But, as C is to E, so is G to H; therefore also, as G is to H, so is A to L."
    highlight: [G, H, A, L]
    hint: |
      {G} : {H} = {A} : {L}.

  - part: proof
    text: "Again, since E by multiplying D has made L, and further by multiplying F has made B, therefore, as D is to F, so is L to B."
    highlight: [D, F, L, B]
    hint: |
      [[VII.17]]: {D} : {F} = {E}{D} : {E}{F} = {L} : {B}.

  - part: proof
    text: "But, as D is to F, so is H to K; therefore also, as H is to K, so is L to B."
    highlight: [H, K, L, B]
    hint: |
      {H} : {K} = {L} : {B}.

  - part: proof
    text: "But it was also proved that, as G is to H, so is A to L; therefore, ex aequali, as G is to K, so is A to B."
    highlight: [G, K, A, B]
    hint: |
      Ex aequali ([[VII.14]]): {G} : {K} = {A} : {B}.

  - part: proof
    text: "But G has to K the ratio compounded of the ratios of the sides; therefore A also has to B the ratio compounded of the ratios of the sides."
    highlight: [A, B]
    hint: |
      So {A} : {B} is the compound ratio.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [5, 6, 7, 8, 9, 10]
      text: |
        $\dfrac{cd}{ef} = \dfrac{cd}{de}\cdot\dfrac{de}{ef} = \dfrac{c}{e}\cdot\dfrac{d}{f}$. $\blacksquare$

commentary: |
  The arithmetic twin of [[VI.23]] (equiangular parallelograms are in the ratio compounded of their sides).
  "Compounded ratio" is never defined in Heath's text of the *Elements*; Book VI's Def. 5, which tried to
  define it, is regarded as an interpolation. Its meaning is fixed by use, as here.

  Joyce discusses compound ratios at length: duplicate and triplicate ratios ([[V.Def.9]], [[V.Def.10]])
  are the special cases where the two ratios are the same.
