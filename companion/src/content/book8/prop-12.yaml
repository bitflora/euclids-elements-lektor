id: VIII.12
kind: theorem
title: Two means between two cubes

paraphrase: |
  Between two cubes {A} = {C}³ and {B} = {D}³ there are two mean proportionals, {C}²{D} and {C}{D}²; and {A} :
  {B} is the triplicate of {C} : {D}.

