id: VIII.14
kind: theorem
title: A square measures a square exactly when side measures side

paraphrase: |
  For squares {A} = {C}² and {B} = {D}²: {A} measures {B} if and only if {C} measures {D}.

diagram:
  width: 270
  height: 170
  elements:
    - "A0;point;free;-1000,35;0;0"
