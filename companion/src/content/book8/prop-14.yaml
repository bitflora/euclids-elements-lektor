steps:
  - part: enunciation
    text: "If a square measure a square, the side will also measure the side; and, if the side measure the side, the square will also measure the square."
    highlight: [A, B, C, D]
    hint: |
      $c^2 \mid d^2 \iff c \mid d$.
    modern: |
      $c^2 \mid d^2 \iff c \mid d$.

  - part: setting-out
    text: "Let A, B be square numbers, let C, D be their sides, and let A measure B;"
    highlight: [A, B, C, D]
    hint: |
      {A} measures {B}.

  - part: specification
    text: "I say that C also measures D."
    highlight: [C, D]
    hint: |
      To prove: {C} measures {D}.

  - part: construction
    text: "For let C by multiplying D make E;"
    highlight: [E]
    hint: |
      {E} = {C}{D}.

  - part: proof
    text: "therefore A, E, B are continuously proportional in the ratio of C to D."
    highlight: [A, E, B]
    hint: |
      By [[VIII.11]].

  - part: proof
    text: "And, since A, E, B are continuously proportional, and A measures B, therefore A also measures E."
    highlight: [A, E]
    hint: |
      First measures last, so first measures second ([[VIII.7]]).

  - part: proof
    text: "And, as A is to E, so is C to D; therefore also C measures D."
    highlight: [C, D]
    hint: |
      Same ratio, so {C} measures {D} ([[VII.Def.20]]).

  - part: specification
    text: "Again, let C measure D; I say that A also measures B."
    highlight: [C, D, A, B]
    hint: |
      The converse.

  - part: proof
    text: "For, with the same construction, we can in a similar manner prove that A, E, B are continuously proportional in the ratio of C to D."
    highlight: [A, E, B]
    hint: |
      As before.

  - part: proof
    text: "And since, as C is to D, so is A to E, and C measures D, therefore A also measures E."
    highlight: [A, E]
    hint: |
      {A} measures {E}.

  - part: proof
    text: "And A, E, B are continuously proportional; therefore A also measures B."
    highlight: [A, B]
    hint: |
      And {E} : {B} is the same ratio, so {A} measures {E} which measures {B}.
    explain:
      implicit: |
        {E} measures {B} because {E} : {B} = {A} : {E}; then {A} measures {B} by transitivity.

  - part: conclusion
    text: "Therefore etc."
    hint: |
      The enunciation, now proved.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6]
      text: |
        $c^2, cd, d^2$ has ratio $c : d$; if $c^2 \mid d^2$ then $c^2 \mid cd$ ([[VIII.7]]), i.e. $c \mid d$.
    - steps: [7, 8, 9, 10]
      text: |
        Conversely $d = kc$ gives $d^2 = k^2 c^2$. $\blacksquare$
