  caption: |
    {C} is the mean between {A} and {B}; {D} : {E} is {A} : {C} in lowest terms; {A} = {D}{F}, {B} = {E}{G}.

steps:
  - part: enunciation
    text: "If one mean proportional number fall between two numbers, the numbers will be similar plane numbers."
    highlight: [A, B, C]
    hint: |
      $a : c = c : b \Rightarrow a, b$ are similar plane numbers.
    modern: |
      If $c^2 = ab$, then $a = dm$, $b = en$ with $d : m = e : n$.

  - part: setting-out
    text: "For let one mean proportional number C fall between the two numbers A, B;"
    highlight: [A, C, B]
    hint: |
      {A} : {C} = {C} : {B}.

  - part: specification
    text: "I say that A, B are similar plane numbers."
    highlight: [A, B]
    hint: |
      To prove.

  - part: construction
    text: "Let D, E, the least numbers of those which have the same ratio with A, C, be taken;"
    highlight: [D, E]
    hint: |
      {D} : {E} = {A} : {C} in lowest terms ([[VII.33]]).

  - part: proof
    text: "therefore D measures A the same number of times that E measures C."
    highlight: [D, A, E, C]
    hint: |
      [[VII.20]].

  - part: construction
    text: "Now, as many times as D measures A, so many units let there be in F; therefore F by multiplying D has made A, so that A is plane, and D, F are its sides."
    highlight: [F, D, A]
    hint: |
      {A} = {D}{F}: plane.

  - part: proof
    text: "Again, since D, E are the least of the numbers which have the same ratio with C, B, therefore D measures C the same number of times that E measures B."
    highlight: [D, C, E, B]
    hint: |
      {C} : {B} = {A} : {C} = {D} : {E}, so [[VII.20]] again.

  - part: construction
    text: "As many times, then, as E measures B, so many units let there be in G; therefore E measures B according to the units in G; therefore G by multiplying E has made B."
    highlight: [G, E, B]
    hint: |
      {B} = {E}{G}.

  - part: proof
    text: "Therefore B is plane, and E, G are its sides."
    highlight: [B]
    hint: |
      Plane.

  - part: proof
    text: "Therefore A, B are plane numbers."
    highlight: [A, B]
    hint: |
      Both plane.

  - part: specification
    text: "I say next that they are also similar."
    highlight: [A, B]
    hint: |
      Now similar.

  - part: proof
    text: "For, † since F by multiplying D has made A, and by multiplying E has made C, therefore, as D is to E, so is A to C, that is, C to B."
    highlight: [F, D, E, A, C, B]
    hint: |
      {C} = {F}{E}, and [[VII.17]].
    dispute: |
      Heath prints a dagger (†) before this clause and the next, marking the text as doubtful. The reasoning
      itself is sound: {F} is the number of times {D} measures {A}, which is also the number of times {E}
      measures {C} (step 2), so {C} is {E} taken {F} times; the doubt concerns how the manuscripts phrase it.

  - part: proof
    text: "Again, † since E by multiplying F, G has made C, B respectively, therefore, as F is to G, so is C to B."
    highlight: [E, F, G, C, B]
    hint: |
      [[VII.17]]: {F} : {G} = {C} : {B}.

  - part: proof
    text: "But, as C is to B, so is D to E; therefore also, as D is to E, so is F to G."
    highlight: [D, E, F, G]
    hint: |
      {D} : {E} = {F} : {G}.

  - part: proof
    text: "And alternately, as D is to F, so is E to G."
    highlight: [D, F, E, G]
    hint: |
      [[VII.13]].

  - part: proof
    text: "Therefore A, B are similar plane numbers; for their sides are proportional."
    highlight: [A, B]
    hint: |
      Done ([[VII.Def.21]]).

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [4, 5, 6, 7, 8, 9, 10]
      text: |
        Let $d : e$ be $a : c$ in lowest terms; then $a = fd$, $c = fe$; and since $c : b = d : e$ too, $c = gd$,
        $b = ge$ ([[VII.20]]).
    - steps: [11, 12, 13, 14, 15]
      text: |
        So $a = df$, $b = eg$ with $d : f = e : g$ (from $fe = gd$). $\blacksquare$

commentary: |
  Example: 12 and 27 have the mean 18; 12 = 2·6 and 27 = 3·9, with 2 : 6 = 3 : 9.
