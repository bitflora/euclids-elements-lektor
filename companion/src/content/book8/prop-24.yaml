id: VIII.24
kind: theorem
title: In the ratio of two squares, if the first is square so is the second

paraphrase: |
  If {A} : {B} = {C} : {D} with {C}, {D} squares, and {A} is a square, then {B} is a square.

diagram:
  width: 190
  height: 170
  elements:
    - "A0;point;free;-1000,40;0;0"
