steps:
  - part: enunciation
    text: "If two numbers have to one another the ratio which a square number has to a square number, and the first be square, the second will also be square."
    highlight: [A, B, C, D]
    hint: |
      $a : b = c^2 : d^2$, $a$ square $\Rightarrow$ $b$ square.
    modern: |
      $a : b = s^2 : t^2$, $a$ a square $\Rightarrow$ $b$ a square.

  - part: setting-out
    text: "For let the two numbers A, B have to one another the ratio which the square number C has to the square number D, and let A be square;"
    highlight: [A, B, C, D]
    hint: |
      {A} : {B} = {C} : {D}; {A} square.

  - part: specification
    text: "I say that B is also square."
    highlight: [B]
    hint: |
      To prove.

  - part: proof
    text: "For, since C, D are square, C, D are similar plane numbers."
    highlight: [C, D]
    hint: |
      Squares are similar plane numbers.

  - part: proof
    text: "Therefore one mean proportional number falls between C, D."
    highlight: [C, D]
    hint: |
      [[VIII.18]].

  - part: proof
    text: "And, as C is to D, so is A to B; therefore one mean proportional number falls between A, B also."
    highlight: [A, B]
    hint: |
      [[VIII.8]].

  - part: proof
    text: "And A is square; therefore B is also square."
    highlight: [A, B]
    hint: |
      [[VIII.22]].

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6]
      text: |
        $b = a t^2/s^2 = (\sqrt{a}\, t / s)^2$, a rational square that is whole, hence a square. $\blacksquare$
