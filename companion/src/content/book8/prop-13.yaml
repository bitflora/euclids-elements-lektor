  caption: |
    {D}, {E}, {F} are the squares and {G}, {H}, {K} the cubes of {A}, {B}, {C}; {L}, {M}, {N}, {O}, {P}, {Q}
    are the intermediate products.

steps:
  - part: enunciation
    text: "If there be as many numbers as we please in continued proportion, and each by multiplying itself make some number, the products will be proportional; and, if the original numbers by multiplying the products make certain numbers, the latter will also be proportional."
    highlight: [A, B, C, D, E, F, G, H, K]
    hint: |
      Squaring or cubing a geometric progression gives a geometric progression.
    modern: |
      $a : b = b : c \Rightarrow a^2 : b^2 = b^2 : c^2$ and $a^3 : b^3 = b^3 : c^3$.

  - part: setting-out
    text: "Let there be as many numbers as we please, A, B, C, in continued proportion, so that, as A is to B, so is B to C; let A, B, C by multiplying themselves make D, E, F, and by multiplying D, E, F let them make G, H, K;"
    highlight: [A, B, C, D, E, F, G, H, K]
    hint: |
      {D}, {E}, {F} = squares; {G}, {H}, {K} = cubes.

  - part: specification
    text: "I say that D, E, F and G, H, K are in continued proportion."
    highlight: [D, E, F, G, H, K]
    hint: |
      To prove.

  - part: construction
    text: "For let A by multiplying B make L, and let the numbers A, B by multiplying L make M, N respectively."
    highlight: [L, M, N]
    hint: |
      {L} = {A}{B}, {M} = {A}²{B}, {N} = {A}{B}².

  - part: construction
    text: "And again let B by multiplying C make O, and let the numbers B, C by multiplying O make P, Q respectively."
    highlight: [O, P, Q]
    hint: |
      {O} = {B}{C}, {P} = {B}²{C}, {Q} = {B}{C}².

  - part: proof
    text: "Then, in manner similar to the foregoing, we can prove that D, L, E and G, M, N, H are continuously proportional in the ratio of A to B, and further E, O, F and H, P, Q, K are continuously proportional in the ratio of B to C."
    highlight: [D, L, E, G, M, N, H, O, F, P, Q, K]
    hint: |
      As in [[VIII.11]] and [[VIII.12]].

  - part: proof
    text: "Now, as A is to B, so is B to C; therefore D, L, E are also in the same ratio with E, O, F, and further G, M, N, H in the same ratio with H, P, Q, K."
    highlight: [D, L, E, O, F]
    hint: |
      The two rows have the same ratios.

  - part: proof
    text: "And the multitude of D, L, E is equal to the multitude of E, O, F, and that of G, M, N, H to that of H, P, Q, K; therefore, ex aequali, as D is to E, so is E to F, and, as G is to H, so is H to K."
    highlight: [D, E, F, G, H, K]
    hint: |
      Ex aequali ([[VII.14]]).

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [4, 5, 6, 7]
      text: |
        $a^2 : b^2 = (a : b)^2 = (b : c)^2 = b^2 : c^2$, likewise for cubes. $\blacksquare$

gaps: |
  - "In manner similar to the foregoing" — the work of [[VIII.11]] and [[VIII.12]] is left to the reader.
