id: VIII.11
kind: theorem
title: One mean between two squares

paraphrase: |
  Between two square numbers {A} = {C}² and {B} = {D}² there is one mean proportional, {C}{D}; and {A} : {B} is
  the duplicate of {C} : {D}.

