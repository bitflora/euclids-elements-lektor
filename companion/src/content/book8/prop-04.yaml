id: VIII.4
kind: problem
title: Least numbers in several given ratios

paraphrase: |
  Given ratios {A} : {B}, {C} : {D}, {E} : {F} in lowest terms, find the least numbers $x_1, x_2, x_3, x_4$
  with $x_1 : x_2 = A : B$, $x_2 : x_3 = C : D$, $x_3 : x_4 = E : F$ — a "continued ratio" whose steps
  differ.

