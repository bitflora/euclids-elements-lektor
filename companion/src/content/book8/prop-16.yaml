id: VIII.16
kind: theorem
title: If a square does not measure a square, the side does not measure the side

paraphrase: |
  The contrapositive of [[VIII.14]]: {A} = {C}² fails to measure {B} = {D}² exactly when {C} fails to measure
  {D}.

diagram:
  width: 250
  height: 170
  elements:
    - "A0;point;free;-1000,35;0;0"
    - "A3;point;free;1000,35;0;0"
