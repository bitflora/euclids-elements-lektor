id: VIII.10
kind: theorem
title: Means from the unit give means between the numbers

paraphrase: |
  If {D}, {E} fall in continued proportion between the unit {C} and {A}, and {F}, {G} between the unit and
  {B}, then as many fall between {A} and {B}. In effect: between $d^3$ and $f^3$ fall $d^2f$ and $df^2$.

