steps:
  - part: enunciation
    text: "If between two numbers there fall numbers in continued proportion with them, then, however many numbers fall between them in continued proportion, so many will also fall in continued proportion between the numbers which have the same ratio with the original numbers."
    highlight: [A, B, E, F]
    hint: |
      The number of geometric means between two numbers depends only on their ratio.
    modern: |
      If $a : b = e : f$ and $a, c_1, \dots, c_k, b$ is a geometric progression, so is some $e, m_1, \dots,
      m_k, f$.

  - part: setting-out
    text: "Let the numbers C, D fall between the two numbers A, B in continued proportion with them, and let E be made in the same ratio to F as A is to B;"
    highlight: [A, C, D, B, E, F]
    hint: |
      {A}, {C}, {D}, {B} in continued proportion; {E} : {F} = {A} : {B}.

  - part: specification
    text: "I say that, as many numbers as have fallen between A, B in continued proportion, so many will also fall between E, F in continued proportion."
    highlight: [E, F]
    hint: |
      To prove: two means fall between {E} and {F}.

  - part: construction
    text: "For, as many as A, B, C, D are in multitude, let so many numbers G, H, K, L, the least of those which have the same ratio with A, C, D, B, be taken;"
    highlight: [G, H, K, L]
    hint: |
      Reduce to the least progression {G}, {H}, {K}, {L} ([[VII.33]]).

  - part: proof
    text: "therefore the extremes of them G, L are prime to one another."
    highlight: [G, L]
    hint: |
      Its extremes are coprime ([[VIII.3]]).

  - part: proof
    text: "Now, since A, C, D, B are in the same ratio with G, H, K, L, and the multitude of the numbers A, C, D, B is equal to the multitude of the numbers G, H, K, L, therefore, ex aequali, as A is to B, so is G to L."
    highlight: [A, B, G, L]
    hint: |
      Ex aequali ([[VII.14]]): {A} : {B} = {G} : {L}.

  - part: proof
    text: "But, as A is to B, so is E to F; therefore also, as G is to L, so is E to F."
    highlight: [G, L, E, F]
    hint: |
      So {G} : {L} = {E} : {F}.

  - part: proof
    text: "But G, L are prime, primes are also least, and the least numbers measure those which have the same ratio the same number of times, the greater the greater and the less the less, that is, the antecedent the antecedent and the consequent the consequent."
    highlight: [G, L]
    hint: |
      {G} : {L} is in lowest terms ([[VII.21]]), so [[VII.20]] applies.

  - part: proof
    text: "Therefore G measures E the same number of times as L measures F."
    highlight: [G, E, L, F]
    hint: |
      {E} and {F} are the same multiple of {G} and {L}.

  - part: construction
    text: "Next, as many times as G measures E, so many times let H, K also measure M, N respectively; therefore G, H, K, L measure E, M, N, F the same number of times."
    highlight: [M, N]
    hint: |
      Scale {H}, {K} by the same factor to get {M}, {N}.

  - part: proof
    text: "Therefore G, H, K, L are in the same ratio with E, M, N, F."
    highlight: [G, H, K, L, E, M, N, F]
    hint: |
      Equal multiples are in the same ratio ([[VII.Def.20]]).

  - part: proof
    text: "But G, H, K, L are in the same ratio with A, C, D, B; therefore A, C, D, B are also in the same ratio with E, M, N, F."
    highlight: [A, C, D, B, E, M, N, F]
    hint: |
      So {E}, {M}, {N}, {F} have the ratios of {A}, {C}, {D}, {B}.

  - part: proof
    text: "But A, C, D, B are in continued proportion; therefore E, M, N, F are also in continued proportion."
    highlight: [E, M, N, F]
    hint: |
      {E}, {M}, {N}, {F} are in continued proportion.

  - part: proof
    text: "Therefore, as many numbers as have fallen between A, B in continued proportion with them, so many numbers have also fallen between E, F in continued proportion."
    highlight: [E, F]
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [4, 5, 6, 7, 8, 9]
      text: |
        The least progression with the ratios of $a, c, d, b$ is $g, h, k, l$ with $\gcd(g, l) = 1$, and $g :
        l = e : f$, so $e = ng$, $f = nl$.
    - steps: [10, 11, 12, 13]
      text: |
        Then $ng, nh, nk, nl$ is a progression from $e$ to $f$. $\blacksquare$

commentary: |
  Joyce's example: 18 : 50 = 63 : 175, and 18, 30, 50 is a continued proportion; so one mean falls between 63
  and 175 (it is 105). [[VIII.8]]–[[VIII.10]] prepare [[VIII.11]]–[[VIII.21]], on how many means fall
  between squares, cubes, and similar numbers.
