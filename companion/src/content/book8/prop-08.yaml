id: VIII.8
kind: theorem
title: Means between numbers carry over to numbers in the same ratio

paraphrase: |
  If {C}, {D} are mean proportionals between {A} and {B}, and {E} : {F} = {A} : {B}, then as many mean
  proportionals fall between {E} and {F}.

