    - "D3;point;free;1000,110;0;0"
    - "A1;point;lineSlider;A0,A3,30,0;0"
    - "A2;point;lineSlider;A0,A3,100,0;0"
    - "A;line;connect;A1,A2;black"
    - "B1;point;lineSlider;A0,A3,130,0;0"
    - "B2;point;lineSlider;A0,A3,250,0;0"
    - "B;line;connect;B1,B2;black"
    - "C1;point;lineSlider;C0,C3,100,0;0"
    - "C2;point;meanProportional;A1,A2,B1,B2,C1,C3;0"
    - "C;line;connect;C1,C2;black"
    - "D1;point;lineSlider;D0,D3,30,0;0"
    - "D2;point;lineSlider;D0,D3,70,0;0"
    - "D;line;connect;D1,D2;black"
    - "E1;point;lineSlider;D0,D3,100,0;0"
    - "E2;point;proportion;A1,A2,B1,B2,D1,D2,E1,D3;0"
