  caption: |
    {C} is the mean between {A} and {B}; {D}, {E}, {F} are the least numbers in their ratio.

steps:
  - part: enunciation
    text: "Similar plane numbers have to one another the ratio which a square number has to a square number."
    highlight: [A, B]
    hint: |
      Similar plane numbers are in the ratio of two squares.
    modern: |
      $a, b$ similar plane $\Rightarrow a : b = s^2 : t^2$.

  - part: setting-out
    text: "Let A, B be similar plane numbers;"
    highlight: [A, B]
    hint: |
      {A}, {B} similar plane numbers.

  - part: specification
    text: "I say that A has to B the ratio which a square number has to a square number."
    highlight: [A, B]
    hint: |
      To prove.

  - part: proof
    text: "For, since A, B are similar plane numbers, therefore one mean proportional number falls between A, B."
    highlight: [A, B]
    hint: |
      [[VIII.18]].

  - part: construction
    text: "Let it so fall, and let it be C; and let D, E, F, the least numbers of those which have the same ratio with A, C, B, be taken;"
    highlight: [C, D, E, F]
    hint: |
      The mean {C}; least numbers {D}, {E}, {F} in the ratio of {A}, {C}, {B}.

  - part: proof
    text: "therefore the extremes of them D, F are square."
    highlight: [D, F]
    hint: |
      The porism of [[VIII.2]].

  - part: proof
    text: "And since, as D is to F, so is A to B, and D, F are square, therefore A has to B the ratio which a square number has to a square number."
    highlight: [D, F, A, B]
    hint: |
      {A} : {B} = {D} : {F} ([[VII.14]]).
    cites: [VII.14]

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6]
      text: |
        $pq : rs$ with $p : q = r : s$: write the common ratio $p/r = q/s = u/v$; then $pq/rs = u^2/v^2$.
        $\blacksquare$

commentary: |
  Used in [[IX.10]] and in [[X.9]], where Euclid proves that squares on commensurable lines are as square
  numbers — the starting point of the theory of irrationals.
