id: VIII.26
kind: theorem
title: Similar plane numbers are as a square to a square

paraphrase: |
  Two similar plane numbers {A}, {B} have the ratio of one square number to another.

diagram:
  width: 300
  height: 140
  elements:
    - "A0;point;free;-1000,40;0;0"
    - "A3;point;free;1000,40;0;0"
    - "C0;point;free;-1000,75;0;0"
    - "C3;point;free;1000,75;0;0"
