id: VIII.1
kind: theorem
title: A continued proportion with coprime extremes is in lowest terms

paraphrase: |
  If {A}, {B}, {C}, {D} are in continued proportion ({A} : {B} = {B} : {C} = {C} : {D}) and the extremes {A},
  {D} are prime to one another, then no smaller numbers are in the same ratios.

