steps:
  - part: enunciation
    text: "If there be as many numbers as we please in continued proportion, and the extremes of them be prime to one another, the numbers are the least of those which have the same ratio with them."
    highlight: [A, B, C, D]
    hint: |
      A geometric progression whose first and last terms are coprime cannot be scaled down.
    explain:
      fact: |
        *Continued proportion*: each term is to the next in one and the same ratio — a geometric progression
        $a, ar, ar^2, \dots$ with rational $r$.
    modern: |
      $a_1 : a_2 = a_2 : a_3 = \dots$ and $\gcd(a_1, a_n) = 1$ $\Rightarrow$ $(a_1, \dots, a_n)$ is least.

  - part: setting-out
    text: "Let there be as many numbers as we please, A, B, C, D, in continued proportion, and let the extremes of them A, D be prime to one another;"
    highlight: [A, B, C, D]
    hint: |
      {A}, {B}, {C}, {D} in continued proportion; {A}, {D} coprime.

  - part: specification
    text: "I say that A, B, C, D are the least of those which have the same ratio with them."
    highlight: [A, B, C, D]
    hint: |
      To prove: no smaller numbers have the same successive ratios.

  - part: proof
    text: "For, if not, let E, F, G, H be less than A, B, C, D, and in the same ratio with them."
    highlight: [E, F, G, H]
    hint: |
      Suppose smaller {E}, {F}, {G}, {H} exist.

  - part: proof
    text: "Now, since A, B, C, D are in the same ratio with E, F, G, H, and the multitude of the numbers A, B, C, D is equal to the multitude of the numbers E, F, G, H, therefore, ex aequali, as A is to D, so is E to H."
    highlight: [A, D, E, H]
    hint: |
      Ex aequali ([[VII.14]]): {A} : {D} = {E} : {H}.

  - part: proof
    text: "But A, D are prime, primes are also least, and the least numbers measure those which have the same ratio the same number of times, the greater the greater and the less the less, that is, the antecedent the antecedent and the consequent the consequent."
    highlight: [A, D]
    hint: |
      {A} : {D} is in lowest terms ([[VII.21]]), so it measures equal ratios term by term ([[VII.20]]).

  - part: proof
    text: "Therefore A measures E, the greater the less: which is impossible."
    highlight: [A, E]
    hint: |
      {A} would measure the smaller {E}.

  - part: proof
    text: "Therefore E, F, G, H which are less than A, B, C, D are not in the same ratio with them."
    highlight: [E, F, G, H]
    hint: |
      No smaller numbers.

  - part: proof
    text: "Therefore A, B, C, D are the least of those which have the same ratio with them."
    highlight: [A, B, C, D]
    hint: |
      Least.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4]
      text: |
        If $(e, f, g, h) = \lambda (a, b, c, d)$ with $\lambda < 1$, then $a : d = e : h$ ([[VII.14]]).
    - steps: [5, 6, 7, 8]
      text: |
        $a : d$ is in lowest terms, so $a \mid e$ ([[VII.20]]), impossible as $e < a$. $\blacksquare$

commentary: |
  Book VIII studies *continued proportions* of numbers — geometric progressions — and, through them, when
  mean proportionals exist between two numbers ([[VIII.8]]–[[VIII.21]]). Joyce's example: 1250, 750, 450,
  270, 162 are in continued proportion with ratio 5 : 3; dividing by 2 gives 625, 375, 225, 135, 81, whose
  extremes are coprime, so these are least.

  The converse is [[VIII.3]].
