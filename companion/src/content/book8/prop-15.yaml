    {E} = {C}², {F} = {C}{D}, {G} = {D}²; {A}, {H}, {K}, {B} are {C}³, {C}²{D}, {C}{D}², {D}³.

steps:
  - part: enunciation
    text: "If a cube number measure a cube number, the side will also measure the side; and, if the side measure the side, the cube will also measure the cube."
    highlight: [A, B, C, D]
    hint: |
      $c^3 \mid d^3 \iff c \mid d$.
    modern: |
      $c^3 \mid d^3 \iff c \mid d$.

  - part: setting-out
    text: "For let the cube number A measure the cube B, and let C be the side of A and D of B;"
    highlight: [A, B, C, D]
    hint: |
      {A} measures {B}.

  - part: specification
    text: "I say that C measures D."
    highlight: [C, D]
    hint: |
      To prove.

  - part: construction
    text: "For let C by multiplying itself make E, and let D by multiplying itself make G; further, let C by multiplying D make F, and let C, D by multiplying F make H, K respectively."
    highlight: [E, F, G, H, K]
    hint: |
      As in [[VIII.12]].

  - part: proof
    text: "Now it is manifest that E, F, G and A, H, K, B are continuously proportional in the ratio of C to D."
    highlight: [A, H, K, B]
    hint: |
      [[VIII.11]], [[VIII.12]].

  - part: proof
    text: "And, since A, H, K, B are continuously proportional, and A measures B, therefore it also measures H."
    highlight: [A, H]
    hint: |
      [[VIII.7]].

  - part: proof
    text: "And, as A is to H, so is C to D; therefore C also measures D."
    highlight: [C, D]
    hint: |
      [[VII.Def.20]].

  - part: specification
    text: "Next, let C measure D; I say that A will also measure B."
    highlight: [C, D, A, B]
    hint: |
      The converse.

  - part: proof
    text: "For, with the same construction, we can prove in a similar manner that A, H, K, B are continuously proportional in the ratio of C to D."
    highlight: [A, H, K, B]
    hint: |
      As before.

  - part: proof
    text: "And, since C measures D, and, as C is to D, so is A to H, therefore A also measures H, so that A measures B also."
    highlight: [A, H, B]
    hint: |
      {A} measures {H}, {H} measures {K}, {K} measures {B}.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6]
      text: |
        $c^3 \mid d^3 \Rightarrow c^3 \mid c^2 d$ ([[VIII.7]]) $\Rightarrow c \mid d$; the converse is clear.
        $\blacksquare$
