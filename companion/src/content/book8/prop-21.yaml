id: VIII.21
kind: theorem
title: Numbers with two means between them are similar solid numbers

paraphrase: |
  If two mean proportionals {C}, {D} fall between {A} and {B}, then {A} and {B} are similar solid numbers. A
  converse of [[VIII.19]].

