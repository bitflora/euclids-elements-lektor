steps:
  - part: enunciation
    text: "If two numbers have to one another the ratio which a cube number has to a cube number, and the first be cube, the second will also be cube."
    highlight: [A, B, C, D]
    hint: |
      The cube version of [[VIII.24]].
    modern: |
      $a : b = s^3 : t^3$, $a$ a cube $\Rightarrow$ $b$ a cube.

  - part: setting-out
    text: "For let the two numbers A, B have to one another the ratio which the cube number C has to the cube number D, and let A be cube;"
    highlight: [A, B, C, D]
    hint: |
      {A} : {B} = {C} : {D}; {A} a cube.

  - part: specification
    text: "I say that B is also cube."
    highlight: [B]
    hint: |
      To prove.

  - part: proof
    text: "For, since C, D are cube, C, D are similar solid numbers."
    highlight: [C, D]
    hint: |
      Cubes are similar solid numbers.

  - part: proof
    text: "Therefore two mean proportional numbers fall between C, D."
    highlight: [C, D]
    hint: |
      [[VIII.19]].

  - part: proof
    text: "And, as many numbers as fall between C, D in continued proportion, so many will also fall between those which have the same ratio with them; so that two mean proportional numbers fall between A, B also."
    highlight: [A, B]
    hint: |
      [[VIII.8]].

  - part: construction
    text: "Let E, F so fall."
    highlight: [E, F]
    hint: |
      The means {E}, {F}.

  - part: proof
    text: "Since, then, the four numbers A, E, F, B are in continued proportion, and A is cube, therefore B is also cube."
    highlight: [A, E, F, B]
    hint: |
      [[VIII.23]].

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6, 7]
      text: |
        $b = a (t/s)^3 = (\sqrt[3]{a}\, t/s)^3$, a rational cube that is whole, hence a cube. $\blacksquare$

commentary: |
  Used in [[IX.10]].
