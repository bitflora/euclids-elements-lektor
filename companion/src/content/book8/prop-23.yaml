steps:
  - part: enunciation
    text: "If four numbers be in continued proportion, and the first be cube, the fourth will also be cube."
    highlight: [A, B, C, D]
    hint: |
      The cube version of [[VIII.22]].
    modern: |
      $a, b, c, d$ geometric, $a$ a cube $\Rightarrow$ $d$ a cube.

  - part: setting-out
    text: "Let A, B, C, D be four numbers in continued proportion, and let A be cube;"
    highlight: [A, B, C, D]
    hint: |
      {A} a cube.

  - part: specification
    text: "I say that D is also cube."
    highlight: [D]
    hint: |
      To prove.

  - part: proof
    text: "For, since between A, D there are two mean proportional numbers B, C, therefore A, D are similar solid numbers."
    highlight: [A, B, C, D]
    hint: |
      [[VIII.21]].

  - part: proof
    text: "But A is cube; therefore D is also cube."
    highlight: [A, D]
    hint: |
      A solid number similar to a cube is a cube.
    gap: |
      As in [[VIII.22]], "similar to a cube, hence a cube" is not proved.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4]
      text: |
        With ratio $r = b/a$, $d = a r^3 = (s r)^3$ where $a = s^3$; $sr$ is rational with whole cube, so
        whole. $\blacksquare$
