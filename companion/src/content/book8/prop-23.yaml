id: VIII.23
kind: theorem
title: If the first of four in continued proportion is a cube, so is the fourth

paraphrase: |
  If {A}, {B}, {C}, {D} are in continued proportion and {A} is a cube, then {D} is a cube.

diagram:
  width: 250
  height: 170
  elements:
    - "A0;point;free;-1000,40;0;0"
