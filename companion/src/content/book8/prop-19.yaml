id: VIII.19
kind: theorem
title: Two means between similar solid numbers

paraphrase: |
  Between two similar solid numbers {A} = {C}{D}{E} and {B} = {F}{G}{H} there fall two mean proportionals,
  and {A} : {B} is the triplicate of {C} : {F}.

