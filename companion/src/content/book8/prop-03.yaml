id: VIII.3
kind: theorem
title: A least continued proportion has coprime extremes

paraphrase: |
  If {A}, {B}, {C}, {D} are the least numbers in continued proportion in their ratio, then the extremes {A}
  and {D} are prime to one another. The converse of [[VIII.1]].

