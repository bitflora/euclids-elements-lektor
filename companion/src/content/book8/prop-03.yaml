  caption: |
    {E} : {F} is the ratio in lowest terms; {G}, {H}, {K} and {L}, {M}, {N}, {O} are the least progressions
    of three and four terms built from it by [[VIII.2]].

steps:
  - part: enunciation
    text: "If as many numbers as we please in continued proportion be the least of those which have the same ratio with them, the extremes of them are prime to one another."
    highlight: [A, B, C, D]
    hint: |
      A least geometric progression has coprime first and last terms.
    modern: |
      $(a_1, \dots, a_n)$ least $\Rightarrow \gcd(a_1, a_n) = 1$.

  - part: setting-out
    text: "Let as many numbers as we please, A, B, C, D, in continued proportion be the least of those which have the same ratio with them;"
    highlight: [A, B, C, D]
    hint: |
      {A}, {B}, {C}, {D}: a least progression.

  - part: specification
    text: "I say that the extremes of them A, D are prime to one another."
    highlight: [A, D]
    hint: |
      To prove: {A}, {D} coprime.

  - part: construction
    text: "For let two numbers E, F, the least that are in the ratio of A, B, C, D, be taken, then three others G, H, K with the same property; and others, more by one continually, until the multitude taken becomes equal to the multitude of the numbers A, B, C, D."
    highlight: [E, F, G, H, K]
    hint: |
      Reduce the common ratio to lowest terms {E} : {F} ([[VII.33]]), and build the least progressions of 3,
      4, … terms ([[VIII.2]]).

  - part: construction
    text: "Let them be taken, and let them be L, M, N, O."
    highlight: [L, M, N, O]
    hint: |
      The least four-term one: {L}, {M}, {N}, {O}.

  - part: proof
    text: "Now, since E, F are the least of those which have the same ratio with them, they are prime to one another."
    highlight: [E, F]
    hint: |
      {E}, {F} coprime ([[VII.22]]).

  - part: proof
    text: "And, since the numbers E, F by multiplying themselves respectively have made the numbers G, K, and by multiplying the numbers G, K respectively have made the numbers L, O, therefore both G, K and L, O are prime to one another."
    highlight: [G, K, L, O]
    hint: |
      {G}, {K} are their squares and {L}, {O} their cubes ([[VIII.2]], porism) — coprime ([[VII.27]]).

  - part: proof
    text: "And, since A, B, C, D are the least of those which have the same ratio with them, while L, M, N, O are the least that are in the same ratio with A, B, C, D, and the multitude of the numbers A, B, C, D is equal to the multitude of the numbers L, M, N, O, therefore the numbers A, B, C, D are equal to the numbers L, M, N, O respectively;"
    highlight: [A, B, C, D, L, M, N, O]
    hint: |
      Both are *the* least progression in that ratio, so they coincide.
    explain:
      implicit: |
        That the least numbers in given ratios are unique: two different least progressions would each be
        smaller than the other. Euclid takes it as evident.

  - part: proof
    text: "therefore A is equal to L, and D to O."
    highlight: [A, L, D, O]
    hint: |
      In particular {A} = {L}, {D} = {O}.

  - part: proof
    text: "And L, O are prime to one another."
    highlight: [L, O]
    hint: |
      As shown.

  - part: proof
    text: "Therefore A, D are also prime to one another."
    highlight: [A, D]
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [4, 5, 6, 7]
      text: |
        With the ratio $e : f$ in lowest terms, the least progression is $e^3, e^2f, ef^2, f^3$ ([[VIII.2]]),
        whose extremes are coprime ([[VII.27]]).
    - steps: [7, 8, 9, 10]
      text: |
        A least progression is unique, so $(a, b, c, d)$ is this one, and $\gcd(a, d) = 1$. $\blacksquare$
  closing: |
    Consequently every least progression of $n$ terms is $e^{n-1}, e^{n-2} f, \dots, f^{n-1}$; this is the
    form Book VIII exploits.

commentary: |
  Used in [[VIII.6]], [[VIII.8]] and [[VIII.21]].
