id: IX.11
kind: theorem
title: In a progression from the unit, a smaller term measures a larger by a term

paraphrase: |
  In a continued proportion 1, {B}, {C}, {D}, {E} from the unit {A}, the smaller term {B} measures the larger
  {E} according to one of the terms — here {D}. In powers: $a^k$ goes into $a^n$ exactly $a^{n-k}$ times.

