  caption: |
    {A} is the unit; {B}, {C}, {D}, {E} are $b, b^2, b^3, b^4$.

steps:
  - part: enunciation
    text: "If as many numbers as we please beginning from an unit be in continued proportion, the less measures the greater according to some one of the numbers which have place among the proportional numbers."
    highlight: [B, C, D, E]
    hint: |
      $a^k \mid a^n$, with quotient $a^{n-k}$, itself a term.
    modern: |
      $a^n = a^k \cdot a^{n-k}$.

  - part: setting-out
    text: "Let there be as many numbers as we please, B, C, D, E, beginning from the unit A and in continued proportion;"
    highlight: [A, B, C, D, E]
    hint: |
      {A} the unit; {B}, {C}, {D}, {E} the progression.

  - part: specification
    text: "I say that B, the least of the numbers B, C, D, E, measures E according to some one of the numbers C, D."
    highlight: [B, E]
    hint: |
      To prove (for {B} and {E}).

  - part: proof
    text: "For since, as the unit A is to B, so is D to E, therefore the unit A measures the number B the same number of times as D measures E;"
    highlight: [A, B, D, E]
    hint: |
      1 : {B} = {D} : {E}.

  - part: proof
    text: "therefore, alternately, the unit A measures D the same number of times as B measures E."
    highlight: [A, D, B, E]
    hint: |
      [[VII.15]].

  - part: proof
    text: "But the unit A measures D according to the units in it; therefore B also measures E according to the units in D; so that B the less measures E the greater according to some number of those which have place among the proportional numbers.—"
    highlight: [B, E, D]
    hint: |
      {B} goes into {E} {D} times.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5]
      text: |
        $b^4 = b \cdot b^3$. $\blacksquare$
  closing: |
    The porism: the quotient sits as far from the dividend (counting back) as the divisor sits from the unit —
    $a^n / a^k = a^{n-k}$.

commentary: |
  Euclid proves only the case of the first term measuring the last; the porism states the general rule,
  which [[IX.12]] and [[IX.13]] use.
