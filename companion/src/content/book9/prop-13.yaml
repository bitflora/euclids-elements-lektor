id: IX.13
kind: theorem
title: The only divisors of a prime power are the lower powers

paraphrase: |
  In a continued proportion 1, {A}, {B}, {C}, {D} from the unit with {A} prime, the greatest term {D} is
  measured by no number except {A}, {B}, {C}. In powers: the divisors of $p^n$ are $1, p, \dots, p^{n}$.

