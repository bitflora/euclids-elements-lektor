id: IX.15
kind: theorem
title: In a least progression of three, any two together are coprime to the third

paraphrase: |
  If {A}, {B}, {C} are the least numbers in continued proportion in their ratio, then {A} + {B} is prime to
  {C}, {B} + {C} to {A}, and {A} + {C} to {B}.

diagram:
  width: 260
  height: 130
  elements:
    - "A0;point;free;-1000,30;0;0"
