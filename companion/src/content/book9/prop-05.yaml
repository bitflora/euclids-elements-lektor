id: IX.5
kind: theorem
title: If a cube times a number is a cube, the number is a cube

paraphrase: |
  If {A} is a cube and {A}·{B} is a cube, then {B} is a cube. The converse of [[IX.4]].

diagram:
  width: 270
  height: 200
  elements:
    - "A0;point;free;-1000,40;0;0"
    - "A3;point;free;1000,40;0;0"
    - "B0;point;free;-1000,75;0;0"
    - "B3;point;free;1000,75;0;0"
    - "C0;point;free;-1000,110;0;0"
    - "C3;point;free;1000,110;0;0"
    - "D0;point;free;-1000,145;0;0"
    - "D3;point;free;1000,145;0;0"
    - "U1;point;free;1000,0;0;0"
    - "U2;point;free;1000,35;0;0"
    - "A1;point;lineSlider;A0,A3,30,0;0"
    - "A2;point;lineSlider;A0,A3,100,0;0"
    - "A;line;connect;A1,A2;black"
    - "B1;point;lineSlider;B0,B3,30,0;0"
    - "B2;point;lineSlider;B0,B3,135,0;0"
    - "B;line;connect;B1,B2;black"
    - "C1;point;lineSlider;C0,C3,30,0;0"
    - "C2;point;proportion;U1,U2,A1,A2,B1,B2,C1,C3;0"
    - "C;line;connect;C1,C2;black"
    - "D1;point;lineSlider;D0,D3,30,0;0"
    - "D2;point;proportion;U1,U2,A1,A2,A1,A2,D1,D3;0"
    - "D;line;connect;D1,D2;black"
  caption: |
    {C} = {A}{B} is a cube; {D} = {A}².

steps:
  - part: enunciation
    text: "If a cube number by multiplying any number make a cube number, the multiplied number will also be cube."
    highlight: [A, B, C]
    hint: |
      $a$, $ab$ cubes $\Rightarrow b$ a cube.
    modern: |
      $a = m^3$, $ab = n^3 \Rightarrow b = (n/m)^3$, a cube.

  - part: setting-out
    text: "For let the cube number A by multiplying any number B make the cube number C;"
    highlight: [A, B, C]
    hint: |
      {C} = {A}{B}, a cube.

  - part: specification
    text: "I say that B is cube."
    highlight: [B]
    hint: |
      To prove.

  - part: construction
    text: "For let A by multiplying itself make D;"
    highlight: [D]
    hint: |
      {D} = {A}².

  - part: proof
    text: "therefore D is cube."
    highlight: [D]
    hint: |
      [[IX.3]].

  - part: proof
    text: "Now, since A by multiplying itself has made D, and by multiplying B has made C, therefore, as A is to B, so is D to C."
    highlight: [A, B, D, C]
    hint: |
      [[VII.17]].

  - part: proof
    text: "And since D, C are cube, they are similar solid numbers."
    highlight: [D, C]
    hint: |
      Cubes.

  - part: proof
    text: "Therefore two mean proportional numbers fall between D, C."
    highlight: [D, C]
    hint: |
      [[VIII.19]].

  - part: proof
    text: "And, as D is to C, so is A to B; therefore two mean proportional numbers fall between A, B also."
    highlight: [A, B]
    hint: |
      [[VIII.8]].

  - part: proof
    text: "And A is cube; therefore B is also cube."
    highlight: [B]
    hint: |
      [[VIII.23]].

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6, 7, 8, 9]
      text: |
        $a : b = a^2 : ab$, a ratio of cubes, and $a$ is a cube, so $b$ is a cube ([[VIII.25]]).
        $\blacksquare$
