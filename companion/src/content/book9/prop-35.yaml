id: IX.35
kind: theorem
title: The sum of a geometric progression

paraphrase: |
  If {A}, {BC}, {D}, {EF} are in continued proportion, then (second − first) : first = (last − first) : (sum of
  all but the last). This gives the sum of a geometric series.

