  aliases: { CG: GC, KH: HK, LK: KL, EL: LE, LF: FL, HF: FH }
  caption: |
    {A}, {BC}, {D}, {EF} in continued proportion; {BG} and {FH} are equal to {A}; {FK} = {BC}, {FL} = {D}.

  equal:
    - [A, BG, FH]
    - [BC, FK]
    - [D, FL]
    - [GC, HK]

steps:
  - part: enunciation
    text: "If as many numbers as we please be in continued proportion, and there be subtracted from the second and the last numbers equal to the first, then, as the excess of the second is to the first, so will the excess of the last be to all those before it."
    highlight: [A, BC, D, EF]
    hint: |
      $(a_2 - a_1) : a_1 = (a_{n+1} - a_1) : (a_1 + \dots + a_n)$.
    modern: |
      $\dfrac{ar - a}{a} = \dfrac{ar^n - a}{a + ar + \dots + ar^{n-1}}$, i.e. $\displaystyle\sum_{k=0}^{n-1}
      ar^k = \frac{a(r^n - 1)}{r - 1}$.

  - part: setting-out
    text: "Let there be as many numbers as we please in continued proportion, A, BC, D, EF, beginning from A as least, and let there be subtracted from BC and EF the numbers BG, FH, each equal to A;"
    highlight: [A, BC, D, EF, BG, FH]
    hint: |
      {BG} = {FH} = {A}.

  - part: specification
    text: "I say that, as GC is to A, so is EH to A, BC, D."
    highlight: [GC, A, EH]
    hint: |
      To prove: {GC} : {A} = {EH} : ({A} + {BC} + {D}).

  - part: construction
    text: "For let FK be made equal to BC, and FL equal to D."
    highlight: [FK, FL]
    hint: |
      Mark the earlier terms inside {EF}.

  - part: proof
    text: "Then, since FK is equal to BC, and of these the part FH is equal to the part BG, therefore the remainder HK is equal to the remainder GC."
    highlight: [HK, GC]
    hint: |
      {HK} = {GC}.

  - part: proof
    text: "And since, as EF is to D, so is D to BC, and BC to A, while D is equal to FL, BC to FK, and A to FH, therefore, as EF is to FL, so is LF to FK, and FK to FH."
    highlight: [EF, FL, FK, FH]
    hint: |
      The progression laid inside {EF}.

  - part: proof
    text: "Separando, as EL is to LF, so is LK to FK, and KH to FH."
    highlight: [LE, FL, KL, FK, HK, FH]
    hint: |
      Subtract: differences in the same ratio ([[VII.11]], [[VII.13]]).

  - part: proof
    text: "Therefore also, as one of the antecedents is to one of the consequents, so are all the antecedents to all the consequents;"
    hint: |
      [[VII.12]].

  - part: proof
    text: "therefore, as KH is to FH, so are EL, LK, KH to LF, FK, HF."
    highlight: [HK, FH, EH]
    hint: |
      {KH} : {FH} = ({EL} + {LK} + {KH}) : ({LF} + {FK} + {HF}), and the left sum is {EH}.

  - part: proof
    text: "But KH is equal to CG, FH to A, and LF, FK, HF to D, BC, A; therefore, as CG is to A, so is EH to D, BC, A."
    highlight: [GC, A, EH]
    hint: |
      Translate back.

  - part: proof
    text: "Therefore, as the excess of the second is to the first, so is the excess of the last to all those before it."
    highlight: [GC, EH]
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.* Terms $a, ar, ar^2, ar^3$.
  lines:
    - steps: [3, 4, 5, 6]
      text: |
        $ar^3 - ar^2 : ar^2 = ar^2 - ar : ar = ar - a : a = r - 1$.
    - steps: [7, 8, 9, 10]
      text: |
        Adding: $(ar^3 - a) : (a + ar + ar^2) = r - 1$, i.e. $S = (ar^3 - a)/(r - 1)$. $\blacksquare$

commentary: |
  The formula for the sum of a geometric series, in ratio form. It is the key to the perfect numbers of
  [[IX.36]], where it shows $1 + 2 + \dots + 2^{n-1} = 2^n - 1$.
