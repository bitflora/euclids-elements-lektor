id: IX.7
kind: theorem
title: A composite number times any number is solid

paraphrase: |
  If {A} is composite, then {A}·{B} is a solid number for any {B}.

diagram:
  width: 250
  height: 175
  elements:
    - "A0;point;free;-1000,40;0;0"
    - "A3;point;free;1000,40;0;0"
    - "B0;point;free;-1000,75;0;0"
    - "B3;point;free;1000,75;0;0"
    - "C0;point;free;-1000,110;0;0"
    - "C3;point;free;1000,110;0;0"
    - "D0;point;free;-1000,145;0;0"
    - "D3;point;free;1000,145;0;0"
    - "U1;point;free;1000,0;0;0"
    - "U2;point;free;1000,40;0;0"
    - "A1;point;lineSlider;A0,A3,30,0;0"
    - "A2;point;lineSlider;A0,A3,160,0;0"
    - "A;line;connect;A1,A2;black"
    - "B1;point;lineSlider;B0,B3,30,0;0"
    - "B2;point;lineSlider;B0,B3,90,0;0"
    - "B;line;connect;B1,B2;black"
    - "C1;point;lineSlider;C0,C3,30,0;0"
    - "C2;point;proportion;U1,U2,A1,A2,B1,B2,C1,C3;0"
    - "C;line;connect;C1,C2;black"
    - "D1;point;lineSlider;D0,D3,30,0;0"
    - "D2;point;lineSlider;D0,D3,80,0;0"
    - "D;line;connect;D1,D2;black"
    - "E1;point;lineSlider;D0,D3,120,0;0"
    - "E2;point;proportion;D1,D2,A1,A2,U1,U2,E1,D3;0"
    - "E;line;connect;E1,E2;black"
  caption: |
    {A} = {D}{E} is composite; {C} = {A}{B}.

steps:
  - part: enunciation
    text: "If a composite number by multiplying any number make some number, the product will be solid."
    highlight: [A, B, C]
    hint: |
      Composite times anything has three factors.
    modern: |
      $a = de$ composite $\Rightarrow ab = deb$ is solid.

  - part: setting-out
    text: "For let the composite number A by multiplying any number B make C;"
    highlight: [A, B, C]
    hint: |
      {C} = {A}{B}.

  - part: specification
    text: "I say that C is solid."
    highlight: [C]
    hint: |
      To prove.

  - part: proof
    text: "For, since A is composite, it will be measured by some number."
    highlight: [A]
    hint: |
      [[VII.Def.13]].

  - part: construction
    text: "Let it be measured by D; and, as many times as D measures A, so many units let there be in E."
    highlight: [D, E]
    hint: |
      {A} = {E} copies of {D}.

  - part: proof
    text: "Since then D measures A according to the units in E, therefore E by multiplying D has made A."
    highlight: [E, D, A]
    hint: |
      {A} = {E}{D} ([[VII.Def.15]]).

  - part: proof
    text: "And, since A by multiplying B has made C, and A is the product of D, E, therefore the product of D, E by multiplying B has made C."
    highlight: [D, E, B, C]
    hint: |
      {C} = {D}{E}{B}.

  - part: proof
    text: "Therefore C is solid, and D, E, B are its sides."
    highlight: [C]
    hint: |
      [[VII.Def.17]].
    cites: [VII.Def.17]

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6, 7]
      text: |
        $c = ab = (de)b$. $\blacksquare$

commentary: |
  Joyce observes that Euclid takes extra steps because "{D} measures {A}, {E} times" and "{E} multiplied by {D}
  is {A}" are, for him, different statements, linked only by [[VII.Def.15]].
