id: IX.36
kind: theorem
title: Euclid's perfect numbers

paraphrase: |
  If $1 + 2 + 4 + \dots + 2^{n-1}$ is prime, then that sum times the last term $2^{n-1}$ is a perfect number.
  For example $1 + 2 + 4 = 7$ is prime, and $7 \cdot 4 = 28 = 1 + 2 + 4 + 7 + 14$.

