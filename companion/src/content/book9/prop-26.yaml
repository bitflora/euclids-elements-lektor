id: IX.26
kind: theorem
title: Odd minus odd is even

paraphrase: |
  If an odd number {BC} is subtracted from an odd number {AB}, the remainder {CA} is even.

diagram:
  width: 220
  height: 60
  elements:
    - "A0;point;free;-1000,30;0;0"
    - "A3;point;free;1000,30;0;0"
    - "U1;point;free;1000,0;0;0"
    - "U2;point;free;1000,20;0;0"
    - "A;point;lineSlider;A0,A3,30,0"
    - "B;point;lineSlider;A0,A3,200,0"
    - "C;point;lineSlider;A0,A3,130,0"
    - "D;point;cutoff;B,A,U1,U2"
    - "AB;line;connect;A,B"
    - "BC;line;connect;B,C;0;0;0"
    - "BD;line;connect;B,D;0;0;0"
    - "AD;line;connect;A,D;0;0;0"
    - "CD;line;connect;C,D;0;0;0"
    - "AC;line;connect;A,C;0;0;0"
  aliases: { CA: AC }
  caption: |
    {BD} is a unit taken off {AB}.

steps:
  - part: enunciation
    text: "If from an odd number an odd number be subtracted, the remainder will be even."
    highlight: [AB, BC]
    hint: |
      odd − odd = even.
    modern: |
      $(2a + 1) - (2b + 1) = 2(a - b)$.

  - part: setting-out
    text: "For from the odd number AB let the odd number BC be subtracted;"
    highlight: [AB, BC]
    hint: |
      {AB}, {BC} odd.

  - part: specification
    text: "I say that the remainder CA is even."
    highlight: [AC]
    hint: |
      To prove.

  - part: construction
    text: "For, since AB is odd, let the unit BD be subtracted;"
    highlight: [BD]
    hint: |
      Take a unit off.

  - part: proof
    text: "therefore the remainder AD is even."
    highlight: [AD]
    hint: |
      [[VII.Def.7]].

  - part: proof
    text: "For the same reason CD is also even;"
    highlight: [CD]
    hint: |
      {CD} = {BC} − 1, even.

  - part: proof
    text: "so that the remainder CA is also even."
    highlight: [AC]
    hint: |
      {CA} = {AD} − {CD}, even − even ([[IX.24]]).

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6]
      text: |
        $(2a + 1) - (2b + 1) = 2a - 2b$. $\blacksquare$
