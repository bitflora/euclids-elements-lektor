id: IX.10
kind: theorem
title: If the first term after the unit is not a square (cube), only the alternate (every third) terms are

paraphrase: |
  In a continued proportion 1, {A}, {B}, … from the unit: if {A} is not a square, the only squares are the
  terms {B}, {D}, {F}, … (every other one); if {A} is not a cube, the only cubes are {C}, {F}, … (every third).

