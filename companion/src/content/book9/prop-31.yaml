    - "D2;point;lineSlider;D0,D3,60,0;0"
    - "D;line;connect;D1,D2;black"
  caption: |
    {C} is double {B}; {D} is the supposed common measure of {A} and {C}.

steps:
  - part: enunciation
    text: "If an odd number be prime to any number, it will also be prime to the double of it."
    highlight: [A, B, C]
    hint: |
      $a$ odd, $\gcd(a, b) = 1 \Rightarrow \gcd(a, 2b) = 1$.
    modern: |
      $a$ odd, $\gcd(a, b) = 1 \Rightarrow \gcd(a, 2b) = 1$.

  - part: setting-out
    text: "For let the odd number A be prime to any number B, and let C be double of B;"
    highlight: [A, B, C]
    hint: |
      {C} = 2{B}.

  - part: specification
    text: "I say that A is prime to C."
    highlight: [A, C]
    hint: |
      To prove.

  - part: proof
    text: "For, if they are not prime to one another, some number will measure them."
    highlight: [A, C]
    hint: |
      Suppose not.

  - part: construction
    text: "Let a number measure them, and let it be D."
    highlight: [D]
    hint: |
      A common measure {D}.

  - part: proof
    text: "Now A is odd; therefore D is also odd."
    highlight: [A, D]
    hint: |
      A measure of an odd number is odd ([[IX.28]], tacitly).
    explain:
      implicit: |
        If {D} were even, every multiple of it would be even ([[IX.28]]); {A} is not.
    cites: [IX.28]

  - part: proof
    text: "And since D which is odd measures C, and C is even, therefore [D] will measure the half of C also."
    highlight: [D, C]
    hint: |
      [[IX.30]].

  - part: proof
    text: "But B is half of C; therefore D measures B."
    highlight: [D, B]
    hint: |
      {D} measures {B}.

  - part: proof
    text: "But it also measures A; therefore D measures A, B which are prime to one another: which is impossible."
    highlight: [D, A, B]
    hint: |
      Contradiction.

  - part: proof
    text: "Therefore A cannot but be prime to C."
    highlight: [A, C]
    hint: |
      Coprime.

  - part: proof
    text: "Therefore A, C are prime to one another."
    highlight: [A, C]
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6, 7, 8]
      text: |
        A common divisor $d$ of $a$ and $2b$ is odd, so it divides $b$ ([[IX.30]]); hence $d = 1$. $\blacksquare$

commentary: |
  Used in [[IX.32]]. Joyce notes the general form: if $a$ is coprime to both 2 and $b$, it is coprime to
  $2b$ ([[VII.24]]).
