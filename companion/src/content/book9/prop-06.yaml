id: IX.6
kind: theorem
title: If the square of a number is a cube, the number is a cube

paraphrase: |
  If {A}·{A} is a cube, then {A} itself is a cube.

diagram:
  width: 250
  height: 140
  elements:
    - "A0;point;free;-1000,40;0;0"
    - "A3;point;free;1000,40;0;0"
    - "B0;point;free;-1000,75;0;0"
    - "B3;point;free;1000,75;0;0"
    - "C0;point;free;-1000,110;0;0"
    - "C3;point;free;1000,110;0;0"
    - "U1;point;free;1000,0;0;0"
    - "U2;point;free;1000,35;0;0"
    - "A1;point;lineSlider;A0,A3,30,0;0"
    - "A2;point;lineSlider;A0,A3,90,0;0"
    - "A;line;connect;A1,A2;black"
    - "B1;point;lineSlider;B0,B3,30,0;0"
    - "B2;point;proportion;U1,U2,A1,A2,A1,A2,B1,B3;0"
    - "B;line;connect;B1,B2;black"
    - "C1;point;lineSlider;C0,C3,30,0;0"
    - "C2;point;proportion;U1,U2,A1,A2,B1,B2,C1,C3;0"
    - "C;line;connect;C1,C2;black"
  caption: |
    {B} = {A}² is a cube; {C} = {A}·{B} = {A}³.

steps:
  - part: enunciation
    text: "If a number by multiplying itself make a cube number, it will itself also be cube."
    highlight: [A, B]
    hint: |
      $a^2$ a cube $\Rightarrow a$ a cube.
    modern: |
      $a^2 = n^3 \Rightarrow a$ is a cube.

  - part: setting-out
    text: "For let the number A by multiplying itself make the cube number B;"
    highlight: [A, B]
    hint: |
      {B} = {A}², a cube.

  - part: specification
    text: "I say that A is also cube."
    highlight: [A]
    hint: |
      To prove.

  - part: construction
    text: "For let A by multiplying B make C."
    highlight: [C]
    hint: |
      {C} = {A}³.

  - part: proof
    text: "Since, then, A by multiplying itself has made B, and by multiplying B has made C, therefore C is cube."
    highlight: [C]
    hint: |
      {C} is a cube ([[VII.Def.19]]).

  - part: proof
    text: "And, since A by multiplying itself has made B, therefore A measures B according to the units in itself."
    highlight: [A, B]
    hint: |
      {B} = {A} copies of {A}.

  - part: proof
    text: "But the unit also measures A according to the units in it."
    highlight: [A]
    hint: |
      And the unit goes {A} times into {A}.

  - part: proof
    text: "Therefore, as the unit is to A, so is A to B."
    highlight: [A, B]
    hint: |
      1 : {A} = {A} : {B}.

  - part: proof
    text: "And, since A by multiplying B has made C, therefore B measures C according to the units in A."
    highlight: [B, C, A]
    hint: |
      {C} = {A} copies of {B}.

  - part: proof
    text: "But the unit also measures A according to the units in it."
    highlight: [A]
    hint: |
      As before.

  - part: proof
    text: "Therefore, as the unit is to A, so is B to C."
    highlight: [B, C]
    hint: |
      1 : {A} = {B} : {C}.

  - part: proof
    text: "But, as the unit is to A, so is A to B; therefore also, as A is to B, so is B to C."
    highlight: [A, B, C]
    hint: |
      {A}, {B}, {C} in continued proportion.

  - part: proof
    text: "And, since B, C are cube, they are similar solid numbers."
    highlight: [B, C]
    hint: |
      Cubes.

  - part: proof
    text: "Therefore there are two mean proportional numbers between B, C."
    highlight: [B, C]
    hint: |
      [[VIII.19]].

  - part: proof
    text: "And, as B is to C, so is A to B."
    highlight: [A, B, C]
    hint: |
      Shown above.

  - part: proof
    text: "Therefore there are two mean proportional numbers between A, B also."
    highlight: [A, B]
    hint: |
      [[VIII.8]].

  - part: proof
    text: "And B is cube; therefore A is also cube."
    highlight: [A, B]
    hint: |
      Compare [[VIII.23]].
    explain:
      implicit: |
        [[VIII.23]] says that if the *first* of four is a cube, so is the fourth; here the fourth ({B}) is the
        cube and the first ({A}) is concluded to be one. The same argument works in reverse, which Heath's
        "cf." acknowledges.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6, 7, 8, 9, 10, 11]
      text: |
        $a : a^2 = a^2 : a^3$, and $a^2$, $a^3$ are cubes, so $a : a^2$ is a ratio of cubes.
    - steps: [12, 13, 14, 15, 16]
      text: |
        $a = a^2 \cdot (a/a^2)$: a cube times a ratio of cubes, whole, hence a cube. $\blacksquare$
