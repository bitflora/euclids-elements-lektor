id: IX.17
kind: theorem
title: A progression with coprime extremes cannot be extended

paraphrase: |
  If {A}, {B}, {C}, {D} are in continued proportion with {A}, {D} coprime, there is no number {E} with {A} :
  {B} = {D} : {E}.

