steps:
  - part: enunciation
    text: "If there be as many numbers as we please in continued proportion, and the extremes of them be prime to one another, the last will not be to any other number as the first to the second."
    highlight: [A, B, C, D]
    hint: |
      A least progression cannot be continued in whole numbers.
    modern: |
      $a, ar, \dots, ar^{n-1}$ with $\gcd$ of extremes $1$ $\Rightarrow$ $ar^n$ is not whole.

  - part: setting-out
    text: "For let there be as many numbers as we please, A, B, C, D, in continued proportion, and let the extremes of them, A, D, be prime to one another;"
    highlight: [A, B, C, D]
    hint: |
      {A}, {D} coprime.

  - part: specification
    text: "I say that D is not to any other number as A is to B."
    highlight: [D]
    hint: |
      To prove.

  - part: proof
    text: "For, if possible, as A is to B, so let D be to E;"
    highlight: [A, B, D, E]
    hint: |
      Suppose {E} exists.

  - part: proof
    text: "therefore, alternately, as A is to D, so is B to E."
    highlight: [A, D, B, E]
    hint: |
      [[VII.13]].

  - part: proof
    text: "But A, D are prime, primes are also least, and the least numbers measure those which have the same ratio the same number of times, the antecedent the antecedent and the consequent the consequent."
    highlight: [A, D]
    hint: |
      [[VII.21]], [[VII.20]].

  - part: proof
    text: "Therefore A measures B."
    highlight: [A, B]
    hint: |
      {A} measures {B}.

  - part: proof
    text: "And, as A is to B, so is B to C."
    highlight: [A, B, C]
    hint: |
      Continued proportion.

  - part: proof
    text: "Therefore B also measures C; so that A also measures C."
    highlight: [B, C, A]
    hint: |
      Same ratio, so {B} measures {C}.

  - part: proof
    text: "And since, as B is to C, so is C to D, and B measures C, therefore C also measures D."
    highlight: [C, D]
    hint: |
      And {C} measures {D}.

  - part: proof
    text: "But A measured C; so that A also measures D."
    highlight: [A, D]
    hint: |
      {A} measures {D}.

  - part: proof
    text: "But it also measures itself; therefore A measures A, D which are prime to one another: which is impossible."
    highlight: [A, D]
    hint: |
      Contradiction.

  - part: proof
    text: "Therefore D will not be to any other number as A is to B."
    highlight: [D]
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6, 7, 8, 9, 10, 11]
      text: |
        $a : d = b : e$ with $a : d$ in lowest terms forces $a \mid b$; then each term divides the next, so $a
        \mid d$, contradicting $\gcd(a, d) = 1$ (unless $a = 1$). $\blacksquare$

commentary: |
  Generalises [[IX.16]] from two terms to any number. Used in [[IX.19]].
