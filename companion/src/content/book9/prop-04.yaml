  caption: |
    {C} = {A}{B}, {D} = {A}².

steps:
  - part: enunciation
    text: "If a cube number by multiplying a cube number make some number, the product will be cube."
    highlight: [A, B, C]
    hint: |
      $m^3 n^3 = (mn)^3$.
    modern: |
      $m^3 n^3 = (mn)^3$.

  - part: setting-out
    text: "For let the cube number A by multiplying the cube number B make C;"
    highlight: [A, B, C]
    hint: |
      {C} = {A}{B}.

  - part: specification
    text: "I say that C is cube."
    highlight: [C]
    hint: |
      To prove.

  - part: construction
    text: "For let A by multiplying itself make D;"
    highlight: [D]
    hint: |
      {D} = {A}².

  - part: proof
    text: "therefore D is cube."
    highlight: [D]
    hint: |
      [[IX.3]].

  - part: proof
    text: "And, since A by multiplying itself has made D, and by multiplying B has made C therefore, as A is to B, so is D to C."
    highlight: [A, B, D, C]
    hint: |
      [[VII.17]].

  - part: proof
    text: "And, since A, B are cube numbers, A, B are similar solid numbers."
    highlight: [A, B]
    hint: |
      Cubes are similar solid numbers.

  - part: proof
    text: "Therefore two mean proportional numbers fall between A, B; so that two mean proportional numbers will fall between D, C also."
    highlight: [D, C]
    hint: |
      [[VIII.19]], [[VIII.8]].

  - part: proof
    text: "And D is cube; therefore C is also cube"
    highlight: [C]
    hint: |
      [[VIII.23]].

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6, 7, 8]
      text: |
        $a^2 : ab = a : b$, a ratio of cubes; $a^2$ is a cube ([[IX.3]]), hence so is $ab$ ([[VIII.25]]).
        $\blacksquare$
