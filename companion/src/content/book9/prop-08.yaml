id: IX.8
kind: theorem
title: In a progression from the unit, every other term is a square, every third a cube

paraphrase: |
  In a continued proportion 1, {A}, {B}, {C}, {D}, {E}, {F}, … starting from the unit, the 3rd, 5th, 7th, …
  terms are squares, the 4th, 7th, 10th, … are cubes, and the 7th, 13th, … are both.

