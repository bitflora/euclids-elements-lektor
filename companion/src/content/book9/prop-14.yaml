steps:
  - part: enunciation
    text: "If a number be the least that is measured by prime numbers, it will not be measured by any other prime number except those originally measuring it."
    highlight: [A, B, C, D]
    hint: |
      $\operatorname{lcm}(p_1, \dots, p_k)$ has no other prime factors.
    modern: |
      If $a = \operatorname{lcm}(p_1, \dots, p_k)$ and $q$ is a prime dividing $a$, then $q$ is some $p_i$.

  - part: setting-out
    text: "For let the number A be the least that is measured by the prime numbers B, C, D;"
    highlight: [A, B, C, D]
    hint: |
      {A} = lcm({B}, {C}, {D}).

  - part: specification
    text: "I say that A will not be measured by any other prime number except B, C, D."
    highlight: [A]
    hint: |
      To prove.

  - part: proof
    text: "For, if possible, let it be measured by the prime number E, and let E not be the same with any one of the numbers B, C, D."
    highlight: [E]
    hint: |
      Suppose another prime {E}.

  - part: construction
    text: "Now, since E measures A, let it measure it according to F; therefore E by multiplying F has made A."
    highlight: [E, F, A]
    hint: |
      {A} = {E}{F}.

  - part: proof
    text: "And A is measured by the prime numbers B, C, D."
    highlight: [A, B, C, D]
    hint: |
      Recalled.

  - part: proof
    text: "But, if two numbers by multiplying one another make some number, and any prime number measure the product, it will also measure one of the original numbers; therefore B, C, D will measure one of the numbers E, F."
    highlight: [B, C, D, E, F]
    hint: |
      [[VII.30]].

  - part: proof
    text: "Now they will not measure E; for E is prime and not the same with any one of the numbers B, C, D."
    highlight: [E]
    hint: |
      Not {E}.

  - part: proof
    text: "Therefore they will measure F, which is less than A: which is impossible, for A is by hypothesis the least number measured by B, C, D."
    highlight: [F, A]
    hint: |
      So they all measure the smaller {F}: contradiction.

  - part: proof
    text: "Therefore no prime number will measure A except B, C, D."
    highlight: [A]
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6, 7, 8, 9]
      text: |
        If $a = qf$, each $p_i$ divides $q$ or $f$ ([[VII.30]]); not $q$, so all divide $f < a$ — contradicting
        minimality. $\blacksquare$

commentary: |
  Often cited as Euclid's version of the uniqueness half of the fundamental theorem of arithmetic. It shows
  that a product of distinct primes has no other prime factor; it does not address repeated factors, and it
  never states that factorisation is unique. Joyce notes that the least common multiple of distinct primes is
  their product, though Euclid does not say so.

historical: |
  Heath regards this as "the nearest" Euclid comes to unique factorisation. The full theorem was first
  stated and proved by Gauss (*Disquisitiones Arithmeticae*, 1801, §16).
