id: IX.24
kind: theorem
title: Even minus even is even

paraphrase: |
  If an even number {BC} is subtracted from an even number {AB}, the remainder {CA} is even.

diagram:
  width: 180
  height: 60
  elements:
    - "A0;point;free;-1000,30;0;0"
    - "A3;point;free;1000,30;0;0"
    - "A;point;lineSlider;A0,A3,30,0"
    - "B;point;lineSlider;A0,A3,100,0"
    - "C;point;lineSlider;A0,A3,140,0"
    - "AC;line;connect;A,C"
    - "AB;line;connect;A,B;0;0;0"
    - "BC;line;connect;B,C;0;0;0"
  aliases: { CA: AC }
  caption: |
    {BC} is taken from {AB}, leaving {AC}.

steps:
  - part: enunciation
    text: "If from an even number an even number be subtracted, the remainder will be even."
    highlight: [AB, BC]
    hint: |
      even − even = even.
    modern: |
      $2a - 2b = 2(a - b)$.

  - part: setting-out
    text: "For from the even number AB let the even number BC be subtracted:"
    highlight: [AB, BC]
    hint: |
      {AB}, {BC} even.

  - part: specification
    text: "I say that the remainder CA is even."
    highlight: [AC]
    hint: |
      To prove.

  - part: proof
    text: "For, since AB is even, it has a half part."
    highlight: [AB]
    hint: |
      [[VII.Def.6]].

  - part: proof
    text: "For the same reason BC also has a half part; so that the remainder [CA also has a half part, and] AC is therefore even."
    highlight: [BC, AC]
    hint: |
      The difference of halves is half the difference ([[VII.7]], tacitly).
    cites: [VII.7]

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4]
      text: |
        $2a - 2b = 2(a - b)$. $\blacksquare$
