id: IX.2
kind: theorem
title: Numbers whose product is a square are similar plane numbers

paraphrase: |
  If {A}·{B} is a square, then {A} and {B} are similar plane numbers. The converse of [[IX.1]].

diagram:
  width: 260
  height: 170
  elements:
    - "A0;point;free;-1000,40;0;0"
