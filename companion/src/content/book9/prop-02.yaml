  caption: |
    {C} = {A}{B} is square; {D} = {A}².

steps:
  - part: enunciation
    text: "If two numbers by multiplying one another make a square number, they are similar plane numbers."
    highlight: [A, B, C]
    hint: |
      $ab$ a square $\Rightarrow$ $a, b$ similar plane.
    modern: |
      $ab = c^2 \Rightarrow a : b$ is a ratio of squares.

  - part: setting-out
    text: "Let A, B be two numbers, and let A by multiplying B make the square number C;"
    highlight: [A, B, C]
    hint: |
      {C} = {A}{B}, a square.

  - part: specification
    text: "I say that A, B are similar plane numbers."
    highlight: [A, B]
    hint: |
      To prove.

  - part: construction
    text: "For let A by multiplying itself make D; therefore D is square."
    highlight: [D]
    hint: |
      {D} = {A}².

  - part: proof
    text: "Now, since A by multiplying itself has made D, and by multiplying B has made C, therefore, as A is to B, so is D to C."
    highlight: [A, B, D, C]
    hint: |
      [[VII.17]].

  - part: proof
    text: "And, since D is square, and C is so also, therefore D, C are similar plane numbers."
    highlight: [D, C]
    hint: |
      Squares are similar plane numbers.

  - part: proof
    text: "Therefore one mean proportional number falls between D, C."
    highlight: [D, C]
    hint: |
      [[VIII.18]].

  - part: proof
    text: "And, as D is to C, so is A to B; therefore one mean proportional number falls between A, B also."
    highlight: [A, B]
    hint: |
      [[VIII.8]].

  - part: proof
    text: "But, if one mean proportional number fall between two numbers, they are similar plane numbers; therefore A, B are similar plane numbers."
    highlight: [A, B]
    hint: |
      [[VIII.20]].

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6, 7, 8]
      text: |
        $a : b = a^2 : ab$, a ratio of two squares; so a mean falls between $a$ and $b$ ([[VIII.8]]), and they
        are similar plane ([[VIII.20]]). $\blacksquare$

commentary: |
  Joyce's example: 400 = 20² factors as 8·50, and 8 = 2·4, 50 = 5·10 with 2 : 4 = 5 : 10.
