id: IX.3
kind: theorem
title: The square of a cube is a cube

paraphrase: |
  If {A} is a cube, then {A}·{A} is a cube.

diagram:
  width: 250
  height: 140
  elements:
    - "A0;point;free;-1000,40;0;0"
    - "A3;point;free;1000,40;0;0"
    - "B0;point;free;-1000,75;0;0"
    - "B3;point;free;1000,75;0;0"
    - "C0;point;free;-1000,110;0;0"
    - "C3;point;free;1000,110;0;0"
    - "U1;point;free;1000,0;0;0"
    - "U2;point;free;1000,30;0;0"
    - "A1;point;lineSlider;A0,A3,30,0;0"
    - "A2;point;lineSlider;A0,A3,105,0;0"
    - "A;line;connect;A1,A2;black"
    - "B1;point;lineSlider;B0,B3,30,0;0"
    - "B2;point;proportion;U1,U2,A1,A2,A1,A2,B1,B3;0"
    - "B;line;connect;B1,B2;black"
    - "C1;point;lineSlider;C0,C3,30,0;0"
    - "C2;point;lineSlider;C0,C3,75,0;0"
    - "C;line;connect;C1,C2;black"
    - "D1;point;lineSlider;C0,C3,110,0;0"
    - "D2;point;proportion;U1,U2,C1,C2,C1,C2,D1,C3;0"
    - "D;line;connect;D1,D2;black"
  caption: |
    {A} = {C}³, {D} = {C}², {B} = {A}².

steps:
  - part: enunciation
    text: "If a cube number by multiplying itself make some number, the product will be cube."
    highlight: [A, B]
    hint: |
      $(c^3)^2 = (c^2)^3$.
    modern: |
      $(c^3)^2 = (c^2)^3$.

  - part: setting-out
    text: "For let the cube number A by multiplying itself make B;"
    highlight: [A, B]
    hint: |
      {B} = {A}².

  - part: specification
    text: "I say that B is cube."
    highlight: [B]
    hint: |
      To prove.

  - part: construction
    text: "For let C, the side of A, be taken, and let C by multiplying itself make D."
    highlight: [C, D]
    hint: |
      {C} the side, {D} = {C}².

  - part: proof
    text: "It is then manifest that C by multiplying D has made A."
    highlight: [C, D, A]
    hint: |
      {A} = {C}{D} ([[VII.Def.19]]).

  - part: proof
    text: "Now, since C by multiplying itself has made D, therefore C measures D according to the units in itself."
    highlight: [C, D]
    hint: |
      {D} is {C} copies of {C}.

  - part: proof
    text: "But further the unit also measures C according to the units in it; therefore, as the unit is to C, so is C to D."
    highlight: [C, D]
    hint: |
      1 : {C} = {C} : {D}.

  - part: proof
    text: "Again, since C by multiplying D has made A, therefore D measures A according to the units in C."
    highlight: [D, A, C]
    hint: |
      {A} is {C} copies of {D}.

  - part: proof
    text: "But the unit also measures C according to the units in it; therefore, as the unit is to C, so is D to A."
    highlight: [C, D, A]
    hint: |
      1 : {C} = {D} : {A}.

  - part: proof
    text: "But, as the unit is to C, so is C to D; therefore also, as the unit is to C, so is C to D, and D to A."
    highlight: [C, D, A]
    hint: |
      1, {C}, {D}, {A} in continued proportion.

  - part: proof
    text: "Therefore between the unit and the number A two mean proportional numbers C, D have fallen in continued proportion."
    highlight: [C, D, A]
    hint: |
      Two means between the unit and {A}.

  - part: proof
    text: "Again, since A by multiplying itself has made B, therefore A measures B according to the units in itself."
    highlight: [A, B]
    hint: |
      {B} is {A} copies of {A}.

  - part: proof
    text: "But the unit also measures A according to the units in it; therefore, as the unit is to A, so is A to B."
    highlight: [A, B]
    hint: |
      1 : {A} = {A} : {B}.

  - part: proof
    text: "But between the unit and A two mean proportional numbers have fallen; therefore two mean proportional numbers will also fall between A, B."
    highlight: [A, B]
    hint: |
      [[VIII.8]].

  - part: proof
    text: "But, if two mean proportional numbers fall between two numbers, and the first be cube, the second will also be cube."
    highlight: [A, B]
    hint: |
      [[VIII.23]].

  - part: proof
    text: "And A is cube; therefore B is also cube."
    highlight: [B]
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6, 7, 8, 9, 10]
      text: |
        $1, c, c^2, c^3$ is a progression.
    - steps: [11, 12, 13, 14, 15]
      text: |
        $1 : c^3 = c^3 : c^6$, so two means fall between $c^3$ and $c^6$, which is therefore a cube.
        $\blacksquare$

commentary: |
  Joyce: "Modern algebra certainly makes short work of this proposition." Euclid has no exponents, so a
  statement about powers becomes a statement about means between numbers and the unit.
