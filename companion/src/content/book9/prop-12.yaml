id: IX.12
kind: theorem
title: A prime dividing a power divides the base

paraphrase: |
  In a continued proportion 1, {A}, {B}, {C}, {D} from the unit, every prime that measures the last term {D}
  also measures {A}. In powers: if $p \mid a^n$ then $p \mid a$.

