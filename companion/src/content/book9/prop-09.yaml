id: IX.9
kind: theorem
title: If the first term after the unit is a square (cube), all terms are

paraphrase: |
  In a continued proportion 1, {A}, {B}, … from the unit, if {A} is a square then every term is a square; if
  {A} is a cube then every term is a cube.

