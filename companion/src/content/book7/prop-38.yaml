steps:
  - part: enunciation
    text: "If a number have any part whatever, it will be measured by a number called by the same name as the part."
    highlight: [A]
    hint: |
      If $a$ has a $1/c$ part, then $c \mid a$.
    modern: |
      $\tfrac1c a$ a whole number $\Rightarrow c \mid a$.

  - part: setting-out
    text: "For let the number A have any part whatever, B, and let C be a number called by the same name as the part B;"
    highlight: [A, B, C]
    hint: |
      {B} is the "{C}-th" part of {A}.

  - part: specification
    text: "I say that C measures A."
    highlight: [C, A]
    hint: |
      To prove: {C} measures {A}.

  - part: proof
    text: "For, since B is a part of A called by the same name as C, and the unit D is also a part of C called by the same name as it, therefore, whatever part the unit D is of the number C, the same part is B of A also;"
    highlight: [B, A, D, C]
    hint: |
      {B} is to {A} as the unit {D} is to {C}.

  - part: proof
    text: "therefore the unit D measures the number C the same number of times that B measures A."
    highlight: [D, C, B, A]
    hint: |
      Restated as "measures the same number of times".

  - part: proof
    text: "Therefore, alternately, the unit D measures the number B the same number of times that C measures A."
    highlight: [D, B, C, A]
    hint: |
      Alternate ([[VII.15]]).

  - part: proof
    text: "Therefore C measures A."
    highlight: [C, A]
    hint: |
      {C} goes into {A} ({B} times).

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3, 4, 5, 6]
      text: |
        $a = cb$ means $a = bc$ ([[VII.15]]): $c$ goes $b$ times into $a$. $\blacksquare$
