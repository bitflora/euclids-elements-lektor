id: VII.37
kind: theorem
title: A number measured by B has a "B-th" part

paraphrase: |
  If {B} measures {A}, then {A} has a part "called by the same name" as {B}: if 3 measures 12, then 12 has a
  third part (namely 4).

diagram:
  width: 250
  height: 170
  elements:
    - "A0;point;free;-1000,35;0;0"
    - "A3;point;free;1000,35;0;0"
    - "B0;point;free;-1000,70;0;0"
    - "B3;point;free;1000,70;0;0"
    - "C0;point;free;-1000,105;0;0"
