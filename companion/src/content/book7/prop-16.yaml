  caption: |
    {C} is {A} multiplied by {B}; {D} is {B} multiplied by {A}. {E} is the unit.

  equal:
    - [C, D]

steps:
  - part: enunciation
    text: "If two numbers by multiplying one another make certain numbers, the numbers so produced will be equal to one another."
    highlight: [A, B, C, D]
    hint: |
      $ab = ba$.
    modern: |
      $a \cdot b = b \cdot a$.

  - part: setting-out
    text: "Let A, B be two numbers, and let A by multiplying B make C, and B by multiplying A make D;"
    highlight: [A, B, C, D]
    hint: |
      {C} = {A} × {B} ({B} added to itself {A} times); {D} = {B} × {A}.
    explain:
      fact: |
        "{A} multiplying {B}" means {B} taken as many times as there are units in {A} ([[VII.Def.15]]).

  - part: specification
    text: "I say that C is equal to D."
    highlight: [C, D]
    hint: |
      To prove: {C} = {D}.

  - part: proof
    text: "For, since A by multiplying B has made C, therefore B measures C according to the units in A."
    highlight: [B, C, A]
    hint: |
      {B} goes into {C} as many times as {A} has units.
    cites: [VII.Def.15]

  - part: proof
    text: "But the unit E also measures the number A according to the units in it; therefore the unit E measures A the same number of times that B measures C."
    highlight: [E, A, B, C]
    hint: |
      And the unit {E} goes into {A} that many times.

  - part: proof
    text: "Therefore, alternately, the unit E measures the number B the same number of times that A measures C."
    highlight: [E, B, A, C]
    hint: |
      Alternate ([[VII.15]]): {A} goes into {C} as many times as {B} has units.

  - part: proof
    text: "Again, since B by multiplying A has made D, therefore A measures D according to the units in B."
    highlight: [A, D, B]
    hint: |
      And by definition {A} goes into {D} as many times as {B} has units.

  - part: proof
    text: "But the unit E also measures B according to the units in it; therefore the unit E measures the number B the same number of times that A measures D."
    highlight: [E, B, A, D]
    hint: |
      Restated with the unit.

  - part: proof
    text: "But the unit E measured the number B the same number of times that A measures C; therefore A measures each of the numbers C, D the same number of times."
    highlight: [A, C, D]
    hint: |
      So {A} goes into {C} and into {D} the same number of times.

  - part: proof
    text: "Therefore C is equal to D."
    highlight: [C, D]
    hint: |
      Hence {C} = {D}.
    explain:
      implicit: |
        Equal multiples of the same number are equal: evident from counting, not stated.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.* Write $a = n \cdot 1$, $b = m \cdot 1$.
  lines:
    - steps: [1, 2, 3, 4, 5]
      text: |
        $ab$ is $b$ taken $n$ times; by [[VII.15]], $b$ taken $n$ times is $n$ taken $m$ times, i.e. $a$
        taken $m$ times.
    - steps: [6, 7, 8, 9]
      text: |
        And $ba$ is $a$ taken $m$ times. So $ab = ba$. $\blacksquare$

commentary: |
  Euclid does not assume that multiplication is commutative; [[VII.Def.15]] defines $ab$ asymmetrically,
  and this proposition is the proof that the order does not matter. It is the basis of [[VII.18]] and much
  else.

  A modern axiomatic treatment (Peano arithmetic) proves commutativity by a double induction; Euclid's proof
  hides that induction inside [[VII.12]] and [[VII.15]].
