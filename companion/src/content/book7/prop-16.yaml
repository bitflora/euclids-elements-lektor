id: VII.16
kind: theorem
title: Multiplication is commutative

paraphrase: |
  {A} times {B} equals {B} times {A}.

diagram:
  width: 250
  height: 200
  elements:
    - "A0;point;free;-1000,40;0;0"
    - "A3;point;free;1000,40;0;0"
