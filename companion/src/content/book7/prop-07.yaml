id: VII.7
kind: theorem
title: The same part of two numbers is that part of their difference

paraphrase: |
  If {AB} is the same part of {CD} as {AE} is of {CF}, then the remainder {EB} is that same part of the
  remainder {FD}: $\tfrac1n b - \tfrac1n e = \tfrac1n (b - e)$.

diagram:
  width: 300
  height: 120
  elements:
    - "A0;point;free;-1000,40;0;0"
    - "A3;point;free;1000,40;0;0"
    - "C0;point;free;-1000,80;0;0"
    - "C3;point;free;1000,80;0;0"
    - "A;point;lineSlider;A0,A3,120,40"
    - "B;point;lineSlider;A0,A3,195,40"
    - "AB;line;connect;A,B"
    - "C;point;lineSlider;C0,C3,120,80"
    - "D';point;cutoff;C,C3,A,B;0;0"
    - "D;point;cutoff;D',C3,A,B"
    - "CD;line;connect;C,D"
    - "E;point;lineSlider;A0,A3,150,40"
    - "F';point;cutoff;C,C3,A,E;0;0"
    - "F;point;cutoff;F',C3,A,E"
    - "G;point;cutoff;C,C0,F,D"
    - "GC;line;connect;G,C"
    - "AE;line;connect;A,E;0;0;0"
    - "EB;line;connect;E,B;0;0;0"
    - "CF;line;connect;C,F;0;0;0"
    - "FD;line;connect;F,D;0;0;0"
    - "GF;line;connect;G,F;0;0;0"
  aliases: { BA: AB, DF: FD, CG: GC }
  caption: |
    {AB} is a third of {CD}, {AE} a third of {CF}. The auxiliary {CG} is made three times {EB}.

  equal:
    - [CD, GF]

steps:
  - part: enunciation
    text: "If a number be that part of a number, which a number subtracted is of a number subtracted, the remainder will also be the same part of the remainder that the whole is of the whole."
    highlight: [AB, CD, AE, CF]
    hint: |
      Taking a part distributes over subtraction.
    modern: |
      $\tfrac1n b - \tfrac1n e = \tfrac1n (b - e)$.

  - part: setting-out
    text: "For let the number AB be that part of the number CD which AE subtracted is of CF subtracted;"
    highlight: [AB, CD, AE, CF]
    hint: |
      {AB} is $1/n$ of {CD}, and the piece {AE} is $1/n$ of the piece {CF}.

  - part: specification
    text: "I say that the remainder EB is also the same part of the remainder FD that the whole AB is of the whole CD."
    highlight: [EB, FD]
    hint: |
      To prove: {EB} is $1/n$ of {FD}.

  - part: construction
    text: "For, whatever part AE is of CF, the same part also let EB be of CG."
    highlight: [EB, GC]
    hint: |
      Make {CG} $n$ times {EB}, laid off beyond {C}.
    explain:
      did: |
        An auxiliary number: {CG} is the number of which {EB} is $1/n$. It exists, since multiplying is
        always possible.

  - part: proof
    text: "Now since, whatever part AE is of CF, the same part also is EB of CG, therefore, whatever part AE is of CF, the same part also is AB of GF."
    highlight: [AE, CF, EB, GC, AB, GF]
    hint: |
      By [[VII.5]], {AE} + {EB} = {AB} is $1/n$ of {CF} + {CG} = {GF}.

  - part: proof
    text: "But, whatever part AE is of CF, the same part also, by hypothesis, is AB of CD; therefore, whatever part AB is of GF, the same part is it of CD also; therefore GF is equal to CD."
    highlight: [AB, GF, CD]
    hint: |
      {AB} is $1/n$ of both {GF} and {CD}, so {GF} = {CD}.
    explain:
      fact: |
        Two numbers of which the same number is the same part are equal: both are $n$ times it.
      implicit: |
        Not proved separately; the analogue for magnitudes is [[V.Def.2]] with "equimultiples of equals are
        equal".

  - part: proof
    text: "Let CF be subtracted from each; therefore the remainder GC is equal to the remainder FD."
    highlight: [CF, GC, FD]
    hint: |
      Take {CF} from both: {GC} = {FD}.
    cites: [I.CN.3]

  - part: proof
    text: "Now since, whatever part AE is of CF, the same part also is EB of GC, while GC is equal to FD, therefore, whatever part AE is of CF, the same part also is EB of FD."
    highlight: [EB, GC, FD]
    hint: |
      So {EB} is $1/n$ of {FD} too.

  - part: proof
    text: "But, whatever part AE is of CF, the same part also is AB of CD; therefore also the remainder EB is the same part of the remainder FD that the whole AB is of the whole CD."
    highlight: [EB, FD, AB, CD]
    hint: |
      The conclusion: the remainder is the same part of the remainder as the whole of the whole.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3]
      text: |
        $CD = n\,AB$, $CF = n\,AE$. Let $CG = n\,EB$.
    - steps: [4, 5]
      text: |
        $CF + CG = n(AE + EB) = n\,AB = CD$.
    - steps: [6, 7, 8]
      text: |
        So $CG = CD - CF = FD$, and $FD = n\,EB$. $\blacksquare$
  closing: |
    The detour through {CG} avoids subtracting multiples directly: Euclid has addition of parts
    ([[VII.5]]) and reduces subtraction to it.

commentary: |
  The subtractive companion of [[VII.5]]; the magnitude version is [[V.5]], proved by the same device of an
  auxiliary multiple.
