id: VII.34
kind: problem
title: The least common multiple of two numbers

paraphrase: |
  To find the least number that two given numbers {A}, {B} both measure. If they are coprime it is their
  product; otherwise reduce {A} : {B} to lowest terms {F} : {E}, and the answer is {A}·{E} (= {B}·{F}).

