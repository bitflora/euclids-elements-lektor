id: VII.27
kind: theorem
title: Squares and cubes of coprime numbers are coprime

paraphrase: |
  If {A} and {B} are prime to one another, so are their squares {C}, {E}, and so are their cubes {D},
  {F}.

diagram:
  width: 210
  height: 290
  elements:
