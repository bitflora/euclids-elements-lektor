  caption: |
    {C} = {A}², {D} = {A}³; {E} = {B}², {F} = {B}³.

steps:
  - part: enunciation
    text: "If two numbers be prime to one another, and each by multiplying itself make a certain number, the products will be prime to one another; and, if the original numbers by multiplying the products make certain numbers, the latter will also be prime to one another [and this is always the case with the extremes]."
    highlight: [A, B, C, D, E, F]
    hint: |
      $\gcd(a, b) = 1 \Rightarrow \gcd(a^2, b^2) = \gcd(a^3, b^3) = 1$.
    explain:
      implicit: |
        Heath prints in square brackets words that Heiberg's edition marks as probably interpolated. The
        clause seems to say that the property goes on to higher powers.
    modern: |
      $\gcd(a, b) = 1 \Rightarrow \gcd(a^n, b^n) = 1$ (Euclid proves $n = 2, 3$).
    dispute: |
      What "the extremes" means is uncertain. One reading takes them to be the last terms of the two series
      of powers $a, a^2, a^3, \dots$ and $b, b^2, b^3, \dots$, so that the clause extends the result to all
      powers; the clause is not used in the proof either way.

  - part: setting-out
    text: "Let A, B be two numbers prime to one another, let A by multiplying itself make C, and by multiplying C make D, and let B by multiplying itself make E, and by multiplying E make F;"
    highlight: [A, B, C, D, E, F]
    hint: |
      {C} = {A}², {D} = {A}³, {E} = {B}², {F} = {B}³.

  - part: specification
    text: "I say that both C, E and D, F are prime to one another."
    highlight: [C, E, D, F]
    hint: |
      To prove: squares coprime, cubes coprime.

  - part: proof
    text: "For, since A, B are prime to one another, and A by multiplying itself has made C, therefore C, B are prime to one another."
    highlight: [C, B]
    hint: |
      {A}² is prime to {B} ([[VII.25]]).

  - part: proof
    text: "Since then C, B are prime to one another, and B by multiplying itself has made E, therefore C, E are prime to one another. [id.]"
    highlight: [C, E]
    hint: |
      And {B}² is prime to {C} ([[VII.25]] again): the squares are coprime.

  - part: proof
    text: "Again, since A, B are prime to one another, and B by multiplying itself has made E, therefore A, E are prime to one another. [id.]"
    highlight: [A, E]
    hint: |
      Also {A} is prime to {B}².

  - part: proof
    text: "Since then the two numbers A, C are prime to the two numbers B, E, both to each, therefore also the product of A, C is prime to the product of B, E."
    highlight: [A, C, B, E]
    hint: |
      {A}, {C} are each prime to each of {B}, {E}; by [[VII.26]], {A}·{C} is prime to {B}·{E}.

  - part: proof
    text: "And the product of A, C is D, and the product of B, E is F."
    highlight: [D, F]
    hint: |
      Those products are the cubes {D}, {F}.

  - part: proof
    text: "Therefore D, F are prime to one another."
    highlight: [D, F]
    hint: |
      The cubes are coprime.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4]
      text: |
        $\gcd(a^2, b) = 1$, then $\gcd(a^2, b^2) = 1$ ([[VII.25]] twice).
    - steps: [5, 6, 7, 8]
      text: |
        $\gcd(a, b^2) = 1$; with $\gcd(a, b) = \gcd(a^2, b) = \gcd(a^2, b^2) = 1$, [[VII.26]] gives
        $\gcd(a^3, b^3) = 1$. $\blacksquare$
  closing: |
    The same induction gives every power; [[VIII.2]] needs that general form.

commentary: |
  Joyce notes that Euclid's proof covers squares and cubes only, but [[VIII.2]] uses the result for any
  powers — perhaps the point of the bracketed clause.
