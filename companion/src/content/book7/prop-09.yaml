id: VII.9
kind: theorem
title: Alternation for a part

paraphrase: |
  If {A} is the same part of {BC} as {D} is of {EF}, then whatever part or parts {A} is of {D}, {BC} is the
  same of {EF}. In fractions: if $a = b/n$ and $d = e/n$, then $a/d = b/e$.

