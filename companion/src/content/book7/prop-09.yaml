steps:
  - part: enunciation
    text: "If a number be a part of a number, and another be the same part of another, alternately also, whatever part or parts the first is of the third, the same part, or the same parts, will the second also be of the fourth."
    highlight: [A, BC, D, EF]
    hint: |
      Alternation, first case: $a = \tfrac1n b,\ d = \tfrac1n e \Rightarrow a : d = b : e$.
    modern: |
      $a = \tfrac1n b,\ d = \tfrac1n e \ \Rightarrow\ \tfrac{a}{d} = \tfrac{b}{e}$.

  - part: setting-out
    text: "For let the number A be a part of the number BC, and another, D, the same part of another, EF, that A is of BC;"
    highlight: [A, BC, D, EF]
    hint: |
      {A} is $1/n$ of {BC}; {D} is $1/n$ of {EF}.

  - part: specification
    text: "I say that, alternately also, whatever part or parts A is of D, the same part or parts is BC of EF also."
    highlight: [A, D, BC, EF]
    hint: |
      To prove: {A} is to {D} as {BC} to {EF}, as fractions.

  - part: proof
    text: "For since, whatever part A is of BC, the same part also is D of EF, therefore, as many numbers as there are in BC equal to A, so many also are there in EF equal to D."
    highlight: [A, BC, D, EF]
    hint: |
      {BC} holds $n$ copies of {A}; {EF} holds $n$ copies of {D}.

  - part: construction
    text: "Let BC be divided into the numbers equal to A, namely BG, GC, and EF into those equal to D, namely EH, HF;"
    highlight: [BG, GC, EH, HF]
    hint: |
      The copies {BG}, {GC} and {EH}, {HF}.

  - part: proof
    text: "thus the multitude of BG, GC will be equal to the multitude of EH, HF."
    highlight: [BG, GC, EH, HF]
    hint: |
      $n$ pieces each.

  - part: proof
    text: "Now, since the numbers BG, GC are equal to one another, and the numbers EH, HF are also equal to one another, while the multitude of BG, GC is equal to the multitude of EH, HF, therefore, whatever part or parts BG is of EH, the same part or the same parts is GC of HF also;"
    highlight: [BG, EH, GC, HF]
    hint: |
      Each piece of {BC} is the same fraction of the matching piece of {EF}.

  - part: proof
    text: "so that, in addition, whatever part or parts BG is of EH, the same part also, or the same parts, is the sum BC of the sum EF."
    highlight: [BC, EF]
    hint: |
      Adding the pieces ([[VII.5]], [[VII.6]]): {BC} is that same fraction of {EF}.

  - part: proof
    text: "But BG is equal to A, and EH to D; therefore, whatever part or parts A is of D, the same part or the same parts is BC of EF also."
    highlight: [A, D, BC, EF]
    hint: |
      And {BG} = {A}, {EH} = {D}. Done.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3, 4, 5]
      text: |
        $b = n a$, $e = n d$.
    - steps: [6, 7, 8]
      text: |
        If $a = \tfrac{p}{q} d$, then $b = n a = \tfrac{p}{q}(n d) = \tfrac{p}{q} e$ ([[VII.5]], [[VII.6]]).
        $\blacksquare$

commentary: |
  The first step toward *alternation* ($a : b = c : d \Rightarrow a : c = b : d$), which for numbers is
  [[VII.13]]. [[VII.9]] handles "a part", [[VII.10]] "parts". The proofs need only the distributive laws of
  [[VII.5]] and [[VII.6]]; Book V's alternation [[V.16]] is not used.

gaps: |
  - Typical case (halves).
