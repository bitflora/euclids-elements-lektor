id: VII.17
kind: theorem
title: Multiplying by the same number keeps the ratio

paraphrase: |
  If {A} multiplied by {B} gives {D} and {A} multiplied by {C} gives {E}, then {B} : {C} = {D} : {E}.
  In symbols: $b : c = ab : ac$.

