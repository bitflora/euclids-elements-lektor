  caption: |
    {D} = {A}·{B} and {E} = {A}·{C}; {F} is the unit.

steps:
  - part: enunciation
    text: "If a number by multiplying two numbers make certain numbers, the numbers so produced will have the same ratio as the numbers multiplied."
    highlight: [A, B, C, D, E]
    hint: |
      $b : c = ab : ac$.
    modern: |
      $b : c = ab : ac$.

  - part: setting-out
    text: "For let the number A by multiplying the two numbers B, C make D, E;"
    highlight: [A, B, C, D, E]
    hint: |
      {D} = {A}·{B}, {E} = {A}·{C}.

  - part: specification
    text: "I say that, as B is to C, so is D to E."
    highlight: [B, C, D, E]
    hint: |
      To prove: {B} : {C} = {D} : {E}.

  - part: proof
    text: "For, since A by multiplying B has made D, therefore B measures D according to the units in A."
    highlight: [B, D, A]
    hint: |
      {B} goes into {D} as many times as {A} has units.

  - part: proof
    text: "But the unit F also measures the number A according to the units in it; therefore the unit F measures the number A the same number of times that B measures D."
    highlight: [F, A, B, D]
    hint: |
      As does the unit {F} into {A}.

  - part: proof
    text: "Therefore, as the unit F is to the number A, so is B to D."
    highlight: [F, A, B, D]
    hint: |
      So {F} : {A} = {B} : {D} ([[VII.Def.20]]).

  - part: proof
    text: "For the same reason, as the unit F is to the number A, so also is C to E;"
    highlight: [F, A, C, E]
    hint: |
      Likewise {F} : {A} = {C} : {E}.
    cites: [VII.Def.20]

  - part: proof
    text: "therefore also, as B is to D, so is C to E."
    highlight: [B, D, C, E]
    hint: |
      Both equal {F} : {A}, so {B} : {D} = {C} : {E}.

  - part: proof
    text: "Therefore, alternately, as B is to C, so is D to E."
    highlight: [B, C, D, E]
    hint: |
      Alternate ([[VII.13]]).

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6, 7]
      text: |
        $b : ab = 1 : a = c : ac$.
    - steps: [8]
      text: |
        Alternating, $b : c = ab : ac$. $\blacksquare$

commentary: |
  One of the workhorses of Books VII–IX, used in [[VII.18]], [[VII.19]] and dozens of later proofs. The
  geometric analogue is [[VI.1]] (parallelograms of the same height are as their bases).

gaps: |
  - Transitivity of "same ratio" (step 7) is assumed for numbers; see [[VII.14]].
