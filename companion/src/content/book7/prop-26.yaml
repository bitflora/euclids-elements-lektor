id: VII.26
kind: theorem
title: Products of coprime pairs are coprime

paraphrase: |
  If each of {A}, {B} is prime to each of {C}, {D}, then {A}·{B} is prime to {C}·{D}.

diagram:
  width: 280
  height: 170
  elements:
    - "A0;point;free;-1000,40;0;0"
