  caption: |
    {D} = {A}·{C}, {E} = {B}·{C}.

steps:
  - part: enunciation
    text: "If two numbers by multiplying any number make certain numbers, the numbers so produced will have the same ratio as the multipliers."
    highlight: [A, B, C, D, E]
    hint: |
      $a : b = ac : bc$ — [[VII.17]] with the factors the other way round.
    modern: |
      $a : b = ac : bc$.

  - part: setting-out
    text: "For let two numbers A, B by multiplying any number C make D, E;"
    highlight: [A, B, C, D, E]
    hint: |
      {D} = {A}·{C}, {E} = {B}·{C}.

  - part: specification
    text: "I say that, as A is to B, so is D to E."
    highlight: [A, B, D, E]
    hint: |
      To prove: {A} : {B} = {D} : {E}.

  - part: proof
    text: "For, since A by multiplying C has made D, therefore also C by multiplying A has made D."
    highlight: [A, C, D]
    hint: |
      By commutativity ([[VII.16]]), {D} is also {C}·{A}.

  - part: proof
    text: "For the same reason also C by multiplying B has made E."
    highlight: [B, C, E]
    hint: |
      And {E} = {C}·{B}.
    cites: [VII.16]

  - part: proof
    text: "Therefore the number C by multiplying the two numbers A, B has made D, E."
    highlight: [C, A, B, D, E]
    hint: |
      Now one number {C} multiplies {A} and {B}.

  - part: proof
    text: "Therefore, as A is to B, so is D to E."
    highlight: [A, B, D, E]
    hint: |
      So [[VII.17]] applies.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6]
      text: |
        $ac = ca$ and $bc = cb$ ([[VII.16]]), and $a : b = ca : cb$ ([[VII.17]]). $\blacksquare$

commentary: |
  Because Euclid's multiplication is defined asymmetrically ([[VII.Def.15]]), "{A} multiplying {C}" and
  "{C} multiplying {A}" are different statements, and [[VII.17]] and [[VII.18]] are different propositions.
  After [[VII.16]] the distinction is merely verbal.
