id: VII.18
kind: theorem
title: Multipliers are as their products

paraphrase: |
  If {A} and {B} each multiply the same number {C}, giving {D} and {E}, then {A} : {B} = {D} : {E}. In
  symbols: $a : b = ac : bc$.

diagram:
  width: 280
  height: 175
  elements:
    - "A0;point;free;-1000,40;0;0"
    - "A3;point;free;1000,40;0;0"
