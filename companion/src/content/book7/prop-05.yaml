id: VII.5
kind: theorem
title: The same part of two numbers is that part of their sum

paraphrase: |
  If {A} is some part of {BC} and {D} the same part of {EF}, then {A} + {D} is that same part of
  {BC} + {EF}. In fractions: $\tfrac1n b + \tfrac1n e = \tfrac1n (b + e)$.

