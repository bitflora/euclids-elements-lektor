steps:
  - part: enunciation
    text: "To find the number which is the least that will have given parts."
    highlight: [A, B, C]
    hint: |
      The least number with, say, a half, a third and a fourth part.
    modern: |
      The least $n$ such that $\tfrac1d n, \tfrac1e n, \tfrac1f n$ are whole: $n = \operatorname{lcm}(d, e,
      f)$.

  - part: setting-out
    text: "Let A, B, C be the given parts;"
    highlight: [A, B, C]
    hint: |
      The given parts {A}, {B}, {C} — named, not sized: "a fourth", "a sixth".
    explain:
      implicit: |
        {A}, {B}, {C} stand for *kinds* of part (a half, a third, …), not for definite numbers; the figure
        cannot draw that distinction. Joyce calls the wording "somewhat unclear".

  - part: specification
    text: "thus it is required to find the number which is the least that will have the parts A, B, C."
    highlight: [A, B, C]
    hint: |
      The goal.

  - part: construction
    text: "Let D, E, F be numbers called by the same name as the parts A, B, C, and let G, the least number measured by D, E, F, be taken."
    highlight: [D, E, F, G]
    hint: |
      {D}, {E}, {F}: the numbers the parts are named after. {G} = lcm({D}, {E}, {F}) ([[VII.36]]).

  - part: proof
    text: "Therefore G has parts called by the same name as D, E, F."
    highlight: [G, D, E, F]
    hint: |
      By [[VII.37]].

  - part: proof
    text: "But A, B, C are parts called by the same name as D, E, F; therefore G has the parts A, B, C."
    highlight: [G, A, B, C]
    hint: |
      So {G} has the required parts.

  - part: specification
    text: "I say next that it is also the least number that has."
    highlight: [G]
    hint: |
      And it is least.

  - part: proof
    text: "For, if not, there will be some number less than G which will have the parts A, B, C."
    highlight: [G]
    hint: |
      Suppose a smaller one.

  - part: construction
    text: "Let it be H."
    highlight: [H]
    hint: |
      Call it {H}.

  - part: proof
    text: "Since H has the parts A, B, C, therefore H will be measured by numbers called by the same name as the parts A, B, C."
    highlight: [H]
    hint: |
      By [[VII.38]], {H} is measured by {D}, {E}, {F}.

  - part: proof
    text: "But D, E, F are numbers called by the same name as the parts A, B, C; therefore H is measured by D, E, F."
    highlight: [H, D, E, F]
    hint: |
      So {H} is a common multiple of {D}, {E}, {F}.

  - part: proof
    text: "And it is less than G: which is impossible."
    highlight: [H, G]
    hint: |
      … smaller than the least: impossible.

  - part: proof
    text: "Therefore there will be no number less than G that will have the parts A, B, C."
    highlight: [G]
    hint: |
      {G} is the least.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to do.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5]
      text: |
        $n$ has parts $1/d$, $1/e$, $1/f$ iff $d, e, f \mid n$ ([[VII.37]], [[VII.38]]).
    - steps: [6, 7, 8, 9, 10, 11, 12]
      text: |
        So the least such $n$ is $\operatorname{lcm}(d, e, f)$ ([[VII.36]]). $\blacksquare$

commentary: |
  The last proposition of Book VII, and a practical one: the least common denominator of the fractions
  $\tfrac1d, \tfrac1e, \tfrac1f$. Book VIII turns to continued proportions.
