  caption: |
    {C} = {A}·{A}; {D} is a copy of {A}.

steps:
  - part: enunciation
    text: "If two numbers be prime to one another, the product of one of them into itself will be prime to the remaining one."
    highlight: [A, B, C]
    hint: |
      $\gcd(a, b) = 1 \Rightarrow \gcd(a^2, b) = 1$.
    modern: |
      $\gcd(a, b) = 1 \Rightarrow \gcd(a^2, b) = 1$.

  - part: setting-out
    text: "Let A, B be two numbers prime to one another, and let A by multiplying itself make C:"
    highlight: [A, B, C]
    hint: |
      {A}, {B} coprime; {C} = {A}².

  - part: specification
    text: "I say that B, C are prime to one another."
    highlight: [B, C]
    hint: |
      To prove: {B}, {C} coprime.

  - part: construction
    text: "For let D be made equal to A."
    highlight: [D]
    hint: |
      A second copy {D} of {A}, so that [[VII.24]] (about two numbers) applies.

  - part: proof
    text: "Since A, B are prime to one another, and A is equal to D, therefore D, B are also prime to one another."
    highlight: [D, B]
    hint: |
      {D} is coprime to {B}, being equal to {A}.

  - part: proof
    text: "Therefore each of the two numbers D, A is prime to B; therefore the product of D, A will also be prime to B."
    highlight: [D, A, B]
    hint: |
      By [[VII.24]], {D}·{A} is coprime to {B}.

  - part: proof
    text: "But the number which is the product of D, A is C."
    highlight: [C]
    hint: |
      And {D}·{A} = {A}·{A} = {C}.

  - part: proof
    text: "Therefore C, B are prime to one another."
    highlight: [C, B]
    hint: |
      Done.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6, 7]
      text: |
        [[VII.24]] with $b = a$: $\gcd(a \cdot a, c) = 1$. $\blacksquare$

commentary: |
  A special case of [[VII.24]]. The copy {D} is there because Euclid's [[VII.24]] speaks of "two numbers",
  and he does not apply it to one number taken twice. Used in [[VII.27]] and [[IX.15]].
