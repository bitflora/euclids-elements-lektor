id: VII.25
kind: theorem
title: The square of a number coprime to another is coprime to it

paraphrase: |
  If {A} and {B} are prime to one another, then {A}·{A} is prime to {B}.

diagram:
  width: 130
  height: 250
  elements:
    - "A0;point;free;30,-1000;0;0"
    - "A3;point;free;30,1000;0;0"
    - "A1;point;lineSlider;A0,A3,30,30;0"
