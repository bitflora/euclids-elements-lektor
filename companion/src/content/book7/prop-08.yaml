id: VII.8
kind: theorem
title: The same parts of two numbers are those parts of their difference

paraphrase: |
  If {AB} is the same parts of {CD} as {AE} is of {CF}, the remainder {EB} is those same parts of the
  remainder {FD}: $\tfrac{m}{n} b - \tfrac{m}{n} e = \tfrac{m}{n}(b - e)$.

diagram:
  width: 280
  height: 150
  elements:
