id: VII.36
kind: problem
title: The least common multiple of three numbers

paraphrase: |
  To find the least number measured by {A}, {B}, {C}: take the least common multiple {D} of {A}, {B}, then
  the least common multiple of {D} and {C}.

diagram:
  width: 250
  height: 240
  elements:
    - "A0;point;free;-1000,35;0;0"
