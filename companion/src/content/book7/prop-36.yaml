  caption: |
    {D} = lcm({A}, {B}); {E} = lcm({D}, {C}). {F} is the supposed smaller common multiple.

steps:
  - part: enunciation
    text: "Given three numbers, to find the least number which they measure."
    highlight: [A, B, C]
    hint: |
      lcm of three numbers.
    modern: |
      $\operatorname{lcm}(a, b, c) = \operatorname{lcm}(\operatorname{lcm}(a, b), c)$.

  - part: setting-out
    text: "Let A, B, C be the three given numbers;"
    highlight: [A, B, C]
    hint: |
      Given {A}, {B}, {C}.

  - part: specification
    text: "thus it is required to find the least number which they measure."
    highlight: [A, B, C]
    hint: |
      The goal.

  - part: construction
    text: "Let D, the least number measured by the two numbers A, B, be taken."
    highlight: [D]
    hint: |
      {D} = lcm({A}, {B}) ([[VII.34]]).

  - part: proof
    text: "Then C either measures, or does not measure, D."
    highlight: [C, D]
    hint: |
      Two cases.

  - part: proof
    text: "First, let it measure it."
    highlight: [C, D]
    hint: |
      Case 1: {C} measures {D}.

  - part: proof
    text: "But A, B also measure D; therefore A, B, C measure D."
    highlight: [A, B, C, D]
    hint: |
      All three measure {D}.

  - part: specification
    text: "I say next that it is also the least that they measure."
    highlight: [D]
    hint: |
      And it is least.

  - part: proof
    text: "For, if not, A, B, C will measure some number which is less than D."
    highlight: [D]
    hint: |
      Suppose not.

  - part: construction
    text: "Let them measure E."
    highlight: [E]
    hint: |
      A smaller common multiple {E} (in this case only).

  - part: proof
    text: "Since A, B, C measure E, therefore also A, B measure E."
    highlight: [A, B, E]
    hint: |
      {A}, {B} measure {E}.

  - part: proof
    text: "Therefore the least number measured by A, B will also measure E."
    highlight: [D, E]
    hint: |
      By [[VII.35]], {D} measures {E}.

  - part: proof
    text: "But D is the least number measured by A, B; therefore D will measure E, the greater the less: which is impossible."
    highlight: [D, E]
    hint: |
      Impossible, as {D} > {E}.

  - part: proof
    text: "Therefore A, B, C will not measure any number which is less than D; therefore D is the least that A, B, C measure."
    highlight: [D]
    hint: |
      Case 1 done.

  - part: construction
    text: "Again, let C not measure D, and let E, the least number measured by C, D, be taken."
    highlight: [C, D, E]
    hint: |
      Case 2: {E} = lcm({C}, {D}) ([[VII.34]]).

  - part: proof
    text: "Since A, B measure D, and D measures E, therefore also A, B measure E."
    highlight: [A, B, D, E]
    hint: |
      {A}, {B} measure {E} through {D}.

  - part: proof
    text: "But C also measures E; therefore also A, B, C measure E."
    highlight: [A, B, C, E]
    hint: |
      All three measure {E}.

  - part: specification
    text: "I say next that it is also the least that they measure."
    highlight: [E]
    hint: |
      And it is least.

  - part: proof
    text: "For, if not, A, B, C will measure some number which is less than E."
    highlight: [E]
    hint: |
      Suppose not.

  - part: construction
    text: "Let them measure F."
    highlight: [F]
    hint: |
      A smaller common multiple {F}.

  - part: proof
    text: "Since A, B, C measure F, therefore also A, B measure F; therefore the least number measured by A, B will also measure F."
    highlight: [A, B, F]
    hint: |
      [[VII.35]]: lcm({A}, {B}) measures {F} …

  - part: proof
    text: "But D is the least number measured by A, B; therefore D measures F."
    highlight: [D, F]
    hint: |
      … that is, {D} measures {F}.

  - part: proof
    text: "But C also measures F; therefore D, C measure F, so that the least number measured by D, C will also measure F."
    highlight: [D, C, F]
    hint: |
      [[VII.35]] again: lcm({D}, {C}) measures {F}.
    cites: [VII.35]

  - part: proof
    text: "But E is the least number measured by C, D; therefore E measures F, the greater the less: which is impossible."
    highlight: [E, F]
    hint: |
      {E} measures the smaller {F}: impossible.

  - part: proof
    text: "Therefore A, B, C will not measure any number which is less than E."
    highlight: [E]
    hint: |
      No smaller common multiple.

  - part: proof
    text: "Therefore E is the least that is measured by A, B, C."
    highlight: [E]
    hint: |
      {E} is the least common multiple.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to do.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [4, 15, 16, 17]
      text: |
        Let $d = \operatorname{lcm}(a, b)$, $e = \operatorname{lcm}(d, c)$ ($e = d$ if $c \mid d$). Then $a,
        b, c \mid e$.
    - steps: [19, 20, 21, 22, 23, 24]
      text: |
        If $a, b, c \mid f$, then $d \mid f$ ([[VII.35]]) and so $e \mid f$ ([[VII.35]]); hence $e \le f$.
        $\blacksquare$

commentary: |
  The companion of [[VII.3]] (gcd of three numbers), with the same two cases. Used in [[VII.39]].
