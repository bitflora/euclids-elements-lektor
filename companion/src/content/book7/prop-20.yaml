id: VII.20
kind: theorem
title: The least numbers in a ratio measure all others in that ratio

paraphrase: |
  If {CD} : {EF} is a ratio in lowest terms and {A} : {B} is the same ratio, then {CD} goes into {A} exactly
  as many times as {EF} goes into {B}.

diagram:
  width: 160
  height: 280
  elements:
    - "A0;point;free;30,-1000;0;0"
