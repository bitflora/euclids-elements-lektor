id: VII.1
kind: theorem
title: If the Euclidean algorithm ends in a unit, the numbers are coprime

paraphrase: |
  Run the Euclidean algorithm on two numbers: subtract the smaller from the larger over and over, then the
  remainder from the smaller, and so on. If the process ends at the unit, the two numbers have no common
  measure but the unit: they are *prime to one another* ([[VII.Def.12]]).

