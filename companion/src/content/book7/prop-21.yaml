steps:
  - part: enunciation
    text: "Numbers prime to one another are the least of those which have the same ratio with them."
    highlight: [A, B]
    hint: |
      A ratio of coprime numbers is in lowest terms.
    modern: |
      $\gcd(a, b) = 1 \Rightarrow$ $a : b$ is in lowest terms.

  - part: setting-out
    text: "Let A, B be numbers prime to one another;"
    highlight: [A, B]
    hint: |
      {A}, {B} coprime.

  - part: specification
    text: "I say that A, B are the least of those which have the same ratio with them."
    highlight: [A, B]
    hint: |
      To prove: no smaller pair has the same ratio.

  - part: proof
    text: "For, if not, there will be some numbers less than A, B which are in the same ratio with A, B."
    highlight: [A, B]
    hint: |
      Suppose a smaller pair exists.

  - part: construction
    text: "Let them be C, D."
    highlight: [C, D]
    hint: |
      Call the least such pair {C}, {D}.
    explain:
      implicit: |
        Euclid needs {C}, {D} to be the *least* numbers in the ratio in order to apply [[VII.20]]; his words
        only say "less than {A}, {B}".
    gap: |
      [[VII.20]] requires the least pair; Euclid should take {C}, {D} to be the least numbers in the ratio,
      which exist by well-ordering.

  - part: proof
    text: "Since, then, the least numbers of those which have the same ratio measure those which have the same ratio the same number of times, the greater the greater and the less the less, that is, the antecedent the antecedent and the consequent the consequent, therefore C measures A the same number of times that D measures B."
    highlight: [C, A, D, B]
    hint: |
      By [[VII.20]], {C} goes into {A} as often as {D} into {B}.

  - part: construction
    text: "Now, as many times as C measures A, so many units let there be in E."
    highlight: [E]
    hint: |
      Let {E} be that number of times.

  - part: proof
    text: "Therefore D also measures B according to the units in E."
    highlight: [D, B, E]
    hint: |
      {B} = {E}·{D}.

  - part: proof
    text: "And, since C measures A according to the units in E, therefore E also measures A according to the units in C."
    highlight: [E, A, C]
    hint: |
      {A} = {E}·{C} = {C}·{E} ([[VII.16]]): {E} measures {A}.

  - part: proof
    text: "For the same reason E also measures B according to the units in D."
    highlight: [E, B, D]
    hint: |
      Likewise {E} measures {B}.

  - part: proof
    text: "Therefore E measures A, B which are prime to one another: which is impossible."
    highlight: [E, A, B]
    hint: |
      {E} is a common measure of coprime numbers: impossible.
    explain:
      implicit: |
        {E} is a *number* (at least 2) because {C} < {A}. Euclid does not say so.

  - part: proof
    text: "Therefore there will be no numbers less than A, B which are in the same ratio with A, B."
    highlight: [A, B]
    hint: |
      No smaller pair.

  - part: proof
    text: "Therefore A, B are the least of those which have the same ratio with them."
    highlight: [A, B]
    hint: |
      {A} : {B} is in lowest terms.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5]
      text: |
        Let $c : d$ be $a : b$ in lowest terms, with $c < a$.
    - steps: [6, 7, 8, 9]
      text: |
        By [[VII.20]], $a = ec$ and $b = ed$ with $e \ge 2$.
    - steps: [10, 11, 12]
      text: |
        Then $e$ divides both $a$ and $b$, contradicting $\gcd(a, b) = 1$. $\blacksquare$

commentary: |
  With its converse [[VII.22]]: a ratio is in lowest terms exactly when its terms are coprime. [[VII.33]]
  uses this for any number of terms.
