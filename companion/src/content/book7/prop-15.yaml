id: VII.15
kind: theorem
title: Alternation with the unit

paraphrase: |
  If the unit {A} measures {BC} as many times as {D} measures {EF}, then the unit measures {D} as many times
  as {BC} measures {EF}. In modern terms: if $EF = n \cdot D$ and $D = m \cdot 1$, then $EF = m \cdot n$,
  the same as $n$ taken $m$ times.

