id: VII.13
kind: theorem
title: Alternation for numbers

paraphrase: |
  If {A} : {B} = {C} : {D}, then alternately {A} : {C} = {B} : {D}.

diagram:
  width: 150
  height: 230
  elements:
    - "A0;point;free;30,-1000;0;0"
    - "A3;point;free;30,1000;0;0"
    - "A1;point;lineSlider;A0,A3,30,30;0"
    - "B0;point;free;60,-1000;0;0"
    - "B3;point;free;60,1000;0;0"
    - "B1;point;lineSlider;B0,B3,60,30;0"
    - "C0;point;free;90,-1000;0;0"
    - "C3;point;free;90,1000;0;0"
    - "C1;point;lineSlider;C0,C3,90,30;0"
    - "D0;point;free;120,-1000;0;0"
    - "D3;point;free;120,1000;0;0"
    - "D1;point;lineSlider;D0,D3,120,30;0"
    - "A2;point;lineSlider;A0,A3,30,200;0"
    - "A;line;connect;A1,A2;black"
    - "B2;point;lineSlider;B0,B3,60,120;0"
    - "B;line;connect;B1,B2;black"
    - "C2;point;lineSlider;C0,C3,90,175;0"
    - "C;line;connect;C1,C2;black"
    - "D2;point;proportion;A1,A2,B1,B2,C1,C2,D1,D3;0"
    - "D;line;connect;D1,D2;black"
  caption: |
    {D} is computed so that {A} : {B} = {C} : {D}.

steps:
  - part: enunciation
    text: "If four numbers be proportional, they will also be proportional alternately."
    highlight: [A, B, C, D]
    hint: |
      The numerical version of [[V.16]].
    modern: |
      $a : b = c : d \Rightarrow a : c = b : d$.

  - part: setting-out
    text: "Let the four numbers A, B, C, D be proportional, so that, as A is to B, so is C to D;"
    highlight: [A, B, C, D]
    hint: |
      {A} : {B} = {C} : {D}.

  - part: specification
    text: "I say that they will also be proportional alternately, so that, as A is to C, so will B be to D."
    highlight: [A, C, B, D]
    hint: |
      To prove: {A} : {C} = {B} : {D}.

  - part: proof
    text: "For since, as A is to B, so is C to D, therefore, whatever part or parts A is of B, the same part or the same parts is C of D also."
    highlight: [A, B, C, D]
    hint: |
      As fractions: {A} is the same part(s) of {B} as {C} of {D}.

  - part: proof
    text: "Therefore, alternately, whatever part or parts A is of C, the same part or the same parts is B of D also."
    highlight: [A, C, B, D]
    hint: |
      By [[VII.10]] (and [[VII.9]] for a single part).
    explain:
      implicit: |
        Heath cites only [[VII.10]]; when {A} is *a part* of {B}, [[VII.9]] is the one needed.
    cites: [VII.9]

  - part: proof
    text: "Therefore, as A is to C, so is B to D."
    highlight: [A, C, B, D]
    hint: |
      Back into a proportion.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5]
      text: |
        $a d = b c$ is symmetric in $b$ and $c$. (Euclid has not yet proved [[VII.19]], and argues with
        fractions instead.) $\blacksquare$

commentary: |
  One of the most-used results of Books VII–IX. Compare the effort it takes in Book V ([[V.16]]), where
  ratios of magnitudes cannot be written as fractions.
