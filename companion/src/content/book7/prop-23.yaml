steps:
  - part: enunciation
    text: "If two number be prime to one another, the number which measures the one of them will be prime to the remaining number."
    highlight: [A, B, C]
    hint: |
      $\gcd(a, b) = 1$ and $c \mid a$ $\Rightarrow$ $\gcd(c, b) = 1$.
    modern: |
      $\gcd(a, b) = 1,\ c \mid a \Rightarrow \gcd(c, b) = 1$.

  - part: setting-out
    text: "Let A, B be two numbers prime to one another, and let any number C measure A;"
    highlight: [A, B, C]
    hint: |
      {A}, {B} coprime; {C} measures {A}.

  - part: specification
    text: "I say that C, B are also prime to one another."
    highlight: [C, B]
    hint: |
      To prove: {C}, {B} coprime.

  - part: proof
    text: "For, if C, B are not prime to one another, some number will measure C, B."
    highlight: [C, B]
    hint: |
      Suppose not.

  - part: construction
    text: "Let a number measure them, and let it be D."
    highlight: [D]
    hint: |
      A common measure {D}.

  - part: proof
    text: "Since D measures C, and C measures A, therefore D also measures A."
    highlight: [D, C, A]
    hint: |
      {D} measures {C}, which measures {A}.

  - part: proof
    text: "But it also measures B; therefore D measures A, B which are prime to one another: which is impossible."
    highlight: [D, A, B]
    hint: |
      So {D} measures both {A} and {B}: impossible.

  - part: proof
    text: "Therefore no number will measure the numbers C, B."
    highlight: [C, B]
    hint: |
      No common measure.

  - part: proof
    text: "Therefore C, B are prime to one another."
    highlight: [C, B]
    hint: |
      Coprime.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6, 7, 8]
      text: |
        A common divisor of $c$ and $b$ divides $a$ (since $c \mid a$) and $b$: so it is $1$. $\blacksquare$

commentary: |
  A small lemma for [[VII.24]].
