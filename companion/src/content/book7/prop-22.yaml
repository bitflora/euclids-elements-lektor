id: VII.22
kind: theorem
title: The least numbers in a ratio are coprime

paraphrase: |
  If {A} : {B} is in lowest terms, then {A} and {B} are prime to one another. The converse of [[VII.21]].

diagram:
  width: 250
  height: 250
  elements:
