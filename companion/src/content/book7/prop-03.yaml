id: VII.3
kind: problem
title: The greatest common measure of three numbers

paraphrase: |
  To find the greatest common divisor of three numbers: take the greatest common divisor {D} of the first
  two, then the greatest common divisor of {D} and the third.

diagram:
  width: 210
  height: 250
  elements:
    - "A0;point;free;30,-1000;0;0"
