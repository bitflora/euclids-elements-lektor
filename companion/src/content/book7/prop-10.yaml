id: VII.10
kind: theorem
title: Alternation for parts

paraphrase: |
  If {AB} is the same parts of {C} as {DE} is of {F}, then whatever fraction {AB} is of {DE}, {C} is the
  same fraction of {F}. In fractions: if $a = \tfrac{m}{n} c$ and $d = \tfrac{m}{n} f$, then $a/d = c/f$.

diagram:
  width: 150
  height: 270
  elements:
