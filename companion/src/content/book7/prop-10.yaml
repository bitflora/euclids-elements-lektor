    - "DH;line;connect;D,H;0;0;0"
    - "HE;line;connect;H,E;0;0;0"
  caption: |
    {AB} is two thirds of {C}; {DE} two thirds of {F}.

steps:
  - part: enunciation
    text: "If a number be parts of a number, and another be the same parts of another, alternately also, whatever parts or part the first is of the third, the same parts or the same part will the second also be of the fourth."
    highlight: [AB, C, DE, F]
    hint: |
      [[VII.9]] for "parts".
    modern: |
      $a = \tfrac{m}{n} c,\ d = \tfrac{m}{n} f\ \Rightarrow\ \tfrac{a}{d} = \tfrac{c}{f}$.

  - part: setting-out
    text: "For let the number AB be parts of the number C, and another, DE, the same parts of another, F;"
    highlight: [AB, C, DE, F]
    hint: |
      {AB} is $m/n$ of {C}; {DE} is $m/n$ of {F}.

  - part: specification
    text: "I say that, alternately also, whatever parts or part AB is of DE, the same parts or the same part is C of F also."
    highlight: [AB, DE, C, F]
    hint: |
      To prove: {AB} is to {DE} as {C} to {F}.

  - part: proof
    text: "For since, whatever parts AB is of C, the same parts also is DE of F, therefore, as many parts of C as there are in AB, so many parts also of F are there in DE."
    highlight: [AB, DE]
    hint: |
      $m$ pieces in each.

  - part: construction
    text: "Let AB be divided into the parts of C, namely AG, GB, and DE into the parts of F, namely DH, HE;"
    highlight: [AG, GB, DH, HE]
    hint: |
      The pieces {AG}, {GB} ($n$th parts of {C}) and {DH}, {HE} ($n$th parts of {F}).

  - part: proof
    text: "thus the multitude of AG, GB will be equal to the multitude of DH, HE."
    highlight: [AG, GB, DH, HE]
    hint: |
      The same number of pieces.

  - part: proof
    text: "Now since, whatever part AG is of C, the same part also is DH of F, alternately also, whatever part or parts AG is of DH, the same part or the same parts is C of F also."
    highlight: [AG, DH, C, F]
    hint: |
      By [[VII.9]], {AG} is to {DH} as {C} to {F}.

  - part: proof
    text: "For the same reason also, whatever part or parts GB is of HE, the same part or the same parts is C of F also;"
    highlight: [GB, HE, C, F]
    hint: |
      Likewise {GB} to {HE}.
    cites: [VII.9]

  - part: proof
    text: "so that, in addition, whatever parts or part AB is of DE, the same parts also, or the same part, is C of F."
    highlight: [AB, DE, C, F]
    hint: |
      Adding ([[VII.5]], [[VII.6]]): {AB} is to {DE} as {C} to {F}.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3, 4, 5, 6]
      text: |
        $a = m \cdot \tfrac1n c$, $d = m \cdot \tfrac1n f$; by [[VII.9]], $\tfrac1n c : \tfrac1n f = c : f$.
    - steps: [7, 8]
      text: |
        Adding $m$ such pieces ([[VII.5]], [[VII.6]]) gives $a : d = c : f$. $\blacksquare$

commentary: |
  Euclid's figure takes two thirds. The phrase "whatever parts or part" has to cover both the case where
  {AB} is less than {DE} and the case where it is greater, though "part" and "parts" were defined only for
  the less of the greater; the proposition tacitly extends the language.

gaps: |
  - When the first is *greater* than the third, "part or parts" has no meaning under [[VII.Def.3]] and
    [[VII.Def.4]]; Euclid uses it anyway, reading it as the inverse relation.
