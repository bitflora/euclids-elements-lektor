id: VII.28
kind: theorem
title: A sum is coprime to its parts exactly when the parts are coprime

paraphrase: |
  If {AB} and {BC} are prime to one another, their sum {AC} is prime to each of them; and conversely, if the
  sum is prime to one of them, the two are prime to one another.

diagram:
  width: 250
  height: 115
  elements:
    - "A0;point;free;-1000,40;0;0"
    - "A3;point;free;1000,40;0;0"
    - "D0;point;free;-1000,75;0;0"
    - "D3;point;free;1000,75;0;0"
    - "A;point;lineSlider;A0,A3,30,0"
    - "B;point;lineSlider;A0,A3,150,0"
    - "C;point;lineSlider;A0,A3,220,0"
    - "AC;line;connect;A,C"
    - "M;point;midpoint;B,C;0;0"
    - "D1;point;lineSlider;D0,D3,100,0;0"
    - "D2;point;cutoff;D1,D3,B,M;0"
    - "D;line;connect;D1,D2;black"
    - "AB;line;connect;A,B;0;0;0"
    - "BC;line;connect;B,C;0;0;0"
  aliases: { CA: AC, BA: AB, CB: BC }
  caption: |
    {AC} is the sum of {AB} and {BC}. {D} is the supposed common measure.

steps:
  - part: enunciation
    text: "If two numbers be prime to one another, the sum will also be prime to each of them; and, if the sum of two numbers be prime to any one of them, the original numbers will also be prime to one another."
    highlight: [AB, BC, AC]
    hint: |
      $\gcd(a, b) = 1 \iff \gcd(a + b, a) = 1$.
    modern: |
      $\gcd(a, b) = \gcd(a + b, a) = \gcd(a + b, b)$.

  - part: setting-out
    text: "For let two numbers AB, BC prime to one another be added;"
    highlight: [AB, BC]
    hint: |
      {AB}, {BC} coprime, placed end to end.

  - part: specification
    text: "I say that the sum AC is also prime to each of the numbers AB, BC."
    highlight: [AC, AB, BC]
    hint: |
      To prove: {AC} is coprime to each.

  - part: proof
    text: "For, if CA, AB are not prime to one another, some number will measure CA, AB."
    highlight: [AC, AB]
    hint: |
      Suppose {CA}, {AB} have a common measure.

  - part: construction
    text: "Let a number measure them, and let it be D."
    highlight: [D]
    hint: |
      Call it {D}.

  - part: proof
    text: "Since then D measures CA, AB, therefore it will also measure the remainder BC."
    highlight: [D, BC]
    hint: |
      It measures the difference {BC}.

  - part: proof
    text: "But it also measures BA; therefore D measures AB, BC which are prime to one another: which is impossible."
    highlight: [D, AB, BC]
    hint: |
      So {D} measures {AB} and {BC}: impossible.

  - part: proof
    text: "Therefore no number will measure the numbers CA, AB; therefore CA, AB are prime to one another."
    highlight: [AC, AB]
    hint: |
      {CA} is prime to {AB}.

  - part: proof
    text: "For the same reason AC, CB are also prime to one another."
    highlight: [AC, BC]
    hint: |
      And to {CB}.

  - part: proof
    text: "Therefore CA is prime to each of the numbers AB, BC."
    highlight: [AC, AB, BC]
    hint: |
      First half done.

  - part: specification
    text: "Again, let CA, AB be prime to one another; I say that AB, BC are also prime to one another."
    highlight: [AC, AB, BC]
    hint: |
      Converse: if the sum is coprime to {AB}, then {AB}, {BC} are coprime.

  - part: proof
    text: "For, if AB, BC are not prime to one another, some number will measure AB, BC."
    highlight: [AB, BC]
    hint: |
      Suppose not.

  - part: construction
    text: "Let a number measure them, and let it be D."
    highlight: [D]
    hint: |
      A common measure {D}.

  - part: proof
    text: "Now, since D measures each of the numbers AB, BC, it will also measure the whole CA."
    highlight: [D, AC]
    hint: |
      It measures the sum {CA}.

  - part: proof
    text: "But it also measures AB; therefore D measures CA, AB which are prime to one another: which is impossible."
    highlight: [D, AC, AB]
    hint: |
      So {D} measures {CA} and {AB}: impossible.

  - part: proof
    text: "Therefore no number will measure the numbers AB, BC."
    highlight: [AB, BC]
    hint: |
      No common measure.

  - part: proof
    text: "Therefore AB, BC are prime to one another."
    highlight: [AB, BC]
    hint: |
      Coprime.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [3, 4, 5, 6, 7, 8, 9]
      text: |
        A common divisor of $a + b$ and $a$ divides $b$; so $\gcd(a + b, a) \mid \gcd(a, b) = 1$.
    - steps: [10, 11, 12, 13, 14, 15, 16]
      text: |
        A common divisor of $a$ and $b$ divides $a + b$; so $\gcd(a, b) \mid \gcd(a + b, a) = 1$.
        $\blacksquare$
  closing: |
    The same two observations are the step of the Euclidean algorithm ([[VII.1]], [[VII.2]]).

commentary: |
  Used in [[IX.15]]. The enunciation says "the sum be prime to any one of them", but the proof does only
  the case of {AB}; the other is the same.
