    - [AG, GB]
    - [DH, HE]

steps:
  - part: enunciation
    text: "If a number be parts of a number, and another be the same parts of another, the sum will also be the same parts of the sum that the one is of the one."
    highlight: [AB, C, DE, F]
    hint: |
      [[VII.5]] for "parts" ($m/n$) instead of "a part" ($1/n$).
    modern: |
      $\tfrac{m}{n} c + \tfrac{m}{n} f = \tfrac{m}{n}(c + f)$.

  - part: setting-out
    text: "For let the number AB be parts of the number C, and another, DE, the same parts of another, F, that AB is of C;"
    highlight: [AB, C, DE, F]
    hint: |
      {AB} is $m/n$ of {C}, and {DE} is $m/n$ of {F}.

  - part: specification
    text: "I say that the sum of AB, DE is also the same parts of the sum of C, F that AB is of C."
    highlight: [AB, DE, C, F]
    hint: |
      To prove: {AB} + {DE} is $m/n$ of {C} + {F}.

  - part: proof
    text: "For since, whatever parts AB is of C, DE is also the same parts of F, therefore, as many parts of C as there are in AB, so many parts of F are there also in DE."
    highlight: [AB, DE]
    hint: |
      {AB} contains $m$ $n$th parts of {C}; {DE} contains $m$ $n$th parts of {F}.

  - part: construction
    text: "Let AB be divided into the parts of C, namely AG, GB, and DE into the parts of F, namely DH, HE;"
    highlight: [AG, GB, DH, HE]
    hint: |
      The pieces: {AG}, {GB} are parts of {C}; {DH}, {HE} parts of {F}.

  - part: proof
    text: "thus the multitude of AG, GB will be equal to the multitude of DH, HE."
    highlight: [AG, GB, DH, HE]
    hint: |
      The same number of pieces on each side.

  - part: proof
    text: "And since, whatever part AG is of C, the same part is DH of F also, therefore, whatever part AG is of C, the same part also is the sum of AG, DH of the sum of C, F."
    highlight: [AG, DH, C, F]
    hint: |
      By [[VII.5]], {AG} + {DH} is that part of {C} + {F}.

  - part: proof
    text: "For the same reason, whatever part GB is of C, the same part also is the sum of GB, HE of the sum of C, F."
    highlight: [GB, HE, C, F]
    hint: |
      And {GB} + {HE} is the same part of {C} + {F}.
    cites: [VII.5]

  - part: proof
    text: "Therefore, whatever parts AB is of C, the same parts also is the sum of AB, DE of the sum of C, F."
    highlight: [AB, DE, C, F]
    hint: |
      Adding the pairs: {AB} + {DE} is the same parts of {C} + {F}.

  - part: conclusion
    text: "Q. E. D."
    hint: |
      What it was required to prove.

reconstruction:
  preamble: |
    *A modern reconstruction — not Euclid's argument.*
  lines:
    - steps: [1, 2, 3, 4, 5]
      text: |
        $AB = m \cdot \tfrac1n C$ and $DE = m \cdot \tfrac1n F$.
    - steps: [6, 7, 8]
      text: |
        Each $\tfrac1n C + \tfrac1n F = \tfrac1n (C + F)$ ([[VII.5]]), so $AB + DE = m \cdot \tfrac1n(C + F)$.
        $\blacksquare$

commentary: |
  Euclid's figure shows two thirds. The proposition is used for sums of any number of terms, starting with
  [[VII.9]] and [[VII.10]].

gaps: |
  - **Typical case** (two thirds), and regrouping, as in [[VII.5]].
