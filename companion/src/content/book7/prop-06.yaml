id: VII.6
kind: theorem
title: The same parts of two numbers are those parts of their sum

paraphrase: |
  If {AB} is some fraction ("parts") of {C} and {DE} the same fraction of {F}, then {AB} + {DE} is that
  fraction of {C} + {F}: $\tfrac{m}{n} c + \tfrac{m}{n} f = \tfrac{m}{n}(c + f)$.

